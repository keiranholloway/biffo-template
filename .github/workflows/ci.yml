name: CI

on:
  push:
    branches: [main, dev, staging]
  pull_request:
    branches: [main, dev, staging]
  # Manual re-run. Without this there is no way to trigger CI on an integration
  # branch: AGENTS.md forbids pushing directly to one, so the only recourse is
  # an otherwise-pointless PR. On 2026-07-19 GitHub stopped dispatching
  # push-triggered runs on main for four consecutive merges (#293) and there was
  # no way to recover — this makes that one click.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.13'
  # Defence in depth for the class of bug in #322: an interactive Terraform
  # prompt on a CI runner has no stdin to read and blocks until the job is
  # killed. Every invocation also passes -input=false explicitly and a drift
  # guard enforces that; this is the backstop for one added without it.
  TF_INPUT: '0'

# Jobs are consolidated by toolchain (one JS job, one Python job) rather than one
# job per check. GitHub bills every job's wall time rounded UP to a full minute
# and each job re-runs checkout + dependency install, so a dozen sub-minute jobs
# cost ~12 billed minutes for ~5 minutes of real work and install deps a dozen
# times. Installing once per toolchain and running the checks as steps cuts that
# roughly in half.
#
# Check steps run on `!cancelled() && steps.install.outcome == 'success'`, which
# is two rules, not one:
#
#   - `!cancelled()` so a failure in one check still runs the rest — you see
#     every failure in a run, not just the first;
#   - the install gate so that when *dependency installation* fails, the checks
#     do NOT run. Without it a failed `pnpm install --frozen-lockfile` leaves no
#     node_modules, every later step dies on a missing binary, and the real
#     error is buried under a pile of `tsx: not found` (#393). One honest
#     failure beats eight misleading ones.
#
# Only jobs that install dependencies carry the gate; a job with no `id: install`
# step must not use it, or `steps.install.outcome` is empty and every gated step
# silently skips.

jobs:
  # Job `name` is load-bearing: "Release Guards" is a REQUIRED status check in
  # this repo's branch protection and in every instance's, and `biffo core
  # upgrade` cannot update branch protection. Renaming it ships a workflow that
  # reports a check name the protection must already require — so any rename MUST
  # be paired with a protection update on the template AND every instance, in the
  # same window the upgrade PR merges there, or instance PRs wait forever on a
  # check that never arrives (#433). It was "Core Version Guard" until #433; the
  # name was a misnomer once #423 removed the version bump, leaving only the two
  # release guards below.
  release-guards:
    name: Release Guards
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - id: install
        run: pnpm install --frozen-lockfile
      # A template-owned change cuts a release on merge, and the release job
      # derives the bump from the squash-merge subject — which is this PR's
      # title. Fail if that title is not a Conventional Commits subject, or a
      # feature ships silently as a patch (ADR-0006, #423).
      - run: sh scripts/biffo.sh check release-subject
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
      # The mirror image, for instances: fail if an INSTANCE changed a
      # template-owned path (#370). Inert in the template, where that is the
      # point of every PR. Shares this job rather than adding its own — same
      # toolchain, same full-depth checkout, same PR-only trigger, and GitHub
      # bills each job's wall time rounded up to a full minute.
      - name: Core ownership guard
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: sh scripts/biffo.sh check ownership
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}

  js:
    name: JS (lint, types, test, audit)
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # The template's version is its highest core-v* tag (#423), and
          # actions/checkout fetches no tags by default. Without them, anything
          # resolving the version in a template checkout — `biffo init` stamping
          # biffo.core.json, and the tests that drive it — cannot say which core
          # it is.
          #
          # `fetch-tags: true` alone does NOT fix this: at the default
          # fetch-depth: 1 it fetches only tags reachable from the single commit
          # fetched, which for a PR merge ref is none. Verified — the job failed
          # identically with it set. Full history is what actually carries them,
          # and it is what the guard jobs above already take.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - id: install
        run: pnpm install --frozen-lockfile
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run lint
      - name: Format check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run format:check
      - name: Type check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run typecheck
      # The portal is a Next.js static export (output: 'export'). lint/type/test
      # all pass on a page that has quietly become dynamic and can no longer be
      # prerendered — that only blows up at `next build`, i.e. at deploy time,
      # never in CI (#382). Build it here so an export regression fails the PR.
      # No real config is wired: these NEXT_PUBLIC_* values are public,
      # client-embedded identifiers (not secrets) and the ones below are obvious
      # placeholders. They must be NON-EMPTY, though — lib/auth.ts constructs a
      # CognitoUserPool at module load and its constructor throws on empty
      # UserPoolId/ClientId, which would fail the prerender for a config reason
      # rather than a real export regression. The goal is to catch a build
      # FAILURE, not to validate config, so any parseable placeholder does.
      - name: Build portal
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @biffo/portal build
        env:
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: us-east-1_ciplaceholder
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ciplaceholderclientid00000
          NEXT_PUBLIC_API_URL: http://localhost
          NEXT_PUBLIC_REGISTRY_URL: http://localhost
      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run test
      - name: Dependency audit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm audit --audit-level=high
      # A plugin manifest declaring event_subscriptions must ship terraform/,
      # or the subscription is inert in every deployment (#194). This walks the
      # whole tree from the git root so it also covers _skeletons/, which no
      # other job in this workflow touches.
      - name: Plugin Terraform guard
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: sh scripts/biffo.sh check plugin-terraform

  python:
    name: Python (lint, types, test, security)
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - id: install
        run: uv sync --all-groups
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run ruff check .
      - name: Format check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run ruff format --check .
      - name: Type check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run pyright
      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # Exit code 5 = no tests collected — valid for the template repo before tests are added
        run: uv run pytest --cov --cov-report=xml || [ $? -eq 5 ]
      - name: Coverage upload
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
      # Scoped to template-owned services only (services/api, services/_plugins —
      # core-manifest.json). Bandit exits non-zero on findings, so scanning the
      # whole user-owned services/ tree would red this template-shipped gate on an
      # instance's own service code, which the instance neither wrote in the
      # template nor can fix via `biffo core upgrade` (issue #327). An instance
      # that wants SAST over its own services adds its own Bandit step.
      - name: SAST (Bandit)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run bandit -r services/api services/_plugins -ll --format json -o bandit-report.json
      - name: Upload Bandit report
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@v5
        with:
          name: bandit-report
          path: bandit-report.json
      - name: Dependency audit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run pip-audit

  security-secrets:
    name: Secret Scan
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      # gitleaks/gitleaks-action@v2 requires a paid GITLEAKS_LICENSE for
      # organization-owned repos — this repo is a personal account today so it
      # doesn't hit that, but every instance/sibling scaffolded from this
      # template that lands under an org would (confirmed: tabsii-com/
      # tabsii-platform and tabsii-com/tabsii-crm both did). Install the free,
      # open-source gitleaks CLI directly instead, so scaffolded repos don't
      # inherit a check that silently breaks the moment they're org-owned.
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version
      # First pass: scan git history (fetch-depth: 0 above), catching secrets
      # committed then removed within the same history.
      #
      # --log-opts is load-bearing (issue #258). gitleaks' default git log
      # arguments include `--all`, so with fetch-depth: 0 — which fetches every
      # remote ref, not just the one being built — the scan covers commits that
      # live only on *unmerged* branches. A single bad commit on anyone's open
      # branch then reddens `main` and every open PR simultaneously, with
      # nothing in the built ref's history responsible for it. That happened
      # live and cost two separate diagnostics.
      #
      # Scoping to HEAD restricts the scan to commits reachable from the ref
      # actually under test, which is exactly the set this job is accountable
      # for. It does NOT weaken detection: fetch-depth: 0 stays, so the full
      # reachable history is still walked and a secret committed then removed
      # within the branch is still caught. On pull_request, HEAD is the
      # merge commit, so the PR's own new commits are in scope too.
      - name: gitleaks git history scan
        run: gitleaks detect --redact -v --exit-code=2 --log-opts="--full-history HEAD"
      # Second pass: scan every file in the working tree (no-git mode).
      # This mirrors what generated repos see on their first CI run — the initial
      # commit includes every template file, so secrets in unchanged files would
      # pass the history scan above but fail there. Running both here closes the gap.
      - name: gitleaks filesystem scan
        run: gitleaks detect --no-git --redact -v --exit-code=2

  infra-validate:
    name: Terraform Validate & Security
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '~> 1.9'
      # Scoped to template-owned modules/ only (core-manifest.json). infra/ is
      # user-owned: fmt-checking or validating it here would red this
      # template-shipped gate on an instance's own Terraform, and the old
      # `infra/environments/dev` target hardcoded an environment name an instance
      # may rename or remove (issue #327). The template validates the modules it
      # owns; an instance validates its own infra composition in its own gate.
      - name: Terraform fmt check (template-owned modules)
        run: terraform fmt -check -recursive modules/
      - name: Validate modules
        env:
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/tf-plugin-cache
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          # Each module declares its own required_providers, so it validates
          # standalone after `init -backend=false`. A shared plugin cache means
          # providers download once, not once per module.
          rc=0
          while IFS= read -r dir; do
            echo "== validating $dir =="
            terraform -chdir="$dir" init -backend=false -input=false >/dev/null || { rc=1; continue; }
            terraform -chdir="$dir" validate || rc=1
          done < <(find modules -name '*.tf' -exec dirname {} \; | sort -u)
          exit $rc
      - name: Checkov (Terraform SAST)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: modules/
          quiet: true
          soft_fail: true
          framework: terraform
