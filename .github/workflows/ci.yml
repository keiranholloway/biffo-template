name: CI

on:
  push:
    branches: [main, dev, staging]
  pull_request:
    branches: [main, dev, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.13'

# Jobs are consolidated by toolchain (one JS job, one Python job) rather than one
# job per check. GitHub bills every job's wall time rounded UP to a full minute
# and each job re-runs checkout + dependency install, so a dozen sub-minute jobs
# cost ~12 billed minutes for ~5 minutes of real work and install deps a dozen
# times. Installing once per toolchain and running the checks as steps cuts that
# roughly in half. Check steps use `if: ${{ !cancelled() }}` so a failure in one
# check still runs the rest — you see every failure in a run, not just the first.

jobs:
  core-version-guard:
    name: Core Version Guard
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fail if a template-owned path changed without a core.version bump (ADR-0006).
      - run: pnpm --filter @biffo/cli check:core-bump
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}

  js:
    name: JS (lint, types, test, audit)
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm run lint
      - name: Format check
        if: ${{ !cancelled() }}
        run: pnpm run format:check
      - name: Type check
        if: ${{ !cancelled() }}
        run: pnpm run typecheck
      - name: Test
        if: ${{ !cancelled() }}
        run: pnpm run test
      - name: Dependency audit
        if: ${{ !cancelled() }}
        run: pnpm audit --audit-level=high

  python:
    name: Python (lint, types, test, security)
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - name: Lint
        if: ${{ !cancelled() }}
        run: uv run ruff check .
      - name: Format check
        if: ${{ !cancelled() }}
        run: uv run ruff format --check .
      - name: Type check
        if: ${{ !cancelled() }}
        run: uv run pyright
      - name: Test
        if: ${{ !cancelled() }}
        # Exit code 5 = no tests collected — valid for the template repo before tests are added
        run: uv run pytest --cov --cov-report=xml || [ $? -eq 5 ]
      - name: Coverage upload
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
      - name: SAST (Bandit)
        if: ${{ !cancelled() }}
        run: uv run bandit -r services/ -ll -x services/_template/ --format json -o bandit-report.json
      - name: Upload Bandit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
      - name: Dependency audit
        if: ${{ !cancelled() }}
        run: uv run pip-audit

  security-secrets:
    name: Secret Scan
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      # gitleaks/gitleaks-action@v2 requires a paid GITLEAKS_LICENSE for
      # organization-owned repos — this repo is a personal account today so it
      # doesn't hit that, but every instance/sibling scaffolded from this
      # template that lands under an org would (confirmed: tabsii-com/
      # tabsii-platform and tabsii-com/tabsii-crm both did). Install the free,
      # open-source gitleaks CLI directly instead, so scaffolded repos don't
      # inherit a check that silently breaks the moment they're org-owned.
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version
      # First pass: scan git history (fetch-depth: 0 above), catching secrets
      # committed then removed within the same history.
      - name: gitleaks git history scan
        run: gitleaks detect --redact -v --exit-code=2
      # Second pass: scan every file in the working tree (no-git mode).
      # This mirrors what generated repos see on their first CI run — the initial
      # commit includes every template file, so secrets in unchanged files would
      # pass the history scan above but fail there. Running both here closes the gap.
      - name: gitleaks filesystem scan
        run: gitleaks detect --no-git --redact -v --exit-code=2

  infra-validate:
    name: Terraform Validate & Security
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '~> 1.9'
      - name: Terraform fmt check
        run: terraform fmt -check -recursive infra/ modules/
      - name: Validate dev environment
        working-directory: infra/environments/dev
        run: |
          terraform init -backend=false
          terraform validate
      - name: Checkov (Terraform SAST)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: modules/
          quiet: true
          soft_fail: true
          framework: terraform
      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: modules/
          soft_fail: true
