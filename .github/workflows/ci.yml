name: CI

on:
  push:
    branches: [main, dev, staging]
  pull_request:
    branches: [main, dev, staging]
  # The merge queue tests each entry on a temporary `gh-readonly-queue/*` ref,
  # which is neither a push to an integration branch nor a pull request. Without
  # this trigger the required checks are never reported for the queue entry, and
  # every queued PR waits for checks that cannot arrive — the queue does not fall
  # back to the PR's own results. This trigger must exist BEFORE a merge queue is
  # enabled on the branch, or the first queued PR blocks the repo.
  #
  # Harmless where no queue is configured (every instance today): the event
  # simply never fires.
  merge_group:
  # Manual re-run. Without this there is no way to trigger CI on an integration
  # branch: AGENTS.md forbids pushing directly to one, so the only recourse is
  # an otherwise-pointless PR. On 2026-07-19 GitHub stopped dispatching
  # push-triggered runs on main for four consecutive merges (#293) and there was
  # no way to recover — this makes that one click.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.13'
  # Defence in depth for the class of bug in #322: an interactive Terraform
  # prompt on a CI runner has no stdin to read and blocks until the job is
  # killed. Every invocation also passes -input=false explicitly and a drift
  # guard enforces that; this is the backstop for one added without it.
  TF_INPUT: '0'

# Jobs are consolidated by toolchain (one JS job, one Python job) rather than one
# job per check. GitHub bills every job's wall time rounded UP to a full minute
# and each job re-runs checkout + dependency install, so a dozen sub-minute jobs
# cost ~12 billed minutes for ~5 minutes of real work and install deps a dozen
# times. Installing once per toolchain and running the checks as steps cuts that
# roughly in half.
#
# Check steps run on `!cancelled() && steps.install.outcome == 'success'`, which
# is two rules, not one:
#
#   - `!cancelled()` so a failure in one check still runs the rest — you see
#     every failure in a run, not just the first;
#   - the install gate so that when *dependency installation* fails, the checks
#     do NOT run. Without it a failed `pnpm install --frozen-lockfile` leaves no
#     node_modules, every later step dies on a missing binary, and the real
#     error is buried under a pile of `tsx: not found` (#393). One honest
#     failure beats eight misleading ones.
#
# Only jobs that install dependencies carry the gate; a job with no `id: install`
# step must not use it, or `steps.install.outcome` is empty and every gated step
# silently skips.

jobs:
  # The "Release Guards" job (release-subject, the core-ownership guard, the
  # practices-corpus check, and the closing-keywords guards) moved to
  # `release-guards.yml` in #1319 — see that file's header. It needed
  # `pull_request: types: [..., edited]` so a title/body correction
  # re-evaluates automatically instead of needing a manual `gh run rerun`,
  # and giving that trigger to the WHOLE matrix below would re-run every
  # heavy job (js/python/security/terraform, several minutes on the
  # self-hosted fleet) on every description tweak — a much larger and more
  # frequent cost on a repo that edits PR bodies often. It is a separate
  # workflow rather than a second job here so the two triggers can differ at
  # all; the required check name it reports ("Release Guards") is unchanged,
  # and this file no longer defines a job with that name.
  js:
    # The name stays "...audit" even though the audit step moved out (below),
    # deliberately: it is a required status-check context matched by literal
    # string against DEFAULT_STATUS_CHECKS and against branch protection
    # already written onto this repo and every existing instance/sibling.
    # Renaming it would leave all of them waiting forever on a context
    # nothing reports — the same trap the sibling skeleton's own `js` job
    # comment already warns about, followed here rather than re-learned.
    name: JS (lint, types, test, audit)
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # The template's version is its highest core-v* tag (#423), and
          # actions/checkout fetches no tags by default. Without them, anything
          # resolving the version in a template checkout — `biffo init` stamping
          # biffo.core.json, and the tests that drive it — cannot say which core
          # it is.
          #
          # `fetch-tags: true` alone does NOT fix this: at the default
          # fetch-depth: 1 it fetches only tags reachable from the single commit
          # fetched, which for a PR merge ref is none. Verified — the job failed
          # identically with it set. Full history is what actually carries them,
          # and it is what the guard jobs above already take.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - id: install
        run: pnpm install --frozen-lockfile
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run lint
      - name: Format check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run format:check
      - name: Type check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run typecheck
      # The portal is a Next.js static export (output: 'export'). lint/type/test
      # all pass on a page that has quietly become dynamic and can no longer be
      # prerendered — that only blows up at `next build`, i.e. at deploy time,
      # never in CI (#382). Build it here so an export regression fails the PR.
      # No real config is wired: these NEXT_PUBLIC_* values are public,
      # client-embedded identifiers (not secrets) and the ones below are obvious
      # placeholders. They must be NON-EMPTY, though — lib/auth.ts constructs a
      # CognitoUserPool at module load and its constructor throws on empty
      # UserPoolId/ClientId, which would fail the prerender for a config reason
      # rather than a real export regression. The goal is to catch a build
      # FAILURE, not to validate config, so any parseable placeholder does.
      - name: Build portal
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @biffo/portal build
        env:
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: us-east-1_ciplaceholder
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ciplaceholderclientid00000
          NEXT_PUBLIC_API_URL: http://localhost
          NEXT_PUBLIC_REGISTRY_URL: http://localhost
      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run test
      # A plugin manifest declaring event_subscriptions must ship terraform/,
      # or the subscription is inert in every deployment (#194). This walks the
      # whole tree from the git root so it also covers _skeletons/, which no
      # other job in this workflow touches.
      - name: Plugin Terraform guard
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: sh scripts/biffo.sh check plugin-terraform
      # Two plugins vendored into one instance must not claim the same
      # importable name — a regular `scripts` package, or a test module pytest
      # imports by bare basename. Both broke the *incumbent* plugin when a
      # second was installed (#688). A no-op here (the template vendors no
      # plugins) and load-bearing in every instance, which is where they meet.
      - name: Plugin collision guard
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: sh scripts/biffo.sh check plugin-collisions
      # Two ADRs in this repo's own docs/ADR/ must not share a number — the
      # instance's own series and the template's series both start at 0001 and
      # are never synced against each other, so a collision is invisible until
      # it has already happened (tabsii-platform#449). In an instance, also
      # fails on a NEW ADR numbered inside the template's reserved range
      # before it can collide with a template ADR not yet shipped (#1105). A
      # no-op in the template (one series, no duplicates by construction, and
      # never checked against its own reserved range) and load-bearing in
      # every instance, which is where the two series actually meet.
      - name: ADR numbering guard
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: sh scripts/biffo.sh check adr-numbering
      # `_skeletons/sibling-template/apps/frontend` sits outside this repo's
      # own pnpm workspace on purpose (see that skeleton's own
      # pnpm-workspace.yaml), so nothing above this step ever installs or runs
      # it. It is the canonical copy of api-client.ts/auth.ts distributed to
      # all seven siblings via shared-files.json's filesIfPresent — #1277
      # added 223 lines of tests for the 401-refresh logic there and every one
      # of the 9 checks on that PR passed without importing a single one of
      # them (#1285). This installs and runs that tree's own vitest suite
      # (and any other nested pnpm project the repo grows outside the
      # workspace — see the script's own comments for why it discovers rather
      # than hardcodes the path), failing closed if discovery finds nothing to
      # test at all.
      - name: Nested frontend tests (_skeletons/ and any other vendored tree)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: sh scripts/nested-frontend-tests.sh
      # An EventBridge target writing to a CloudWatch Logs group with no
      # resource policy granting events.amazonaws.com access to it: terraform
      # apply succeeds and the rule reports ENABLED, but the log group
      # receives nothing, forever (#1356). Shipped with #1408 and had zero
      # callers until #1413 wired it here.
      - name: EventBridge log permission guard
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: sh scripts/biffo.sh check eventbridge-log-permissions
      # A plugin manifest declaring a tool whose is_available predicate reads
      # an env var no Terraform environment_variables block ever wires — the
      # shape that left web_search silently unavailable in every environment
      # (#822). Shipped with #1409 and had zero callers until #1413 wired it
      # here.
      - name: Plugin tool-supply guard
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: sh scripts/biffo.sh check plugin-tool-supply
      # A frontend's core-direct call site (bypassing its own BFF) naming a
      # route prefix core does not register (#1377). Self-checks the sibling
      # skeleton against this repo's own services/api/src — the real
      # estate-wide sweep across live siblings needs a cross-repo checkout
      # this workflow does not have; see the entrypoint's own doc comment.
      # Shipped with #1406 and had zero callers until #1413 wired it here.
      - name: Core-direct-paths guard (skeleton self-check)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: sh scripts/biffo.sh check core-direct-paths
      # Orphan ratchet / unsanctioned-file guard (#1026's checkOrphanRatchet +
      # planCoreUpgrade's classify(), cli/src/lib/core-upgrade.ts) — previously
      # reachable only from inside `biffo core upgrade`, so an instance could
      # accumulate unsanctioned files under a template-owned path for months
      # before an upgrade ever tripped over them (biffo-template#1714).
      # Self-check only: with no --instance-dir, it defaults to comparing this
      # checkout's own root against itself, so classify() can only ever report
      # zero — there is no second, diverged tree for the template to compare
      # itself against (see check-orphan-ratchet.ts's doc comment for the
      # proof, and for why that default exists here rather than being refused
      # the way instance-adoption's is below). This step exists to prove the
      # CLI wiring, exit codes and the #1714 per-file guidance work in real CI
      # on every PR, and to give an instance a working command to copy. It is
      # left in place deliberately even though it can never itself catch a
      # real orphan: kept, not removed, because it is still real per-PR
      # coverage of the CLI path itself, and removing it would buy nothing.
      # The part that CAN catch real drift — --instance-dir pointed at a real
      # instance tree — now runs in .github/workflows/orphan-ratchet-report.yml
      # (biffo-template#1714), a scheduled cross-repo report cloning every
      # live instance fresh, mirroring instance-adoption-report.yml exactly.
      - name: Orphan-ratchet guard (template self-check)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: sh scripts/biffo.sh check orphan-ratchet
      # A Cognito invite_message_template missing email_subject/email_message/
      # sms_message, or one of the {username}/{####} placeholders Cognito's
      # CreateUserPool requires — terraform validate is silent on this, so a
      # fresh deploy fails on its very first apply (#356). Shipped with #356,
      # exercised only by its own .test.ts until this pass wired it here
      # (#1363's five-guard baseline).
      - name: Cognito invite template guard
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: sh scripts/biffo.sh check cognito-invite-template
      # An unsuppressed `aws lambda update-function-*` prints the whole
      # resolved function configuration — every env var, plaintext — into the
      # Actions log, and the response is never consumed (#334). Shipped with
      # #334, exercised only by its own .test.ts until this pass wired it here
      # (#1363's five-guard baseline).
      - name: Lambda output guard
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: sh scripts/biffo.sh check lambda-output
      # A status-bearing command (claim.sh, wait-for-checks, git push, ...)
      # piped into another, or $? read on the line after one, reads the LAST
      # command's exit status — how a rejected push or a failed claim has read
      # as `exit: 0` before (#1231, AGENTS.md §4). Shipped with #1231,
      # exercised only by its own .test.ts sweep until this pass wired it here
      # (#1363's five-guard baseline).
      - name: Pipe-trap guard
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: sh scripts/biffo.sh check pipe-trap
      # A `// codeql[query-id]` comment does not suppress anything in this
      # repo's CodeQL setup — no paths-ignore/query-filter reads it, so alert
      # #21 stayed open directly under one for a while before anyone noticed
      # (#1491). Real suppression is a dismissed alert with a recorded reason,
      # or a config exclusion; a source comment claiming otherwise is worse
      # than no comment.
      - name: CodeQL-suppression-comment guard
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: sh scripts/biffo.sh check codeql-suppression
      # A fix this repo made for itself (a hardcoded runner, the paid/broken
      # gitleaks action, an unhardened dependency audit, a hard-coded app
      # title) that never reached the scaffolding trees it hands out —
      # invisible until someone scaffolds from the drifted skeleton, by which
      # point it has already shipped into every repo created in the meantime.
      # Exercised only by its own .test.ts until this pass wired it here
      # (#1363's five-guard baseline).
      - name: Skeleton drift guard
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: sh scripts/biffo.sh check skeleton-drift
      # The same drift, in the ruleset rather than the scaffolding: `--as
      # <token>` shipped in #1279, reached this repo's own AGENTS.md and
      # neither skeleton, and since the skeletons are what satellites receive
      # it was documented in ZERO of them while working perfectly. Every
      # delegated session in the estate therefore claimed anonymously, which
      # is the one thing the flag exists to prevent (#1562). Compares every
      # distributed AGENTS.md -- discovered, not listed -- against the others.
      - name: Claim-invocation parity guard
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: sh scripts/biffo.sh check claim-invocation
      # A Terraform subcommand that can prompt for an unresolved variable
      # without -input=false, or a workflow running Terraform at all without
      # TF_INPUT set as a backstop — a GitHub Actions runner has no stdin to
      # answer a prompt, so the step hangs until the job is killed (#322).
      # -auto-approve does NOT prevent this. Shipped with #322, exercised only
      # by its own .test.ts until this pass wired it here (#1363's five-guard
      # baseline).
      - name: Terraform-input guard
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: sh scripts/biffo.sh check terraform-input
      # The ADR-0009 service-principal allowlist glob no longer matching the
      # IAM role name modules/cloud/aws/compute + modules/plugins/_template
      # actually build — terraform validate is silent on this by design (the
      # allowlist never references either naming module), so a rename in
      # either would leave every plugin call rejected with no signal before a
      # real deploy hits it (#266). tabsii-platform#863 is this exact failure
      # shape already reaching production, via a hand-maintained allowlist
      # array that simply omitted the plugin host. Shipped with #266,
      # exercised only by its own .test.ts until #1519's widened guard
      # enumeration surfaced it as unwired (#1545) and this pass wired it here.
      - name: Plugin-allowlist convention guard
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: sh scripts/biffo.sh check plugin-allowlist-convention

  # Split out of the `js` job deliberately (#1880): `pnpm audit`'s registry
  # call (`registry.npmjs.org/-/npm/v1/security/advisories/bulk`) has been
  # chronically overloaded since npm/GitHub retired the legacy audit endpoints
  # on 2026-07-15, consolidating every pnpm/npm/yarn audit client worldwide
  # onto this one path with no published SLA. Independently reproduced and
  # documented in #1880: intermittent multi-second hangs, unrelated to this
  # repo's own code, CI config, or runner — an ongoing, unresolved, upstream
  # infrastructure condition, not a transient blip #591's retry loop can be
  # relied on to absorb. #1269/#591 already made `js-dependency-audit.sh`
  # itself fail closed (INCONCLUSIVE blocks) rather than silently pass on a
  # broken registry response; #1880 is the discovery that the registry itself
  # is now unreliable often enough that "fail closed" was blocking real,
  # unrelated PRs on a problem nobody merging them could fix.
  #
  # `js` (required) no longer runs this step at all, so a registry hang can
  # never again block or cancel the lint/type/test/guard job. This job runs
  # the exact same script, on every push/PR, so a real high/critical advisory
  # is still surfaced quickly — it is informational rather than blocking:
  # `continue-on-error: true` keeps a registry-side failure from turning red
  # in a way that looks like this job's own fault, and this job's name is
  # deliberately NOT added to `dev`'s required status checks. This is a
  # DELIBERATE, OPEN loosening of a gate per AGENTS.md §7, not a silent one —
  # #1880 is the tracking issue, and it names the follow-up (a scheduled,
  # persistent scan) this PR does not itself build.
  js-audit:
    name: JS Dependency Audit (non-blocking, #1880)
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - id: install
        run: pnpm install --frozen-lockfile
      - name: Dependency audit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # Fails on a real high/critical advisory, but treats a broken audit
        # registry (non-JSON response, or the chronic #1880 timeout) as
        # inconclusive rather than blocking (#591) — and this job's own
        # non-required status is what stops that inconclusive result from
        # blocking the merge queue in the first place.
        run: sh scripts/js-dependency-audit.sh

  python:
    name: Python (lint, types, test, security)
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    # `contents: read` is restated explicitly rather than left to the ambient
    # default, matching the `security-secrets` job's own pattern in this file.
    #
    # `actions: read` and `statuses: write` came BACK here in #1666, when the
    # error-branch gate folded in from `error-branch-coverage-gate.yml`. They
    # are the two the gate genuinely needs and no more: `actions: read` to list
    # this commit's runs and download the second lane's coverage artefact, and
    # `statuses: write` to post the `Error-branch coverage` context that branch
    # protection requires on some instances. The gate never pushes, never
    # comments, and never touches contents.
    permissions:
      contents: read
      actions: read
      statuses: write
    steps:
      # `fetch-depth: 0` matches the `js` and `security-secrets` checkouts
      # above (#1692). Without it this checkout is shallow (depth 1, single
      # ref) and `origin/dev` — or any other ref/merge-base — is simply not a
      # valid object in the working tree: `git merge-base HEAD origin/dev`
      # fails `fatal: Not a valid object name origin/dev` (exit 128), not a
      # wrong answer. A step built on that resolution would fail CLOSED with
      # a clear git error, never silently skip — but the swept job as it
      # stands has exactly one step that touches git/origin state at all
      # ("Error-branch coverage" below), and it deliberately does its own
      # `git fetch --depth=1 --no-tags origin "$default_branch"` rather than
      # relying on this checkout's depth, precisely so a PR under test cannot
      # influence which gate script version runs. That step is unaffected
      # either way. This still brings the job in line with its siblings and
      # closes the gap for any script this job's steps call out to
      # (`scripts/*.sh` — out of this change's read set, see the PR body).
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - id: install
        # `--locked` is the uv counterpart of `pnpm install --frozen-lockfile`
        # above, and it is here because the two halves of this job disagreed:
        # the JS side refused to install against a stale lock, while `uv sync`
        # silently RE-RESOLVED and carried on. So `uv.lock` pinned nothing —
        # CI tested whatever resolved at that moment, and the lockfile stopped
        # recording what was tested. It had already drifted (`pytest-xdist`,
        # declared in services/api/pyproject.toml, absent from the lock), which
        # is why every contributor running the Python tooling got an unexplained
        # `uv.lock` hunk in their diff (#1388).
        #
        # A lockfile nothing verifies is not a lock. `--locked` fails rather
        # than updating, so the drift cannot return quietly.
        run: uv sync --all-groups --locked
      # `uv sync` installs the workspace lock — core. An instance's own product
      # domains (ADR-0022) declare their extra dependencies in a user-owned,
      # fully pinned `domains/<name>/requirements.txt`, which is NOT in that lock
      # (#891); this installs them as a second layer, constrained by the lock so
      # a domain can never move a core package.
      #
      # It sits here, ahead of every gate, on purpose: lint, pyright, pytest AND
      # pip-audit then all see the same environment the Lambda will ship. A
      # domain dependency nobody type-checks and no advisory database is ever
      # asked about is the fail-open shape `scripts/py-dependency-audit.sh`
      # already exists to fight. A no-op in this template, which ships no
      # product domain.
      - name: Product-domain dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: sh scripts/sync-domain-deps.sh
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run ruff check .
      - name: Format check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run ruff format --check .
      - name: Type check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run pyright
      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # Exit code 5 = no tests collected — valid for the template repo before tests are added
        run: uv run pytest --cov --cov-report=xml --cov-report=json || [ $? -eq 5 ]
      # Published as an artefact (not just left on disk) because the
      # deterministic cross-workflow gate (`error-branch-coverage-gate.yml`,
      # #637) downloads it from a DIFFERENT workflow run via the API, the same
      # way an instance's `RLS Tests` lane already publishes `rls-coverage`.
      # `if-no-files-found: error` matches that producer's own posture: this
      # step running with no coverage.json to publish means pytest's coverage
      # plugin silently produced nothing, which is worth failing THIS job on
      # immediately rather than surfacing as an unexplained download failure
      # in the downstream gate an entire workflow later.
      - name: Upload coverage artefact
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@v5
        with:
          name: python-coverage
          path: coverage.json
          if-no-files-found: error
      # ── Error-branch coverage ──────────────────────────────────────────
      #
      # Fails only when error handling is ADDED with nothing exercising it
      # (#956). An unexecuted `except` is unverified, and that is where every
      # fail-open this estate has found actually lived.
      #
      # THIS RAN AS ITS OWN `workflow_run` WORKFLOW UNTIL #1666, AND THE
      # REASONS IT LEFT ARE WHY THE STEP BELOW IS SHAPED THE WAY IT IS.
      #
      # #637 moved it out because the version that lived here was
      # BEST-EFFORT: it read the second lane's coverage artefact if that
      # artefact happened to already exist, and silently fell back to
      # Python-only coverage when it did not. Measurement at the time showed
      # the second lane finishing AFTER `CI` in 3 of 4 same-commit pairs, so
      # on a typical first push the fallback is what actually ran -- and
      # Python-only coverage flags every Postgres-only error branch (an RLS
      # refusal, a constraint violation) as newly unexecuted. That fallback is
      # a fail-open, and `ci.yml` carried a duplicate weaker stub test purely
      # to survive it (#831).
      #
      # What #1666 changes is the WAITING, not the assertion. This step does
      # not read-if-present; it BLOCKS until the second lane's run for this
      # commit reaches a conclusion, and on timeout it reports `failure` --
      # never success, never silence. A gate that cannot run must not pass.
      #
      # Why it is worth coming back at all: a `workflow_run` workflow is a
      # separate JOB, so it allocates its own runner. Measured on
      # tabsii-platform 2026-08-21 -- 38 runs and ~8 hours of wall-clock in
      # 24h for ~4 minutes of execution, because a 6-second API-only job was
      # waiting on an EC2 spot boot every time. It could not simply move to
      # `ubuntu-latest`: hosted runners are refused in that org on billing.
      # Here the step runs on an instance this job has ALREADY allocated, so
      # the marginal cost is the wait, and the wait is usually zero: re-measured
      # over same-push pairs on 2026-08-21, `CI` now finishes LAST about two
      # thirds of the time (the second lane was the one dying on 20-minute
      # timeouts before the runner-fleet change of 2026-08-20), and the worst
      # observed wait was 166s.
      #
      # TWO PROPERTIES FROM THE `workflow_run` VERSION MUST NOT BE LOST, AND
      # ARE THE ONLY REASON THIS STEP IS MORE THAN THREE LINES:
      #
      # 1. IT RUNS THE DEFAULT BRANCH'S SCRIPTS, NOT THE CHECKED-OUT ONES.
      #    `workflow_run` got this for free by construction: it always ran the
      #    default branch's copy of the workflow and its scripts, so a commit
      #    under test could never edit the thing judging it. Inline, the
      #    checkout IS the commit under test, so the trusted copies are
      #    fetched explicitly below. Without this the gate becomes
      #    self-verifying -- a PR could edit `error_branch_coverage.py` to
      #    always pass -- which is a worse defect than the cost #1666 fixed.
      #    The danger is EXECUTING the commit's code, not reading it: the
      #    trusted scripts are run against this working tree, which is exactly
      #    what the `workflow_run` version did with its source tarball.
      #
      # 2. THE LANE QUESTION IS ANSWERED ONCE. There used to be two callers of
      #    `second_coverage_lane.py` -- one here deciding whether to assert
      #    inline, one in the gate deciding whether to assert at all. The
      #    comment they both carried said it plainly: disagree one way and a
      #    commit is asserted twice, disagree the other and it is asserted
      #    NOWHERE, green, with each file believing the other did it. They are
      #    one call now, in one step, and the answer is used for both branches
      #    of the decision.
      #
      # A repo with NO second lane still gets the plain single-coverage
      # assertion, and still gets the `Error-branch coverage` commit status
      # posted -- that context is REQUIRED on some instances, so a repo that
      # never posts it would block every PR forever.
      - name: Error-branch coverage
        id: errorbranch
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # The status must land on the commit branch protection is judging,
          # which for a `pull_request` event is the PR HEAD -- `github.sha` is
          # the ephemeral merge commit and no protection rule ever sees it.
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          # Bounded deliberately. The job's own `timeout-minutes` is the
          # backstop, but a wait that runs into it reports the job as timed
          # out rather than reporting WHY the gate could not assert.
          LANE_WAIT_SECONDS: '480'
          LANE_POLL_SECONDS: '15'
        run: |
          set -uo pipefail

          # --- the trusted copies (property 1 above) -----------------------
          default_branch=$(gh api "repos/$REPO" --jq .default_branch)
          if [ -z "$default_branch" ]; then
            echo "::error::error-branch coverage: could not resolve the default branch — refusing to run the commit's own copy of the gate."
            echo "state=failure" >> "$GITHUB_OUTPUT"
            echo "description=could not resolve the default branch to fetch a trusted gate script" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --depth=1 --no-tags origin "$default_branch" || {
            echo "::error::error-branch coverage: could not fetch $default_branch for the trusted gate scripts."
            echo "state=failure" >> "$GITHUB_OUTPUT"
            echo "description=could not fetch the default branch to obtain a trusted gate script" >> "$GITHUB_OUTPUT"
            exit 0
          }
          mkdir -p .gate-trusted
          for f in error_branch_coverage.py second_coverage_lane.py; do
            if ! git show "FETCH_HEAD:scripts/$f" > ".gate-trusted/$f"; then
              echo "::error::error-branch coverage: $f is missing from $default_branch — cannot run a trusted gate."
              echo "state=failure" >> "$GITHUB_OUTPUT"
              echo "description=trusted gate script $f missing from $default_branch" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "Using $default_branch copies of the gate scripts (commit $(git rev-parse --short FETCH_HEAD))."

          # --- the lane question, answered once (property 2 above) ---------
          if ! python3 .gate-trusted/second_coverage_lane.py --github-output > lane.env; then
            echo "::error::error-branch coverage: the second-lane resolver failed."
            echo "state=failure" >> "$GITHUB_OUTPUT"
            echo "description=the second-coverage-lane resolver failed — see this run's log" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cat lane.env

          # NEVER `.` THIS FILE. It is GitHub Actions KEY=VALUE output, which is
          # deliberately NOT shell-quoted, and its `name` is read from the workflow file
          # in the CHECKOUT UNDER TEST.
          #
          # Sourcing it was wrong twice over (biffo-fleet, 2026-08-21):
          #
          #   name=RLS Tests   -> assignment plus a command `Tests` -> exit 127, the step
          #                       dies before setting state, and the REQUIRED
          #                       'Error-branch coverage' check reports no verdict at all.
          #                       Reproduced: `sh: ./lane.env: Tests: not found`.
          #   name=$(id -u)    -> ARBITRARY CODE EXECUTION inside the trusted gate.
          #                       Reproduced: it printed the uid.
          #
          # The second is the one that matters. This step exists to run the DEFAULT
          # BRANCH's scripts precisely so a pull request cannot influence the thing judging
          # it -- and sourcing a value derived from the PR's own workflow name handed that
          # back. It is the "pwn request" shape the workflow this replaced warned about in
          # its own header, reintroduced by the change that removed it.
          #
          # sed extracts the values without a shell ever evaluating them.
          present=$(sed -n 's/^present=//p' lane.env | head -1)
          name=$(sed -n 's/^name=//p' lane.env | head -1)

          if [ "${present:-false}" != "true" ]; then
            # Byte-for-byte the assertion this file ran before #637, now with
            # the trusted script rather than the checked-out one.
            if python3 .gate-trusted/error_branch_coverage.py --check --coverage coverage.json; then
              echo "state=success" >> "$GITHUB_OUTPUT"
              echo "description=no second coverage lane — asserted over coverage.json alone" >> "$GITHUB_OUTPUT"
            else
              echo "state=failure" >> "$GITHUB_OUTPUT"
              echo "description=new unexecuted error branch(es) — see this run's log" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          # --- wait for the second lane, do not read-if-present ------------
          echo "Second coverage lane is '$name'. Waiting up to ${LANE_WAIT_SECONDS}s for its run on $SHA to conclude."
          deadline=$(( $(date +%s) + LANE_WAIT_SECONDS ))
          lane_run_id=""
          lane_conclusion=""
          while :; do
            runs_json=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" 2>/dev/null || echo "")
            if [ -n "$runs_json" ]; then
              lane_run_id=$(printf '%s' "$runs_json" | jq -r --arg n "$name" \
                '[.workflow_runs[] | select(.name == $n)] | sort_by(.created_at) | last | .id // empty')
              lane_conclusion=$(printf '%s' "$runs_json" | jq -r --arg n "$name" \
                '[.workflow_runs[] | select(.name == $n)] | sort_by(.created_at) | last
                 | if .status == "completed" then (.conclusion // "completed") else "" end')
            fi
            [ -n "$lane_conclusion" ] && break
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::error-branch coverage: '$name' did not conclude for $SHA within ${LANE_WAIT_SECONDS}s."
              echo "state=failure" >> "$GITHUB_OUTPUT"
              echo "description=the $name lane did not finish within ${LANE_WAIT_SECONDS}s — the gate cannot assert combined coverage" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep "$LANE_POLL_SECONDS"
          done
          echo "Lane run $lane_run_id concluded: $lane_conclusion"

          # A red lane may have produced partial or no coverage. Asserting over
          # it would flag its unreached branches as newly unexecuted, so this
          # reports failure with the reason rather than a misleading verdict.
          if [ "$lane_conclusion" != "success" ]; then
            echo "state=failure" >> "$GITHUB_OUTPUT"
            echo "description=the $name lane concluded '$lane_conclusion' — combined coverage cannot be asserted over a lane that did not pass" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! gh run download "$lane_run_id" --repo "$REPO" --name rls-coverage --dir cov-lane; then
            echo "::error::error-branch coverage: lane run $lane_run_id passed but its rls-coverage artefact could not be downloaded."
            echo "state=failure" >> "$GITHUB_OUTPUT"
            echo "description=the $name lane's coverage artefact could not be downloaded — a repo WITH a second lane must not fall back to Python-only coverage" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if python3 .gate-trusted/error_branch_coverage.py --check \
              --coverage coverage.json --coverage cov-lane/rls-coverage.json; then
            echo "state=success" >> "$GITHUB_OUTPUT"
            echo "description=combined this run + $name run $lane_run_id" >> "$GITHUB_OUTPUT"
          else
            echo "state=failure" >> "$GITHUB_OUTPUT"
            echo "description=new unexecuted error branch(es) — see this run's log" >> "$GITHUB_OUTPUT"
          fi
      # Separate from the step above and `always()`, so a crash in the gate
      # still reports a verdict. `Error-branch coverage` is a REQUIRED context
      # on some instances: a run that posts nothing leaves the PR blocked with
      # no explanation, which is the failure mode this split exists to prevent.
      # An empty state means the gate did not reach a verdict, and that is a
      # failure -- never an absence.
      - name: Report Error-branch coverage
        if: ${{ always() && steps.errorbranch.conclusion != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          STATE: ${{ steps.errorbranch.outputs.state }}
          DESCRIPTION: ${{ steps.errorbranch.outputs.description }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          state="${STATE:-}"
          description="${DESCRIPTION:-}"
          if [ -z "$state" ]; then
            state=failure
            description="the gate did not reach a verdict — see this run's log"
          fi
          description=$(printf '%s' "$description" | cut -c1-140)
          gh api "repos/$REPO/statuses/$SHA" \
            -f state="$state" \
            -f context="Error-branch coverage" \
            -f description="$description" \
            -f target_url="$RUN_URL"
          echo "Posted commit status '$state' for Error-branch coverage on $SHA."
          [ "$state" = "success" ]
      - name: Core-revision preflight — self-test
        if: ${{ !cancelled() }}
        # scripts/core-revision-preflight.sh (#1604) is distributed here too,
        # verbatim, via shared-files.json's `files` -- but this repo is not a
        # sibling of anything and has no deploy.yml that mounts an
        # independently-deployed service ahead of core, so the root copy is
        # never invoked for a REAL preflight here the same way the sibling
        # skeleton's deploy.yml invokes it. This is the caller that keeps it
        # off the #1413 zero-caller list anyway, mirroring the identical step
        # in _skeletons/plugin-template/.github/workflows/ci.yml (which has
        # the same reason: no deploy path of its own): it proves the script
        # itself still blocks a stale core, passes a current one, and fails
        # CLOSED when the digest is missing, against a stubbed curl -- the
        # same governance-plumbing reasoning js-dependency-audit.sh/
        # py-dependency-audit.sh already carry as inert-but-verified copies
        # here too. See shared-files.json's note for the full trail.
        run: sh scripts/core-revision-preflight.test.sh

      # A distributed check with no caller is only half a guard, so
      # verify-deployed's tests are invoked by name here. (Until #1705, this
      # comment said routing-smoke-test.test.sh sat unwired with "no
      # discovery" to catch it -- that gap is closed now by the "Guard
      # self-test wiring audit" step below, which discovers and runs any
      # scripts/*.test.sh file nothing here names explicitly.)
      - name: verify-deployed self-test
        run: sh scripts/verify-deployed.test.sh
      - name: Branch-health plan-only detection — self-test
        if: ${{ !cancelled() }}
        # scripts/branch-health-plan-only-detection.test.sh (#1582's second
        # half) had no caller when it was first written. Its sibling,
        # scripts/branch-health-workflow-run-attribution.test.sh, sat
        # unwired for longer -- until #1705's "Guard self-test wiring audit"
        # step below started discovering and running it automatically. Wired
        # here, beside its sibling self-test, using this runner's own `sh`
        # — the same interpreter `scripts/biffo.sh branch-health` and
        # `practices-daily.sh` actually invoke it with in production, so a
        # regression that only breaks under `sh` (not `bash`) is caught here
        # rather than in the field.
        run: sh scripts/branch-health-plan-only-detection.test.sh
      - name: wait-for-checks caller-deadline — self-test
        if: ${{ !cancelled() }}
        # A test with no caller is not a guard (#1413/#1629), and this one guards
        # a property that only shows up under a caller that dies: wait-for-checks
        # bounded its own timeout and nothing else, so a Foreman running under
        # `timeout 3300` started an 11-minute wait with 5 minutes left, was
        # SIGKILLed mid-wait, and lost the turn with no verdict and no cost
        # record. Eleven such kills in three days.
        #
        # Behavioural, with a stubbed `gh` whose checks never conclude: anything
        # that returns did so because a deadline fired, not because CI finished.
        # Both controls (bound unset, bound unreadable) assert the waiting still
        # happens, so this cannot pass against a script that stopped waiting.
        # Every case is `timeout`-bounded because WITHOUT the fix they do not
        # exit at all -- an unguarded regression would hang CI rather than fail.
        run: sh scripts/wait-for-checks-deadline.test.sh
      - name: Guard self-test wiring audit
        if: ${{ !cancelled() }}
        # #1705: three scripts/*.test.sh guards -- branch-health-workflow-run-
        # attribution.test.sh, claim-comments-unreadable-tristate.test.sh and
        # routing-smoke-test.test.sh -- sat with zero callers, some of them
        # for multiple cycles of #1413 fixing the SAME class one file at a
        # time. Each fix closed the instance found and left the class open:
        # the next guard added tomorrow would sit unwired exactly the same
        # way, silently, because nothing here ever asked "does the set of
        # scripts/*.test.sh files on disk match the set anything actually
        # runs?" -- the workflow file's own comments recorded the debt in
        # prose ("already sits ... unwired") rather than closing it.
        #
        # scripts/guard-self-test-wiring.sh globs scripts/*.test.sh itself,
        # so the denominator is derived rather than a second hand-maintained
        # list that can drift from this file the same way the comments did.
        # Anything already invoked by name elsewhere in .github/workflows/ is
        # left alone (some, like interpreter-audit.test.sh, deliberately run
        # inside a docker-wrapped real dash for #1652 and must not be re-run
        # bare here); anything with no other caller is executed directly,
        # right here, with plain `sh`. A brand-new guard with no `run:` line
        # anywhere is therefore executed automatically instead of silently
        # doing nothing, and fails this step by name if it fails. An empty
        # glob, or a guard that is unreadable/non-executable, fails closed
        # rather than reporting a vacuous pass -- see the script's own header
        # for the full reasoning and the fail-first proof run against it.
        run: sh scripts/guard-self-test-wiring.sh
      - name: Coverage upload
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
      # Scoped to template-owned services only (services/api, services/_plugins —
      # core-manifest.json). Bandit exits non-zero on findings, so scanning the
      # whole user-owned services/ tree would red this template-shipped gate on an
      # instance's own service code, which the instance neither wrote in the
      # template nor can fix via `biffo core upgrade` (issue #327). An instance
      # that wants SAST over its own services adds its own Bandit step.
      - name: SAST (Bandit)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run bandit -r services/api services/_plugins -ll --format json -o bandit-report.json
      - name: Upload Bandit report
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@v5
        with:
          name: bandit-report
          path: bandit-report.json

  # Split out of the `python` job deliberately (#1882, mirroring #1880/#1881's
  # identical JS-side fix): `pip-audit`'s advisory lookups are exactly as
  # registry-dependent and chronically unreliable as `pnpm audit`'s were --
  # AGENTS.md's own "a dependency audit is time-dependent" section already
  # documented that a fresh advisory landing mid-session can redden an
  # untouched PR, and #1880's rollout proved it live: the same morning the JS
  # fix shipped, a newly-published pip advisory (PYSEC-2026-3721) independently
  # blocked the required Python gate on five unrelated sibling repos within the
  # same hour, none of which touch Python code. `#591` already made
  # `py-dependency-audit.sh` itself fail closed (INCONCLUSIVE blocks) rather
  # than silently pass on a broken registry response; #1882 is the same
  # discovery #1880 made for JS, now confirmed for Python too: fail-closed was
  # blocking real, unrelated PRs on a problem nobody merging them could fix.
  #
  # `python` (required) no longer runs this step at all, so a registry-side
  # advisory event can never again block that job. This job runs the exact
  # same script, on every push/PR, so a real high/critical advisory is still
  # surfaced quickly -- it is informational rather than blocking:
  # `continue-on-error: true` keeps a registry-side failure from turning red
  # in a way that looks like this job's own fault, and this job's name is
  # deliberately NOT added to `dev`'s required status checks. This is a
  # DELIBERATE, OPEN loosening of a gate per AGENTS.md §7, not a silent one --
  # #1882 is the tracking issue.
  python-audit:
    name: Python Dependency Audit (non-blocking, #1882)
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - id: install
        run: uv sync --all-groups --locked
      - name: Product-domain dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: sh scripts/sync-domain-deps.sh
      - name: Dependency audit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # Fails on a real advisory, but treats a broken audit registry/network
        # response as inconclusive rather than blocking (#591) -- and this
        # job's own non-required status is what stops that inconclusive
        # result from blocking the merge queue in the first place.
        run: sh scripts/py-dependency-audit.sh

  security-secrets:
    name: Secret Scan
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      # gitleaks/gitleaks-action@v2 requires a paid GITLEAKS_LICENSE for
      # organization-owned repos — this repo is a personal account today so it
      # doesn't hit that, but every instance/sibling scaffolded from this
      # template that lands under an org would (confirmed: tabsii-com/
      # tabsii-platform and tabsii-com/tabsii-crm both did). Install the free,
      # open-source gitleaks CLI directly instead, so scaffolded repos don't
      # inherit a check that silently breaks the moment they're org-owned.
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version
      # First pass: scan git history (fetch-depth: 0 above), catching secrets
      # committed then removed within the same history.
      #
      # --log-opts is load-bearing (issue #258). gitleaks' default git log
      # arguments include `--all`, so with fetch-depth: 0 — which fetches every
      # remote ref, not just the one being built — the scan covers commits that
      # live only on *unmerged* branches. A single bad commit on anyone's open
      # branch then reddens `main` and every open PR simultaneously, with
      # nothing in the built ref's history responsible for it. That happened
      # live and cost two separate diagnostics.
      #
      # Scoping to HEAD restricts the scan to commits reachable from the ref
      # actually under test, which is exactly the set this job is accountable
      # for. It does NOT weaken detection: fetch-depth: 0 stays, so the full
      # reachable history is still walked and a secret committed then removed
      # within the branch is still caught. On pull_request, HEAD is the
      # merge commit, so the PR's own new commits are in scope too.
      - name: gitleaks git history scan
        run: gitleaks detect --redact -v --exit-code=2 --log-opts="--full-history HEAD"
      # Second pass: scan every file in the working tree (no-git mode).
      # This mirrors what generated repos see on their first CI run — the initial
      # commit includes every template file, so secrets in unchanged files would
      # pass the history scan above but fail there. Running both here closes the gap.
      - name: gitleaks filesystem scan
        run: gitleaks detect --no-git --redact -v --exit-code=2

  infra-validate:
    # Both Terraform validations run here as separate STEPS of one job, not as
    # two jobs. GitHub bills each *job* rounded up to a full minute, and the
    # infra/environments validation does ~33 seconds of work -- so as its own
    # job it cost a full billed minute per run (90 min/day on tabsii-platform,
    # measured 2026-08-05) almost entirely in per-job minimum rather than work.
    # Merging also drops a duplicate checkout and `setup-terraform` install.
    #
    # Why THIS job absorbed the other, and not the reverse: `Terraform Validate
    # & Security` is a REQUIRED status check in all 8 protected repos, while
    # `Terraform Validate (infra/environments)` is required in none. A required
    # context that stops being produced hangs every PR waiting for a check that
    # can never arrive, so the surviving job must keep the required name (#1331).
    #
    # The two assertions remain distinct -- see the step comments below. They
    # are separately named so a failure still says which half broke, and the
    # steps after the first run on
    # `!cancelled() && steps.setup.outcome == 'success'` so one failing half
    # still reports the other, exactly as two independent jobs did. That is the
    # same two-part idiom the js/python jobs use for `steps.install.outcome`
    # (see this file's header): `!cancelled()` to see every failure in a run
    # rather than only the first, and the setup gate so that when the toolchain
    # itself fails to install, four steps do not each die separately on a
    # missing `terraform` binary. The first fmt step needs no `if:` -- default
    # step semantics already skip it when setup fails, and nothing before it
    # can fail in a way the others should survive.
    name: Terraform Validate & Security
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - id: setup
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '~> 1.9'
      # Scoped to template-owned modules/ only (core-manifest.json). infra/ is
      # user-owned, so a check ASSERTING INSTANCE-SPECIFIC CORRECTNESS over it
      # here would red a template-shipped gate on content the template does not
      # own and cannot fix on an instance's behalf. The infra/environments steps
      # further down are a narrower, different claim -- syntax/schema validity,
      # not correctness -- which every instance can fix itself with no upstream
      # dependency, so it is safe to ship as a template-owned check (see those
      # steps' own comment for why this distinction holds).
      - name: Terraform fmt check (template-owned modules)
        run: terraform fmt -check -recursive modules/
      - name: Validate modules
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/tf-plugin-cache
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          # Each module declares its own required_providers, so it validates
          # standalone after `init -backend=false`. A shared plugin cache means
          # providers download once, not once per module.
          rc=0
          while IFS= read -r dir; do
            echo "== validating $dir =="
            terraform -chdir="$dir" init -backend=false -input=false >/dev/null || { rc=1; continue; }
            terraform -chdir="$dir" validate || rc=1
          done < <(find modules -name '*.tf' -exec dirname {} \; | sort -u)
          exit $rc
      # Terraform's native test framework (*.tftest.hcl), not to be confused
      # with the `validate` step above. Discovered separately and
      # deliberately: `find modules -name '*.tf'` above can never reach a
      # tests/ directory, because tests/ holds only *.tftest.hcl and no *.tf
      # of its own. That mismatch is exactly how 5 native test files --
      # a real SES-identity plan-time detector test among them -- shipped to
      # every instance for months with nothing in any workflow ever invoking
      # `terraform test` over them (#1661). Discover by the file extension
      # that actually marks a testable module, strip the trailing `/tests` to
      # get back to the module root `terraform test` expects to be run from.
      - name: Terraform test (native test suite)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/tf-plugin-cache
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          count=0
          rc=0
          while IFS= read -r dir; do
            count=$((count + 1))
            echo "== testing $dir =="
            terraform -chdir="$dir" init -backend=false -input=false >/dev/null || { rc=1; continue; }
            terraform -chdir="$dir" test || rc=1
          done < <(find modules -name '*.tftest.hcl' -exec dirname {} \; | sed 's:/tests$::' | sort -u)
          # Fail closed on a zero denominator -- a discovery step that finds
          # nothing must never be reported as a silent pass (the #1363
          # class): otherwise this exact bug returns the moment someone
          # renames tests/ or moves a module, and CI keeps reporting success
          # while testing nothing, same as before this step existed.
          if [ "$count" -eq 0 ]; then
            echo "::error::terraform test: discovery found zero *.tftest.hcl files under modules/ -- either they were removed/renamed without updating this step, or this step itself is broken. Refusing to report success over zero tests run."
            exit 1
          fi
          echo "terraform test: exercised $count module director$([ "$count" -eq 1 ] && echo y || echo ies) with a *.tftest.hcl suite."
          exit $rc
      - name: Checkov (Terraform SAST)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: modules/
          quiet: true
          soft_fail: true
          framework: terraform
      # --- infra/environments -------------------------------------------------
      #
      # `infra/environments/` is user-owned (core-manifest.json) -- instance-
      # specific resource naming, account config and customisation are the
      # instance's own to get right, and these steps assert none of that.
      #
      # What they DO assert -- does every environment directory still `fmt`
      # and `validate` -- is a claim any instance can verify and fix itself,
      # with no upstream dependency: unlike a check on instance-specific
      # CORRECTNESS (the #327 trap the modules/ steps above avoid by staying
      # scoped to modules/), "does this still parse" has one right answer
      # regardless of which instance is asking, and template-owning the CHECK
      # (not its subject) is exactly what lets `biffo core upgrade` keep this
      # current for every instance rather than freezing it at `biffo
      # init` time (tabsii-platform#521 -- template-shipping a `.instance.yml`
      # copy of this same check would have meant no instance could ever receive
      # a fix to it again, the #755 trap).
      #
      # Generic on purpose: no hardcoded environment name (the old
      # `infra/environments/dev`-only version was #327's actual bug) -- every
      # directory under infra/environments/ gets fmt + validate, whatever an
      # instance happens to have renamed, added, or removed.
      #
      # An instance with no infra/environments/ at all is not a failure: the
      # directory is user-owned and a repo may legitimately not have one, so
      # both steps no-op rather than red. `terraform fmt -check` errors on a
      # missing path, which is why the guard is here and not left implicit.
      - name: Terraform fmt check (infra/environments)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          if [ ! -d infra/environments ]; then
            echo "no infra/environments/ in this repo — nothing to check"
            exit 0
          fi
          terraform fmt -check -recursive infra/environments/
      - name: Validate every environment
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/tf-plugin-cache
        run: |
          if [ ! -d infra/environments ]; then
            echo "no infra/environments/ in this repo — nothing to validate"
            exit 0
          fi
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          # -backend=false: no cloud credentials or real state needed, this is
          # syntax/schema validation only, the same shape as the modules/ steps
          # above. One directory per environment, not per .tf file -- an
          # environment's files are one Terraform root together.
          rc=0
          for dir in infra/environments/*/; do
            [ -d "$dir" ] || continue
            echo "== validating $dir =="
            terraform -chdir="$dir" init -backend=false -input=false >/dev/null || { rc=1; continue; }
            terraform -chdir="$dir" validate || rc=1
          done
          exit $rc
      # --- infra/global --------------------------------------------------------
      #
      # `infra/global/` is user-owned (core-manifest.json), same ownership as
      # infra/environments/ above, and these steps assert the same narrow
      # claim -- does it still `fmt` and `validate` -- for the same reason:
      # any instance can verify and fix that itself with no upstream
      # dependency, so template-owning the CHECK (not its subject) is safe.
      #
      # Unlike infra/environments/, `infra/global/` is itself a single
      # Terraform root (main.tf/outputs.tf/variables.tf directly inside it),
      # not a directory of per-environment roots -- so there is one directory
      # to init/validate, not a loop over `*/`.
      #
      # An instance with no infra/global/ at all is not a failure: the
      # directory is user-owned and a repo may legitimately not have one, so
      # both steps no-op rather than red, the same guard shape as
      # infra/environments/ above.
      - name: Terraform fmt check (infra/global)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          if [ ! -d infra/global ]; then
            echo "no infra/global/ in this repo — nothing to check"
            exit 0
          fi
          terraform fmt -check -recursive infra/global/
      - name: Validate infra/global
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/tf-plugin-cache
        run: |
          if [ ! -d infra/global ]; then
            echo "no infra/global/ in this repo — nothing to validate"
            exit 0
          fi
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          terraform -chdir="infra/global" init -backend=false -input=false
          terraform -chdir="infra/global" validate
