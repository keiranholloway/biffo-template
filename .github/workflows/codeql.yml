name: 'CodeQL'

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    # Weekly catch-up scan (Tuesday 05:17 UTC) for issues that land outside
    # PR review (e.g. direct merges onto the integration branch).
    - cron: '17 5 * * 2'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Scan wherever scanning is actually possible, and be honest where it is not.
    #
    # CodeQL's SARIF upload needs Code Security, which is free on PUBLIC repos
    # and a paid add-on on private ones. The old gate was a bare
    # `vars.ENABLE_CODE_SCANNING == 'true'`, and that variable was set nowhere in
    # the estate — so every repo carrying this workflow reported `Analyze
    # (…) skipped` on every run and had no SAST at all, while looking like it
    # did (#1214). Nine repos, months.
    #
    # `github.event.repository.private == false` fixes that for free and without
    # per-repo configuration: a public repo scans automatically, because it can.
    # A private repo still needs the opt-in, because there the upload genuinely
    # fails without a purchase.
    #
    # Note what this does NOT claim. On a private repo under a *user* account
    # rather than an organisation, GitHub offers no `code_security` setting at
    # all — the API returns no such key, where an org repo returns
    # `code_security: disabled`. Setting ENABLE_CODE_SCANNING there cannot help.
    # That is a hosting decision, not a workflow one; see #1214.
    if: github.event.repository.private == false || vars.ENABLE_CODE_SCANNING == 'true'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      # Required for CodeQL to upload SARIF results.
      security-events: write
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      # autobuild intentionally omitted (build-mode 'none'):
      # - JavaScript/TS in this repo is a pnpm workspace compiled per-package;
      #   CodeQL analyses sources directly and needs no build.
      # - Python (services/api/FastAPI) has no build step CodeQL requires.
      # Autobuild would add nothing useful and risks spurious "failed to build"
      # noise that blocks the SARIF upload.

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
