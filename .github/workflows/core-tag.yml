name: Core Version Tag

# Keeps the git tag `core-v<version>` standing for the template-owned tree at
# that core version, so `biffo core upgrade` can resolve the template tree an
# instance merges from — ADR-0006.
on:
  push:
    branches: [main]
    # Deliberately NOT path-filtered on core.version. The failure this workflow
    # has to catch is precisely a push that does NOT change core.version: two
    # PRs opened against the same base both bumped to the same number, the
    # second rebased and kept it, and its template-owned changes landed on main
    # under a tag that already existed and pointed at the first commit. Those
    # changes were then reachable at no version at all — invisible to every
    # instance, forever (issue #294; observed with a2acf15/be4c573 at 0.32.4).
    # A path filter on core.version cannot see that push, so there is none.
  # Manual re-run, for the same reason as ci.yml. This workflow failing to fire
  # is worse than CI failing to fire: no tag means `biffo core upgrade` cannot
  # resolve the template tree at that version at all (ADR-0006), so the release
  # is invisible to every instance. On 2026-07-19 three versions shipped with no
  # tag and had to be backfilled by hand (#293).
  workflow_dispatch:

permissions:
  contents: write

# Serialise: two pushes racing here could both decide to move the same tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  tag:
    name: Tag core version
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      # This workflow lives in a template-owned path, so it ships to every
      # instance. Tagging there would push `core-v<template-version>` into the
      # instance's own tag namespace, alongside its release tags. An instance is
      # detected the same way the Core Version Guard detects one
      # (cli/src/scripts/check-core-version-bump.ts): `biffo.core.json` is
      # present in an instance and absent in the template. sync-core-tag.ts
      # re-checks this itself; the step guard only avoids the install cost.
      - name: Skip in instances
        id: guard
        run: |
          set -euo pipefail
          if [ -f biffo.core.json ]; then
            echo "biffo.core.json present — this is an instance, not the template. Skipping."
            echo "is_template=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_template=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.guard.outputs.is_template == 'true'
      - uses: actions/setup-node@v5
        if: steps.guard.outputs.is_template == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.guard.outputs.is_template == 'true'
      # Creates core-v<version>, or moves it forward when the template-owned
      # tree changed while core.version stayed put (logged loudly). Then audits
      # every version from the baseline up and fails if any tag does not stand
      # for its version's template tree.
      - name: Sync and audit core-v<version>
        if: steps.guard.outputs.is_template == 'true'
        run: pnpm --filter biffo sync:core-tag -- --push
