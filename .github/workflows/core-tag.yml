name: Core Version Tag

# Releases the template. On every push to `main` it derives the next core
# version — the highest existing `core-v*` tag, bumped by the commit's
# conventional type (#423) — and tags HEAD with it. That tag is what `biffo core
# upgrade` resolves the template tree from (ADR-0006), and what `publish-cli.yml`
# publishes `@biffo/cli@<version>` off.
on:
  push:
    branches: [main]
    # Deliberately NOT path-filtered. Every push to main is a candidate
    # release: the script itself decides, by diffing the template-owned tree
    # against the last tag, whether there is anything to release. A path filter
    # would have to encode the manifest's ownership boundary a second time, in a
    # place that cannot read it, and go stale the moment ownership moves.
  # Manual re-run, for the same reason as ci.yml. This workflow failing to fire
  # is worse than CI failing to fire: no tag means `biffo core upgrade` cannot
  # resolve the template tree at that version at all (ADR-0006), so the release
  # is invisible to every instance. On 2026-07-19 three versions shipped with no
  # tag and had to be backfilled by hand (#293).
  workflow_dispatch:

permissions:
  contents: write
  # Dispatching the release workflow below. A tag pushed by this job's
  # GITHUB_TOKEN does NOT trigger `on: push: tags:` anywhere — GitHub suppresses
  # that to prevent workflows recursing. So the release has to be asked for
  # explicitly, and asking requires actions:write.
  actions: write

# Serialise: two pushes racing here could both decide to create the same tag,
# and the loser would then read main's tip as drifted from a tag it never saw
# created — reporting a release-integrity failure that never happened.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  tag:
    name: Tag core version
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # The version is derived from the tags, so the checkout must carry
          # them. A release job that saw no tags would derive a first release
          # (0.1.0) over a live 0.59.x line and try to publish a version npm
          # already holds. fetch-depth: 0 is needed for the ancestry check.
          fetch-depth: 0
          fetch-tags: true
      # This workflow lives in a template-owned path, so it ships to every
      # instance. Tagging there would push `core-v<template-version>` into the
      # instance's own tag namespace, alongside its release tags. An instance is
      # detected the same way the Core Version Guard detects one
      # (cli/src/scripts/check-release-subject.ts): `biffo.core.json` is
      # present in an instance and absent in the template. sync-core-tag.ts
      # re-checks this itself; the step guard only avoids the install cost.
      - name: Skip in instances
        id: guard
        run: |
          set -euo pipefail
          if [ -f biffo.core.json ]; then
            echo "biffo.core.json present — this is an instance, not the template. Skipping."
            echo "is_template=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_template=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.guard.outputs.is_template == 'true'
      - uses: actions/setup-node@v5
        if: steps.guard.outputs.is_template == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.guard.outputs.is_template == 'true'
      # Creates core-v<version> when it does not exist, and leaves it alone when
      # it already stands for this template tree. It never repoints an existing
      # tag: that tag is a release, and the npm artifact behind it cannot move
      # with it (#342), so a tree that has drifted underneath one fails here
      # instead. Then audits every version from the baseline up and fails if any
      # tag does not stand for its version's template tree.
      - name: Sync and audit core-v<version>
        id: sync
        if: steps.guard.outputs.is_template == 'true'
        run: pnpm --filter @biffo/cli sync:core-tag -- --push

      # Release the CLI for the tag just written.
      #
      # This exists because of a gap that is easy to miss and silent when hit:
      # the tag above is pushed with this job's GITHUB_TOKEN, and GitHub does not
      # trigger workflows from GITHUB_TOKEN-created events. So publish-cli.yml's
      # `on: push: tags: [core-v*]` never fired — every release to date was a
      # manual dispatch, with nothing to indicate one was needed.
      #
      # Dispatching explicitly keeps the causal chain visible in the Actions log
      # and needs no new credential: a PAT purely to defeat the recursion guard
      # would be a long-lived secret bought for nothing.
      #
      # Only fires when a tag was actually created — `steps.sync.outputs.tag` is
      # unset when the tag already stood for this tree, so an ordinary push to
      # the default branch releases nothing. This is also why an existing tag is
      # a *published* tag, and so must never be repointed: every tag this job
      # writes is handed straight to publish-cli.yml.
      - name: Dispatch CLI release
        if: steps.sync.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.sync.outputs.tag }}
          ACTION: ${{ steps.sync.outputs.action }}
        run: |
          set -euo pipefail
          echo "::notice::Tag $TAG was ${ACTION}d — dispatching publish-cli.yml against it."
          gh workflow run publish-cli.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
          echo "Dispatched publish-cli.yml for $TAG." >> "$GITHUB_STEP_SUMMARY"
