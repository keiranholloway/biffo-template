          # sibling to services/api/, created by `biffo data import`) so
          # discover_ddl_import_dirs() can find them at runtime — same reasoning
          # as the plugin manifest loop above. See api.ddl_import module docstring.
          mkdir -p package/db/imports
          for import_dir in ../db/imports/*/; do
            [ -d "$import_dir" ] || continue
            import_name=$(basename "$import_dir")
            mkdir -p "package/db/imports/$import_name"
            cp "$import_dir"*.sql "package/db/imports/$import_name/" 2>/dev/null || true
          done
          cd package && zip -r ../lambda.zip .
          aws lambda update-function-code \
            --function-name ${{ vars.CORE_API_LAMBDA_NAME }} \
            --zip-file fileb://../lambda.zip
      - name: Initialise database schema
        run: |
          aws lambda wait function-updated \
            --function-name ${{ vars.CORE_API_LAMBDA_NAME }}
          RESULT=$(aws lambda invoke \
            --function-name ${{ vars.CORE_API_LAMBDA_NAME }} \
            --payload '{"source":"biffo:db-init"}' \
            --cli-binary-format raw-in-base64-out \
            db-init-response.json)
          if echo "$RESULT" | grep -q FunctionError; then
            echo "Schema init failed:" && cat db-init-response.json && exit 1
          fi
      # Apply every vendored DDL import (ADR-0005) after the Alembic schema init.
      # Like db-init runs the Core's own migrations, this runs biffo:ddl-import for
      # each db/imports/<name>/ dir — new .sql files (schema additions, seeds) apply
      # automatically on deploy instead of needing a manual invoke. Idempotent:
      # already-applied files are skipped via ddl_import_history.
      - name: Apply DDL imports
        run: |
          shopt -s nullglob
          for import_dir in db/imports/*/; do
            name=$(basename "$import_dir")
            echo "Applying DDL import: $name"
            RESULT=$(aws lambda invoke \
              --function-name ${{ vars.CORE_API_LAMBDA_NAME }} \
              --payload "{\"source\":\"biffo:ddl-import\",\"directory\":\"$name\"}" \
              --cli-binary-format raw-in-base64-out \
              ddl-import-response.json)
            if echo "$RESULT" | grep -q FunctionError; then
              echo "DDL import $name failed:" && cat ddl-import-response.json && exit 1
            fi
            cat ddl-import-response.json
          done
      # Package and deploy the isolated PR-signer Lambda (ADR-0008), only when
      # the instance has provisioned one (enable_pr_signer surfaces its function
      # name as PR_SIGNER_LAMBDA_NAME). Unlike the Core API above, this packages
      # straight from the checkout, not the api-service artifact: the signer
      # depends on the workspace SDK (packages/python-sdk), which the artifact
      # doesn't carry. Third-party deps come from the workspace lock (excluding
      # workspace members, hence --no-emit-workspace/--no-emit-project); the SDK
      # itself is installed from source with --no-deps.
      - name: Package and deploy PR-signer Lambda
        if: vars.PR_SIGNER_LAMBDA_NAME != ''
        run: |
          uv export --package biffo-pr-signer --no-dev --frozen \
            --no-emit-workspace --no-emit-project \
            --output-file pr-signer-requirements.txt
          uv pip install -r pr-signer-requirements.txt --target pr-signer-package/
          uv pip install ./packages/python-sdk --target pr-signer-package/ --no-deps
          cp -r services/pr-signer/src pr-signer-package/
          cd pr-signer-package && zip -r ../pr-signer-lambda.zip .
          cd ..
          aws lambda update-function-code \
            --function-name ${{ vars.PR_SIGNER_LAMBDA_NAME }} \
            --zip-file fileb://pr-signer-lambda.zip
          aws lambda wait function-updated \
            --function-name ${{ vars.PR_SIGNER_LAMBDA_NAME }}
