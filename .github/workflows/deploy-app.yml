name: Deploy Application

on:
  push:
    branches: [dev, staging, main]
    paths:
      - 'apps/**'
      - 'services/**'
      - 'packages/**'
      # db/imports/<name>/*.sql, vendored by `biffo data import` (ADR-0005) —
      # without this, pushing a new/updated DDL import wouldn't trigger a
      # redeploy the way installing a plugin under services/ already does.
      - 'db/**'
      # The portal's Microservices tab (siblings.json) is generated by THIS
      # workflow from the sibling registry. Without this path a `biffo sibling
      # create` registration PR (which touches only infra/) fires Deploy
      # Infrastructure — updating CDN routing — but never rebuilds the portal,
      # so a newly-registered sibling routes at /<name> yet never appears in
      # the tab (ADR-0007).
      - 'infra/environments/*/siblings.auto.tfvars.json'
      # A plugin's Lambda code is only shipped once its Terraform is wired, so
      # WIRING a plugin is what makes its code deployable — and wiring touches
      # only modules/ and infra/, neither of which otherwise fires this workflow.
      #
      # Without this path the sequence fails silently and permanently: the core
      # upgrade that adds `services/_plugins/<name>/` fires this workflow, which
      # skips the plugin because it is not wired yet; the wiring PR fires Deploy
      # Infrastructure, which creates the Lambda; and nothing ever runs this
      # workflow again. The function exists and serves the compute module's
      # placeholder forever. Observed on tabsii-platform with the ADR-0014 agent
      # runtime, and only fixable by a manual workflow_dispatch.
      #
      # Both wiring locations are covered: modules/plugins/ for a third-party
      # plugin whose terraform is copied in, and infra/environments/ for a
      # first-party one, which is referenced in place (#406) and whose wiring is
      # therefore just a module block. Missing the second is how this recurred:
      # repointing tabsii-platform's module sources touched only infra/ and
      # modules/, so no Deploy Application ran for it at all.
      - 'modules/plugins/**'
      - 'infra/environments/*/main.tf'
      - 'infra/environments/*/plugins.generated.tf'
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [dev, staging, prod]

# Never cancel-in-progress here (unlike ci.yml) — this workflow packages and
# ships application code. A second trigger for the same branch (e.g. a push
# landing right after a manual re-run) queues behind the first instead of
# running alongside it, so two overlapping S3 syncs / Lambda code updates
# for the same environment can't race each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  NODE_VERSION: '22'

# Deploy jobs only run in repos where BIFFO_DEPLOY_ENABLED=true has been set.
# The template repo itself has this unset, so all jobs are skipped there.

# ─── DEV ─────────────────────────────────────────────────────────────────────

jobs:
  build-dev:
    name: Build (dev)
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    environment: dev
    if: vars.BIFFO_DEPLOY_ENABLED == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/dev') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev'))
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      # Generate the Microservices tab's data (ADR-0007) from this env's sibling
      # registry so the static portal can list siblings without a server. Link is
      # /<name> (no trailing slash — CloudFront path routing is exact).
      #
      # It lives under public/admin/ so it publishes at /admin/siblings.json:
      # the portal owns the /admin prefix and only that prefix (issue #306), so
      # a manifest at the root would be served by whatever owns `/` — the
      # user-application sibling — and the tab would 404.
      - name: Generate siblings manifest
        run: |
          SRC=infra/environments/dev/siblings.auto.tfvars.json
          OUT=apps/portal/public/admin/siblings.json
          mkdir -p "$(dirname "$OUT")"
          if [ -f "$SRC" ]; then
            jq '{ siblings: [.sibling_origins[] | { name, description: (.description // ""), routes: (.routes // []) }] }' "$SRC" > "$OUT"
          else
            echo '{ "siblings": [] }' > "$OUT"
          fi
          cat "$OUT"
      - name: Build portal
        env:
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ vars.COGNITO_USER_POOL_ID }}
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
          NEXT_PUBLIC_COGNITO_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          NEXT_PUBLIC_API_URL: ${{ vars.API_GATEWAY_URL }}
        run: pnpm run build
      - uses: actions/upload-artifact@v5
        with:
          name: portal-build-dev
          path: apps/portal/out/
      - uses: actions/upload-artifact@v5
        with:
          name: api-service-dev
          path: services/api/

  deploy-dev:
    name: Deploy to dev
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    needs: build-dev
    environment: dev
    if: vars.BIFFO_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/dev'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.BIFFO_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Register Core API secret env values as log masks
        # Belt-and-braces for #334. The primary fix suppresses update-function-code
        # output, but if any *future* step accidentally echoes the function config,
        # these masks redact the two known DB credentials. The values are never
        # printed: each is scoped by --query to a single variable, captured into a
        # shell var, and piped only into ::add-mask:: (whose own argument GitHub
        # redacts). Best-effort — it must never fail the deploy, hence the guards.
        run: |
          for v in DATABASE_URL BIFFO_APP_DATABASE_URL; do
            val=$(aws lambda get-function-configuration \
              --function-name "${{ vars.CORE_API_LAMBDA_NAME }}" \
              --query "Environment.Variables.$v" --output text 2>/dev/null || true)
            if [ -n "$val" ] && [ "$val" != "None" ]; then
              echo "::add-mask::$val"
            fi
          done
      - uses: actions/download-artifact@v5
        with:
          name: portal-build-dev
          path: portal-dist/
      - name: Verify the portal was built against live Cognito
        run: |
          # Deploy Application and Deploy Infrastructure trigger independently and
          # run CONCURRENTLY — a core upgrade touches modules/ AND apps/, firing
          # both. The portal bakes NEXT_PUBLIC_COGNITO_* at build time from
          # GitHub variables that the infra run writes at the END of its apply, so
          # a build that starts first ships the PREVIOUS pool.
          #
          # Not theoretical: replacing a user pool (any change to an immutable
          # attribute such as username_attributes) produced a fully green deploy
          # serving a portal that answered every sign-in with
          # "User pool client <id> does not exist".
          #
          # Ordering cannot express the rule — a push touching only apps/**
          # legitimately never runs infra and must not wait for it — so assert the
          # artefact against reality instead. Catches the race, a stale variable, a
          # manual dispatch after an infra change, and the empty-string fallback in
          # lib/auth.ts, regardless of cause.
          #
          # The remedy is always a FULL workflow re-run, never a failed-job re-run
          # (issue #408). This job consumes the portal via download-artifact and the
          # ids are baked in at build time, so re-running it alone re-downloads the
          # identical stale bundle and fails identically. Say so in the messages
          # below — "re-run failed jobs" is the cheaper and more obvious action, and
          # it is the wrong one.
          set -euo pipefail
          POOL=$(grep -rhoE '[a-z]{2}-[a-z]+-[0-9]+_[A-Za-z0-9]{9}' portal-dist/ | sort -u | head -1 || true)
          if [ -z "$POOL" ]; then
            echo "::error::No Cognito user pool id in the built portal. NEXT_PUBLIC_COGNITO_USER_POOL_ID was empty at build time; lib/auth.ts falls back to '' and every sign-in fails."
            exit 1
          fi
          if ! aws cognito-idp describe-user-pool --user-pool-id "$POOL" >/dev/null 2>&1; then
            echo "::error::The portal was built against Cognito pool $POOL, which does not exist. It was almost certainly replaced by a concurrent Deploy Infrastructure run. Fix: re-run the ENTIRE workflow now that infrastructure has settled - the 'Re-run all jobs' button, or 'gh run rerun <run-id>' WITHOUT --failed. Re-running only this failed job cannot work: the pool id is baked into the portal at build time, so this job just re-downloads the same stale build artifact and fails identically. Only a new Build job can pick up the live pool."
            exit 1
          fi
          # One call, then a grep — never guess client ids out of the bundle, which
          # is full of same-shaped build hashes.
          MATCH=""
          for c in $(aws cognito-idp list-user-pool-clients --user-pool-id "$POOL" \
                       --query 'UserPoolClients[].ClientId' --output text); do
            if grep -rq "$c" portal-dist/; then MATCH="$c"; break; fi
          done
          if [ -z "$MATCH" ]; then
            echo "::error::The portal names pool $POOL but none of that pool's app clients. The baked client id is stale. Fix: re-run the ENTIRE workflow - the 'Re-run all jobs' button, or 'gh run rerun <run-id>' WITHOUT --failed. Re-running only this failed job cannot work: the client id is baked into the portal at build time, so this job just re-downloads the same stale build artifact and fails identically. Only a new Build job can pick up the live client."
            exit 1
          fi
          echo "Portal builds against live pool $POOL / client $MATCH"
      - name: Place portal assets under /admin
        run: |
          # apps/portal/next.config.ts sets `assetPrefix: '/admin'` (issue #306)
          # so the exported HTML references /admin/_next/*, freeing /_next/* for
          # the user-application sibling, which has an empty basePath and would
          # otherwise claim the identical URL prefix from a different origin.
          #
          # assetPrefix rewrites URLs ONLY — Next still EMITS the files at
          # out/_next/*. Nothing in the build moves them, so without this step
          # every asset the portal asks for 404s. Move them to the key the HTML
          # references. The three sync passes below are unchanged: the same
          # extension filters apply, and their `--delete` removes the now-stale
          # objects under the old s3://<bucket>/_next/ prefix.
          if [ -d portal-dist/_next ]; then
            mkdir -p portal-dist/admin
            rm -rf portal-dist/admin/_next
            mv portal-dist/_next portal-dist/admin/_next
          fi
          # Fail loudly rather than shipping a portal with no assets at all.
          test -d portal-dist/admin/_next
      - name: Sync portal to S3
        run: |
          # Three passes, split by mutability and content type.
          #
          # Next's App Router emits its RSC flight payloads as *.txt. They were
          # previously caught by the first pass, which gave them two wrong
          # properties and broke every client-side navigation (issue #275):
          #
          #   - `aws s3 sync` guesses content type from the extension, so they
          #     were served as text/plain rather than text/x-component. The
          #     router does not recognise that as an RSC response and falls
          #     back to a hard MPA navigation TO THE URL IT WAS FETCHING — so
          #     clicking a link landed the browser on /admin/index.txt showing
          #     raw serialised React. Typing the URL worked, because a full
          #     page load never fetches the payload.
          #
          #   - they were cached immutable for a year, but they change on every
          #     deploy exactly like the HTML does.
          #
          # Hashed assets under _next/static are genuinely immutable and keep
          # the long cache; HTML and RSC payloads must not.
          aws s3 sync portal-dist/ s3://${{ vars.PORTAL_BUCKET_NAME }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "*.txt"
          # `--include` only re-includes from an excluded set; on its own it is a
          # no-op, since everything is included by default. Without the explicit
          # `--exclude "*"` this pass would upload the .txt payloads too — as
          # text/plain — and the pass below, being a sync, would then skip them
          # as unchanged and the wrong content type would survive.
          aws s3 sync portal-dist/ s3://${{ vars.PORTAL_BUCKET_NAME }}/ \
            --delete \
            --cache-control "no-cache" \
            --exclude "*" \
            --include "*.html"
          aws s3 sync portal-dist/ s3://${{ vars.PORTAL_BUCKET_NAME }}/ \
            --delete \
            --cache-control "no-cache" \
            --content-type "text/x-component" \
            --exclude "*" \
            --include "*.txt"
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
      - uses: actions/download-artifact@v5
        with:
          name: api-service-dev
          path: api-service/
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - name: Package and deploy Lambda
        working-directory: api-service
        run: |
          # Export from the repo-root lock, NOT from this directory. The
          # artifact is services/api/ alone, which carries a pyproject.toml but
          # no uv.lock — this is a uv workspace, so the lock exists only at the
          # root. Exporting from here found no lock and so re-resolved every
          # dependency against live PyPI on each deploy, ignoring every pin:
          # identical code could ship different trees on two runs, and a broken
          # or hostile release reached the Lambda minutes after publication.
          # greenlet 3.5.4 did precisely that — published with no manylinux
          # wheels, it broke a deploy five minutes later (#410). --frozen uses
          # the lock as-is and fails rather than quietly resolving something
          # new, matching the PR-signer and plugin steps further down.
          uv export --project .. --package biffo-api --no-dev --frozen \
            --no-emit-workspace --no-emit-project \
            --output-file requirements.txt
          uv pip install -r requirements.txt --target package/
          # Trim the package before zipping so the code update fits AWS's direct
          # update-function-code limit. That API base64-encodes the zip into the
          # request body (~1.33x), so a ~54MB zip inflates past the ~70MB request
          # cap — large native deps (numpy/shapely/pandas/pydantic-core/etc.) reach
          # that easily. boto3/botocore/s3transfer are already provided by the
          # Lambda Python runtime, so drop them plus build-time dead weight
          # (dist-info, __pycache__, bundled tests/); the app's `import boto3`
          # resolves to the runtime's own copy.
          (
            cd package
            rm -rf boto3 botocore s3transfer \
                   boto3-*.dist-info botocore-*.dist-info s3transfer-*.dist-info
            find . -type d -name __pycache__ -prune -exec rm -rf {} +
            find . -type d -name tests -prune -exec rm -rf {} +
          )
          cp -r src/ package/
          cp -r migrations/ package/
          cp alembic.ini package/
          # Bundle every installed plugin's manifest so discover_plugin_manifests()
          # can find it at runtime — the Lambda otherwise only ships services/api/
          # itself. Both plugin channels are bundled: services/*/ (third-party,
          # user-owned) and services/_plugins/*/ (first-party, template-owned).
          # They flatten to services/<name>/ in the zip, keyed on plugin name, so
          # the runtime layout is identical either way. See the api.plugins module
          # docstring for the read side of this.
          mkdir -p package/services
          for manifest in ../services/*/biffo.plugin.json ../services/_plugins/*/biffo.plugin.json; do
            [ -f "$manifest" ] || continue
            plugin_name=$(basename "$(dirname "$manifest")")
            mkdir -p "package/services/$plugin_name"
            cp "$manifest" "package/services/$plugin_name/"
          done
          # Bundle every vendored DDL import's .sql files (db/imports/<name>/*.sql,
          # sibling to services/api/, created by `biffo data import`) so
          # discover_ddl_import_dirs() can find them at runtime — same reasoning
          # as the plugin manifest loop above. See api.ddl_import module docstring.
          mkdir -p package/db/imports
          for import_dir in ../db/imports/*/; do
            [ -d "$import_dir" ] || continue
            import_name=$(basename "$import_dir")
            mkdir -p "package/db/imports/$import_name"
            cp "$import_dir"*.sql "package/db/imports/$import_name/" 2>/dev/null || true
          done
          cd package && zip -r ../lambda.zip .
          # --output text --query 'LastUpdateStatus' suppresses the CLI's default
          # output, which is the *entire* function configuration as JSON —
          # including Environment.Variables (the master DATABASE_URL and, since
          # #253, BIFFO_APP_DATABASE_URL) in plaintext. Printing that leaked live
          # DB credentials into the Actions log (#334). The response is unused —
          # the wait below is what gates progress — so narrowing it to the status
          # string loses nothing.
          aws lambda update-function-code \
            --function-name ${{ vars.CORE_API_LAMBDA_NAME }} \
            --zip-file fileb://../lambda.zip \
            --output text --query 'LastUpdateStatus'
      - name: Initialise database schema
        run: |
          aws lambda wait function-updated \
            --function-name ${{ vars.CORE_API_LAMBDA_NAME }}
          RESULT=$(aws lambda invoke \
            --function-name ${{ vars.CORE_API_LAMBDA_NAME }} \
            --payload '{"source":"biffo:db-init"}' \
            --cli-binary-format raw-in-base64-out \
            db-init-response.json)
          if echo "$RESULT" | grep -q FunctionError; then
            echo "Schema init failed:" && cat db-init-response.json && exit 1
          fi
          # Echo the response on success too. It carries the app_role result
          # (#253): {"bootstrapped": true, "role": "biffo_app", "schemas": [...]}
          # when the least-privilege role was created and granted. A
          # "bootstrapped": false with reason "no-app-credential" means the
          # environment has not been re-applied and the request path is still
          # falling back to the owner/master role -- which is serving traffic,
          # so it is not a deploy failure, but it is not the intended posture
          # either. This is the only place that distinction is visible.
          echo "db-init response:" && cat db-init-response.json && echo
      # Apply every vendored DDL import (ADR-0005) after the Alembic schema init.
      # Like db-init runs the Core's own migrations, this runs biffo:ddl-import for
      # each db/imports/<name>/ dir — new .sql files (schema additions, seeds) apply
      # automatically on deploy instead of needing a manual invoke. Idempotent:
      # already-applied files are skipped via ddl_import_history.
      - name: Apply DDL imports
        run: |
          shopt -s nullglob
          for import_dir in db/imports/*/; do
            name=$(basename "$import_dir")
            echo "Applying DDL import: $name"
            RESULT=$(aws lambda invoke \
              --function-name ${{ vars.CORE_API_LAMBDA_NAME }} \
              --payload "{\"source\":\"biffo:ddl-import\",\"directory\":\"$name\"}" \
              --cli-binary-format raw-in-base64-out \
              ddl-import-response.json)
            if echo "$RESULT" | grep -q FunctionError; then
              echo "DDL import $name failed:" && cat ddl-import-response.json && exit 1
            fi
            cat ddl-import-response.json
          done
      # Package and deploy the isolated PR-signer Lambda (ADR-0008), only when
      # the instance has provisioned one (enable_pr_signer surfaces its function
      # name as PR_SIGNER_LAMBDA_NAME). Unlike the Core API above, this packages
      # straight from the checkout, not the api-service artifact: the signer
      # depends on the workspace SDK (packages/python-sdk), which the artifact
      # doesn't carry. Third-party deps come from the workspace lock (excluding
      # workspace members, hence --no-emit-workspace/--no-emit-project); the SDK
      # itself is installed from source with --no-deps.
      - name: Package and deploy PR-signer Lambda
        if: vars.PR_SIGNER_LAMBDA_NAME != ''
        run: |
          uv export --package biffo-pr-signer --no-dev --frozen \
            --no-emit-workspace --no-emit-project \
            --output-file pr-signer-requirements.txt
          uv pip install -r pr-signer-requirements.txt --target pr-signer-package/
          uv pip install ./packages/python-sdk --target pr-signer-package/ --no-deps
          cp -r services/pr-signer/src pr-signer-package/
          cd pr-signer-package && zip -r ../pr-signer-lambda.zip .
          cd ..
          # --output text --query 'LastUpdateStatus' suppresses the default full
          # function-config JSON (env vars in plaintext) — see #334.
          aws lambda update-function-code \
            --function-name ${{ vars.PR_SIGNER_LAMBDA_NAME }} \
            --zip-file fileb://pr-signer-lambda.zip \
            --output text --query 'LastUpdateStatus'
          aws lambda wait function-updated \
            --function-name ${{ vars.PR_SIGNER_LAMBDA_NAME }}
      # Package and deploy each enabled plugin's own Lambda (ADR-0003, #196).
      # deploy-infra (running in parallel) creates the function from a placeholder
      # zip with ignore_changes on its code; this step ships the real handler. A
      # plugin owns a Lambda once its terraform module is installed at
      # modules/plugins/<name>/. The function name is <project>-<env>-plugin-<name>,
      # derived from the Core API Lambda name (strip -core-api) so no extra var is
      # needed. Packaged from the checkout like the PR-signer: third-party deps from
      # the workspace lock (workspace members excluded), the SDK from source, and the
      # plugin's own src/ at the package root to match the <name>.main.handler; the
      # manifest is bundled at the task root (the plugin's manifest.py walks up to it).
      - name: Package and deploy plugin Lambdas
        run: |
          set -euo pipefail
          shopt -s nullglob
          prefix='${{ vars.CORE_API_LAMBDA_NAME }}'
          prefix="${prefix%-core-api}"
          # Both plugin channels (see the manifest-bundling loop above); the
          # terraform module and Lambda name are resolved by plugin *name*
          # (basename of the plugin dir), so the source channel is immaterial here.
          for manifest in services/*/biffo.plugin.json services/_plugins/*/biffo.plugin.json; do
            plugin_dir="$(dirname "$manifest")"
            name="$(basename "$plugin_dir")"
            # Wired means: a copied module (third-party) OR terraform/ beside the
            # plugin (first-party, referenced in place since #406). Checking only
            # modules/plugins/ silently stopped shipping first-party plugin code
            # the moment their dead copies were deleted.
            [ -d "modules/plugins/$name" ] || [ -d "$plugin_dir/terraform" ] || { echo "skip $name (no terraform module)"; continue; }
            fn="${prefix}-plugin-${name}"
            echo "::group::plugin $name -> $fn"
            found=""
            for i in $(seq 1 30); do
              if aws lambda get-function --function-name "$fn" >/dev/null 2>&1; then found=1; break; fi
              echo "waiting for $fn to exist ($i/30)"; sleep 10
            done
            if [ -z "$found" ]; then echo "$fn not found (plugin not enabled this env?); skipping"; echo "::endgroup::"; continue; fi
            pkg_name="$(sed -n 's/^name *= *"\(.*\)".*/\1/p' "$plugin_dir/pyproject.toml" | head -1)"
            rm -rf "plugin-$name-package"
            uv export --package "$pkg_name" --no-dev --frozen \
              --no-emit-workspace --no-emit-project \
              --output-file "plugin-$name-requirements.txt"
            uv pip install -r "plugin-$name-requirements.txt" --target "plugin-$name-package/"
            uv pip install ./packages/python-sdk --target "plugin-$name-package/" --no-deps
            cp -r "$plugin_dir"/src/. "plugin-$name-package/"
            cp "$manifest" "plugin-$name-package/biffo.plugin.json"
            (cd "plugin-$name-package" && zip -rq "../plugin-$name.zip" .)
            # --output text --query 'LastUpdateStatus' suppresses the default full
            # function-config JSON (a plugin Lambda's own secret env vars in
            # plaintext) — see #334.
            aws lambda update-function-code \
              --function-name "$fn" \
              --zip-file "fileb://plugin-$name.zip" \
              --output text --query 'LastUpdateStatus'
            aws lambda wait function-updated --function-name "$fn"
            echo "::endgroup::"
          done

  # ─── STAGING ─────────────────────────────────────────────────────────────────
  # Manual only — run workflow_dispatch with environment=staging.

  build-staging:
    name: Build (staging)
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    environment: staging
    if: vars.BIFFO_DEPLOY_ENABLED == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/staging') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging'))
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      # Generate the Microservices tab's data (ADR-0007) from this env's sibling
      # registry so the static portal can list siblings without a server. Link is
      # /<name> (no trailing slash — CloudFront path routing is exact).
      #
      # It lives under public/admin/ so it publishes at /admin/siblings.json:
      # the portal owns the /admin prefix and only that prefix (issue #306), so
      # a manifest at the root would be served by whatever owns `/` — the
      # user-application sibling — and the tab would 404.
      - name: Generate siblings manifest
        run: |
          SRC=infra/environments/staging/siblings.auto.tfvars.json
          OUT=apps/portal/public/admin/siblings.json
          mkdir -p "$(dirname "$OUT")"
          if [ -f "$SRC" ]; then
            jq '{ siblings: [.sibling_origins[] | { name, description: (.description // ""), routes: (.routes // []) }] }' "$SRC" > "$OUT"
          else
            echo '{ "siblings": [] }' > "$OUT"
          fi
          cat "$OUT"
      - name: Build portal
        env:
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ vars.COGNITO_USER_POOL_ID }}
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
          NEXT_PUBLIC_COGNITO_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          NEXT_PUBLIC_API_URL: ${{ vars.API_GATEWAY_URL }}
        run: pnpm run build
      - uses: actions/upload-artifact@v5
        with:
          name: portal-build-staging
          path: apps/portal/out/
      - uses: actions/upload-artifact@v5
        with:
          name: api-service-staging
          path: services/api/

  deploy-staging:
    name: Deploy to staging
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    needs: build-staging
    environment: staging
    if: vars.BIFFO_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/staging'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.BIFFO_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Register Core API secret env values as log masks
        # Belt-and-braces for #334. The primary fix suppresses update-function-code
        # output, but if any *future* step accidentally echoes the function config,
        # these masks redact the two known DB credentials. The values are never
        # printed: each is scoped by --query to a single variable, captured into a
        # shell var, and piped only into ::add-mask:: (whose own argument GitHub
        # redacts). Best-effort — it must never fail the deploy, hence the guards.
        run: |
          for v in DATABASE_URL BIFFO_APP_DATABASE_URL; do
            val=$(aws lambda get-function-configuration \
              --function-name "${{ vars.CORE_API_LAMBDA_NAME }}" \
              --query "Environment.Variables.$v" --output text 2>/dev/null || true)
            if [ -n "$val" ] && [ "$val" != "None" ]; then
              echo "::add-mask::$val"
            fi
          done
      - uses: actions/download-artifact@v5
        with:
          name: portal-build-staging
          path: portal-dist/
      - name: Verify the portal was built against live Cognito
        run: |
          # Deploy Application and Deploy Infrastructure trigger independently and
          # run CONCURRENTLY — a core upgrade touches modules/ AND apps/, firing
          # both. The portal bakes NEXT_PUBLIC_COGNITO_* at build time from
          # GitHub variables that the infra run writes at the END of its apply, so
          # a build that starts first ships the PREVIOUS pool.
          #
          # Not theoretical: replacing a user pool (any change to an immutable
          # attribute such as username_attributes) produced a fully green deploy
          # serving a portal that answered every sign-in with
          # "User pool client <id> does not exist".
          #
          # Ordering cannot express the rule — a push touching only apps/**
          # legitimately never runs infra and must not wait for it — so assert the
          # artefact against reality instead. Catches the race, a stale variable, a
          # manual dispatch after an infra change, and the empty-string fallback in
          # lib/auth.ts, regardless of cause.
          #
          # The remedy is always a FULL workflow re-run, never a failed-job re-run
          # (issue #408). This job consumes the portal via download-artifact and the
          # ids are baked in at build time, so re-running it alone re-downloads the
          # identical stale bundle and fails identically. Say so in the messages
          # below — "re-run failed jobs" is the cheaper and more obvious action, and
          # it is the wrong one.
          set -euo pipefail
          POOL=$(grep -rhoE '[a-z]{2}-[a-z]+-[0-9]+_[A-Za-z0-9]{9}' portal-dist/ | sort -u | head -1 || true)
          if [ -z "$POOL" ]; then
            echo "::error::No Cognito user pool id in the built portal. NEXT_PUBLIC_COGNITO_USER_POOL_ID was empty at build time; lib/auth.ts falls back to '' and every sign-in fails."
            exit 1
          fi
          if ! aws cognito-idp describe-user-pool --user-pool-id "$POOL" >/dev/null 2>&1; then
            echo "::error::The portal was built against Cognito pool $POOL, which does not exist. It was almost certainly replaced by a concurrent Deploy Infrastructure run. Fix: re-run the ENTIRE workflow now that infrastructure has settled - the 'Re-run all jobs' button, or 'gh run rerun <run-id>' WITHOUT --failed. Re-running only this failed job cannot work: the pool id is baked into the portal at build time, so this job just re-downloads the same stale build artifact and fails identically. Only a new Build job can pick up the live pool."
            exit 1
          fi
          # One call, then a grep — never guess client ids out of the bundle, which
          # is full of same-shaped build hashes.
          MATCH=""
          for c in $(aws cognito-idp list-user-pool-clients --user-pool-id "$POOL" \
                       --query 'UserPoolClients[].ClientId' --output text); do
            if grep -rq "$c" portal-dist/; then MATCH="$c"; break; fi
          done
          if [ -z "$MATCH" ]; then
            echo "::error::The portal names pool $POOL but none of that pool's app clients. The baked client id is stale. Fix: re-run the ENTIRE workflow - the 'Re-run all jobs' button, or 'gh run rerun <run-id>' WITHOUT --failed. Re-running only this failed job cannot work: the client id is baked into the portal at build time, so this job just re-downloads the same stale build artifact and fails identically. Only a new Build job can pick up the live client."
            exit 1
          fi
          echo "Portal builds against live pool $POOL / client $MATCH"
      - name: Place portal assets under /admin
        run: |
          # apps/portal/next.config.ts sets `assetPrefix: '/admin'` (issue #306)
          # so the exported HTML references /admin/_next/*, freeing /_next/* for
          # the user-application sibling, which has an empty basePath and would
          # otherwise claim the identical URL prefix from a different origin.
          #
          # assetPrefix rewrites URLs ONLY — Next still EMITS the files at
          # out/_next/*. Nothing in the build moves them, so without this step
          # every asset the portal asks for 404s. Move them to the key the HTML
          # references. The three sync passes below are unchanged: the same
          # extension filters apply, and their `--delete` removes the now-stale
          # objects under the old s3://<bucket>/_next/ prefix.
          if [ -d portal-dist/_next ]; then
            mkdir -p portal-dist/admin
            rm -rf portal-dist/admin/_next
            mv portal-dist/_next portal-dist/admin/_next
          fi
          # Fail loudly rather than shipping a portal with no assets at all.
          test -d portal-dist/admin/_next
      - name: Sync portal to S3
        run: |
          # Three passes, split by mutability and content type.
          #
          # Next's App Router emits its RSC flight payloads as *.txt. They were
          # previously caught by the first pass, which gave them two wrong
          # properties and broke every client-side navigation (issue #275):
          #
          #   - `aws s3 sync` guesses content type from the extension, so they
          #     were served as text/plain rather than text/x-component. The
          #     router does not recognise that as an RSC response and falls
          #     back to a hard MPA navigation TO THE URL IT WAS FETCHING — so
          #     clicking a link landed the browser on /admin/index.txt showing
          #     raw serialised React. Typing the URL worked, because a full
          #     page load never fetches the payload.
          #
          #   - they were cached immutable for a year, but they change on every
          #     deploy exactly like the HTML does.
          #
          # Hashed assets under _next/static are genuinely immutable and keep
          # the long cache; HTML and RSC payloads must not.
          aws s3 sync portal-dist/ s3://${{ vars.PORTAL_BUCKET_NAME }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "*.txt"
          # `--include` only re-includes from an excluded set; on its own it is a
          # no-op, since everything is included by default. Without the explicit
          # `--exclude "*"` this pass would upload the .txt payloads too — as
          # text/plain — and the pass below, being a sync, would then skip them
          # as unchanged and the wrong content type would survive.
          aws s3 sync portal-dist/ s3://${{ vars.PORTAL_BUCKET_NAME }}/ \
            --delete \
            --cache-control "no-cache" \
            --exclude "*" \
            --include "*.html"
          aws s3 sync portal-dist/ s3://${{ vars.PORTAL_BUCKET_NAME }}/ \
            --delete \
            --cache-control "no-cache" \
            --content-type "text/x-component" \
            --exclude "*" \
            --include "*.txt"
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
      - uses: actions/download-artifact@v5
        with:
          name: api-service-staging
          path: api-service/
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - name: Package and deploy Lambda
        working-directory: api-service
        run: |
          # Export from the repo-root lock, NOT from this directory. The
          # artifact is services/api/ alone, which carries a pyproject.toml but
          # no uv.lock — this is a uv workspace, so the lock exists only at the
          # root. Exporting from here found no lock and so re-resolved every
          # dependency against live PyPI on each deploy, ignoring every pin:
          # identical code could ship different trees on two runs, and a broken
          # or hostile release reached the Lambda minutes after publication.
          # greenlet 3.5.4 did precisely that — published with no manylinux
          # wheels, it broke a deploy five minutes later (#410). --frozen uses
          # the lock as-is and fails rather than quietly resolving something
          # new, matching the PR-signer and plugin steps further down.
          uv export --project .. --package biffo-api --no-dev --frozen \
            --no-emit-workspace --no-emit-project \
            --output-file requirements.txt
          uv pip install -r requirements.txt --target package/
          # Trim the package before zipping so the code update fits AWS's direct
          # update-function-code limit. That API base64-encodes the zip into the
          # request body (~1.33x), so a ~54MB zip inflates past the ~70MB request
          # cap — large native deps (numpy/shapely/pandas/pydantic-core/etc.) reach
          # that easily. boto3/botocore/s3transfer are already provided by the
          # Lambda Python runtime, so drop them plus build-time dead weight
          # (dist-info, __pycache__, bundled tests/); the app's `import boto3`
          # resolves to the runtime's own copy.
          (
            cd package
            rm -rf boto3 botocore s3transfer \
                   boto3-*.dist-info botocore-*.dist-info s3transfer-*.dist-info
            find . -type d -name __pycache__ -prune -exec rm -rf {} +
            find . -type d -name tests -prune -exec rm -rf {} +
          )
          cp -r src/ package/
          cp -r migrations/ package/
          cp alembic.ini package/
          # Bundle every installed plugin's manifest so discover_plugin_manifests()
          # can find it at runtime — the Lambda otherwise only ships services/api/
          # itself. Both plugin channels are bundled: services/*/ (third-party,
          # user-owned) and services/_plugins/*/ (first-party, template-owned).
          # They flatten to services/<name>/ in the zip, keyed on plugin name, so
          # the runtime layout is identical either way. See the api.plugins module
          # docstring for the read side of this.
          mkdir -p package/services
          for manifest in ../services/*/biffo.plugin.json ../services/_plugins/*/biffo.plugin.json; do
            [ -f "$manifest" ] || continue
            plugin_name=$(basename "$(dirname "$manifest")")
            mkdir -p "package/services/$plugin_name"
            cp "$manifest" "package/services/$plugin_name/"
          done
          # Bundle every vendored DDL import's .sql files (db/imports/<name>/*.sql,
          # sibling to services/api/, created by `biffo data import`) so
          # discover_ddl_import_dirs() can find them at runtime — same reasoning
          # as the plugin manifest loop above. See api.ddl_import module docstring.
          mkdir -p package/db/imports
          for import_dir in ../db/imports/*/; do
            [ -d "$import_dir" ] || continue
            import_name=$(basename "$import_dir")
            mkdir -p "package/db/imports/$import_name"
            cp "$import_dir"*.sql "package/db/imports/$import_name/" 2>/dev/null || true
          done
          cd package && zip -r ../lambda.zip .
          # --output text --query 'LastUpdateStatus' suppresses the CLI's default
          # output, which is the *entire* function configuration as JSON —
          # including Environment.Variables (the master DATABASE_URL and, since
          # #253, BIFFO_APP_DATABASE_URL) in plaintext. Printing that leaked live
          # DB credentials into the Actions log (#334). The response is unused —
          # the wait below is what gates progress — so narrowing it to the status
          # string loses nothing.
          aws lambda update-function-code \
            --function-name ${{ vars.CORE_API_LAMBDA_NAME }} \
            --zip-file fileb://../lambda.zip \
            --output text --query 'LastUpdateStatus'
      - name: Initialise database schema
        run: |
          aws lambda wait function-updated \
            --function-name ${{ vars.CORE_API_LAMBDA_NAME }}
          RESULT=$(aws lambda invoke \
            --function-name ${{ vars.CORE_API_LAMBDA_NAME }} \
            --payload '{"source":"biffo:db-init"}' \
            --cli-binary-format raw-in-base64-out \
            db-init-response.json)
          if echo "$RESULT" | grep -q FunctionError; then
            echo "Schema init failed:" && cat db-init-response.json && exit 1
          fi
          # Echo the response on success too. It carries the app_role result
          # (#253): {"bootstrapped": true, "role": "biffo_app", "schemas": [...]}
          # when the least-privilege role was created and granted. A
          # "bootstrapped": false with reason "no-app-credential" means the
          # environment has not been re-applied and the request path is still
          # falling back to the owner/master role -- which is serving traffic,
          # so it is not a deploy failure, but it is not the intended posture
          # either. This is the only place that distinction is visible.
          echo "db-init response:" && cat db-init-response.json && echo
      # Apply every vendored DDL import (ADR-0005) after the Alembic schema init.
      # Like db-init runs the Core's own migrations, this runs biffo:ddl-import for
      # each db/imports/<name>/ dir — new .sql files (schema additions, seeds) apply
      # automatically on deploy instead of needing a manual invoke. Idempotent:
      # already-applied files are skipped via ddl_import_history.
      - name: Apply DDL imports
        run: |
          shopt -s nullglob
          for import_dir in db/imports/*/; do
            name=$(basename "$import_dir")
            echo "Applying DDL import: $name"
            RESULT=$(aws lambda invoke \
              --function-name ${{ vars.CORE_API_LAMBDA_NAME }} \
              --payload "{\"source\":\"biffo:ddl-import\",\"directory\":\"$name\"}" \
              --cli-binary-format raw-in-base64-out \
              ddl-import-response.json)
            if echo "$RESULT" | grep -q FunctionError; then
              echo "DDL import $name failed:" && cat ddl-import-response.json && exit 1
            fi
            cat ddl-import-response.json
          done
      # Package and deploy the isolated PR-signer Lambda (ADR-0008), only when
      # the instance has provisioned one (enable_pr_signer surfaces its function
      # name as PR_SIGNER_LAMBDA_NAME). Unlike the Core API above, this packages
      # straight from the checkout, not the api-service artifact: the signer
      # depends on the workspace SDK (packages/python-sdk), which the artifact
      # doesn't carry. Third-party deps come from the workspace lock (excluding
      # workspace members, hence --no-emit-workspace/--no-emit-project); the SDK
      # itself is installed from source with --no-deps.
      - name: Package and deploy PR-signer Lambda
        if: vars.PR_SIGNER_LAMBDA_NAME != ''
        run: |
          uv export --package biffo-pr-signer --no-dev --frozen \
            --no-emit-workspace --no-emit-project \
            --output-file pr-signer-requirements.txt
          uv pip install -r pr-signer-requirements.txt --target pr-signer-package/
          uv pip install ./packages/python-sdk --target pr-signer-package/ --no-deps
          cp -r services/pr-signer/src pr-signer-package/
          cd pr-signer-package && zip -r ../pr-signer-lambda.zip .
          cd ..
          # --output text --query 'LastUpdateStatus' suppresses the default full
          # function-config JSON (env vars in plaintext) — see #334.
          aws lambda update-function-code \
            --function-name ${{ vars.PR_SIGNER_LAMBDA_NAME }} \
            --zip-file fileb://pr-signer-lambda.zip \
            --output text --query 'LastUpdateStatus'
          aws lambda wait function-updated \
            --function-name ${{ vars.PR_SIGNER_LAMBDA_NAME }}
      # Package and deploy each enabled plugin's own Lambda (ADR-0003, #196).
      # deploy-infra (running in parallel) creates the function from a placeholder
      # zip with ignore_changes on its code; this step ships the real handler. A
      # plugin owns a Lambda once its terraform module is installed at
      # modules/plugins/<name>/. The function name is <project>-<env>-plugin-<name>,
      # derived from the Core API Lambda name (strip -core-api) so no extra var is
      # needed. Packaged from the checkout like the PR-signer: third-party deps from
      # the workspace lock (workspace members excluded), the SDK from source, and the
      # plugin's own src/ at the package root to match the <name>.main.handler; the
      # manifest is bundled at the task root (the plugin's manifest.py walks up to it).
      - name: Package and deploy plugin Lambdas
        run: |
          set -euo pipefail
          shopt -s nullglob
          prefix='${{ vars.CORE_API_LAMBDA_NAME }}'
          prefix="${prefix%-core-api}"
          # Both plugin channels (see the manifest-bundling loop above); the
          # terraform module and Lambda name are resolved by plugin *name*
          # (basename of the plugin dir), so the source channel is immaterial here.
          for manifest in services/*/biffo.plugin.json services/_plugins/*/biffo.plugin.json; do
            plugin_dir="$(dirname "$manifest")"
            name="$(basename "$plugin_dir")"
            # Wired means: a copied module (third-party) OR terraform/ beside the
            # plugin (first-party, referenced in place since #406). Checking only
            # modules/plugins/ silently stopped shipping first-party plugin code
            # the moment their dead copies were deleted.
            [ -d "modules/plugins/$name" ] || [ -d "$plugin_dir/terraform" ] || { echo "skip $name (no terraform module)"; continue; }
            fn="${prefix}-plugin-${name}"
            echo "::group::plugin $name -> $fn"
            found=""
            for i in $(seq 1 30); do
              if aws lambda get-function --function-name "$fn" >/dev/null 2>&1; then found=1; break; fi
              echo "waiting for $fn to exist ($i/30)"; sleep 10
            done
            if [ -z "$found" ]; then echo "$fn not found (plugin not enabled this env?); skipping"; echo "::endgroup::"; continue; fi
            pkg_name="$(sed -n 's/^name *= *"\(.*\)".*/\1/p' "$plugin_dir/pyproject.toml" | head -1)"
            rm -rf "plugin-$name-package"
            uv export --package "$pkg_name" --no-dev --frozen \
              --no-emit-workspace --no-emit-project \
              --output-file "plugin-$name-requirements.txt"
            uv pip install -r "plugin-$name-requirements.txt" --target "plugin-$name-package/"
            uv pip install ./packages/python-sdk --target "plugin-$name-package/" --no-deps
            cp -r "$plugin_dir"/src/. "plugin-$name-package/"
            cp "$manifest" "plugin-$name-package/biffo.plugin.json"
            (cd "plugin-$name-package" && zip -rq "../plugin-$name.zip" .)
            # --output text --query 'LastUpdateStatus' suppresses the default full
            # function-config JSON (a plugin Lambda's own secret env vars in
            # plaintext) — see #334.
            aws lambda update-function-code \
              --function-name "$fn" \
              --zip-file "fileb://plugin-$name.zip" \
              --output text --query 'LastUpdateStatus'
            aws lambda wait function-updated --function-name "$fn"
            echo "::endgroup::"
          done

  # ─── PROD ────────────────────────────────────────────────────────────────────
  # Manual only — run workflow_dispatch with environment=prod.
  # Requires prod environment approval in GitHub Settings → Environments.

  build-prod:
    name: Build (prod)
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    environment: prod
    # prod deploys always require an explicit workflow_dispatch, never a push
    # side effect — BIFFO_DEPLOY_ENABLED is a single repo-wide flag set true
    # by the very first `biffo deploy` of ANY environment, so a push-triggered
    # prod path here would mean every future push to main (e.g. a routine PR
    # merge) silently deploys to production the moment anyone has ever run
    # `biffo deploy dev` even once. This is what "Manual only" above means —
    # a prior version of this condition contradicted that comment.
    if: vars.BIFFO_DEPLOY_ENABLED == 'true' && github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      # Generate the Microservices tab's data (ADR-0007) from this env's sibling
      # registry so the static portal can list siblings without a server. Link is
      # /<name> (no trailing slash — CloudFront path routing is exact).
      #
      # It lives under public/admin/ so it publishes at /admin/siblings.json:
      # the portal owns the /admin prefix and only that prefix (issue #306), so
      # a manifest at the root would be served by whatever owns `/` — the
      # user-application sibling — and the tab would 404.
      - name: Generate siblings manifest
        run: |
          SRC=infra/environments/prod/siblings.auto.tfvars.json
          OUT=apps/portal/public/admin/siblings.json
          mkdir -p "$(dirname "$OUT")"
          if [ -f "$SRC" ]; then
            jq '{ siblings: [.sibling_origins[] | { name, description: (.description // ""), routes: (.routes // []) }] }' "$SRC" > "$OUT"
          else
            echo '{ "siblings": [] }' > "$OUT"
          fi
          cat "$OUT"
      - name: Build portal
        env:
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ vars.COGNITO_USER_POOL_ID }}
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
          NEXT_PUBLIC_COGNITO_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          NEXT_PUBLIC_API_URL: ${{ vars.API_GATEWAY_URL }}
        run: pnpm run build
      - uses: actions/upload-artifact@v5
        with:
          name: portal-build-prod
          path: apps/portal/out/
      - uses: actions/upload-artifact@v5
        with:
          name: api-service-prod
          path: services/api/

  deploy-prod:
    name: Deploy to prod
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    needs: build-prod
    environment: prod
    # See build-prod above — prod always requires an explicit workflow_dispatch.
    # (In practice this job only ever runs via needs: build-prod anyway once
    # that job is push-gated correctly, but stating it explicitly here too
    # means this condition is never misleading on its own.)
    if: vars.BIFFO_DEPLOY_ENABLED == 'true' && github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.BIFFO_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Register Core API secret env values as log masks
        # Belt-and-braces for #334. The primary fix suppresses update-function-code
        # output, but if any *future* step accidentally echoes the function config,
        # these masks redact the two known DB credentials. The values are never
        # printed: each is scoped by --query to a single variable, captured into a
        # shell var, and piped only into ::add-mask:: (whose own argument GitHub
        # redacts). Best-effort — it must never fail the deploy, hence the guards.
        run: |
          for v in DATABASE_URL BIFFO_APP_DATABASE_URL; do
            val=$(aws lambda get-function-configuration \
              --function-name "${{ vars.CORE_API_LAMBDA_NAME }}" \
              --query "Environment.Variables.$v" --output text 2>/dev/null || true)
            if [ -n "$val" ] && [ "$val" != "None" ]; then
              echo "::add-mask::$val"
            fi
          done
      - uses: actions/download-artifact@v5
        with:
          name: portal-build-prod
          path: portal-dist/
      - name: Verify the portal was built against live Cognito
        run: |
          # Deploy Application and Deploy Infrastructure trigger independently and
          # run CONCURRENTLY — a core upgrade touches modules/ AND apps/, firing
          # both. The portal bakes NEXT_PUBLIC_COGNITO_* at build time from
          # GitHub variables that the infra run writes at the END of its apply, so
          # a build that starts first ships the PREVIOUS pool.
          #
          # Not theoretical: replacing a user pool (any change to an immutable
          # attribute such as username_attributes) produced a fully green deploy
          # serving a portal that answered every sign-in with
          # "User pool client <id> does not exist".
          #
          # Ordering cannot express the rule — a push touching only apps/**
          # legitimately never runs infra and must not wait for it — so assert the
          # artefact against reality instead. Catches the race, a stale variable, a
          # manual dispatch after an infra change, and the empty-string fallback in
          # lib/auth.ts, regardless of cause.
          #
          # The remedy is always a FULL workflow re-run, never a failed-job re-run
          # (issue #408). This job consumes the portal via download-artifact and the
          # ids are baked in at build time, so re-running it alone re-downloads the
          # identical stale bundle and fails identically. Say so in the messages
          # below — "re-run failed jobs" is the cheaper and more obvious action, and
          # it is the wrong one.
          set -euo pipefail
          POOL=$(grep -rhoE '[a-z]{2}-[a-z]+-[0-9]+_[A-Za-z0-9]{9}' portal-dist/ | sort -u | head -1 || true)
          if [ -z "$POOL" ]; then
            echo "::error::No Cognito user pool id in the built portal. NEXT_PUBLIC_COGNITO_USER_POOL_ID was empty at build time; lib/auth.ts falls back to '' and every sign-in fails."
            exit 1
          fi
          if ! aws cognito-idp describe-user-pool --user-pool-id "$POOL" >/dev/null 2>&1; then
            echo "::error::The portal was built against Cognito pool $POOL, which does not exist. It was almost certainly replaced by a concurrent Deploy Infrastructure run. Fix: re-run the ENTIRE workflow now that infrastructure has settled - the 'Re-run all jobs' button, or 'gh run rerun <run-id>' WITHOUT --failed. Re-running only this failed job cannot work: the pool id is baked into the portal at build time, so this job just re-downloads the same stale build artifact and fails identically. Only a new Build job can pick up the live pool."
            exit 1
          fi
          # One call, then a grep — never guess client ids out of the bundle, which
          # is full of same-shaped build hashes.
          MATCH=""
          for c in $(aws cognito-idp list-user-pool-clients --user-pool-id "$POOL" \
                       --query 'UserPoolClients[].ClientId' --output text); do
            if grep -rq "$c" portal-dist/; then MATCH="$c"; break; fi
          done
          if [ -z "$MATCH" ]; then
            echo "::error::The portal names pool $POOL but none of that pool's app clients. The baked client id is stale. Fix: re-run the ENTIRE workflow - the 'Re-run all jobs' button, or 'gh run rerun <run-id>' WITHOUT --failed. Re-running only this failed job cannot work: the client id is baked into the portal at build time, so this job just re-downloads the same stale build artifact and fails identically. Only a new Build job can pick up the live client."
            exit 1
          fi
          echo "Portal builds against live pool $POOL / client $MATCH"
      - name: Place portal assets under /admin
        run: |
          # apps/portal/next.config.ts sets `assetPrefix: '/admin'` (issue #306)
          # so the exported HTML references /admin/_next/*, freeing /_next/* for
          # the user-application sibling, which has an empty basePath and would
          # otherwise claim the identical URL prefix from a different origin.
          #
          # assetPrefix rewrites URLs ONLY — Next still EMITS the files at
          # out/_next/*. Nothing in the build moves them, so without this step
          # every asset the portal asks for 404s. Move them to the key the HTML
          # references. The three sync passes below are unchanged: the same
          # extension filters apply, and their `--delete` removes the now-stale
          # objects under the old s3://<bucket>/_next/ prefix.
          if [ -d portal-dist/_next ]; then
            mkdir -p portal-dist/admin
            rm -rf portal-dist/admin/_next
            mv portal-dist/_next portal-dist/admin/_next
          fi
          # Fail loudly rather than shipping a portal with no assets at all.
          test -d portal-dist/admin/_next
      - name: Sync portal to S3
        run: |
          # Three passes, split by mutability and content type.
          #
          # Next's App Router emits its RSC flight payloads as *.txt. They were
          # previously caught by the first pass, which gave them two wrong
          # properties and broke every client-side navigation (issue #275):
          #
          #   - `aws s3 sync` guesses content type from the extension, so they
          #     were served as text/plain rather than text/x-component. The
          #     router does not recognise that as an RSC response and falls
          #     back to a hard MPA navigation TO THE URL IT WAS FETCHING — so
          #     clicking a link landed the browser on /admin/index.txt showing
          #     raw serialised React. Typing the URL worked, because a full
          #     page load never fetches the payload.
          #
          #   - they were cached immutable for a year, but they change on every
          #     deploy exactly like the HTML does.
          #
          # Hashed assets under _next/static are genuinely immutable and keep
          # the long cache; HTML and RSC payloads must not.
          aws s3 sync portal-dist/ s3://${{ vars.PORTAL_BUCKET_NAME }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "*.txt"
          # `--include` only re-includes from an excluded set; on its own it is a
          # no-op, since everything is included by default. Without the explicit
          # `--exclude "*"` this pass would upload the .txt payloads too — as
          # text/plain — and the pass below, being a sync, would then skip them
          # as unchanged and the wrong content type would survive.
          aws s3 sync portal-dist/ s3://${{ vars.PORTAL_BUCKET_NAME }}/ \
            --delete \
            --cache-control "no-cache" \
            --exclude "*" \
            --include "*.html"
          aws s3 sync portal-dist/ s3://${{ vars.PORTAL_BUCKET_NAME }}/ \
            --delete \
            --cache-control "no-cache" \
            --content-type "text/x-component" \
            --exclude "*" \
            --include "*.txt"
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
      - uses: actions/download-artifact@v5
        with:
          name: api-service-prod
          path: api-service/
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - name: Package and deploy Lambda
        working-directory: api-service
        run: |
          # Export from the repo-root lock, NOT from this directory. The
          # artifact is services/api/ alone, which carries a pyproject.toml but
          # no uv.lock — this is a uv workspace, so the lock exists only at the
          # root. Exporting from here found no lock and so re-resolved every
          # dependency against live PyPI on each deploy, ignoring every pin:
          # identical code could ship different trees on two runs, and a broken
          # or hostile release reached the Lambda minutes after publication.
          # greenlet 3.5.4 did precisely that — published with no manylinux
          # wheels, it broke a deploy five minutes later (#410). --frozen uses
          # the lock as-is and fails rather than quietly resolving something
          # new, matching the PR-signer and plugin steps further down.
          uv export --project .. --package biffo-api --no-dev --frozen \
            --no-emit-workspace --no-emit-project \
            --output-file requirements.txt
          uv pip install -r requirements.txt --target package/
          # Trim the package before zipping so the code update fits AWS's direct
          # update-function-code limit. That API base64-encodes the zip into the
          # request body (~1.33x), so a ~54MB zip inflates past the ~70MB request
          # cap — large native deps (numpy/shapely/pandas/pydantic-core/etc.) reach
          # that easily. boto3/botocore/s3transfer are already provided by the
          # Lambda Python runtime, so drop them plus build-time dead weight
          # (dist-info, __pycache__, bundled tests/); the app's `import boto3`
          # resolves to the runtime's own copy.
          (
            cd package
            rm -rf boto3 botocore s3transfer \
                   boto3-*.dist-info botocore-*.dist-info s3transfer-*.dist-info
            find . -type d -name __pycache__ -prune -exec rm -rf {} +
            find . -type d -name tests -prune -exec rm -rf {} +
          )
          cp -r src/ package/
          cp -r migrations/ package/
          cp alembic.ini package/
          # Bundle every installed plugin's manifest so discover_plugin_manifests()
          # can find it at runtime — the Lambda otherwise only ships services/api/
          # itself. Both plugin channels are bundled: services/*/ (third-party,
          # user-owned) and services/_plugins/*/ (first-party, template-owned).
          # They flatten to services/<name>/ in the zip, keyed on plugin name, so
          # the runtime layout is identical either way. See the api.plugins module
          # docstring for the read side of this.
          mkdir -p package/services
          for manifest in ../services/*/biffo.plugin.json ../services/_plugins/*/biffo.plugin.json; do
            [ -f "$manifest" ] || continue
            plugin_name=$(basename "$(dirname "$manifest")")
            mkdir -p "package/services/$plugin_name"
            cp "$manifest" "package/services/$plugin_name/"
          done
          # Bundle every vendored DDL import's .sql files (db/imports/<name>/*.sql,
          # sibling to services/api/, created by `biffo data import`) so
          # discover_ddl_import_dirs() can find them at runtime — same reasoning
          # as the plugin manifest loop above. See api.ddl_import module docstring.
          mkdir -p package/db/imports
          for import_dir in ../db/imports/*/; do
            [ -d "$import_dir" ] || continue
            import_name=$(basename "$import_dir")
            mkdir -p "package/db/imports/$import_name"
            cp "$import_dir"*.sql "package/db/imports/$import_name/" 2>/dev/null || true
          done
          cd package && zip -r ../lambda.zip .
          # --output text --query 'LastUpdateStatus' suppresses the CLI's default
          # output, which is the *entire* function configuration as JSON —
          # including Environment.Variables (the master DATABASE_URL and, since
          # #253, BIFFO_APP_DATABASE_URL) in plaintext. Printing that leaked live
          # DB credentials into the Actions log (#334). The response is unused —
          # the wait below is what gates progress — so narrowing it to the status
          # string loses nothing.
          aws lambda update-function-code \
            --function-name ${{ vars.CORE_API_LAMBDA_NAME }} \
            --zip-file fileb://../lambda.zip \
            --output text --query 'LastUpdateStatus'
      - name: Initialise database schema
        run: |
          aws lambda wait function-updated \
            --function-name ${{ vars.CORE_API_LAMBDA_NAME }}
          RESULT=$(aws lambda invoke \
            --function-name ${{ vars.CORE_API_LAMBDA_NAME }} \
            --payload '{"source":"biffo:db-init"}' \
            --cli-binary-format raw-in-base64-out \
            db-init-response.json)
          if echo "$RESULT" | grep -q FunctionError; then
            echo "Schema init failed:" && cat db-init-response.json && exit 1
          fi
          # Echo the response on success too. It carries the app_role result
          # (#253): {"bootstrapped": true, "role": "biffo_app", "schemas": [...]}
          # when the least-privilege role was created and granted. A
          # "bootstrapped": false with reason "no-app-credential" means the
          # environment has not been re-applied and the request path is still
          # falling back to the owner/master role -- which is serving traffic,
          # so it is not a deploy failure, but it is not the intended posture
          # either. This is the only place that distinction is visible.
          echo "db-init response:" && cat db-init-response.json && echo
      # Apply every vendored DDL import (ADR-0005) after the Alembic schema init.
      # Like db-init runs the Core's own migrations, this runs biffo:ddl-import for
      # each db/imports/<name>/ dir — new .sql files (schema additions, seeds) apply
      # automatically on deploy instead of needing a manual invoke. Idempotent:
      # already-applied files are skipped via ddl_import_history.
      - name: Apply DDL imports
        run: |
          shopt -s nullglob
          for import_dir in db/imports/*/; do
            name=$(basename "$import_dir")
            echo "Applying DDL import: $name"
            RESULT=$(aws lambda invoke \
              --function-name ${{ vars.CORE_API_LAMBDA_NAME }} \
              --payload "{\"source\":\"biffo:ddl-import\",\"directory\":\"$name\"}" \
              --cli-binary-format raw-in-base64-out \
              ddl-import-response.json)
            if echo "$RESULT" | grep -q FunctionError; then
              echo "DDL import $name failed:" && cat ddl-import-response.json && exit 1
            fi
            cat ddl-import-response.json
          done
      # Package and deploy the isolated PR-signer Lambda (ADR-0008), only when
      # the instance has provisioned one (enable_pr_signer surfaces its function
      # name as PR_SIGNER_LAMBDA_NAME). Unlike the Core API above, this packages
      # straight from the checkout, not the api-service artifact: the signer
      # depends on the workspace SDK (packages/python-sdk), which the artifact
      # doesn't carry. Third-party deps come from the workspace lock (excluding
      # workspace members, hence --no-emit-workspace/--no-emit-project); the SDK
      # itself is installed from source with --no-deps.
      - name: Package and deploy PR-signer Lambda
        if: vars.PR_SIGNER_LAMBDA_NAME != ''
        run: |
          uv export --package biffo-pr-signer --no-dev --frozen \
            --no-emit-workspace --no-emit-project \
            --output-file pr-signer-requirements.txt
          uv pip install -r pr-signer-requirements.txt --target pr-signer-package/
          uv pip install ./packages/python-sdk --target pr-signer-package/ --no-deps
          cp -r services/pr-signer/src pr-signer-package/
          cd pr-signer-package && zip -r ../pr-signer-lambda.zip .
          cd ..
          # --output text --query 'LastUpdateStatus' suppresses the default full
          # function-config JSON (env vars in plaintext) — see #334.
          aws lambda update-function-code \
            --function-name ${{ vars.PR_SIGNER_LAMBDA_NAME }} \
            --zip-file fileb://pr-signer-lambda.zip \
            --output text --query 'LastUpdateStatus'
          aws lambda wait function-updated \
            --function-name ${{ vars.PR_SIGNER_LAMBDA_NAME }}
      # Package and deploy each enabled plugin's own Lambda (ADR-0003, #196).
      # deploy-infra (running in parallel) creates the function from a placeholder
      # zip with ignore_changes on its code; this step ships the real handler. A
      # plugin owns a Lambda once its terraform module is installed at
      # modules/plugins/<name>/. The function name is <project>-<env>-plugin-<name>,
      # derived from the Core API Lambda name (strip -core-api) so no extra var is
      # needed. Packaged from the checkout like the PR-signer: third-party deps from
      # the workspace lock (workspace members excluded), the SDK from source, and the
      # plugin's own src/ at the package root to match the <name>.main.handler; the
      # manifest is bundled at the task root (the plugin's manifest.py walks up to it).
      - name: Package and deploy plugin Lambdas
        run: |
          set -euo pipefail
          shopt -s nullglob
          prefix='${{ vars.CORE_API_LAMBDA_NAME }}'
          prefix="${prefix%-core-api}"
          # Both plugin channels (see the manifest-bundling loop above); the
          # terraform module and Lambda name are resolved by plugin *name*
          # (basename of the plugin dir), so the source channel is immaterial here.
          for manifest in services/*/biffo.plugin.json services/_plugins/*/biffo.plugin.json; do
            plugin_dir="$(dirname "$manifest")"
            name="$(basename "$plugin_dir")"
            # Wired means: a copied module (third-party) OR terraform/ beside the
            # plugin (first-party, referenced in place since #406). Checking only
            # modules/plugins/ silently stopped shipping first-party plugin code
            # the moment their dead copies were deleted.
            [ -d "modules/plugins/$name" ] || [ -d "$plugin_dir/terraform" ] || { echo "skip $name (no terraform module)"; continue; }
            fn="${prefix}-plugin-${name}"
            echo "::group::plugin $name -> $fn"
            found=""
            for i in $(seq 1 30); do
              if aws lambda get-function --function-name "$fn" >/dev/null 2>&1; then found=1; break; fi
              echo "waiting for $fn to exist ($i/30)"; sleep 10
            done
            if [ -z "$found" ]; then echo "$fn not found (plugin not enabled this env?); skipping"; echo "::endgroup::"; continue; fi
            pkg_name="$(sed -n 's/^name *= *"\(.*\)".*/\1/p' "$plugin_dir/pyproject.toml" | head -1)"
            rm -rf "plugin-$name-package"
            uv export --package "$pkg_name" --no-dev --frozen \
              --no-emit-workspace --no-emit-project \
              --output-file "plugin-$name-requirements.txt"
            uv pip install -r "plugin-$name-requirements.txt" --target "plugin-$name-package/"
            uv pip install ./packages/python-sdk --target "plugin-$name-package/" --no-deps
            cp -r "$plugin_dir"/src/. "plugin-$name-package/"
            cp "$manifest" "plugin-$name-package/biffo.plugin.json"
            (cd "plugin-$name-package" && zip -rq "../plugin-$name.zip" .)
            # --output text --query 'LastUpdateStatus' suppresses the default full
            # function-config JSON (a plugin Lambda's own secret env vars in
            # plaintext) — see #334.
            aws lambda update-function-code \
              --function-name "$fn" \
              --zip-file "fileb://plugin-$name.zip" \
              --output text --query 'LastUpdateStatus'
            aws lambda wait function-updated --function-name "$fn"
            echo "::endgroup::"
          done
