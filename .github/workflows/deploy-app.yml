name: Deploy Application

on:
  push:
    branches: [dev, staging, main]
    paths:
      - 'apps/**'
      - 'services/**'
      - 'packages/**'
      # db/imports/<name>/*.sql, vendored by `biffo data import` (ADR-0005) —
      # without this, pushing a new/updated DDL import wouldn't trigger a
      # redeploy the way installing a plugin under services/ already does.
      - 'db/**'
      # The portal's Microservices tab (siblings.json) is generated by THIS
      # workflow from the sibling registry. Without this path a `biffo sibling
      # create` registration PR (which touches only infra/) fires Deploy
      # Infrastructure — updating CDN routing — but never rebuilds the portal,
      # so a newly-registered sibling routes at /<name> yet never appears in
      # the tab (ADR-0007).
      - 'infra/environments/*/siblings.auto.tfvars.json'
      # A plugin's Lambda code is only shipped once its Terraform is wired, so
      # WIRING a plugin is what makes its code deployable — and wiring touches
      # only modules/ and infra/, neither of which otherwise fires this workflow.
      #
      # Without this path the sequence fails silently and permanently: the core
      # upgrade that adds `services/_plugins/<name>/` fires this workflow, which
      # skips the plugin because it is not wired yet; the wiring PR fires Deploy
      # Infrastructure, which creates the Lambda; and nothing ever runs this
      # workflow again. The function exists and serves the compute module's
      # placeholder forever. Observed on tabsii-platform with the ADR-0014 agent
      # runtime, and only fixable by a manual workflow_dispatch.
      #
      # Both wiring locations are covered: modules/plugins/ for a third-party
      # plugin whose terraform is copied in, and infra/environments/ for a
      # first-party one, which is referenced in place (#406) and whose wiring is
      # therefore just a module block. Missing the second is how this recurred:
      # repointing tabsii-platform's module sources touched only infra/ and
      # modules/, so no Deploy Application ran for it at all.
      - 'modules/plugins/**'
      - 'infra/environments/*/main.tf'
      - 'infra/environments/*/plugins.generated.tf'
      # First-party plugins are wired in the template-owned plugins.core.tf
      # (#406), a distinct file from main.tf and plugins.generated.tf. Without it
      # here, provisioning a first-party plugin fires Deploy Infrastructure (which
      # creates the Lambda) but never this workflow, so the plugin serves the
      # compute placeholder for ever — the exact failure this comment block warns
      # about, reintroduced by the #406 file itself.
      - 'infra/environments/*/plugins.core.tf'
      # The shared plugin host (ADR-0021) is wired in its own template-owned file,
      # like plugins.core.tf above. Wiring it touches only infra/, which otherwise
      # fires Deploy Infrastructure (creating the placeholder Lambda) but never this
      # workflow — so the host would serve the compute placeholder for ever. Same
      # failure class the block above documents; keep this path here to avoid it.
      - 'infra/environments/*/plugin-host.core.tf'
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [dev, staging, prod]

# Never cancel-in-progress here (unlike ci.yml) — this workflow packages and
# ships application code. A second trigger for the same branch (e.g. a push
# landing right after a manual re-run) queues behind the first instead of
# running alongside it, so two overlapping S3 syncs / Lambda code updates
# for the same environment can't race each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  NODE_VERSION: '22'

# Deploy jobs only run in repos where BIFFO_DEPLOY_ENABLED=true has been set.
# The template repo itself has this unset, so all jobs are skipped there.

# ─── DEV ─────────────────────────────────────────────────────────────────────

jobs:
  build-dev:
    name: Build (dev)
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    environment: dev
    if: vars.BIFFO_DEPLOY_ENABLED == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/dev') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev'))
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # The template resolves its own core version from its highest core-v*
          # tag (#648), and checkout fetches NO tags at the default depth of 1.
          # Without this the resolver fails the build — which is the designed
          # behaviour, but the cause would be this line, not the deploy.
          fetch-tags: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      # Generate the Microservices tab's data (ADR-0007) from this env's sibling
      # registry so the static portal can list siblings without a server. Link is
      # /<name> (no trailing slash — CloudFront path routing is exact).
      #
      # It lives under public/admin/ so it publishes at /admin/siblings.json:
      # the portal owns the /admin prefix and only that prefix (issue #306), so
      # a manifest at the root would be served by whatever owns `/` — the
      # user-application sibling — and the tab would 404.
      - name: Generate siblings manifest
        run: |
          SRC=infra/environments/dev/siblings.auto.tfvars.json
          OUT=apps/portal/public/admin/siblings.json
          mkdir -p "$(dirname "$OUT")"
          if [ -f "$SRC" ]; then
            jq '{ siblings: [.sibling_origins[] | { name, description: (.description // ""), routes: (.routes // []) }] }' "$SRC" > "$OUT"
          else
            echo '{ "siblings": [] }' > "$OUT"
          fi
          cat "$OUT"
      - name: Build portal
        env:
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ vars.COGNITO_USER_POOL_ID }}
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
          NEXT_PUBLIC_COGNITO_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          NEXT_PUBLIC_API_URL: ${{ vars.API_GATEWAY_URL }}
        run: pnpm run build
      - uses: actions/upload-artifact@v5
        with:
          name: portal-build-dev
          path: apps/portal/out/
      - uses: actions/upload-artifact@v5
        with:
          name: api-service-dev
          path: services/api/

  deploy-dev:
    name: Deploy to dev
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    needs: build-dev
    environment: dev
    if: vars.BIFFO_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/dev'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # The template resolves its own core version from its highest core-v*
          # tag (#648), and checkout fetches NO tags at the default depth of 1.
          # Without this the resolver fails the build — which is the designed
          # behaviour, but the cause would be this line, not the deploy.
          fetch-tags: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.BIFFO_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Register Core API secret env values as log masks
        # Belt-and-braces for #334. The primary fix suppresses update-function-code
        # output, but if any *future* step accidentally echoes the function config,
        # these masks redact the two known DB credentials. The values are never
        # printed: each is scoped by --query to a single variable, captured into a
        # shell var, and piped only into ::add-mask:: (whose own argument GitHub
        # redacts). Best-effort — it must never fail the deploy, hence the guards.
        run: |
          for v in DATABASE_URL BIFFO_APP_DATABASE_URL; do
            val=$(aws lambda get-function-configuration \
              --function-name "${{ vars.CORE_API_LAMBDA_NAME }}" \
              --query "Environment.Variables.$v" --output text 2>/dev/null || true)
            if [ -n "$val" ] && [ "$val" != "None" ]; then
              echo "::add-mask::$val"
            fi
          done
      - uses: actions/download-artifact@v5
        with:
          name: portal-build-dev
          path: portal-dist/
      - name: Verify the portal was built against live Cognito
        run: |
          # Deploy Application and Deploy Infrastructure trigger independently and
          # run CONCURRENTLY — a core upgrade touches modules/ AND apps/, firing
          # both. The portal bakes NEXT_PUBLIC_COGNITO_* at build time from
          # GitHub variables that the infra run writes at the END of its apply, so
          # a build that starts first ships the PREVIOUS pool.
          #
          # Not theoretical: replacing a user pool (any change to an immutable
          # attribute such as username_attributes) produced a fully green deploy
          # serving a portal that answered every sign-in with
          # "User pool client <id> does not exist".
          #
          # Ordering cannot express the rule — a push touching only apps/**
          # legitimately never runs infra and must not wait for it — so assert the
          # artefact against reality instead. Catches the race, a stale variable, a
          # manual dispatch after an infra change, and the empty-string fallback in
          # lib/auth.ts, regardless of cause.
          #
          # The remedy is always a FULL workflow re-run, never a failed-job re-run
          # (issue #408). This job consumes the portal via download-artifact and the
          # ids are baked in at build time, so re-running it alone re-downloads the
          # identical stale bundle and fails identically. Say so in the messages
          # below — "re-run failed jobs" is the cheaper and more obvious action, and
          # it is the wrong one.
          set -euo pipefail
          POOL=$(grep -rhoE '[a-z]{2}-[a-z]+-[0-9]+_[A-Za-z0-9]{9}' portal-dist/ | sort -u | head -1 || true)
          if [ -z "$POOL" ]; then
            echo "::error::No Cognito user pool id in the built portal. NEXT_PUBLIC_COGNITO_USER_POOL_ID was empty at build time; lib/auth.ts falls back to '' and every sign-in fails."
            exit 1
          fi
          if ! aws cognito-idp describe-user-pool --user-pool-id "$POOL" >/dev/null 2>&1; then
            echo "::error::The portal was built against Cognito pool $POOL, which does not exist. It was almost certainly replaced by a concurrent Deploy Infrastructure run. Fix: re-run the ENTIRE workflow now that infrastructure has settled - the 'Re-run all jobs' button, or 'gh run rerun <run-id>' WITHOUT --failed. Re-running only this failed job cannot work: the pool id is baked into the portal at build time, so this job just re-downloads the same stale build artifact and fails identically. Only a new Build job can pick up the live pool."
            exit 1
          fi
          # One call, then a grep — never guess client ids out of the bundle, which
          # is full of same-shaped build hashes.
          MATCH=""
          for c in $(aws cognito-idp list-user-pool-clients --user-pool-id "$POOL" \
                       --query 'UserPoolClients[].ClientId' --output text); do
            if grep -rq "$c" portal-dist/; then MATCH="$c"; break; fi
          done
          if [ -z "$MATCH" ]; then
            echo "::error::The portal names pool $POOL but none of that pool's app clients. The baked client id is stale. Fix: re-run the ENTIRE workflow - the 'Re-run all jobs' button, or 'gh run rerun <run-id>' WITHOUT --failed. Re-running only this failed job cannot work: the client id is baked into the portal at build time, so this job just re-downloads the same stale build artifact and fails identically. Only a new Build job can pick up the live client."
            exit 1
          fi
          echo "Portal builds against live pool $POOL / client $MATCH"
      - name: Place portal assets under /admin
        run: |
          # apps/portal/next.config.ts sets `assetPrefix: '/admin'` (issue #306)
          # so the exported HTML references /admin/_next/*, freeing /_next/* for
          # the user-application sibling, which has an empty basePath and would
          # otherwise claim the identical URL prefix from a different origin.
          #
          # assetPrefix rewrites URLs ONLY — Next still EMITS the files at
          # out/_next/*. Nothing in the build moves them, so without this step
          # every asset the portal asks for 404s. Move them to the key the HTML
          # references. The three sync passes below are unchanged: the same
          # extension filters apply, and their `--delete` removes the now-stale
          # objects under the old s3://<bucket>/_next/ prefix.
          if [ -d portal-dist/_next ]; then
            mkdir -p portal-dist/admin
            rm -rf portal-dist/admin/_next
            mv portal-dist/_next portal-dist/admin/_next
          fi
          # Fail loudly rather than shipping a portal with no assets at all.
          test -d portal-dist/admin/_next
      - name: Sync portal to S3
        run: |
          # Three passes, split by mutability and content type.
          #
          # Next's App Router emits its RSC flight payloads as *.txt. They were
          # previously caught by the first pass, which gave them two wrong
          # properties and broke every client-side navigation (issue #275):
          #
          #   - `aws s3 sync` guesses content type from the extension, so they
          #     were served as text/plain rather than text/x-component. The
          #     router does not recognise that as an RSC response and falls
          #     back to a hard MPA navigation TO THE URL IT WAS FETCHING — so
          #     clicking a link landed the browser on /admin/index.txt showing
          #     raw serialised React. Typing the URL worked, because a full
          #     page load never fetches the payload.
          #
          #   - they were cached immutable for a year, but they change on every
          #     deploy exactly like the HTML does.
          #
          # Hashed assets under _next/static are genuinely immutable and keep
          # the long cache; HTML and RSC payloads must not.
          # `.well-known/*` is EXCLUDED from this --delete pass. The runtime
          # identity document (.well-known/biffo-identity.json, #403) is written to
          # this same bucket by Deploy Infrastructure, NOT by the portal build — so
          # it is absent from portal-dist/, and without this exclude the --delete
          # here removes it. That strands every ROOT sibling (which resolves Cognito
          # only from that document, no baked fallback) in a sign-in redirect loop.
          # An App-only deploy (no concurrent Infra run to re-publish it) makes the
          # deletion permanent. Excluding the prefix keeps the doc across syncs.
          aws s3 sync portal-dist/ s3://${{ vars.PORTAL_BUCKET_NAME }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "*.txt" \
            --exclude ".well-known/*"
          # `--include` only re-includes from an excluded set; on its own it is a
          # no-op, since everything is included by default. Without the explicit
          # `--exclude "*"` this pass would upload the .txt payloads too — as
          # text/plain — and the pass below, being a sync, would then skip them
          # as unchanged and the wrong content type would survive.
          aws s3 sync portal-dist/ s3://${{ vars.PORTAL_BUCKET_NAME }}/ \
            --delete \
            --cache-control "no-cache" \
            --exclude "*" \
            --include "*.html"
          aws s3 sync portal-dist/ s3://${{ vars.PORTAL_BUCKET_NAME }}/ \
            --delete \
            --cache-control "no-cache" \
            --content-type "text/x-component" \
            --exclude "*" \
            --include "*.txt"
      - name: Invalidate CloudFront
        # A cache invalidation must never block or abort the functional deploy
        # (Lambda / DB schema / DDL imports) that follows. create-invalidation is
        # fire-and-forget and normally returns in seconds, but a stalled AWS API
        # call once timed out the whole job at this step and skipped every deploy
        # step after it, leaving a portal-updated-but-backend-stale promotion
        # (#478). So: bound each call (CLI timeouts), retry transient stalls, and
        # never fail the job on it — a missed invalidation self-heals via
        # CloudFront TTLs and the static-export edge redirect (#468).
        continue-on-error: true
        timeout-minutes: 3
        run: |
          for attempt in 1 2 3; do
            if aws cloudfront create-invalidation \
              --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
              --paths "/*" \
              --cli-read-timeout 20 --cli-connect-timeout 10; then
              exit 0
            fi
            echo "CloudFront invalidation attempt ${attempt} failed; retrying..." >&2
            sleep 5
          done
          echo "::warning::CloudFront invalidation did not succeed; deploy continues (cache self-heals via TTL and the #468 edge redirect)."
      - uses: actions/download-artifact@v5
        with:
          name: api-service-dev
          path: api-service/
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - name: Package and deploy Lambda
        working-directory: api-service
        run: |
          # Export from the repo-root lock, NOT from this directory. The
          # artifact is services/api/ alone, which carries a pyproject.toml but
          # no uv.lock — this is a uv workspace, so the lock exists only at the
          # root. Exporting from here found no lock and so re-resolved every
          # dependency against live PyPI on each deploy, ignoring every pin:
          # identical code could ship different trees on two runs, and a broken
          # or hostile release reached the Lambda minutes after publication.
          # greenlet 3.5.4 did precisely that — published with no manylinux
          # wheels, it broke a deploy five minutes later (#410). --frozen uses
          # the lock as-is and fails rather than quietly resolving something
          # new, matching the PR-signer and plugin steps further down.
          uv export --project .. --package biffo-api --no-dev --frozen \
            --no-emit-workspace --no-emit-project \
            --output-file requirements.txt
          uv pip install -r requirements.txt --target package/
          # The shared Cognito verifier (packages/cognito-auth) is a workspace
          # package, excluded from the export above by --no-emit-workspace, so
          # install it explicitly — the same pattern the PR-signer and plugin
          # steps below use for packages/python-sdk. Core's middleware/auth.py
          # imports it on every authenticated request, so it MUST land in the
          # zip. The path is ../ because this step runs in the api-service
          # artifact dir and the full repo checkout is its parent.
          uv pip install ../packages/cognito-auth --target package/ --no-deps
          # Trim the package before zipping so the code update fits AWS's direct
          # update-function-code limit. That API base64-encodes the zip into the
          # request body (~1.33x), so a ~54MB zip inflates past the ~70MB request
          # cap — large native deps (numpy/shapely/pandas/pydantic-core/etc.) reach
          # that easily. boto3/botocore/s3transfer are already provided by the
          # Lambda Python runtime, so drop them plus build-time dead weight
          # (dist-info, __pycache__, bundled tests/); the app's `import boto3`
          # resolves to the runtime's own copy.
          (
            cd package
            rm -rf boto3 botocore s3transfer \
                   boto3-*.dist-info botocore-*.dist-info s3transfer-*.dist-info
            find . -type d -name __pycache__ -prune -exec rm -rf {} +
            find . -type d -name tests -prune -exec rm -rf {} +
          )
          cp -r src/ package/
          cp -r migrations/ package/
          cp alembic.ini package/
          # Bake the core version in at BUILD time (#648). Resolved from
          # biffo.core.json in an instance, or the highest core-v* tag in the
          # template; the script exits non-zero if it can determine neither, so
          # "we could not tell" is a red build rather than a /health response
          # quietly reading "unknown" months later.
          #
          # NOT the repo-root core.version the issue originally asked for: that
          # file is a fossil since #423 (0.41.17 against an authority of 0.181.0
          # on biffo-platform, measured 2026-07-30) and #842 now deletes it.
          #
          # Written beside api/core_version.py, which imports it relatively so the
          # same module works under `api.*` in tests and `src.api.*` in Lambda.
          core_version=$(sh ../scripts/resolve-core-version.sh)
          printf 'CORE_VERSION = "%s"\n' "$core_version" > package/src/api/_core_version.py
          echo "Baked core version $core_version into the package"

          # Bundle every installed plugin's manifest so discover_plugin_manifests()
          # can find it at runtime — the Lambda otherwise only ships services/api/
          # itself. Both plugin channels are bundled: services/*/ (third-party,
          # user-owned) and services/_plugins/*/ (first-party, template-owned).
          # They flatten to services/<name>/ in the zip, keyed on plugin name, so
          # the runtime layout is identical either way. See the api.plugins module
          # docstring for the read side of this.
          mkdir -p package/services
          for manifest in ../services/*/biffo.plugin.json ../services/_plugins/*/biffo.plugin.json; do
            [ -f "$manifest" ] || continue
            plugin_name=$(basename "$(dirname "$manifest")")
            mkdir -p "package/services/$plugin_name"
            cp "$manifest" "package/services/$plugin_name/"
          done
          # Bundle every vendored DDL import's .sql files (db/imports/<name>/*.sql,
          # sibling to services/api/, created by `biffo data import`) so
          # discover_ddl_import_dirs() can find them at runtime — same reasoning
          # as the plugin manifest loop above. See api.ddl_import module docstring.
          mkdir -p package/db/imports
          for import_dir in ../db/imports/*/; do
            [ -d "$import_dir" ] || continue
            import_name=$(basename "$import_dir")
            mkdir -p "package/db/imports/$import_name"
            cp "$import_dir"*.sql "package/db/imports/$import_name/" 2>/dev/null || true
          done
          # Precompile the whole package to bytecode (#724).
          #
          # /var/task is READ-ONLY in Lambda, so the interpreter can never write a
          # bytecode cache: every cold start recompiles all ~1,620 .py files from
          # source. Measured on biffo-platform, that is ~60% of a ~4.0s init.
          #
          # --invalidation-mode unchecked-hash is LOAD-BEARING, not a tidy default.
          # zip/unzip rewrites every mtime, and a timestamp-invalidated .pyc is then
          # discarded as stale — giving today's behaviour back with a green build and
          # nothing to see. Measured here with mtimes forced to 2030:
          #
          #     no .pyc          0.22-0.27s
          #     timestamp .pyc   0.21-0.22s   <- no benefit whatsoever
          #     unchecked-hash   0.12s
          #
          # Runs AFTER everything is assembled and after the __pycache__ trim above,
          # or the trim would delete exactly what this produces.
          # Through uv, NOT a bare `python`. This job installs uv with
          # `python-version: 3.13` and never runs actions/setup-python, so there is
          # no `python` on PATH at all: the self-hosted runners carry python3 only.
          # It died `python: command not found`, exit 127, AFTER a successful build
          # and after the core version had already been baked in — so the deploy read
          # as a versioning problem twice over (#414) rather than a missing
          # interpreter. GitHub-hosted images ship python-is-python3, which is why
          # this survived until the estate moved onto its own runners.
          #
          # `--no-project` because this step runs in the api-service artifact dir;
          # without it uv walks up, finds the repo pyproject.toml and tries to sync a
          # project that has nothing to do with the package being built.
          #
          # The version must match the LAMBDA runtime, not merely be importable: an
          # unchecked-hash .pyc built by the wrong minor is silently ignored at
          # runtime — a green build that quietly loses the optimisation this line
          # exists for. Pinned to the same 3.13 as this job setup-uv step, and
          # workflow-python-interpreter.test.ts fails if the two ever drift apart.
          uv run --no-project --python 3.13 python -m compileall -q --invalidation-mode unchecked-hash package
          # Guard the size, because the trim above exists for a reason (#724).
          #
          # Bytecode adds ~56% to the zip (17.8 -> 27.8 MB measured on this
          # template). update-function-code base64-encodes the body at ~1.33x
          # against a ~70MB request cap, so the template lands at ~37MB with ~33MB
          # spare — but an instance carrying heavy native deps has less. Failing here
          # with the numbers beats update-function-code failing opaquely after the
          # upload, which is the shape this comment block is already about.
          zipped=$(cd package && zip -qr ../lambda.zip . && stat -c%s ../lambda.zip)
          request_mb=$(awk -v b="$zipped" 'BEGIN{printf "%.1f", b*1.33/1048576}')
          echo "Package: $(awk -v b="$zipped" 'BEGIN{printf "%.1f", b/1048576}')MB zipped, ~${request_mb}MB as a base64 request body"
          # Over the cap, DEGRADE before failing: bytecode is an optimisation, and a
          # slower cold start beats an instance that cannot deploy at all. Dropping
          # it costs ~2.5s on a cold invoke and ~56% of the zip, and the deployed
          # code is byte-for-byte the same either way.
          #
          # This exists because tabsii-platform outgrew the inline cap -- 60.3MB
          # zipped, ~80.2MB as a request body -- and the guard failed the deploy
          # outright, which left the instance's /health reporting a version 173
          # releases old with every merged change unshipped. The fallback is not the
          # real fix (that is an S3-based update, which lifts the ceiling to 250MB
          # unzipped and needs an artifacts bucket that does not exist yet); it is
          # what stops a size ceiling being an outage in the meantime.
          # Prefer S3 (#994). update-function-code --zip-file sends the package INLINE,
          # base64-encoded at ~1.33x against a ~70MB request cap; via S3 the ceiling is
          # 250MB unzipped and bytecode never has to be sacrificed to fit.
          #
          # Gated on the bucket EXISTING, not merely on the variable being set, and
          # that is the whole ordering story: a core upgrade lands this workflow and
          # the bucket's Terraform in one PR, and nothing orders Deploy Application
          # after Deploy Infrastructure. Without the head-bucket probe the first
          # upgrade would trade a size failure for a missing-bucket failure. Same
          # shape as the plugin frontend loop below, for the same reason.
          artifacts_bucket="${{ vars.ARTIFACTS_BUCKET_NAME }}"
          if [ -n "$artifacts_bucket" ] && aws s3api head-bucket --bucket "$artifacts_bucket" 2>/dev/null; then
            key="core-api/${GITHUB_SHA}.zip"
            echo "Uploading via s3://$artifacts_bucket/$key (bytecode kept)"
            aws s3 cp lambda.zip "s3://$artifacts_bucket/$key" --only-show-errors
            use_s3=1
          else
            use_s3=""
            if [ -n "$artifacts_bucket" ]; then
              echo "::warning::ARTIFACTS_BUCKET_NAME is set but $artifacts_bucket does not exist yet — run Deploy Infrastructure. Falling back to an inline upload." >&2
            else
              echo "ARTIFACTS_BUCKET_NAME unset; inline upload. Run Deploy Infrastructure to enable S3 (#994)."
            fi
          fi

          # Inline only: degrade before failing. Bytecode is an optimisation, and a
          # slower cold start beats an instance that cannot deploy at all -- the
          # deployed code is byte-for-byte identical either way. Not reached on the
          # S3 path, which is the point of doing this at all.
          if [ -z "$use_s3" ] && awk -v m="$request_mb" 'BEGIN{exit !(m > 60)}'; then
            echo "::warning::~${request_mb}MB exceeds the inline cap; dropping bytecode and retrying." >&2
            find package -name '__pycache__' -type d -prune -exec rm -rf {} + 2>/dev/null || true
            rm -f lambda.zip
            zipped=$(cd package && zip -qr ../lambda.zip . && stat -c%s ../lambda.zip)
            request_mb=$(awk -v b="$zipped" 'BEGIN{printf "%.1f", b*1.33/1048576}')
            echo "Without bytecode: $(awk -v b="$zipped" 'BEGIN{printf "%.1f", b/1048576}')MB zipped, ~${request_mb}MB as a request body"
            echo "::warning::Cold start is ~2.5s slower until Deploy Infrastructure provisions the artifacts bucket (#994)." >&2
          fi
          # Still over without bytecode means the package itself is too big, and no
          # amount of not-precompiling saves it. Fail loudly rather than let
          # update-function-code reject it opaquely after the upload.
          if [ -z "$use_s3" ] && awk -v m="$request_mb" 'BEGIN{exit !(m > 60)}'; then
            echo "::error::Lambda package is ~${request_mb}MB as a base64 request body even without bytecode, against a ~70MB cap." >&2
            echo "Move this function to an S3-based update (250MB unzipped) or drop a heavy" >&2
            echo "dependency. Do not raise this threshold without measuring the real cap." >&2
            exit 1
          fi
          # --output text --query 'LastUpdateStatus' suppresses the CLI's default
          # output, which is the *entire* function configuration as JSON —
          # including Environment.Variables (the master DATABASE_URL and, since
          # #253, BIFFO_APP_DATABASE_URL) in plaintext. Printing that leaked live
          # DB credentials into the Actions log (#334). The response is unused —
          # the wait below is what gates progress — so narrowing it to the status
          # string loses nothing.
          if [ -n "$use_s3" ]; then
            aws lambda update-function-code \
              --function-name ${{ vars.CORE_API_LAMBDA_NAME }} \
              --s3-bucket "$artifacts_bucket" --s3-key "$key" \
              --output text --query 'LastUpdateStatus'
          else
            aws lambda update-function-code \
              --function-name ${{ vars.CORE_API_LAMBDA_NAME }} \
              --zip-file fileb://lambda.zip \
              --output text --query 'LastUpdateStatus'
          fi
      - name: Initialise database schema
        run: |
          aws lambda wait function-updated \
            --function-name ${{ vars.CORE_API_LAMBDA_NAME }}
          RESULT=$(aws lambda invoke \
            --function-name ${{ vars.CORE_API_LAMBDA_NAME }} \
            --payload '{"source":"biffo:db-init"}' \
            --cli-binary-format raw-in-base64-out \
            db-init-response.json)
          if echo "$RESULT" | grep -q FunctionError; then
            echo "Schema init failed:" && cat db-init-response.json && exit 1
          fi
          # Echo the response on success too. It carries the app_role result
          # (#253): {"bootstrapped": true, "role": "biffo_app", "schemas": [...]}
          # when the least-privilege role was created and granted. A
          # "bootstrapped": false with reason "no-app-credential" means the
          # environment has not been re-applied and the request path is still
          # falling back to the owner/master role -- which is serving traffic,
          # so it is not a deploy failure, but it is not the intended posture
          # either. This is the only place that distinction is visible.
          echo "db-init response:" && cat db-init-response.json && echo
      # Apply every vendored DDL import (ADR-0005) after the Alembic schema init.
      # Like db-init runs the Core's own migrations, this runs biffo:ddl-import for
      # each db/imports/<name>/ dir — new .sql files (schema additions, seeds) apply
      # automatically on deploy instead of needing a manual invoke. Idempotent:
      # already-applied files are skipped via ddl_import_history.
      - name: Apply DDL imports
        run: |
          shopt -s nullglob
          for import_dir in db/imports/*/; do
            name=$(basename "$import_dir")
            echo "Applying DDL import: $name"
            RESULT=$(aws lambda invoke \
              --function-name ${{ vars.CORE_API_LAMBDA_NAME }} \
              --payload "{\"source\":\"biffo:ddl-import\",\"directory\":\"$name\"}" \
              --cli-binary-format raw-in-base64-out \
              ddl-import-response.json)
            if echo "$RESULT" | grep -q FunctionError; then
              echo "DDL import $name failed:" && cat ddl-import-response.json && exit 1
            fi
            cat ddl-import-response.json
          done
      # Package and deploy the isolated PR-signer Lambda (ADR-0008), only when
      # the instance has provisioned one (enable_pr_signer surfaces its function
      # name as PR_SIGNER_LAMBDA_NAME). Unlike the Core API above, this packages
      # straight from the checkout, not the api-service artifact: the signer
      # depends on the workspace SDK (packages/python-sdk), which the artifact
      # doesn't carry. Third-party deps come from the workspace lock (excluding
      # workspace members, hence --no-emit-workspace/--no-emit-project); the SDK
      # itself is installed from source with --no-deps.
      - name: Package and deploy PR-signer Lambda
        if: vars.PR_SIGNER_LAMBDA_NAME != ''
        run: |
          uv export --package biffo-pr-signer --no-dev --frozen \
            --no-emit-workspace --no-emit-project \
            --output-file pr-signer-requirements.txt
          uv pip install -r pr-signer-requirements.txt --target pr-signer-package/
          uv pip install ./packages/python-sdk --target pr-signer-package/ --no-deps
          cp -r services/pr-signer/src pr-signer-package/
          cd pr-signer-package && zip -r ../pr-signer-lambda.zip .
          cd ..
          # --output text --query 'LastUpdateStatus' suppresses the default full
          # function-config JSON (env vars in plaintext) — see #334.
          aws lambda update-function-code \
            --function-name ${{ vars.PR_SIGNER_LAMBDA_NAME }} \
            --zip-file fileb://pr-signer-lambda.zip \
            --output text --query 'LastUpdateStatus'
          aws lambda wait function-updated \
            --function-name ${{ vars.PR_SIGNER_LAMBDA_NAME }}
      # Package and deploy each enabled plugin's own Lambda (ADR-0003, #196).
      # deploy-infra (running in parallel) creates the function from a placeholder
      # zip with ignore_changes on its code; this step ships the real handler. A
      # plugin owns a Lambda once its terraform module is installed at
      # modules/plugins/<name>/. The function name is <project>-<env>-plugin-<name>,
      # derived from the Core API Lambda name (strip -core-api) so no extra var is
      # needed. Packaged from the checkout like the PR-signer: third-party deps from
      # the workspace lock (workspace members excluded), the SDK from source, and the
      # plugin's own src/ at the package root to match the <name>.main.handler; the
      # manifest is bundled at the task root (the plugin's manifest.py walks up to it).
      - name: Package and deploy plugin Lambdas
        run: |
          set -euo pipefail
          shopt -s nullglob
          prefix='${{ vars.CORE_API_LAMBDA_NAME }}'
          prefix="${prefix%-core-api}"
          # Both plugin channels (see the manifest-bundling loop above); the
          # terraform module and Lambda name are resolved by plugin *name*
          # (basename of the plugin dir), so the source channel is immaterial here.
          for manifest in services/*/biffo.plugin.json services/_plugins/*/biffo.plugin.json; do
            plugin_dir="$(dirname "$manifest")"
            name="$(basename "$plugin_dir")"
            # Wired means: a copied module (third-party) OR terraform/ beside the
            # plugin (first-party, referenced in place since #406). Checking only
            # modules/plugins/ silently stopped shipping first-party plugin code
            # the moment their dead copies were deleted.
            [ -d "modules/plugins/$name" ] || [ -d "$plugin_dir/terraform" ] || { echo "skip $name (no terraform module)"; continue; }
            fn="${prefix}-plugin-${name}"
            echo "::group::plugin $name -> $fn"
            # Ground truth for "provisioned in this env" is whether the Lambda
            # exists, so check once and skip immediately if it does not (#449).
            #
            # This used to wait 30×10s for the function to appear, on the theory
            # that a concurrent infra deploy was creating it. But a first-party
            # plugin's terraform ships to every instance while its Lambda exists
            # only where the env wired `module "plugin_<name>"` into its
            # (user-owned) infra — so for any instance not running that plugin,
            # the wait always ran out the full ~5.5 min per plugin, on every
            # deploy, for a function that would never appear (observed on
            # biffo-platform: ~11 min/deploy, then skipped anyway).
            #
            # The race barely exists in practice: enabling a plugin edits
            # infra/environments/** only, so it triggers Deploy Infrastructure —
            # not this app workflow — and infra creates the Lambda with a
            # placeholder zip (compute module, ignore_changes on the code). Its
            # real code is loaded by the next app deploy regardless. Waiting here
            # is what the "this job never runs infra and must not wait for it"
            # contract above already says it should not do.
            if ! aws lambda get-function --function-name "$fn" >/dev/null 2>&1; then
              echo "$fn does not exist — plugin not provisioned in this env; skipping."
              echo "(If you just enabled it, its infra apply creates the Lambda; re-run this deploy to load its code.)"
              echo "::endgroup::"; continue
            fi
            pkg_name="$(sed -n 's/^name *= *"\(.*\)".*/\1/p' "$plugin_dir/pyproject.toml" | head -1)"
            rm -rf "plugin-$name-package"
            uv export --package "$pkg_name" --no-dev --frozen \
              --no-emit-workspace --no-emit-project \
              --output-file "plugin-$name-requirements.txt"
            uv pip install -r "plugin-$name-requirements.txt" --target "plugin-$name-package/"
            uv pip install ./packages/python-sdk --target "plugin-$name-package/" --no-deps
            cp -r "$plugin_dir"/src/. "plugin-$name-package/"
            cp "$manifest" "plugin-$name-package/biffo.plugin.json"
            (cd "plugin-$name-package" && zip -rq "../plugin-$name.zip" .)
            # --output text --query 'LastUpdateStatus' suppresses the default full
            # function-config JSON (a plugin Lambda's own secret env vars in
            # plaintext) — see #334.
            aws lambda update-function-code \
              --function-name "$fn" \
              --zip-file "fileb://plugin-$name.zip" \
              --output text --query 'LastUpdateStatus'
            aws lambda wait function-updated --function-name "$fn"
            echo "::endgroup::"
          done
      # Package and deploy the SHARED plugin host (ADR-0021, #545) — ONE Lambda
      # that runs every installed user-facing plugin's API behind the shared API
      # Gateway at /api/v1/plugins/*. It supersedes ADR-0018's per-plugin Lambda:
      # a plugin that declares user_ingress.app is pure code mounted here, not its
      # own function, so the per-plugin step above skips it (no terraform/ beside
      # it). The host function is <project>-<env>-plugin-host, created by
      # deploy-infra from the compute-module placeholder (ignore_changes on code);
      # this step ships the real code. Skipped where the host is not provisioned.
      - name: Package and deploy the shared plugin host
        run: |
          set -euo pipefail
          shopt -s nullglob
          prefix='${{ vars.CORE_API_LAMBDA_NAME }}'
          prefix="${prefix%-core-api}"
          fn="${prefix}-plugin-host"
          if ! aws lambda get-function --function-name "$fn" >/dev/null 2>&1; then
            echo "$fn does not exist — the shared plugin host is not provisioned in this env; skipping."
            exit 0
          fi
          pkg=plugin-host-package
          rm -rf "$pkg"
          # Host runtime: third-party deps from the workspace lock (workspace
          # members excluded), the SDK from source, and the host's own package at
          # the task root. The SDK[user-serving] extra's transitive deps (the JWT
          # verification the founder gate needs) are NOT workspace members, so the
          # export already carries them.
          uv export --package biffo-plugin-host --no-dev --frozen \
            --no-emit-workspace --no-emit-project \
            --output-file host-requirements.txt
          uv pip install -r host-requirements.txt --target "$pkg/"
          uv pip install ./packages/python-sdk --target "$pkg/" --no-deps
          cp -r services/_plugin-host/src/. "$pkg/"
          # Each user-facing plugin (a manifest with user_ingress.app) becomes pure
          # code inside the host: its package at the task root so load_app("<mod>:
          # <attr>") imports it, and its manifest under services/<name>/ so
          # discover_plugins() — which scans BIFFO_PLUGINS_ROOT=/var/task/services —
          # mounts it. Both plugin channels are covered, keyed on plugin name like
          # every other step here. A plugin's own workspace SDK dep is excluded from
          # its export; the host already installed the SDK above.
          mkdir -p "$pkg/services"
          for manifest in services/*/biffo.plugin.json services/_plugins/*/biffo.plugin.json; do
            jq -e '.user_ingress.app' "$manifest" >/dev/null 2>&1 || continue
            plugin_dir="$(dirname "$manifest")"
            name="$(basename "$plugin_dir")"
            echo "::group::host mount: $name"
            pkg_name="$(sed -n 's/^name *= *"\(.*\)".*/\1/p' "$plugin_dir/pyproject.toml" | head -1)"
            uv export --package "$pkg_name" --no-dev --frozen \
              --no-emit-workspace --no-emit-project \
              --output-file "host-$name-requirements.txt"
            uv pip install -r "host-$name-requirements.txt" --target "$pkg/"
            cp -r "$plugin_dir"/src/. "$pkg/"
            mkdir -p "$pkg/services/$name"
            cp "$manifest" "$pkg/services/$name/biffo.plugin.json"
            # admin_ingress's built UI shell (biffo-template#627/#632) is served
            # by this same Lambda, read from services/<name>/web-admin/dist via
            # BIFFO_PLUGINS_ROOT -- build it here (same pnpm shape as the
            # plugin-frontend step below) and copy the output in. Skipped if the
            # plugin declares no admin_ingress.
            #
            # Declaring admin_ingress WITHOUT a web-admin/ is a misconfiguration,
            # not a variant to tolerate. This condition used to be a single
            # `&&`, so that combination skipped the build silently and the
            # deploy reported success -- the plugin then 404'd on GET /admin/,
            # and a CDN rule rewrote that 404 into the marketing portal's HTML,
            # so the visible symptom was an admin URL apparently serving an
            # unauthenticated page (biffo-plugin-idea-scout#22; #647 for the
            # rewrite). Nothing anywhere reported that the UI had not been built.
            #
            # Same fail-open shape as the audit gates in #591/#644: the step
            # could not do its job and passed anyway.
            if jq -e '.admin_ingress' "$manifest" >/dev/null 2>&1; then
              if [ ! -d "$plugin_dir/web-admin" ]; then
                echo "::error file=$manifest::Plugin '$name' declares admin_ingress but has no web-admin/ directory. The admin UI cannot be built, so GET /admin/ would 404 at runtime. Either add web-admin/ or remove admin_ingress from the manifest."
                exit 1
              fi
              (
                cd "$plugin_dir/web-admin"
                pnpm install --ignore-workspace --frozen-lockfile
                pnpm run build
              )
              mkdir -p "$pkg/services/$name/web-admin"
              cp -r "$plugin_dir/web-admin/dist" "$pkg/services/$name/web-admin/dist"
            fi
            echo "::endgroup::"
          done
          # Trim runtime-provided and dead weight so the zip fits the direct
          # update-function-code limit (see the Core API step for the rationale).
          (
            cd "$pkg"
            rm -rf boto3 botocore s3transfer \
                   boto3-*.dist-info botocore-*.dist-info s3transfer-*.dist-info
            find . -type d -name __pycache__ -prune -exec rm -rf {} +
            find . -type d -name tests -prune -exec rm -rf {} +
          )
          (cd "$pkg" && zip -rq ../plugin-host.zip .)
          # --output text --query 'LastUpdateStatus' suppresses the default full
          # function-config JSON (env vars in plaintext) — see #334.
          aws lambda update-function-code \
            --function-name "$fn" \
            --zip-file fileb://plugin-host.zip \
            --output text --query 'LastUpdateStatus'
          aws lambda wait function-updated --function-name "$fn"

      # Build and deploy each installed user-facing plugin's static frontend
      # (ADR-0018 §2 — the shape ADR-0021 reuses for the frontend until its own
      # shared app-shell lands, #558). Unlike the backend loop above, this is
      # keyed on user_frontend, not user_ingress — a plugin can ship a frontend
      # with no backend page (or vice versa). A plugin's own web/ isn't a pnpm
      # workspace member of this monorepo (services/<name>/web/ has its own
      # package.json + lockfile), so it needs its own install — --ignore-workspace,
      # or pnpm silently installs this repo's root deps and skips it entirely
      # (observed the hard way shipping ideation's frontend by hand: this
      # workflow never previously deployed a plugin frontend at all).
      - name: Build and deploy plugin frontends
        run: |
          set -euo pipefail
          shopt -s nullglob
          prefix='${{ vars.CORE_API_LAMBDA_NAME }}'
          prefix="${prefix%-core-api}"
          for manifest in services/*/biffo.plugin.json services/_plugins/*/biffo.plugin.json; do
            jq -e '.user_frontend' "$manifest" >/dev/null 2>&1 || continue
            plugin_dir="$(dirname "$manifest")"
            name="$(basename "$plugin_dir")"
            web_dir="$plugin_dir/web"
            [ -d "$web_dir" ] || { echo "skip $name (user_frontend declared but no web/ dir)"; continue; }
            bucket="${prefix}-plugin-${name}-web"
            if ! aws s3api head-bucket --bucket "$bucket" 2>/dev/null; then
              echo "$bucket does not exist — $name's frontend bucket not provisioned in this env; skipping."
              continue
            fi
            echo "::group::frontend $name -> $bucket"
            (
              cd "$web_dir"
              pnpm install --ignore-workspace --frozen-lockfile
              pnpm run build
            )
            # Same cache split as the portal sync above: hashed assets under
            # assets/ are immutable and keep the long cache; index.html changes
            # every deploy and must not be cached.
            aws s3 sync "$web_dir/dist/" "s3://$bucket/$name/" \
              --delete \
              --cache-control "public, max-age=31536000, immutable" \
              --exclude "index.html" \
              --exclude "*.txt"
            aws s3 sync "$web_dir/dist/" "s3://$bucket/$name/" \
              --delete \
              --cache-control "no-cache" \
              --exclude "*" \
              --include "index.html"
            echo "::endgroup::"
          done
      - name: Invalidate CloudFront for plugin frontends
        # Same fire-and-forget discipline as the portal's own invalidation step
        # above (#478) — this one covers content the portal's earlier
        # invalidation ran before, so it needs its own pass, not a duplicate of
        # the same one.
        continue-on-error: true
        timeout-minutes: 3
        run: |
          for attempt in 1 2 3; do
            if aws cloudfront create-invalidation \
              --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
              --paths "/*" \
              --cli-read-timeout 20 --cli-connect-timeout 10; then
              exit 0
            fi
            echo "CloudFront invalidation attempt ${attempt} failed; retrying..." >&2
            sleep 5
          done
          echo "::warning::CloudFront invalidation did not succeed; deploy continues (cache self-heals via TTL)."

  # ─── STAGING ─────────────────────────────────────────────────────────────────
  # Manual only — run workflow_dispatch with environment=staging.

  build-staging:
    name: Build (staging)
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    environment: staging
    if: vars.BIFFO_DEPLOY_ENABLED == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/staging') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging'))
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # The template resolves its own core version from its highest core-v*
          # tag (#648), and checkout fetches NO tags at the default depth of 1.
          # Without this the resolver fails the build — which is the designed
          # behaviour, but the cause would be this line, not the deploy.
          fetch-tags: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      # Generate the Microservices tab's data (ADR-0007) from this env's sibling
      # registry so the static portal can list siblings without a server. Link is
      # /<name> (no trailing slash — CloudFront path routing is exact).
      #
      # It lives under public/admin/ so it publishes at /admin/siblings.json:
      # the portal owns the /admin prefix and only that prefix (issue #306), so
      # a manifest at the root would be served by whatever owns `/` — the
      # user-application sibling — and the tab would 404.
      - name: Generate siblings manifest
        run: |
          SRC=infra/environments/staging/siblings.auto.tfvars.json
          OUT=apps/portal/public/admin/siblings.json
          mkdir -p "$(dirname "$OUT")"
          if [ -f "$SRC" ]; then
            jq '{ siblings: [.sibling_origins[] | { name, description: (.description // ""), routes: (.routes // []) }] }' "$SRC" > "$OUT"
          else
            echo '{ "siblings": [] }' > "$OUT"
          fi
          cat "$OUT"
      - name: Build portal
        env:
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ vars.COGNITO_USER_POOL_ID }}
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
          NEXT_PUBLIC_COGNITO_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          NEXT_PUBLIC_API_URL: ${{ vars.API_GATEWAY_URL }}
        run: pnpm run build
      - uses: actions/upload-artifact@v5
        with:
          name: portal-build-staging
          path: apps/portal/out/
      - uses: actions/upload-artifact@v5
        with:
          name: api-service-staging
          path: services/api/

  deploy-staging:
    name: Deploy to staging
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    needs: build-staging
    environment: staging
    if: vars.BIFFO_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/staging'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # The template resolves its own core version from its highest core-v*
          # tag (#648), and checkout fetches NO tags at the default depth of 1.
          # Without this the resolver fails the build — which is the designed
          # behaviour, but the cause would be this line, not the deploy.
          fetch-tags: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.BIFFO_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Register Core API secret env values as log masks
        # Belt-and-braces for #334. The primary fix suppresses update-function-code
        # output, but if any *future* step accidentally echoes the function config,
        # these masks redact the two known DB credentials. The values are never
        # printed: each is scoped by --query to a single variable, captured into a
        # shell var, and piped only into ::add-mask:: (whose own argument GitHub
        # redacts). Best-effort — it must never fail the deploy, hence the guards.
        run: |
          for v in DATABASE_URL BIFFO_APP_DATABASE_URL; do
            val=$(aws lambda get-function-configuration \
              --function-name "${{ vars.CORE_API_LAMBDA_NAME }}" \
              --query "Environment.Variables.$v" --output text 2>/dev/null || true)
            if [ -n "$val" ] && [ "$val" != "None" ]; then
              echo "::add-mask::$val"
            fi
          done
      - uses: actions/download-artifact@v5
        with:
          name: portal-build-staging
          path: portal-dist/
      - name: Verify the portal was built against live Cognito
        run: |
          # Deploy Application and Deploy Infrastructure trigger independently and
          # run CONCURRENTLY — a core upgrade touches modules/ AND apps/, firing
          # both. The portal bakes NEXT_PUBLIC_COGNITO_* at build time from
          # GitHub variables that the infra run writes at the END of its apply, so
          # a build that starts first ships the PREVIOUS pool.
          #
          # Not theoretical: replacing a user pool (any change to an immutable
          # attribute such as username_attributes) produced a fully green deploy
          # serving a portal that answered every sign-in with
          # "User pool client <id> does not exist".
          #
          # Ordering cannot express the rule — a push touching only apps/**
          # legitimately never runs infra and must not wait for it — so assert the
          # artefact against reality instead. Catches the race, a stale variable, a
          # manual dispatch after an infra change, and the empty-string fallback in
          # lib/auth.ts, regardless of cause.
          #
          # The remedy is always a FULL workflow re-run, never a failed-job re-run
          # (issue #408). This job consumes the portal via download-artifact and the
          # ids are baked in at build time, so re-running it alone re-downloads the
          # identical stale bundle and fails identically. Say so in the messages
          # below — "re-run failed jobs" is the cheaper and more obvious action, and
          # it is the wrong one.
          set -euo pipefail
          POOL=$(grep -rhoE '[a-z]{2}-[a-z]+-[0-9]+_[A-Za-z0-9]{9}' portal-dist/ | sort -u | head -1 || true)
          if [ -z "$POOL" ]; then
            echo "::error::No Cognito user pool id in the built portal. NEXT_PUBLIC_COGNITO_USER_POOL_ID was empty at build time; lib/auth.ts falls back to '' and every sign-in fails."
            exit 1
          fi
          if ! aws cognito-idp describe-user-pool --user-pool-id "$POOL" >/dev/null 2>&1; then
            echo "::error::The portal was built against Cognito pool $POOL, which does not exist. It was almost certainly replaced by a concurrent Deploy Infrastructure run. Fix: re-run the ENTIRE workflow now that infrastructure has settled - the 'Re-run all jobs' button, or 'gh run rerun <run-id>' WITHOUT --failed. Re-running only this failed job cannot work: the pool id is baked into the portal at build time, so this job just re-downloads the same stale build artifact and fails identically. Only a new Build job can pick up the live pool."
            exit 1
          fi
          # One call, then a grep — never guess client ids out of the bundle, which
          # is full of same-shaped build hashes.
          MATCH=""
          for c in $(aws cognito-idp list-user-pool-clients --user-pool-id "$POOL" \
                       --query 'UserPoolClients[].ClientId' --output text); do
            if grep -rq "$c" portal-dist/; then MATCH="$c"; break; fi
          done
          if [ -z "$MATCH" ]; then
            echo "::error::The portal names pool $POOL but none of that pool's app clients. The baked client id is stale. Fix: re-run the ENTIRE workflow - the 'Re-run all jobs' button, or 'gh run rerun <run-id>' WITHOUT --failed. Re-running only this failed job cannot work: the client id is baked into the portal at build time, so this job just re-downloads the same stale build artifact and fails identically. Only a new Build job can pick up the live client."
            exit 1
          fi
          echo "Portal builds against live pool $POOL / client $MATCH"
      - name: Place portal assets under /admin
        run: |
          # apps/portal/next.config.ts sets `assetPrefix: '/admin'` (issue #306)
          # so the exported HTML references /admin/_next/*, freeing /_next/* for
          # the user-application sibling, which has an empty basePath and would
          # otherwise claim the identical URL prefix from a different origin.
          #
          # assetPrefix rewrites URLs ONLY — Next still EMITS the files at
          # out/_next/*. Nothing in the build moves them, so without this step
          # every asset the portal asks for 404s. Move them to the key the HTML
          # references. The three sync passes below are unchanged: the same
          # extension filters apply, and their `--delete` removes the now-stale
          # objects under the old s3://<bucket>/_next/ prefix.
          if [ -d portal-dist/_next ]; then
            mkdir -p portal-dist/admin
            rm -rf portal-dist/admin/_next
            mv portal-dist/_next portal-dist/admin/_next
          fi
          # Fail loudly rather than shipping a portal with no assets at all.
          test -d portal-dist/admin/_next
      - name: Sync portal to S3
        run: |
          # Three passes, split by mutability and content type.
          #
          # Next's App Router emits its RSC flight payloads as *.txt. They were
          # previously caught by the first pass, which gave them two wrong
          # properties and broke every client-side navigation (issue #275):
          #
          #   - `aws s3 sync` guesses content type from the extension, so they
          #     were served as text/plain rather than text/x-component. The
          #     router does not recognise that as an RSC response and falls
          #     back to a hard MPA navigation TO THE URL IT WAS FETCHING — so
          #     clicking a link landed the browser on /admin/index.txt showing
          #     raw serialised React. Typing the URL worked, because a full
          #     page load never fetches the payload.
          #
          #   - they were cached immutable for a year, but they change on every
          #     deploy exactly like the HTML does.
          #
          # Hashed assets under _next/static are genuinely immutable and keep
          # the long cache; HTML and RSC payloads must not.
          # `.well-known/*` is EXCLUDED from this --delete pass. The runtime
          # identity document (.well-known/biffo-identity.json, #403) is written to
          # this same bucket by Deploy Infrastructure, NOT by the portal build — so
          # it is absent from portal-dist/, and without this exclude the --delete
          # here removes it. That strands every ROOT sibling (which resolves Cognito
          # only from that document, no baked fallback) in a sign-in redirect loop.
          # An App-only deploy (no concurrent Infra run to re-publish it) makes the
          # deletion permanent. Excluding the prefix keeps the doc across syncs.
          aws s3 sync portal-dist/ s3://${{ vars.PORTAL_BUCKET_NAME }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "*.txt" \
            --exclude ".well-known/*"
          # `--include` only re-includes from an excluded set; on its own it is a
          # no-op, since everything is included by default. Without the explicit
          # `--exclude "*"` this pass would upload the .txt payloads too — as
          # text/plain — and the pass below, being a sync, would then skip them
          # as unchanged and the wrong content type would survive.
          aws s3 sync portal-dist/ s3://${{ vars.PORTAL_BUCKET_NAME }}/ \
            --delete \
            --cache-control "no-cache" \
            --exclude "*" \
            --include "*.html"
          aws s3 sync portal-dist/ s3://${{ vars.PORTAL_BUCKET_NAME }}/ \
            --delete \
            --cache-control "no-cache" \
            --content-type "text/x-component" \
            --exclude "*" \
            --include "*.txt"
      - name: Invalidate CloudFront
        # A cache invalidation must never block or abort the functional deploy
        # (Lambda / DB schema / DDL imports) that follows. create-invalidation is
        # fire-and-forget and normally returns in seconds, but a stalled AWS API
        # call once timed out the whole job at this step and skipped every deploy
        # step after it, leaving a portal-updated-but-backend-stale promotion
        # (#478). So: bound each call (CLI timeouts), retry transient stalls, and
        # never fail the job on it — a missed invalidation self-heals via
        # CloudFront TTLs and the static-export edge redirect (#468).
        continue-on-error: true
        timeout-minutes: 3
        run: |
          for attempt in 1 2 3; do
            if aws cloudfront create-invalidation \
              --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
              --paths "/*" \
              --cli-read-timeout 20 --cli-connect-timeout 10; then
              exit 0
            fi
            echo "CloudFront invalidation attempt ${attempt} failed; retrying..." >&2
            sleep 5
          done
          echo "::warning::CloudFront invalidation did not succeed; deploy continues (cache self-heals via TTL and the #468 edge redirect)."
      - uses: actions/download-artifact@v5
        with:
          name: api-service-staging
          path: api-service/
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - name: Package and deploy Lambda
        working-directory: api-service
        run: |
          # Export from the repo-root lock, NOT from this directory. The
          # artifact is services/api/ alone, which carries a pyproject.toml but
          # no uv.lock — this is a uv workspace, so the lock exists only at the
          # root. Exporting from here found no lock and so re-resolved every
          # dependency against live PyPI on each deploy, ignoring every pin:
          # identical code could ship different trees on two runs, and a broken
          # or hostile release reached the Lambda minutes after publication.
          # greenlet 3.5.4 did precisely that — published with no manylinux
          # wheels, it broke a deploy five minutes later (#410). --frozen uses
          # the lock as-is and fails rather than quietly resolving something
          # new, matching the PR-signer and plugin steps further down.
          uv export --project .. --package biffo-api --no-dev --frozen \
            --no-emit-workspace --no-emit-project \
            --output-file requirements.txt
          uv pip install -r requirements.txt --target package/
          # The shared Cognito verifier (packages/cognito-auth) is a workspace
          # package, excluded from the export above by --no-emit-workspace, so
          # install it explicitly — the same pattern the PR-signer and plugin
          # steps below use for packages/python-sdk. Core's middleware/auth.py
          # imports it on every authenticated request, so it MUST land in the
          # zip. The path is ../ because this step runs in the api-service
          # artifact dir and the full repo checkout is its parent.
          uv pip install ../packages/cognito-auth --target package/ --no-deps
          # Trim the package before zipping so the code update fits AWS's direct
          # update-function-code limit. That API base64-encodes the zip into the
          # request body (~1.33x), so a ~54MB zip inflates past the ~70MB request
          # cap — large native deps (numpy/shapely/pandas/pydantic-core/etc.) reach
          # that easily. boto3/botocore/s3transfer are already provided by the
          # Lambda Python runtime, so drop them plus build-time dead weight
          # (dist-info, __pycache__, bundled tests/); the app's `import boto3`
          # resolves to the runtime's own copy.
          (
            cd package
            rm -rf boto3 botocore s3transfer \
                   boto3-*.dist-info botocore-*.dist-info s3transfer-*.dist-info
            find . -type d -name __pycache__ -prune -exec rm -rf {} +
            find . -type d -name tests -prune -exec rm -rf {} +
          )
          cp -r src/ package/
          cp -r migrations/ package/
          cp alembic.ini package/
          # Bake the core version in at BUILD time (#648). Resolved from
          # biffo.core.json in an instance, or the highest core-v* tag in the
          # template; the script exits non-zero if it can determine neither, so
          # "we could not tell" is a red build rather than a /health response
          # quietly reading "unknown" months later.
          #
          # NOT the repo-root core.version the issue originally asked for: that
          # file is a fossil since #423 (0.41.17 against an authority of 0.181.0
          # on biffo-platform, measured 2026-07-30) and #842 now deletes it.
          #
          # Written beside api/core_version.py, which imports it relatively so the
          # same module works under `api.*` in tests and `src.api.*` in Lambda.
          core_version=$(sh ../scripts/resolve-core-version.sh)
          printf 'CORE_VERSION = "%s"\n' "$core_version" > package/src/api/_core_version.py
          echo "Baked core version $core_version into the package"

          # Bundle every installed plugin's manifest so discover_plugin_manifests()
          # can find it at runtime — the Lambda otherwise only ships services/api/
          # itself. Both plugin channels are bundled: services/*/ (third-party,
          # user-owned) and services/_plugins/*/ (first-party, template-owned).
          # They flatten to services/<name>/ in the zip, keyed on plugin name, so
          # the runtime layout is identical either way. See the api.plugins module
          # docstring for the read side of this.
          mkdir -p package/services
          for manifest in ../services/*/biffo.plugin.json ../services/_plugins/*/biffo.plugin.json; do
            [ -f "$manifest" ] || continue
            plugin_name=$(basename "$(dirname "$manifest")")
            mkdir -p "package/services/$plugin_name"
            cp "$manifest" "package/services/$plugin_name/"
          done
          # Bundle every vendored DDL import's .sql files (db/imports/<name>/*.sql,
          # sibling to services/api/, created by `biffo data import`) so
          # discover_ddl_import_dirs() can find them at runtime — same reasoning
          # as the plugin manifest loop above. See api.ddl_import module docstring.
          mkdir -p package/db/imports
          for import_dir in ../db/imports/*/; do
            [ -d "$import_dir" ] || continue
            import_name=$(basename "$import_dir")
            mkdir -p "package/db/imports/$import_name"
            cp "$import_dir"*.sql "package/db/imports/$import_name/" 2>/dev/null || true
          done
          # Precompile the whole package to bytecode (#724).
          #
          # /var/task is READ-ONLY in Lambda, so the interpreter can never write a
          # bytecode cache: every cold start recompiles all ~1,620 .py files from
          # source. Measured on biffo-platform, that is ~60% of a ~4.0s init.
          #
          # --invalidation-mode unchecked-hash is LOAD-BEARING, not a tidy default.
          # zip/unzip rewrites every mtime, and a timestamp-invalidated .pyc is then
          # discarded as stale — giving today's behaviour back with a green build and
          # nothing to see. Measured here with mtimes forced to 2030:
          #
          #     no .pyc          0.22-0.27s
          #     timestamp .pyc   0.21-0.22s   <- no benefit whatsoever
          #     unchecked-hash   0.12s
          #
          # Runs AFTER everything is assembled and after the __pycache__ trim above,
          # or the trim would delete exactly what this produces.
          # Through uv, NOT a bare `python`. This job installs uv with
          # `python-version: 3.13` and never runs actions/setup-python, so there is
          # no `python` on PATH at all: the self-hosted runners carry python3 only.
          # It died `python: command not found`, exit 127, AFTER a successful build
          # and after the core version had already been baked in — so the deploy read
          # as a versioning problem twice over (#414) rather than a missing
          # interpreter. GitHub-hosted images ship python-is-python3, which is why
          # this survived until the estate moved onto its own runners.
          #
          # `--no-project` because this step runs in the api-service artifact dir;
          # without it uv walks up, finds the repo pyproject.toml and tries to sync a
          # project that has nothing to do with the package being built.
          #
          # The version must match the LAMBDA runtime, not merely be importable: an
          # unchecked-hash .pyc built by the wrong minor is silently ignored at
          # runtime — a green build that quietly loses the optimisation this line
          # exists for. Pinned to the same 3.13 as this job setup-uv step, and
          # workflow-python-interpreter.test.ts fails if the two ever drift apart.
          uv run --no-project --python 3.13 python -m compileall -q --invalidation-mode unchecked-hash package
          # Guard the size, because the trim above exists for a reason (#724).
          #
          # Bytecode adds ~56% to the zip (17.8 -> 27.8 MB measured on this
          # template). update-function-code base64-encodes the body at ~1.33x
          # against a ~70MB request cap, so the template lands at ~37MB with ~33MB
          # spare — but an instance carrying heavy native deps has less. Failing here
          # with the numbers beats update-function-code failing opaquely after the
          # upload, which is the shape this comment block is already about.
          zipped=$(cd package && zip -qr ../lambda.zip . && stat -c%s ../lambda.zip)
          request_mb=$(awk -v b="$zipped" 'BEGIN{printf "%.1f", b*1.33/1048576}')
          echo "Package: $(awk -v b="$zipped" 'BEGIN{printf "%.1f", b/1048576}')MB zipped, ~${request_mb}MB as a base64 request body"
          # Over the cap, DEGRADE before failing: bytecode is an optimisation, and a
          # slower cold start beats an instance that cannot deploy at all. Dropping
          # it costs ~2.5s on a cold invoke and ~56% of the zip, and the deployed
          # code is byte-for-byte the same either way.
          #
          # This exists because tabsii-platform outgrew the inline cap -- 60.3MB
          # zipped, ~80.2MB as a request body -- and the guard failed the deploy
          # outright, which left the instance's /health reporting a version 173
          # releases old with every merged change unshipped. The fallback is not the
          # real fix (that is an S3-based update, which lifts the ceiling to 250MB
          # unzipped and needs an artifacts bucket that does not exist yet); it is
          # what stops a size ceiling being an outage in the meantime.
          # Prefer S3 (#994). update-function-code --zip-file sends the package INLINE,
          # base64-encoded at ~1.33x against a ~70MB request cap; via S3 the ceiling is
          # 250MB unzipped and bytecode never has to be sacrificed to fit.
          #
          # Gated on the bucket EXISTING, not merely on the variable being set, and
          # that is the whole ordering story: a core upgrade lands this workflow and
          # the bucket's Terraform in one PR, and nothing orders Deploy Application
          # after Deploy Infrastructure. Without the head-bucket probe the first
          # upgrade would trade a size failure for a missing-bucket failure. Same
          # shape as the plugin frontend loop below, for the same reason.
          artifacts_bucket="${{ vars.ARTIFACTS_BUCKET_NAME }}"
          if [ -n "$artifacts_bucket" ] && aws s3api head-bucket --bucket "$artifacts_bucket" 2>/dev/null; then
            key="core-api/${GITHUB_SHA}.zip"
            echo "Uploading via s3://$artifacts_bucket/$key (bytecode kept)"
            aws s3 cp lambda.zip "s3://$artifacts_bucket/$key" --only-show-errors
            use_s3=1
          else
            use_s3=""
            if [ -n "$artifacts_bucket" ]; then
              echo "::warning::ARTIFACTS_BUCKET_NAME is set but $artifacts_bucket does not exist yet — run Deploy Infrastructure. Falling back to an inline upload." >&2
            else
              echo "ARTIFACTS_BUCKET_NAME unset; inline upload. Run Deploy Infrastructure to enable S3 (#994)."
            fi
          fi

          # Inline only: degrade before failing. Bytecode is an optimisation, and a
          # slower cold start beats an instance that cannot deploy at all -- the
          # deployed code is byte-for-byte identical either way. Not reached on the
          # S3 path, which is the point of doing this at all.
          if [ -z "$use_s3" ] && awk -v m="$request_mb" 'BEGIN{exit !(m > 60)}'; then
            echo "::warning::~${request_mb}MB exceeds the inline cap; dropping bytecode and retrying." >&2
            find package -name '__pycache__' -type d -prune -exec rm -rf {} + 2>/dev/null || true
            rm -f lambda.zip
            zipped=$(cd package && zip -qr ../lambda.zip . && stat -c%s ../lambda.zip)
            request_mb=$(awk -v b="$zipped" 'BEGIN{printf "%.1f", b*1.33/1048576}')
            echo "Without bytecode: $(awk -v b="$zipped" 'BEGIN{printf "%.1f", b/1048576}')MB zipped, ~${request_mb}MB as a request body"
            echo "::warning::Cold start is ~2.5s slower until Deploy Infrastructure provisions the artifacts bucket (#994)." >&2
          fi
          # Still over without bytecode means the package itself is too big, and no
          # amount of not-precompiling saves it. Fail loudly rather than let
          # update-function-code reject it opaquely after the upload.
          if [ -z "$use_s3" ] && awk -v m="$request_mb" 'BEGIN{exit !(m > 60)}'; then
            echo "::error::Lambda package is ~${request_mb}MB as a base64 request body even without bytecode, against a ~70MB cap." >&2
            echo "Move this function to an S3-based update (250MB unzipped) or drop a heavy" >&2
            echo "dependency. Do not raise this threshold without measuring the real cap." >&2
            exit 1
          fi
          # --output text --query 'LastUpdateStatus' suppresses the CLI's default
          # output, which is the *entire* function configuration as JSON —
          # including Environment.Variables (the master DATABASE_URL and, since
          # #253, BIFFO_APP_DATABASE_URL) in plaintext. Printing that leaked live
          # DB credentials into the Actions log (#334). The response is unused —
          # the wait below is what gates progress — so narrowing it to the status
          # string loses nothing.
          if [ -n "$use_s3" ]; then
            aws lambda update-function-code \
              --function-name ${{ vars.CORE_API_LAMBDA_NAME }} \
              --s3-bucket "$artifacts_bucket" --s3-key "$key" \
              --output text --query 'LastUpdateStatus'
          else
            aws lambda update-function-code \
              --function-name ${{ vars.CORE_API_LAMBDA_NAME }} \
              --zip-file fileb://lambda.zip \
              --output text --query 'LastUpdateStatus'
          fi
      - name: Initialise database schema
        run: |
          aws lambda wait function-updated \
            --function-name ${{ vars.CORE_API_LAMBDA_NAME }}
          RESULT=$(aws lambda invoke \
            --function-name ${{ vars.CORE_API_LAMBDA_NAME }} \
            --payload '{"source":"biffo:db-init"}' \
            --cli-binary-format raw-in-base64-out \
            db-init-response.json)
          if echo "$RESULT" | grep -q FunctionError; then
            echo "Schema init failed:" && cat db-init-response.json && exit 1
          fi
          # Echo the response on success too. It carries the app_role result
          # (#253): {"bootstrapped": true, "role": "biffo_app", "schemas": [...]}
          # when the least-privilege role was created and granted. A
          # "bootstrapped": false with reason "no-app-credential" means the
          # environment has not been re-applied and the request path is still
          # falling back to the owner/master role -- which is serving traffic,
          # so it is not a deploy failure, but it is not the intended posture
          # either. This is the only place that distinction is visible.
          echo "db-init response:" && cat db-init-response.json && echo
      # Apply every vendored DDL import (ADR-0005) after the Alembic schema init.
      # Like db-init runs the Core's own migrations, this runs biffo:ddl-import for
      # each db/imports/<name>/ dir — new .sql files (schema additions, seeds) apply
      # automatically on deploy instead of needing a manual invoke. Idempotent:
      # already-applied files are skipped via ddl_import_history.
      - name: Apply DDL imports
        run: |
          shopt -s nullglob
          for import_dir in db/imports/*/; do
            name=$(basename "$import_dir")
            echo "Applying DDL import: $name"
            RESULT=$(aws lambda invoke \
              --function-name ${{ vars.CORE_API_LAMBDA_NAME }} \
              --payload "{\"source\":\"biffo:ddl-import\",\"directory\":\"$name\"}" \
              --cli-binary-format raw-in-base64-out \
              ddl-import-response.json)
            if echo "$RESULT" | grep -q FunctionError; then
              echo "DDL import $name failed:" && cat ddl-import-response.json && exit 1
            fi
            cat ddl-import-response.json
          done
      # Package and deploy the isolated PR-signer Lambda (ADR-0008), only when
      # the instance has provisioned one (enable_pr_signer surfaces its function
      # name as PR_SIGNER_LAMBDA_NAME). Unlike the Core API above, this packages
      # straight from the checkout, not the api-service artifact: the signer
      # depends on the workspace SDK (packages/python-sdk), which the artifact
      # doesn't carry. Third-party deps come from the workspace lock (excluding
      # workspace members, hence --no-emit-workspace/--no-emit-project); the SDK
      # itself is installed from source with --no-deps.
      - name: Package and deploy PR-signer Lambda
        if: vars.PR_SIGNER_LAMBDA_NAME != ''
        run: |
          uv export --package biffo-pr-signer --no-dev --frozen \
            --no-emit-workspace --no-emit-project \
            --output-file pr-signer-requirements.txt
          uv pip install -r pr-signer-requirements.txt --target pr-signer-package/
          uv pip install ./packages/python-sdk --target pr-signer-package/ --no-deps
          cp -r services/pr-signer/src pr-signer-package/
          cd pr-signer-package && zip -r ../pr-signer-lambda.zip .
          cd ..
          # --output text --query 'LastUpdateStatus' suppresses the default full
          # function-config JSON (env vars in plaintext) — see #334.
          aws lambda update-function-code \
            --function-name ${{ vars.PR_SIGNER_LAMBDA_NAME }} \
            --zip-file fileb://pr-signer-lambda.zip \
            --output text --query 'LastUpdateStatus'
          aws lambda wait function-updated \
            --function-name ${{ vars.PR_SIGNER_LAMBDA_NAME }}
      # Package and deploy each enabled plugin's own Lambda (ADR-0003, #196).
      # deploy-infra (running in parallel) creates the function from a placeholder
      # zip with ignore_changes on its code; this step ships the real handler. A
      # plugin owns a Lambda once its terraform module is installed at
      # modules/plugins/<name>/. The function name is <project>-<env>-plugin-<name>,
      # derived from the Core API Lambda name (strip -core-api) so no extra var is
      # needed. Packaged from the checkout like the PR-signer: third-party deps from
      # the workspace lock (workspace members excluded), the SDK from source, and the
      # plugin's own src/ at the package root to match the <name>.main.handler; the
      # manifest is bundled at the task root (the plugin's manifest.py walks up to it).
      - name: Package and deploy plugin Lambdas
        run: |
          set -euo pipefail
          shopt -s nullglob
          prefix='${{ vars.CORE_API_LAMBDA_NAME }}'
          prefix="${prefix%-core-api}"
          # Both plugin channels (see the manifest-bundling loop above); the
          # terraform module and Lambda name are resolved by plugin *name*
          # (basename of the plugin dir), so the source channel is immaterial here.
          for manifest in services/*/biffo.plugin.json services/_plugins/*/biffo.plugin.json; do
            plugin_dir="$(dirname "$manifest")"
            name="$(basename "$plugin_dir")"
            # Wired means: a copied module (third-party) OR terraform/ beside the
            # plugin (first-party, referenced in place since #406). Checking only
            # modules/plugins/ silently stopped shipping first-party plugin code
            # the moment their dead copies were deleted.
            [ -d "modules/plugins/$name" ] || [ -d "$plugin_dir/terraform" ] || { echo "skip $name (no terraform module)"; continue; }
            fn="${prefix}-plugin-${name}"
            echo "::group::plugin $name -> $fn"
            # Ground truth for "provisioned in this env" is whether the Lambda
            # exists, so check once and skip immediately if it does not (#449).
            #
            # This used to wait 30×10s for the function to appear, on the theory
            # that a concurrent infra deploy was creating it. But a first-party
            # plugin's terraform ships to every instance while its Lambda exists
            # only where the env wired `module "plugin_<name>"` into its
            # (user-owned) infra — so for any instance not running that plugin,
            # the wait always ran out the full ~5.5 min per plugin, on every
            # deploy, for a function that would never appear (observed on
            # biffo-platform: ~11 min/deploy, then skipped anyway).
            #
            # The race barely exists in practice: enabling a plugin edits
            # infra/environments/** only, so it triggers Deploy Infrastructure —
            # not this app workflow — and infra creates the Lambda with a
            # placeholder zip (compute module, ignore_changes on the code). Its
            # real code is loaded by the next app deploy regardless. Waiting here
            # is what the "this job never runs infra and must not wait for it"
            # contract above already says it should not do.
            if ! aws lambda get-function --function-name "$fn" >/dev/null 2>&1; then
              echo "$fn does not exist — plugin not provisioned in this env; skipping."
              echo "(If you just enabled it, its infra apply creates the Lambda; re-run this deploy to load its code.)"
              echo "::endgroup::"; continue
            fi
            pkg_name="$(sed -n 's/^name *= *"\(.*\)".*/\1/p' "$plugin_dir/pyproject.toml" | head -1)"
            rm -rf "plugin-$name-package"
            uv export --package "$pkg_name" --no-dev --frozen \
              --no-emit-workspace --no-emit-project \
              --output-file "plugin-$name-requirements.txt"
            uv pip install -r "plugin-$name-requirements.txt" --target "plugin-$name-package/"
            uv pip install ./packages/python-sdk --target "plugin-$name-package/" --no-deps
            cp -r "$plugin_dir"/src/. "plugin-$name-package/"
            cp "$manifest" "plugin-$name-package/biffo.plugin.json"
            (cd "plugin-$name-package" && zip -rq "../plugin-$name.zip" .)
            # --output text --query 'LastUpdateStatus' suppresses the default full
            # function-config JSON (a plugin Lambda's own secret env vars in
            # plaintext) — see #334.
            aws lambda update-function-code \
              --function-name "$fn" \
              --zip-file "fileb://plugin-$name.zip" \
              --output text --query 'LastUpdateStatus'
            aws lambda wait function-updated --function-name "$fn"
            echo "::endgroup::"
          done
      # Package and deploy the SHARED plugin host (ADR-0021, #545) — ONE Lambda
      # that runs every installed user-facing plugin's API behind the shared API
      # Gateway at /api/v1/plugins/*. It supersedes ADR-0018's per-plugin Lambda:
      # a plugin that declares user_ingress.app is pure code mounted here, not its
      # own function, so the per-plugin step above skips it (no terraform/ beside
      # it). The host function is <project>-<env>-plugin-host, created by
      # deploy-infra from the compute-module placeholder (ignore_changes on code);
      # this step ships the real code. Skipped where the host is not provisioned.
      - name: Package and deploy the shared plugin host
        run: |
          set -euo pipefail
          shopt -s nullglob
          prefix='${{ vars.CORE_API_LAMBDA_NAME }}'
          prefix="${prefix%-core-api}"
          fn="${prefix}-plugin-host"
          if ! aws lambda get-function --function-name "$fn" >/dev/null 2>&1; then
            echo "$fn does not exist — the shared plugin host is not provisioned in this env; skipping."
            exit 0
          fi
          pkg=plugin-host-package
          rm -rf "$pkg"
          # Host runtime: third-party deps from the workspace lock (workspace
          # members excluded), the SDK from source, and the host's own package at
          # the task root. The SDK[user-serving] extra's transitive deps (the JWT
          # verification the founder gate needs) are NOT workspace members, so the
          # export already carries them.
          uv export --package biffo-plugin-host --no-dev --frozen \
            --no-emit-workspace --no-emit-project \
            --output-file host-requirements.txt
          uv pip install -r host-requirements.txt --target "$pkg/"
          uv pip install ./packages/python-sdk --target "$pkg/" --no-deps
          cp -r services/_plugin-host/src/. "$pkg/"
          # Each user-facing plugin (a manifest with user_ingress.app) becomes pure
          # code inside the host: its package at the task root so load_app("<mod>:
          # <attr>") imports it, and its manifest under services/<name>/ so
          # discover_plugins() — which scans BIFFO_PLUGINS_ROOT=/var/task/services —
          # mounts it. Both plugin channels are covered, keyed on plugin name like
          # every other step here. A plugin's own workspace SDK dep is excluded from
          # its export; the host already installed the SDK above.
          mkdir -p "$pkg/services"
          for manifest in services/*/biffo.plugin.json services/_plugins/*/biffo.plugin.json; do
            jq -e '.user_ingress.app' "$manifest" >/dev/null 2>&1 || continue
            plugin_dir="$(dirname "$manifest")"
            name="$(basename "$plugin_dir")"
            echo "::group::host mount: $name"
            pkg_name="$(sed -n 's/^name *= *"\(.*\)".*/\1/p' "$plugin_dir/pyproject.toml" | head -1)"
            uv export --package "$pkg_name" --no-dev --frozen \
              --no-emit-workspace --no-emit-project \
              --output-file "host-$name-requirements.txt"
            uv pip install -r "host-$name-requirements.txt" --target "$pkg/"
            cp -r "$plugin_dir"/src/. "$pkg/"
            mkdir -p "$pkg/services/$name"
            cp "$manifest" "$pkg/services/$name/biffo.plugin.json"
            # admin_ingress's built UI shell (biffo-template#627/#632) is served
            # by this same Lambda, read from services/<name>/web-admin/dist via
            # BIFFO_PLUGINS_ROOT -- build it here (same pnpm shape as the
            # plugin-frontend step below) and copy the output in. Skipped if the
            # plugin declares no admin_ingress.
            #
            # Declaring admin_ingress WITHOUT a web-admin/ is a misconfiguration,
            # not a variant to tolerate. This condition used to be a single
            # `&&`, so that combination skipped the build silently and the
            # deploy reported success -- the plugin then 404'd on GET /admin/,
            # and a CDN rule rewrote that 404 into the marketing portal's HTML,
            # so the visible symptom was an admin URL apparently serving an
            # unauthenticated page (biffo-plugin-idea-scout#22; #647 for the
            # rewrite). Nothing anywhere reported that the UI had not been built.
            #
            # Same fail-open shape as the audit gates in #591/#644: the step
            # could not do its job and passed anyway.
            if jq -e '.admin_ingress' "$manifest" >/dev/null 2>&1; then
              if [ ! -d "$plugin_dir/web-admin" ]; then
                echo "::error file=$manifest::Plugin '$name' declares admin_ingress but has no web-admin/ directory. The admin UI cannot be built, so GET /admin/ would 404 at runtime. Either add web-admin/ or remove admin_ingress from the manifest."
                exit 1
              fi
              (
                cd "$plugin_dir/web-admin"
                pnpm install --ignore-workspace --frozen-lockfile
                pnpm run build
              )
              mkdir -p "$pkg/services/$name/web-admin"
              cp -r "$plugin_dir/web-admin/dist" "$pkg/services/$name/web-admin/dist"
            fi
            echo "::endgroup::"
          done
          # Trim runtime-provided and dead weight so the zip fits the direct
          # update-function-code limit (see the Core API step for the rationale).
          (
            cd "$pkg"
            rm -rf boto3 botocore s3transfer \
                   boto3-*.dist-info botocore-*.dist-info s3transfer-*.dist-info
            find . -type d -name __pycache__ -prune -exec rm -rf {} +
            find . -type d -name tests -prune -exec rm -rf {} +
          )
          (cd "$pkg" && zip -rq ../plugin-host.zip .)
          # --output text --query 'LastUpdateStatus' suppresses the default full
          # function-config JSON (env vars in plaintext) — see #334.
          aws lambda update-function-code \
            --function-name "$fn" \
            --zip-file fileb://plugin-host.zip \
            --output text --query 'LastUpdateStatus'
          aws lambda wait function-updated --function-name "$fn"

      # Build and deploy each installed user-facing plugin's static frontend
      # (ADR-0018 §2 — the shape ADR-0021 reuses for the frontend until its own
      # shared app-shell lands, #558). Unlike the backend loop above, this is
      # keyed on user_frontend, not user_ingress — a plugin can ship a frontend
      # with no backend page (or vice versa). A plugin's own web/ isn't a pnpm
      # workspace member of this monorepo (services/<name>/web/ has its own
      # package.json + lockfile), so it needs its own install — --ignore-workspace,
      # or pnpm silently installs this repo's root deps and skips it entirely
      # (observed the hard way shipping ideation's frontend by hand: this
      # workflow never previously deployed a plugin frontend at all).
      - name: Build and deploy plugin frontends
        run: |
          set -euo pipefail
          shopt -s nullglob
          prefix='${{ vars.CORE_API_LAMBDA_NAME }}'
          prefix="${prefix%-core-api}"
          for manifest in services/*/biffo.plugin.json services/_plugins/*/biffo.plugin.json; do
            jq -e '.user_frontend' "$manifest" >/dev/null 2>&1 || continue
            plugin_dir="$(dirname "$manifest")"
            name="$(basename "$plugin_dir")"
            web_dir="$plugin_dir/web"
            [ -d "$web_dir" ] || { echo "skip $name (user_frontend declared but no web/ dir)"; continue; }
            bucket="${prefix}-plugin-${name}-web"
            if ! aws s3api head-bucket --bucket "$bucket" 2>/dev/null; then
              echo "$bucket does not exist — $name's frontend bucket not provisioned in this env; skipping."
              continue
            fi
            echo "::group::frontend $name -> $bucket"
            (
              cd "$web_dir"
              pnpm install --ignore-workspace --frozen-lockfile
              pnpm run build
            )
            # Same cache split as the portal sync above: hashed assets under
            # assets/ are immutable and keep the long cache; index.html changes
            # every deploy and must not be cached.
            aws s3 sync "$web_dir/dist/" "s3://$bucket/$name/" \
              --delete \
              --cache-control "public, max-age=31536000, immutable" \
              --exclude "index.html" \
              --exclude "*.txt"
            aws s3 sync "$web_dir/dist/" "s3://$bucket/$name/" \
              --delete \
              --cache-control "no-cache" \
              --exclude "*" \
              --include "index.html"
            echo "::endgroup::"
          done
      - name: Invalidate CloudFront for plugin frontends
        # Same fire-and-forget discipline as the portal's own invalidation step
        # above (#478) — this one covers content the portal's earlier
        # invalidation ran before, so it needs its own pass, not a duplicate of
        # the same one.
        continue-on-error: true
        timeout-minutes: 3
        run: |
          for attempt in 1 2 3; do
            if aws cloudfront create-invalidation \
              --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
              --paths "/*" \
              --cli-read-timeout 20 --cli-connect-timeout 10; then
              exit 0
            fi
            echo "CloudFront invalidation attempt ${attempt} failed; retrying..." >&2
            sleep 5
          done
          echo "::warning::CloudFront invalidation did not succeed; deploy continues (cache self-heals via TTL)."

  # ─── PROD ────────────────────────────────────────────────────────────────────
  # Manual only — run workflow_dispatch with environment=prod.
  # Requires prod environment approval in GitHub Settings → Environments.

  build-prod:
    name: Build (prod)
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    environment: prod
    # prod deploys always require an explicit workflow_dispatch, never a push
    # side effect — BIFFO_DEPLOY_ENABLED is a single repo-wide flag set true
    # by the very first `biffo deploy` of ANY environment, so a push-triggered
    # prod path here would mean every future push to main (e.g. a routine PR
    # merge) silently deploys to production the moment anyone has ever run
    # `biffo deploy dev` even once. This is what "Manual only" above means —
    # a prior version of this condition contradicted that comment.
    if: vars.BIFFO_DEPLOY_ENABLED == 'true' && github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # The template resolves its own core version from its highest core-v*
          # tag (#648), and checkout fetches NO tags at the default depth of 1.
          # Without this the resolver fails the build — which is the designed
          # behaviour, but the cause would be this line, not the deploy.
          fetch-tags: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      # Generate the Microservices tab's data (ADR-0007) from this env's sibling
      # registry so the static portal can list siblings without a server. Link is
      # /<name> (no trailing slash — CloudFront path routing is exact).
      #
      # It lives under public/admin/ so it publishes at /admin/siblings.json:
      # the portal owns the /admin prefix and only that prefix (issue #306), so
      # a manifest at the root would be served by whatever owns `/` — the
      # user-application sibling — and the tab would 404.
      - name: Generate siblings manifest
        run: |
          SRC=infra/environments/prod/siblings.auto.tfvars.json
          OUT=apps/portal/public/admin/siblings.json
          mkdir -p "$(dirname "$OUT")"
          if [ -f "$SRC" ]; then
            jq '{ siblings: [.sibling_origins[] | { name, description: (.description // ""), routes: (.routes // []) }] }' "$SRC" > "$OUT"
          else
            echo '{ "siblings": [] }' > "$OUT"
          fi
          cat "$OUT"
      - name: Build portal
        env:
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ vars.COGNITO_USER_POOL_ID }}
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
          NEXT_PUBLIC_COGNITO_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          NEXT_PUBLIC_API_URL: ${{ vars.API_GATEWAY_URL }}
        run: pnpm run build
      - uses: actions/upload-artifact@v5
        with:
          name: portal-build-prod
          path: apps/portal/out/
      - uses: actions/upload-artifact@v5
        with:
          name: api-service-prod
          path: services/api/

  deploy-prod:
    name: Deploy to prod
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    needs: build-prod
    environment: prod
    # See build-prod above — prod always requires an explicit workflow_dispatch.
    # (In practice this job only ever runs via needs: build-prod anyway once
    # that job is push-gated correctly, but stating it explicitly here too
    # means this condition is never misleading on its own.)
    if: vars.BIFFO_DEPLOY_ENABLED == 'true' && github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # The template resolves its own core version from its highest core-v*
          # tag (#648), and checkout fetches NO tags at the default depth of 1.
          # Without this the resolver fails the build — which is the designed
          # behaviour, but the cause would be this line, not the deploy.
          fetch-tags: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.BIFFO_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Register Core API secret env values as log masks
        # Belt-and-braces for #334. The primary fix suppresses update-function-code
        # output, but if any *future* step accidentally echoes the function config,
        # these masks redact the two known DB credentials. The values are never
        # printed: each is scoped by --query to a single variable, captured into a
        # shell var, and piped only into ::add-mask:: (whose own argument GitHub
        # redacts). Best-effort — it must never fail the deploy, hence the guards.
        run: |
          for v in DATABASE_URL BIFFO_APP_DATABASE_URL; do
            val=$(aws lambda get-function-configuration \
              --function-name "${{ vars.CORE_API_LAMBDA_NAME }}" \
              --query "Environment.Variables.$v" --output text 2>/dev/null || true)
            if [ -n "$val" ] && [ "$val" != "None" ]; then
              echo "::add-mask::$val"
            fi
          done
      - uses: actions/download-artifact@v5
        with:
          name: portal-build-prod
          path: portal-dist/
      - name: Verify the portal was built against live Cognito
        run: |
          # Deploy Application and Deploy Infrastructure trigger independently and
          # run CONCURRENTLY — a core upgrade touches modules/ AND apps/, firing
          # both. The portal bakes NEXT_PUBLIC_COGNITO_* at build time from
          # GitHub variables that the infra run writes at the END of its apply, so
          # a build that starts first ships the PREVIOUS pool.
          #
          # Not theoretical: replacing a user pool (any change to an immutable
          # attribute such as username_attributes) produced a fully green deploy
          # serving a portal that answered every sign-in with
          # "User pool client <id> does not exist".
          #
          # Ordering cannot express the rule — a push touching only apps/**
          # legitimately never runs infra and must not wait for it — so assert the
          # artefact against reality instead. Catches the race, a stale variable, a
          # manual dispatch after an infra change, and the empty-string fallback in
          # lib/auth.ts, regardless of cause.
          #
          # The remedy is always a FULL workflow re-run, never a failed-job re-run
          # (issue #408). This job consumes the portal via download-artifact and the
          # ids are baked in at build time, so re-running it alone re-downloads the
          # identical stale bundle and fails identically. Say so in the messages
          # below — "re-run failed jobs" is the cheaper and more obvious action, and
          # it is the wrong one.
          set -euo pipefail
          POOL=$(grep -rhoE '[a-z]{2}-[a-z]+-[0-9]+_[A-Za-z0-9]{9}' portal-dist/ | sort -u | head -1 || true)
          if [ -z "$POOL" ]; then
            echo "::error::No Cognito user pool id in the built portal. NEXT_PUBLIC_COGNITO_USER_POOL_ID was empty at build time; lib/auth.ts falls back to '' and every sign-in fails."
            exit 1
          fi
          if ! aws cognito-idp describe-user-pool --user-pool-id "$POOL" >/dev/null 2>&1; then
            echo "::error::The portal was built against Cognito pool $POOL, which does not exist. It was almost certainly replaced by a concurrent Deploy Infrastructure run. Fix: re-run the ENTIRE workflow now that infrastructure has settled - the 'Re-run all jobs' button, or 'gh run rerun <run-id>' WITHOUT --failed. Re-running only this failed job cannot work: the pool id is baked into the portal at build time, so this job just re-downloads the same stale build artifact and fails identically. Only a new Build job can pick up the live pool."
            exit 1
          fi
          # One call, then a grep — never guess client ids out of the bundle, which
          # is full of same-shaped build hashes.
          MATCH=""
          for c in $(aws cognito-idp list-user-pool-clients --user-pool-id "$POOL" \
                       --query 'UserPoolClients[].ClientId' --output text); do
            if grep -rq "$c" portal-dist/; then MATCH="$c"; break; fi
          done
          if [ -z "$MATCH" ]; then
            echo "::error::The portal names pool $POOL but none of that pool's app clients. The baked client id is stale. Fix: re-run the ENTIRE workflow - the 'Re-run all jobs' button, or 'gh run rerun <run-id>' WITHOUT --failed. Re-running only this failed job cannot work: the client id is baked into the portal at build time, so this job just re-downloads the same stale build artifact and fails identically. Only a new Build job can pick up the live client."
            exit 1
          fi
          echo "Portal builds against live pool $POOL / client $MATCH"
      - name: Place portal assets under /admin
        run: |
          # apps/portal/next.config.ts sets `assetPrefix: '/admin'` (issue #306)
          # so the exported HTML references /admin/_next/*, freeing /_next/* for
          # the user-application sibling, which has an empty basePath and would
          # otherwise claim the identical URL prefix from a different origin.
          #
          # assetPrefix rewrites URLs ONLY — Next still EMITS the files at
          # out/_next/*. Nothing in the build moves them, so without this step
          # every asset the portal asks for 404s. Move them to the key the HTML
          # references. The three sync passes below are unchanged: the same
          # extension filters apply, and their `--delete` removes the now-stale
          # objects under the old s3://<bucket>/_next/ prefix.
          if [ -d portal-dist/_next ]; then
            mkdir -p portal-dist/admin
            rm -rf portal-dist/admin/_next
            mv portal-dist/_next portal-dist/admin/_next
          fi
          # Fail loudly rather than shipping a portal with no assets at all.
          test -d portal-dist/admin/_next
      - name: Sync portal to S3
        run: |
          # Three passes, split by mutability and content type.
          #
          # Next's App Router emits its RSC flight payloads as *.txt. They were
          # previously caught by the first pass, which gave them two wrong
          # properties and broke every client-side navigation (issue #275):
          #
          #   - `aws s3 sync` guesses content type from the extension, so they
          #     were served as text/plain rather than text/x-component. The
          #     router does not recognise that as an RSC response and falls
          #     back to a hard MPA navigation TO THE URL IT WAS FETCHING — so
          #     clicking a link landed the browser on /admin/index.txt showing
          #     raw serialised React. Typing the URL worked, because a full
          #     page load never fetches the payload.
          #
          #   - they were cached immutable for a year, but they change on every
          #     deploy exactly like the HTML does.
          #
          # Hashed assets under _next/static are genuinely immutable and keep
          # the long cache; HTML and RSC payloads must not.
          # `.well-known/*` is EXCLUDED from this --delete pass. The runtime
          # identity document (.well-known/biffo-identity.json, #403) is written to
          # this same bucket by Deploy Infrastructure, NOT by the portal build — so
          # it is absent from portal-dist/, and without this exclude the --delete
          # here removes it. That strands every ROOT sibling (which resolves Cognito
          # only from that document, no baked fallback) in a sign-in redirect loop.
          # An App-only deploy (no concurrent Infra run to re-publish it) makes the
          # deletion permanent. Excluding the prefix keeps the doc across syncs.
          aws s3 sync portal-dist/ s3://${{ vars.PORTAL_BUCKET_NAME }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "*.txt" \
            --exclude ".well-known/*"
          # `--include` only re-includes from an excluded set; on its own it is a
          # no-op, since everything is included by default. Without the explicit
          # `--exclude "*"` this pass would upload the .txt payloads too — as
          # text/plain — and the pass below, being a sync, would then skip them
          # as unchanged and the wrong content type would survive.
          aws s3 sync portal-dist/ s3://${{ vars.PORTAL_BUCKET_NAME }}/ \
            --delete \
            --cache-control "no-cache" \
            --exclude "*" \
            --include "*.html"
          aws s3 sync portal-dist/ s3://${{ vars.PORTAL_BUCKET_NAME }}/ \
            --delete \
            --cache-control "no-cache" \
            --content-type "text/x-component" \
            --exclude "*" \
            --include "*.txt"
      - name: Invalidate CloudFront
        # A cache invalidation must never block or abort the functional deploy
        # (Lambda / DB schema / DDL imports) that follows. create-invalidation is
        # fire-and-forget and normally returns in seconds, but a stalled AWS API
        # call once timed out the whole job at this step and skipped every deploy
        # step after it, leaving a portal-updated-but-backend-stale promotion
        # (#478). So: bound each call (CLI timeouts), retry transient stalls, and
        # never fail the job on it — a missed invalidation self-heals via
        # CloudFront TTLs and the static-export edge redirect (#468).
        continue-on-error: true
        timeout-minutes: 3
        run: |
          for attempt in 1 2 3; do
            if aws cloudfront create-invalidation \
              --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
              --paths "/*" \
              --cli-read-timeout 20 --cli-connect-timeout 10; then
              exit 0
            fi
            echo "CloudFront invalidation attempt ${attempt} failed; retrying..." >&2
            sleep 5
          done
          echo "::warning::CloudFront invalidation did not succeed; deploy continues (cache self-heals via TTL and the #468 edge redirect)."
      - uses: actions/download-artifact@v5
        with:
          name: api-service-prod
          path: api-service/
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - name: Package and deploy Lambda
        working-directory: api-service
        run: |
          # Export from the repo-root lock, NOT from this directory. The
          # artifact is services/api/ alone, which carries a pyproject.toml but
          # no uv.lock — this is a uv workspace, so the lock exists only at the
          # root. Exporting from here found no lock and so re-resolved every
          # dependency against live PyPI on each deploy, ignoring every pin:
          # identical code could ship different trees on two runs, and a broken
          # or hostile release reached the Lambda minutes after publication.
          # greenlet 3.5.4 did precisely that — published with no manylinux
          # wheels, it broke a deploy five minutes later (#410). --frozen uses
          # the lock as-is and fails rather than quietly resolving something
          # new, matching the PR-signer and plugin steps further down.
          uv export --project .. --package biffo-api --no-dev --frozen \
            --no-emit-workspace --no-emit-project \
            --output-file requirements.txt
          uv pip install -r requirements.txt --target package/
          # The shared Cognito verifier (packages/cognito-auth) is a workspace
          # package, excluded from the export above by --no-emit-workspace, so
          # install it explicitly — the same pattern the PR-signer and plugin
          # steps below use for packages/python-sdk. Core's middleware/auth.py
          # imports it on every authenticated request, so it MUST land in the
          # zip. The path is ../ because this step runs in the api-service
          # artifact dir and the full repo checkout is its parent.
          uv pip install ../packages/cognito-auth --target package/ --no-deps
          # Trim the package before zipping so the code update fits AWS's direct
          # update-function-code limit. That API base64-encodes the zip into the
          # request body (~1.33x), so a ~54MB zip inflates past the ~70MB request
          # cap — large native deps (numpy/shapely/pandas/pydantic-core/etc.) reach
          # that easily. boto3/botocore/s3transfer are already provided by the
          # Lambda Python runtime, so drop them plus build-time dead weight
          # (dist-info, __pycache__, bundled tests/); the app's `import boto3`
          # resolves to the runtime's own copy.
          (
            cd package
            rm -rf boto3 botocore s3transfer \
                   boto3-*.dist-info botocore-*.dist-info s3transfer-*.dist-info
            find . -type d -name __pycache__ -prune -exec rm -rf {} +
            find . -type d -name tests -prune -exec rm -rf {} +
          )
          cp -r src/ package/
          cp -r migrations/ package/
          cp alembic.ini package/
          # Bake the core version in at BUILD time (#648). Resolved from
          # biffo.core.json in an instance, or the highest core-v* tag in the
          # template; the script exits non-zero if it can determine neither, so
          # "we could not tell" is a red build rather than a /health response
          # quietly reading "unknown" months later.
          #
          # NOT the repo-root core.version the issue originally asked for: that
          # file is a fossil since #423 (0.41.17 against an authority of 0.181.0
          # on biffo-platform, measured 2026-07-30) and #842 now deletes it.
          #
          # Written beside api/core_version.py, which imports it relatively so the
          # same module works under `api.*` in tests and `src.api.*` in Lambda.
          core_version=$(sh ../scripts/resolve-core-version.sh)
          printf 'CORE_VERSION = "%s"\n' "$core_version" > package/src/api/_core_version.py
          echo "Baked core version $core_version into the package"

          # Bundle every installed plugin's manifest so discover_plugin_manifests()
          # can find it at runtime — the Lambda otherwise only ships services/api/
          # itself. Both plugin channels are bundled: services/*/ (third-party,
          # user-owned) and services/_plugins/*/ (first-party, template-owned).
          # They flatten to services/<name>/ in the zip, keyed on plugin name, so
          # the runtime layout is identical either way. See the api.plugins module
          # docstring for the read side of this.
          mkdir -p package/services
          for manifest in ../services/*/biffo.plugin.json ../services/_plugins/*/biffo.plugin.json; do
            [ -f "$manifest" ] || continue
            plugin_name=$(basename "$(dirname "$manifest")")
            mkdir -p "package/services/$plugin_name"
            cp "$manifest" "package/services/$plugin_name/"
          done
          # Bundle every vendored DDL import's .sql files (db/imports/<name>/*.sql,
          # sibling to services/api/, created by `biffo data import`) so
          # discover_ddl_import_dirs() can find them at runtime — same reasoning
          # as the plugin manifest loop above. See api.ddl_import module docstring.
          mkdir -p package/db/imports
          for import_dir in ../db/imports/*/; do
            [ -d "$import_dir" ] || continue
            import_name=$(basename "$import_dir")
            mkdir -p "package/db/imports/$import_name"
            cp "$import_dir"*.sql "package/db/imports/$import_name/" 2>/dev/null || true
          done
          # Precompile the whole package to bytecode (#724).
          #
          # /var/task is READ-ONLY in Lambda, so the interpreter can never write a
          # bytecode cache: every cold start recompiles all ~1,620 .py files from
          # source. Measured on biffo-platform, that is ~60% of a ~4.0s init.
          #
          # --invalidation-mode unchecked-hash is LOAD-BEARING, not a tidy default.
          # zip/unzip rewrites every mtime, and a timestamp-invalidated .pyc is then
          # discarded as stale — giving today's behaviour back with a green build and
          # nothing to see. Measured here with mtimes forced to 2030:
          #
          #     no .pyc          0.22-0.27s
          #     timestamp .pyc   0.21-0.22s   <- no benefit whatsoever
          #     unchecked-hash   0.12s
          #
          # Runs AFTER everything is assembled and after the __pycache__ trim above,
          # or the trim would delete exactly what this produces.
          # Through uv, NOT a bare `python`. This job installs uv with
          # `python-version: 3.13` and never runs actions/setup-python, so there is
          # no `python` on PATH at all: the self-hosted runners carry python3 only.
          # It died `python: command not found`, exit 127, AFTER a successful build
          # and after the core version had already been baked in — so the deploy read
          # as a versioning problem twice over (#414) rather than a missing
          # interpreter. GitHub-hosted images ship python-is-python3, which is why
          # this survived until the estate moved onto its own runners.
          #
          # `--no-project` because this step runs in the api-service artifact dir;
          # without it uv walks up, finds the repo pyproject.toml and tries to sync a
          # project that has nothing to do with the package being built.
          #
          # The version must match the LAMBDA runtime, not merely be importable: an
          # unchecked-hash .pyc built by the wrong minor is silently ignored at
          # runtime — a green build that quietly loses the optimisation this line
          # exists for. Pinned to the same 3.13 as this job setup-uv step, and
          # workflow-python-interpreter.test.ts fails if the two ever drift apart.
          uv run --no-project --python 3.13 python -m compileall -q --invalidation-mode unchecked-hash package
          # Guard the size, because the trim above exists for a reason (#724).
          #
          # Bytecode adds ~56% to the zip (17.8 -> 27.8 MB measured on this
          # template). update-function-code base64-encodes the body at ~1.33x
          # against a ~70MB request cap, so the template lands at ~37MB with ~33MB
          # spare — but an instance carrying heavy native deps has less. Failing here
          # with the numbers beats update-function-code failing opaquely after the
          # upload, which is the shape this comment block is already about.
          zipped=$(cd package && zip -qr ../lambda.zip . && stat -c%s ../lambda.zip)
          request_mb=$(awk -v b="$zipped" 'BEGIN{printf "%.1f", b*1.33/1048576}')
          echo "Package: $(awk -v b="$zipped" 'BEGIN{printf "%.1f", b/1048576}')MB zipped, ~${request_mb}MB as a base64 request body"
          # Over the cap, DEGRADE before failing: bytecode is an optimisation, and a
          # slower cold start beats an instance that cannot deploy at all. Dropping
          # it costs ~2.5s on a cold invoke and ~56% of the zip, and the deployed
          # code is byte-for-byte the same either way.
          #
          # This exists because tabsii-platform outgrew the inline cap -- 60.3MB
          # zipped, ~80.2MB as a request body -- and the guard failed the deploy
          # outright, which left the instance's /health reporting a version 173
          # releases old with every merged change unshipped. The fallback is not the
          # real fix (that is an S3-based update, which lifts the ceiling to 250MB
          # unzipped and needs an artifacts bucket that does not exist yet); it is
          # what stops a size ceiling being an outage in the meantime.
          # Prefer S3 (#994). update-function-code --zip-file sends the package INLINE,
          # base64-encoded at ~1.33x against a ~70MB request cap; via S3 the ceiling is
          # 250MB unzipped and bytecode never has to be sacrificed to fit.
          #
          # Gated on the bucket EXISTING, not merely on the variable being set, and
          # that is the whole ordering story: a core upgrade lands this workflow and
          # the bucket's Terraform in one PR, and nothing orders Deploy Application
          # after Deploy Infrastructure. Without the head-bucket probe the first
          # upgrade would trade a size failure for a missing-bucket failure. Same
          # shape as the plugin frontend loop below, for the same reason.
          artifacts_bucket="${{ vars.ARTIFACTS_BUCKET_NAME }}"
          if [ -n "$artifacts_bucket" ] && aws s3api head-bucket --bucket "$artifacts_bucket" 2>/dev/null; then
            key="core-api/${GITHUB_SHA}.zip"
            echo "Uploading via s3://$artifacts_bucket/$key (bytecode kept)"
            aws s3 cp lambda.zip "s3://$artifacts_bucket/$key" --only-show-errors
            use_s3=1
          else
            use_s3=""
            if [ -n "$artifacts_bucket" ]; then
              echo "::warning::ARTIFACTS_BUCKET_NAME is set but $artifacts_bucket does not exist yet — run Deploy Infrastructure. Falling back to an inline upload." >&2
            else
              echo "ARTIFACTS_BUCKET_NAME unset; inline upload. Run Deploy Infrastructure to enable S3 (#994)."
            fi
          fi

          # Inline only: degrade before failing. Bytecode is an optimisation, and a
          # slower cold start beats an instance that cannot deploy at all -- the
          # deployed code is byte-for-byte identical either way. Not reached on the
          # S3 path, which is the point of doing this at all.
          if [ -z "$use_s3" ] && awk -v m="$request_mb" 'BEGIN{exit !(m > 60)}'; then
            echo "::warning::~${request_mb}MB exceeds the inline cap; dropping bytecode and retrying." >&2
            find package -name '__pycache__' -type d -prune -exec rm -rf {} + 2>/dev/null || true
            rm -f lambda.zip
            zipped=$(cd package && zip -qr ../lambda.zip . && stat -c%s ../lambda.zip)
            request_mb=$(awk -v b="$zipped" 'BEGIN{printf "%.1f", b*1.33/1048576}')
            echo "Without bytecode: $(awk -v b="$zipped" 'BEGIN{printf "%.1f", b/1048576}')MB zipped, ~${request_mb}MB as a request body"
            echo "::warning::Cold start is ~2.5s slower until Deploy Infrastructure provisions the artifacts bucket (#994)." >&2
          fi
          # Still over without bytecode means the package itself is too big, and no
          # amount of not-precompiling saves it. Fail loudly rather than let
          # update-function-code reject it opaquely after the upload.
          if [ -z "$use_s3" ] && awk -v m="$request_mb" 'BEGIN{exit !(m > 60)}'; then
            echo "::error::Lambda package is ~${request_mb}MB as a base64 request body even without bytecode, against a ~70MB cap." >&2
            echo "Move this function to an S3-based update (250MB unzipped) or drop a heavy" >&2
            echo "dependency. Do not raise this threshold without measuring the real cap." >&2
            exit 1
          fi
          # --output text --query 'LastUpdateStatus' suppresses the CLI's default
          # output, which is the *entire* function configuration as JSON —
          # including Environment.Variables (the master DATABASE_URL and, since
          # #253, BIFFO_APP_DATABASE_URL) in plaintext. Printing that leaked live
          # DB credentials into the Actions log (#334). The response is unused —
          # the wait below is what gates progress — so narrowing it to the status
          # string loses nothing.
          if [ -n "$use_s3" ]; then
            aws lambda update-function-code \
              --function-name ${{ vars.CORE_API_LAMBDA_NAME }} \
              --s3-bucket "$artifacts_bucket" --s3-key "$key" \
              --output text --query 'LastUpdateStatus'
          else
            aws lambda update-function-code \
              --function-name ${{ vars.CORE_API_LAMBDA_NAME }} \
              --zip-file fileb://lambda.zip \
              --output text --query 'LastUpdateStatus'
          fi
      - name: Initialise database schema
        run: |
          aws lambda wait function-updated \
            --function-name ${{ vars.CORE_API_LAMBDA_NAME }}
          RESULT=$(aws lambda invoke \
            --function-name ${{ vars.CORE_API_LAMBDA_NAME }} \
            --payload '{"source":"biffo:db-init"}' \
            --cli-binary-format raw-in-base64-out \
            db-init-response.json)
          if echo "$RESULT" | grep -q FunctionError; then
            echo "Schema init failed:" && cat db-init-response.json && exit 1
          fi
          # Echo the response on success too. It carries the app_role result
          # (#253): {"bootstrapped": true, "role": "biffo_app", "schemas": [...]}
          # when the least-privilege role was created and granted. A
          # "bootstrapped": false with reason "no-app-credential" means the
          # environment has not been re-applied and the request path is still
          # falling back to the owner/master role -- which is serving traffic,
          # so it is not a deploy failure, but it is not the intended posture
          # either. This is the only place that distinction is visible.
          echo "db-init response:" && cat db-init-response.json && echo
      # Apply every vendored DDL import (ADR-0005) after the Alembic schema init.
      # Like db-init runs the Core's own migrations, this runs biffo:ddl-import for
      # each db/imports/<name>/ dir — new .sql files (schema additions, seeds) apply
      # automatically on deploy instead of needing a manual invoke. Idempotent:
      # already-applied files are skipped via ddl_import_history.
      - name: Apply DDL imports
        run: |
          shopt -s nullglob
          for import_dir in db/imports/*/; do
            name=$(basename "$import_dir")
            echo "Applying DDL import: $name"
            RESULT=$(aws lambda invoke \
              --function-name ${{ vars.CORE_API_LAMBDA_NAME }} \
              --payload "{\"source\":\"biffo:ddl-import\",\"directory\":\"$name\"}" \
              --cli-binary-format raw-in-base64-out \
              ddl-import-response.json)
            if echo "$RESULT" | grep -q FunctionError; then
              echo "DDL import $name failed:" && cat ddl-import-response.json && exit 1
            fi
            cat ddl-import-response.json
          done
      # Package and deploy the isolated PR-signer Lambda (ADR-0008), only when
      # the instance has provisioned one (enable_pr_signer surfaces its function
      # name as PR_SIGNER_LAMBDA_NAME). Unlike the Core API above, this packages
      # straight from the checkout, not the api-service artifact: the signer
      # depends on the workspace SDK (packages/python-sdk), which the artifact
      # doesn't carry. Third-party deps come from the workspace lock (excluding
      # workspace members, hence --no-emit-workspace/--no-emit-project); the SDK
      # itself is installed from source with --no-deps.
      - name: Package and deploy PR-signer Lambda
        if: vars.PR_SIGNER_LAMBDA_NAME != ''
        run: |
          uv export --package biffo-pr-signer --no-dev --frozen \
            --no-emit-workspace --no-emit-project \
            --output-file pr-signer-requirements.txt
          uv pip install -r pr-signer-requirements.txt --target pr-signer-package/
          uv pip install ./packages/python-sdk --target pr-signer-package/ --no-deps
          cp -r services/pr-signer/src pr-signer-package/
          cd pr-signer-package && zip -r ../pr-signer-lambda.zip .
          cd ..
          # --output text --query 'LastUpdateStatus' suppresses the default full
          # function-config JSON (env vars in plaintext) — see #334.
          aws lambda update-function-code \
            --function-name ${{ vars.PR_SIGNER_LAMBDA_NAME }} \
            --zip-file fileb://pr-signer-lambda.zip \
            --output text --query 'LastUpdateStatus'
          aws lambda wait function-updated \
            --function-name ${{ vars.PR_SIGNER_LAMBDA_NAME }}
      # Package and deploy each enabled plugin's own Lambda (ADR-0003, #196).
      # deploy-infra (running in parallel) creates the function from a placeholder
      # zip with ignore_changes on its code; this step ships the real handler. A
      # plugin owns a Lambda once its terraform module is installed at
      # modules/plugins/<name>/. The function name is <project>-<env>-plugin-<name>,
      # derived from the Core API Lambda name (strip -core-api) so no extra var is
      # needed. Packaged from the checkout like the PR-signer: third-party deps from
      # the workspace lock (workspace members excluded), the SDK from source, and the
      # plugin's own src/ at the package root to match the <name>.main.handler; the
      # manifest is bundled at the task root (the plugin's manifest.py walks up to it).
      - name: Package and deploy plugin Lambdas
        run: |
          set -euo pipefail
          shopt -s nullglob
          prefix='${{ vars.CORE_API_LAMBDA_NAME }}'
          prefix="${prefix%-core-api}"
          # Both plugin channels (see the manifest-bundling loop above); the
          # terraform module and Lambda name are resolved by plugin *name*
          # (basename of the plugin dir), so the source channel is immaterial here.
          for manifest in services/*/biffo.plugin.json services/_plugins/*/biffo.plugin.json; do
            plugin_dir="$(dirname "$manifest")"
            name="$(basename "$plugin_dir")"
            # Wired means: a copied module (third-party) OR terraform/ beside the
            # plugin (first-party, referenced in place since #406). Checking only
            # modules/plugins/ silently stopped shipping first-party plugin code
            # the moment their dead copies were deleted.
            [ -d "modules/plugins/$name" ] || [ -d "$plugin_dir/terraform" ] || { echo "skip $name (no terraform module)"; continue; }
            fn="${prefix}-plugin-${name}"
            echo "::group::plugin $name -> $fn"
            # Ground truth for "provisioned in this env" is whether the Lambda
            # exists, so check once and skip immediately if it does not (#449).
            #
            # This used to wait 30×10s for the function to appear, on the theory
            # that a concurrent infra deploy was creating it. But a first-party
            # plugin's terraform ships to every instance while its Lambda exists
            # only where the env wired `module "plugin_<name>"` into its
            # (user-owned) infra — so for any instance not running that plugin,
            # the wait always ran out the full ~5.5 min per plugin, on every
            # deploy, for a function that would never appear (observed on
            # biffo-platform: ~11 min/deploy, then skipped anyway).
            #
            # The race barely exists in practice: enabling a plugin edits
            # infra/environments/** only, so it triggers Deploy Infrastructure —
            # not this app workflow — and infra creates the Lambda with a
            # placeholder zip (compute module, ignore_changes on the code). Its
            # real code is loaded by the next app deploy regardless. Waiting here
            # is what the "this job never runs infra and must not wait for it"
            # contract above already says it should not do.
            if ! aws lambda get-function --function-name "$fn" >/dev/null 2>&1; then
              echo "$fn does not exist — plugin not provisioned in this env; skipping."
              echo "(If you just enabled it, its infra apply creates the Lambda; re-run this deploy to load its code.)"
              echo "::endgroup::"; continue
            fi
            pkg_name="$(sed -n 's/^name *= *"\(.*\)".*/\1/p' "$plugin_dir/pyproject.toml" | head -1)"
            rm -rf "plugin-$name-package"
            uv export --package "$pkg_name" --no-dev --frozen \
              --no-emit-workspace --no-emit-project \
              --output-file "plugin-$name-requirements.txt"
            uv pip install -r "plugin-$name-requirements.txt" --target "plugin-$name-package/"
            uv pip install ./packages/python-sdk --target "plugin-$name-package/" --no-deps
            cp -r "$plugin_dir"/src/. "plugin-$name-package/"
            cp "$manifest" "plugin-$name-package/biffo.plugin.json"
            (cd "plugin-$name-package" && zip -rq "../plugin-$name.zip" .)
            # --output text --query 'LastUpdateStatus' suppresses the default full
            # function-config JSON (a plugin Lambda's own secret env vars in
            # plaintext) — see #334.
            aws lambda update-function-code \
              --function-name "$fn" \
              --zip-file "fileb://plugin-$name.zip" \
              --output text --query 'LastUpdateStatus'
            aws lambda wait function-updated --function-name "$fn"
            echo "::endgroup::"
          done
      # Package and deploy the SHARED plugin host (ADR-0021, #545) — ONE Lambda
      # that runs every installed user-facing plugin's API behind the shared API
      # Gateway at /api/v1/plugins/*. It supersedes ADR-0018's per-plugin Lambda:
      # a plugin that declares user_ingress.app is pure code mounted here, not its
      # own function, so the per-plugin step above skips it (no terraform/ beside
      # it). The host function is <project>-<env>-plugin-host, created by
      # deploy-infra from the compute-module placeholder (ignore_changes on code);
      # this step ships the real code. Skipped where the host is not provisioned.
      - name: Package and deploy the shared plugin host
        run: |
          set -euo pipefail
          shopt -s nullglob
          prefix='${{ vars.CORE_API_LAMBDA_NAME }}'
          prefix="${prefix%-core-api}"
          fn="${prefix}-plugin-host"
          if ! aws lambda get-function --function-name "$fn" >/dev/null 2>&1; then
            echo "$fn does not exist — the shared plugin host is not provisioned in this env; skipping."
            exit 0
          fi
          pkg=plugin-host-package
          rm -rf "$pkg"
          # Host runtime: third-party deps from the workspace lock (workspace
          # members excluded), the SDK from source, and the host's own package at
          # the task root. The SDK[user-serving] extra's transitive deps (the JWT
          # verification the founder gate needs) are NOT workspace members, so the
          # export already carries them.
          uv export --package biffo-plugin-host --no-dev --frozen \
            --no-emit-workspace --no-emit-project \
            --output-file host-requirements.txt
          uv pip install -r host-requirements.txt --target "$pkg/"
          uv pip install ./packages/python-sdk --target "$pkg/" --no-deps
          cp -r services/_plugin-host/src/. "$pkg/"
          # Each user-facing plugin (a manifest with user_ingress.app) becomes pure
          # code inside the host: its package at the task root so load_app("<mod>:
          # <attr>") imports it, and its manifest under services/<name>/ so
          # discover_plugins() — which scans BIFFO_PLUGINS_ROOT=/var/task/services —
          # mounts it. Both plugin channels are covered, keyed on plugin name like
          # every other step here. A plugin's own workspace SDK dep is excluded from
          # its export; the host already installed the SDK above.
          mkdir -p "$pkg/services"
          for manifest in services/*/biffo.plugin.json services/_plugins/*/biffo.plugin.json; do
            jq -e '.user_ingress.app' "$manifest" >/dev/null 2>&1 || continue
            plugin_dir="$(dirname "$manifest")"
            name="$(basename "$plugin_dir")"
            echo "::group::host mount: $name"
            pkg_name="$(sed -n 's/^name *= *"\(.*\)".*/\1/p' "$plugin_dir/pyproject.toml" | head -1)"
            uv export --package "$pkg_name" --no-dev --frozen \
              --no-emit-workspace --no-emit-project \
              --output-file "host-$name-requirements.txt"
            uv pip install -r "host-$name-requirements.txt" --target "$pkg/"
            cp -r "$plugin_dir"/src/. "$pkg/"
            mkdir -p "$pkg/services/$name"
            cp "$manifest" "$pkg/services/$name/biffo.plugin.json"
            # admin_ingress's built UI shell (biffo-template#627/#632) is served
            # by this same Lambda, read from services/<name>/web-admin/dist via
            # BIFFO_PLUGINS_ROOT -- build it here (same pnpm shape as the
            # plugin-frontend step below) and copy the output in. Skipped if the
            # plugin declares no admin_ingress.
            #
            # Declaring admin_ingress WITHOUT a web-admin/ is a misconfiguration,
            # not a variant to tolerate. This condition used to be a single
            # `&&`, so that combination skipped the build silently and the
            # deploy reported success -- the plugin then 404'd on GET /admin/,
            # and a CDN rule rewrote that 404 into the marketing portal's HTML,
            # so the visible symptom was an admin URL apparently serving an
            # unauthenticated page (biffo-plugin-idea-scout#22; #647 for the
            # rewrite). Nothing anywhere reported that the UI had not been built.
            #
            # Same fail-open shape as the audit gates in #591/#644: the step
            # could not do its job and passed anyway.
            if jq -e '.admin_ingress' "$manifest" >/dev/null 2>&1; then
              if [ ! -d "$plugin_dir/web-admin" ]; then
                echo "::error file=$manifest::Plugin '$name' declares admin_ingress but has no web-admin/ directory. The admin UI cannot be built, so GET /admin/ would 404 at runtime. Either add web-admin/ or remove admin_ingress from the manifest."
                exit 1
              fi
              (
                cd "$plugin_dir/web-admin"
                pnpm install --ignore-workspace --frozen-lockfile
                pnpm run build
              )
              mkdir -p "$pkg/services/$name/web-admin"
              cp -r "$plugin_dir/web-admin/dist" "$pkg/services/$name/web-admin/dist"
            fi
            echo "::endgroup::"
          done
          # Trim runtime-provided and dead weight so the zip fits the direct
          # update-function-code limit (see the Core API step for the rationale).
          (
            cd "$pkg"
            rm -rf boto3 botocore s3transfer \
                   boto3-*.dist-info botocore-*.dist-info s3transfer-*.dist-info
            find . -type d -name __pycache__ -prune -exec rm -rf {} +
            find . -type d -name tests -prune -exec rm -rf {} +
          )
          (cd "$pkg" && zip -rq ../plugin-host.zip .)
          # --output text --query 'LastUpdateStatus' suppresses the default full
          # function-config JSON (env vars in plaintext) — see #334.
          aws lambda update-function-code \
            --function-name "$fn" \
            --zip-file fileb://plugin-host.zip \
            --output text --query 'LastUpdateStatus'
          aws lambda wait function-updated --function-name "$fn"

      # Build and deploy each installed user-facing plugin's static frontend
      # (ADR-0018 §2 — the shape ADR-0021 reuses for the frontend until its own
      # shared app-shell lands, #558). Unlike the backend loop above, this is
      # keyed on user_frontend, not user_ingress — a plugin can ship a frontend
      # with no backend page (or vice versa). A plugin's own web/ isn't a pnpm
      # workspace member of this monorepo (services/<name>/web/ has its own
      # package.json + lockfile), so it needs its own install — --ignore-workspace,
      # or pnpm silently installs this repo's root deps and skips it entirely
      # (observed the hard way shipping ideation's frontend by hand: this
      # workflow never previously deployed a plugin frontend at all).
      - name: Build and deploy plugin frontends
        run: |
          set -euo pipefail
          shopt -s nullglob
          prefix='${{ vars.CORE_API_LAMBDA_NAME }}'
          prefix="${prefix%-core-api}"
          for manifest in services/*/biffo.plugin.json services/_plugins/*/biffo.plugin.json; do
            jq -e '.user_frontend' "$manifest" >/dev/null 2>&1 || continue
            plugin_dir="$(dirname "$manifest")"
            name="$(basename "$plugin_dir")"
            web_dir="$plugin_dir/web"
            [ -d "$web_dir" ] || { echo "skip $name (user_frontend declared but no web/ dir)"; continue; }
            bucket="${prefix}-plugin-${name}-web"
            if ! aws s3api head-bucket --bucket "$bucket" 2>/dev/null; then
              echo "$bucket does not exist — $name's frontend bucket not provisioned in this env; skipping."
              continue
            fi
            echo "::group::frontend $name -> $bucket"
            (
              cd "$web_dir"
              pnpm install --ignore-workspace --frozen-lockfile
              pnpm run build
            )
            # Same cache split as the portal sync above: hashed assets under
            # assets/ are immutable and keep the long cache; index.html changes
            # every deploy and must not be cached.
            aws s3 sync "$web_dir/dist/" "s3://$bucket/$name/" \
              --delete \
              --cache-control "public, max-age=31536000, immutable" \
              --exclude "index.html" \
              --exclude "*.txt"
            aws s3 sync "$web_dir/dist/" "s3://$bucket/$name/" \
              --delete \
              --cache-control "no-cache" \
              --exclude "*" \
              --include "index.html"
            echo "::endgroup::"
          done
      - name: Invalidate CloudFront for plugin frontends
        # Same fire-and-forget discipline as the portal's own invalidation step
        # above (#478) — this one covers content the portal's earlier
        # invalidation ran before, so it needs its own pass, not a duplicate of
        # the same one.
        continue-on-error: true
        timeout-minutes: 3
        run: |
          for attempt in 1 2 3; do
            if aws cloudfront create-invalidation \
              --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
              --paths "/*" \
              --cli-read-timeout 20 --cli-connect-timeout 10; then
              exit 0
            fi
            echo "CloudFront invalidation attempt ${attempt} failed; retrying..." >&2
            sleep 5
          done
          echo "::warning::CloudFront invalidation did not succeed; deploy continues (cache self-heals via TTL)."
