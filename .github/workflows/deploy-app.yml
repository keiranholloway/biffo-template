          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ vars.COGNITO_USER_POOL_ID }}
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
          NEXT_PUBLIC_COGNITO_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          NEXT_PUBLIC_API_URL: ${{ vars.API_GATEWAY_URL }}
        run: pnpm run build
      - uses: actions/upload-artifact@v4
        with:
          name: portal-build-prod
          path: apps/portal/out/
      - uses: actions/upload-artifact@v4
        with:
          name: api-service-prod
          path: services/api/

  deploy-prod:
    name: Deploy to prod
    runs-on: ubuntu-latest
    needs: build-prod
    environment: prod
    # See build-prod above — prod always requires an explicit workflow_dispatch.
    # (In practice this job only ever runs via needs: build-prod anyway once
    # that job is push-gated correctly, but stating it explicitly here too
    # means this condition is never misleading on its own.)
    if: vars.BIFFO_DEPLOY_ENABLED == 'true' && github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.BIFFO_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - uses: actions/download-artifact@v4
        with:
          name: portal-build-prod
          path: portal-dist/
      - name: Sync portal to S3
        run: |
          aws s3 sync portal-dist/ s3://${{ vars.PORTAL_BUCKET_NAME }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html"
          aws s3 sync portal-dist/ s3://${{ vars.PORTAL_BUCKET_NAME }}/ \
            --delete \
            --cache-control "no-cache" \
            --include "*.html"
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
      - uses: actions/download-artifact@v4
        with:
          name: api-service-prod
          path: api-service/
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'
      - name: Package and deploy Lambda
        working-directory: api-service
        run: |
          uv export --no-dev --output-file requirements.txt
          uv pip install -r requirements.txt --target package/
          cp -r src/ package/
          cp -r migrations/ package/
          cp alembic.ini package/
          # Bundle every installed plugin's manifest (services/*/biffo.plugin.json,
          # sibling to services/api/ in the full checkout) so discover_plugin_manifests()
          # can find them at runtime — the Lambda otherwise only ships services/api/
          # itself. See api.plugins module docstring for the read side of this.
          mkdir -p package/services
          for manifest in ../services/*/biffo.plugin.json; do
            [ -f "$manifest" ] || continue
            plugin_name=$(basename "$(dirname "$manifest")")
            mkdir -p "package/services/$plugin_name"
            cp "$manifest" "package/services/$plugin_name/"
          done
