name: Deploy Infrastructure

# biffo-template#1582 / #1701: a workflow_dispatch of THIS workflow always
# applies, and the dispatch API refuses any call that does not say so
# explicitly. Both of those are load-bearing; neither is sufficient alone.
#
# ## The original defect (#1582)
#
# This workflow accepted an `action` input (`plan` or `apply`) that
# **defaulted to `plan`**. Left at its default it applied nothing — but every
# job that WOULD have applied was `skipped` rather than `failed`, so the run's
# own `conclusion` was `success` either way. `conclusion` is the one field
# every external consumer of this workflow reads (the Actions list,
# branch-health.sh, a script, a dashboard), so a plan-only dispatch and a real
# apply were indistinguishable to anything that did not open the job list.
# Two mitigations shipped first — a run-name spelling out PLAN ONLY vs APPLY
# (#1678), and a `deploy-outcome` job posting a warning — and neither could
# touch `conclusion`: the warning job was deliberately `continue-on-error:
# true` so a legitimate dry run would not read as a branch break, which is
# exactly what left the run-level rollup `success` regardless.
#
# ## Why the input is not simply deleted (#1701)
#
# Deleting it outright does fix #1582, and introduces its mirror image. The
# *old* dispatch shape — `gh workflow run deploy-infra.yml -f environment=dev`,
# relying on the removed `plan` default — was then silently accepted and run as
# an unconditional apply (measured: run 32601969875, `displayTitle: "Deploy
# Infrastructure — APPLY dev"`). "Meant to preview, actually applied" is a
# one-way door against live infrastructure and is strictly worse than the bug
# it replaced.
#
# ## The contract: fail closed at the API
#
#   action:  required: true, type: choice, options: [apply], and NO default
#
# GitHub enforces both halves of that when the dispatch is created, before a
# run exists. Measured against this repo on 2026-08-22:
#
#   gh workflow run deploy-infra.yml -f environment=dev
#     -> HTTP 422: Required input 'action' not provided
#   gh workflow run deploy-infra.yml -f environment=dev -f action=plan
#     -> HTTP 422: Provided value 'plan' for input 'action' not in the list of
#        allowed values
#
# So a caller who meant to preview gets a hard error and no run — never an
# apply. A caller who means to apply passes `action=apply`, exactly as before,
# and nothing changes for them. There is still no input value that produces a
# plan-only run of THIS workflow, so `conclusion: success` here can still only
# mean "applied". Both properties hold at once, which is the whole point.
#
# ## Deliberately NOT done
#
# No job below carries `if: ... inputs.action == 'apply'`. That would reinstate
# #1582 exactly: a dispatch carrying the wrong value would SKIP every job and
# the run would conclude `success` having applied nothing. Fail-closed here
# means "no run at all", or "a run that FAILED" — never "a green run that
# skipped". `deploy-infra-dispatch-contract.test.ts` asserts that absence, and
# asserts the input keeps `required: true`, no `default:`, and `[apply]` as its
# only option, because those three lines are the entire enforcement.
#
# A plan-only preview lives in the separate `deploy-infra-plan.yml`, which can
# never apply anything by construction, so its own `conclusion: success` is
# equally unambiguous ("planned" is all it ever claims).
run-name: >-
  Deploy Infrastructure —
  ${{
    github.event_name == 'workflow_dispatch'
      && format('APPLY {0}', github.event.inputs.environment)
      || 'apply (push-triggered)'
  }}

on:
  push:
    branches: [dev, staging, main]
    paths:
      - 'infra/**'
      - 'modules/**'
      # A first-party plugin's own Terraform (template-owned per
      # core-manifest.json, referenced in place by infra/environments/*/main.tf
      # — ADR-0003 §2 / #406) is a real infra change needing `terraform apply`,
      # but doesn't touch infra/** or modules/** — so without this it silently
      # never triggers a deploy, even though "Deploy Application" still runs
      # and merges/CI look complete (#608).
      - 'services/_plugins/*/terraform/**'
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [dev, staging, prod]
      action:
        # Fail closed — see this file's header. `required: true` with NO
        # `default:` makes an omitted value a 422; `options: [apply]` makes any
        # other value a 422. Both are enforced by the dispatch API before a run
        # exists, so a caller who meant to preview cannot reach an apply.
        # Do not add a `default:`, do not add a second option, and do not gate
        # any job on this value with an `if:`.
        description: Must be `apply` — this workflow only applies. For a preview that applies nothing, run "Deploy Infrastructure Plan".
        required: true
        type: choice
        options: [apply]

# Never cancel-in-progress here (unlike ci.yml) — this workflow runs
# `terraform apply`. Cancelling mid-apply can leave real infrastructure
# half-applied, which is worse than just queuing a second trigger behind
# the first (e.g. a push landing right after a manual re-run for the same
# environment). Every dispatch of this workflow now applies (see above), so
# that is true of every run it produces, not just push-triggered ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: '~> 1.9'
  # Defence in depth for the class of bug in #322: an interactive Terraform
  # prompt on a CI runner has no stdin to read and blocks until the job is
  # killed. Every invocation also passes -input=false explicitly and a drift
  # guard enforces that; this is the backstop for one added without it.
  TF_INPUT: '0'

permissions:
  id-token: write
  contents: read
  pull-requests: write
  actions: write

# Deploy jobs only run in repos where BIFFO_DEPLOY_ENABLED=true has been set.
# The template repo itself has this unset, so all jobs are skipped there.
#
# Branch → environment mapping:
#   dev     → dev environment     (dev.domain.com)
#   staging → staging environment (staging.domain.com)
#   main    → prod environment    (domain.com)

# ─── DEV ─────────────────────────────────────────────────────────────────────
# Auto-deploys on push to dev branch; manual via workflow_dispatch.

jobs:
  plan-dev:
    name: Plan (dev)
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    environment: dev
    if: vars.BIFFO_DEPLOY_ENABLED == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/dev') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev'))
    defaults:
      run:
        working-directory: infra/environments/dev
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.BIFFO_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Generate backend config
        run: |
          cat > backend.hcl << 'EOF'
          bucket = "${{ vars.TF_STATE_BUCKET }}"
          key    = "dev/terraform.tfstate"
          region = "${{ vars.AWS_REGION || 'us-east-1' }}"
          EOF
      - run: terraform init -input=false -backend-config=backend.hcl
        timeout-minutes: 10
      - run: terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan.txt
        timeout-minutes: 20
        env:
          TF_VAR_project_name: ${{ vars.PROJECT_NAME }}
          TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
          TF_VAR_admin_email: ${{ vars.BIFFO_ADMIN_EMAIL }}
          TF_VAR_admin_username: ${{ vars.BIFFO_ADMIN_USERNAME }}
          TF_VAR_domain: ${{ vars.DOMAIN }}
          TF_VAR_custom_domain: ${{ vars.CUSTOM_DOMAIN }}
          TF_VAR_acm_certificate_arn: ${{ vars.ACM_CERTIFICATE_ARN }}
          TF_VAR_hosted_zone_id: ${{ vars.HOSTED_ZONE_ID }}
          # biffo-template#1574. Published by deploy-global.yml's "Export
          # outputs" step, exactly like ACM_CERTIFICATE_ARN above and for the
          # same reason: Lambda@Edge functions must live in us-east-1, so this
          # one is created in the global stack and its qualified ARN threaded
          # into the regional one. Without this line #1529's fix ships inert —
          # the CDN module defaults the variable to "" and every API 403/404
          # keeps returning the portal's index.html.
          #
          # Empty is the SAFE state, not merely the old one: the module gates
          # the origin-response demote AND the viewer-response restore on this
          # single variable, so neither half can arm without the other. Demote
          # alone would return HTTP 200 on real API errors, which is worse than
          # the bug this fixes. See modules/cloud/aws/cdn/variables.tf and
          # cli/src/lib/cdn-error-status-coupling.test.ts.
          TF_VAR_error_status_restore_lambda_arn: ${{ vars.ERROR_STATUS_RESTORE_LAMBDA_ARN }}
          # Endpoint control plane / PR-signer (ADR-0008). All default to empty
          # or false, so a deployment that has not set these GitHub variables is
          # unaffected — but without passing them, an instance could not enable
          # the feature the template already ships (#458, backported from tabsii).
          TF_VAR_enable_pr_signer: ${{ vars.ENABLE_PR_SIGNER || 'false' }}
          TF_VAR_pr_signer_github_app_id: ${{ vars.PR_SIGNER_GITHUB_APP_ID }}
          TF_VAR_pr_signer_github_installation_id: ${{ vars.PR_SIGNER_GITHUB_INSTALLATION_ID }}
          TF_VAR_pr_signer_repo_owner: ${{ vars.PR_SIGNER_REPO_OWNER }}
          TF_VAR_pr_signer_repo_name: ${{ vars.PR_SIGNER_REPO_NAME }}
          TF_VAR_pr_signer_base_branch: ${{ vars.PR_SIGNER_BASE_BRANCH || 'dev' }}

      # Refuse a plan that destroys stateful infrastructure without saying so
      # (#387). Runs in the PLAN job, before Apply, so a refusal costs nothing —
      # nothing has been touched yet. Apply is --auto-approve, so this is the
      # only point where a human decision can still be required.
      #
      # Bare node, no pnpm install: this job sets up Terraform and AWS and
      # nothing else, and the guard has no dependencies precisely so three plan
      # jobs need not each install one.
      - name: Destructive-plan guard
        run: |
          terraform show -json tfplan > plan.json
          node "$GITHUB_WORKSPACE/scripts/check-destructive-plan.mjs" plan.json
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}

      # Carry the plan the guard just inspected across to the apply job (#1148),
      # so the thing applied is the thing that was reviewed.
      #
      # Retention is deliberately minimal: a Terraform plan file embeds variable
      # values and resolved resource attributes, so it is sensitive and must not
      # outlive the run that needs it. `if-no-files-found: error` because a
      # missing plan must fail here rather than let the apply job fall back to
      # computing its own -- which is the entire defect this fixes.
      - uses: actions/upload-artifact@v5
        with:
          name: tfplan-dev
          path: infra/environments/dev/tfplan
          retention-days: 1
          if-no-files-found: error

      # Carry whatever `.build/` files this plan generated across to the apply
      # job too (#1663). `archive_file` data sources materialise
      # `./.build/<name>.zip` at PLAN time in the plan job's own workspace;
      # `apply-dev` runs in a separate workspace and needs those same bytes,
      # not just `tfplan`'s hash of them -- transporting `tfplan` alone (#1148)
      # solved that one artifact, not the general "apply needs every plan-time
      # input" problem. Uploading the whole directory rather than naming files
      # keeps this automatic for any archive_file an instance adds later -- a
      # hand-maintained file list mirroring a computable fact is the defect
      # named in #744.
      #
      # `if-no-files-found: ignore`, unlike the plan upload above: most
      # environments' Terraform has no archive_file at all, so no `.build/`
      # is ever produced, and that absence is normal rather than a failure.
      - uses: actions/upload-artifact@v5
        with:
          name: tfbuild-dev
          path: infra/environments/dev/.build/
          retention-days: 1
          if-no-files-found: ignore
          # actions/upload-artifact excludes dotfiles/dot-directories by
          # default (include-hidden-files defaults to false), and .build/ IS
          # a dot-directory -- the exclusion applies to the search-path root
          # itself, not just nested descendants, so with the default this
          # step silently uploaded NOTHING even when .build/ held real
          # archive_file zips. filesToUpload.length === 0 combined with
          # if-no-files-found: ignore above logs "No files were found" and
          # exits success, indistinguishable from the legitimate "no
          # archive_file in this env" case -- so apply-dev's paired
          # download-artifact never restored .build/ and `terraform apply`
          # failed with the exact "no such file or directory" this workflow
          # exists to prevent (run 32265569287, biffo-template#1774). Same
          # class already fixed once for a NESTED hidden dir in
          # deploy-app.yml's portal-build upload (#1159); this one is the
          # artifact ROOT being hidden, so nothing survived at all.
          include-hidden-files: true
  apply-dev:
    name: Apply (dev)
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    environment: dev
    needs: plan-dev
    if: vars.BIFFO_DEPLOY_ENABLED == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/dev') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev'))
    defaults:
      run:
        working-directory: infra/environments/dev
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.BIFFO_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Generate backend config
        run: |
          cat > backend.hcl << 'EOF'
          bucket = "${{ vars.TF_STATE_BUCKET }}"
          key    = "dev/terraform.tfstate"
          region = "${{ vars.AWS_REGION || 'us-east-1' }}"
          EOF
      - run: terraform init -input=false -backend-config=backend.hcl
        timeout-minutes: 10
      # Apply the plan the guard inspected, never a fresh one (#1148).
      #
      # Until this, plan and apply ran as SEPARATE JOBS on separate runners and
      # `tfplan` was never transported, so `terraform apply -auto-approve`
      # recomputed a plan from scratch. `check-destructive-plan.mjs` therefore
      # inspected a plan that was then thrown away: the guard could not gate
      # what was actually applied, by construction, in all three environments.
      #
      # A saved plan carries every variable value, so no `TF_VAR_*` belongs here
      # -- they were removed rather than left inert and misleading. If state has
      # moved since the plan was taken, Terraform refuses the stale plan instead
      # of applying something nobody reviewed. That refusal is the point.
      - uses: actions/download-artifact@v5
        with:
          name: tfplan-dev
          # Relative to the workspace: `defaults.run.working-directory` governs
          # `run` steps only, never an action's own inputs.
          path: infra/environments/dev

      # Restore the plan-time `.build/` directory, if the plan produced one
      # (#1663) -- the upload is in plan-dev, right after the tfplan upload.
      # `if-no-artifact-found: ignore` mirrors that upload's
      # `if-no-files-found: ignore`: no artifact means the plan's Terraform
      # has no archive_file, which is the common case, not an error.
      - uses: actions/download-artifact@v5
        with:
          name: tfbuild-dev
          path: infra/environments/dev/.build
          if-no-artifact-found: ignore
      - run: terraform apply -input=false -auto-approve tfplan
        timeout-minutes: 45
      - name: Export outputs to GitHub Actions variables
        env:
          GH_TOKEN: ${{ secrets.BIFFO_GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh variable set API_GATEWAY_URL \
            --body "$(terraform output -raw api_gateway_url)" \
            --env dev
          gh variable set COGNITO_USER_POOL_ID \
            --body "$(terraform output -raw cognito_user_pool_id)" \
            --env dev
          gh variable set COGNITO_CLIENT_ID \
            --body "$(terraform output -raw cognito_client_id)" \
            --env dev
          gh variable set CORE_API_LAMBDA_NAME \
            --body "$(terraform output -raw core_api_lambda_name)" \
            --env dev
          gh variable set PORTAL_BUCKET_NAME \
            --body "$(terraform output -raw portal_bucket_name)" \
            --env dev
          # Consumed by deploy-app.yml to upload the Lambda package to S3 instead of
          # inlining it against a ~70MB request cap (#994). deploy-app FALLS BACK to an
          # inline upload when this is unset, which is what makes the ordering safe: a
          # core upgrade lands the workflow and the bucket in one PR, and nothing orders
          # Deploy Application after Deploy Infrastructure.
          gh variable set ARTIFACTS_BUCKET_NAME \
            --body "$(terraform output -raw artifacts_bucket_name)" \
            --env dev
          gh variable set CLOUDFRONT_DISTRIBUTION_ID \
            --body "$(terraform output -raw cloudfront_distribution_id)" \
            --env dev
          gh variable set PORTAL_URL \
            --body "$(terraform output -raw portal_url)" \
            --env dev
      - name: Publish runtime identity document (#403)
        # The core's identity, resolved at RUNTIME by the portal and every sibling
        # instead of baked into their bundles — so a Cognito pool replacement no
        # longer strands siblings on a dead pool (#400). Written from Terraform
        # outputs (the source of truth) to the portal bucket root; CloudFront
        # serves it from the short-TTL .well-known/* behaviour. Nothing here is
        # secret: every value already ships in plaintext in today's bundles.
        run: |
          IDENTITY="$(jq -n \
            --arg userPoolId "$(terraform output -raw cognito_user_pool_id)" \
            --arg clientId "$(terraform output -raw cognito_client_id)" \
            --arg region "${AWS_REGION:-us-east-1}" \
            --arg apiUrl "$(terraform output -raw api_gateway_url)" \
            --arg portalUrl "$(terraform output -raw portal_url)" \
            '{userPoolId: $userPoolId, clientId: $clientId, region: $region, apiUrl: $apiUrl, portalUrl: $portalUrl}')"
          echo "$IDENTITY" | aws s3 cp - \
            "s3://$(terraform output -raw portal_bucket_name)/.well-known/biffo-identity.json" \
            --content-type application/json \
            --cache-control "max-age=60"

  # ─── STAGING ─────────────────────────────────────────────────────────────────
  # Auto-deploys on push to staging branch; manual via workflow_dispatch.

  plan-staging:
    name: Plan (staging)
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    environment: staging
    if: vars.BIFFO_DEPLOY_ENABLED == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/staging') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging'))
    defaults:
      run:
        working-directory: infra/environments/staging
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.BIFFO_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Generate backend config
        run: |
          cat > backend.hcl << 'EOF'
          bucket = "${{ vars.TF_STATE_BUCKET }}"
          key    = "staging/terraform.tfstate"
          region = "${{ vars.AWS_REGION || 'us-east-1' }}"
          EOF
      - run: terraform init -input=false -backend-config=backend.hcl
        timeout-minutes: 10
      - run: terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan.txt
        timeout-minutes: 20
        env:
          TF_VAR_project_name: ${{ vars.PROJECT_NAME }}
          TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
          TF_VAR_admin_email: ${{ vars.BIFFO_ADMIN_EMAIL }}
          TF_VAR_admin_username: ${{ vars.BIFFO_ADMIN_USERNAME }}
          TF_VAR_domain: ${{ vars.DOMAIN }}
          TF_VAR_custom_domain: ${{ vars.CUSTOM_DOMAIN }}
          TF_VAR_acm_certificate_arn: ${{ vars.ACM_CERTIFICATE_ARN }}
          TF_VAR_hosted_zone_id: ${{ vars.HOSTED_ZONE_ID }}
          # biffo-template#1574. Published by deploy-global.yml's "Export
          # outputs" step, exactly like ACM_CERTIFICATE_ARN above and for the
          # same reason: Lambda@Edge functions must live in us-east-1, so this
          # one is created in the global stack and its qualified ARN threaded
          # into the regional one. Without this line #1529's fix ships inert —
          # the CDN module defaults the variable to "" and every API 403/404
          # keeps returning the portal's index.html.
          #
          # Empty is the SAFE state, not merely the old one: the module gates
          # the origin-response demote AND the viewer-response restore on this
          # single variable, so neither half can arm without the other. Demote
          # alone would return HTTP 200 on real API errors, which is worse than
          # the bug this fixes. See modules/cloud/aws/cdn/variables.tf and
          # cli/src/lib/cdn-error-status-coupling.test.ts.
          TF_VAR_error_status_restore_lambda_arn: ${{ vars.ERROR_STATUS_RESTORE_LAMBDA_ARN }}
          # Endpoint control plane / PR-signer (ADR-0008). All default to empty
          # or false, so a deployment that has not set these GitHub variables is
          # unaffected — but without passing them, an instance could not enable
          # the feature the template already ships (#458, backported from tabsii).
          TF_VAR_enable_pr_signer: ${{ vars.ENABLE_PR_SIGNER || 'false' }}
          TF_VAR_pr_signer_github_app_id: ${{ vars.PR_SIGNER_GITHUB_APP_ID }}
          TF_VAR_pr_signer_github_installation_id: ${{ vars.PR_SIGNER_GITHUB_INSTALLATION_ID }}
          TF_VAR_pr_signer_repo_owner: ${{ vars.PR_SIGNER_REPO_OWNER }}
          TF_VAR_pr_signer_repo_name: ${{ vars.PR_SIGNER_REPO_NAME }}
          TF_VAR_pr_signer_base_branch: ${{ vars.PR_SIGNER_BASE_BRANCH || 'dev' }}

      # Refuse a plan that destroys stateful infrastructure without saying so
      # (#387). Runs in the PLAN job, before Apply, so a refusal costs nothing —
      # nothing has been touched yet. Apply is --auto-approve, so this is the
      # only point where a human decision can still be required.
      #
      # Bare node, no pnpm install: this job sets up Terraform and AWS and
      # nothing else, and the guard has no dependencies precisely so three plan
      # jobs need not each install one.
      - name: Destructive-plan guard
        run: |
          terraform show -json tfplan > plan.json
          node "$GITHUB_WORKSPACE/scripts/check-destructive-plan.mjs" plan.json
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}

      # Carry the plan the guard just inspected across to the apply job (#1148),
      # so the thing applied is the thing that was reviewed.
      #
      # Retention is deliberately minimal: a Terraform plan file embeds variable
      # values and resolved resource attributes, so it is sensitive and must not
      # outlive the run that needs it. `if-no-files-found: error` because a
      # missing plan must fail here rather than let the apply job fall back to
      # computing its own -- which is the entire defect this fixes.
      - uses: actions/upload-artifact@v5
        with:
          name: tfplan-staging
          path: infra/environments/staging/tfplan
          retention-days: 1
          if-no-files-found: error

      # Carry whatever `.build/` files this plan generated across to the apply
      # job too (#1663) -- see the matching comment in plan-dev for the full
      # explanation. `if-no-files-found: ignore`: most environments' Terraform
      # has no archive_file at all, so no `.build/` is ever produced.
      - uses: actions/upload-artifact@v5
        with:
          name: tfbuild-staging
          path: infra/environments/staging/.build/
          retention-days: 1
          if-no-files-found: ignore
          # See the matching comment on tfbuild-dev in plan-dev -- .build/ is
          # a dot-directory and upload-artifact excludes it by default (root
          # included, not just nested descendants), which silently uploaded
          # nothing even when real archive_file zips existed
          # (biffo-template#1774).
          include-hidden-files: true
  apply-staging:
    name: Apply (staging)
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    environment: staging
    needs: plan-staging
    if: vars.BIFFO_DEPLOY_ENABLED == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/staging') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging'))
    defaults:
      run:
        working-directory: infra/environments/staging
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.BIFFO_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Generate backend config
        run: |
          cat > backend.hcl << 'EOF'
          bucket = "${{ vars.TF_STATE_BUCKET }}"
          key    = "staging/terraform.tfstate"
          region = "${{ vars.AWS_REGION || 'us-east-1' }}"
          EOF
      - run: terraform init -input=false -backend-config=backend.hcl
        timeout-minutes: 10
      # Apply the plan the guard inspected, never a fresh one (#1148).
      #
      # Until this, plan and apply ran as SEPARATE JOBS on separate runners and
      # `tfplan` was never transported, so `terraform apply -auto-approve`
      # recomputed a plan from scratch. `check-destructive-plan.mjs` therefore
      # inspected a plan that was then thrown away: the guard could not gate
      # what was actually applied, by construction, in all three environments.
      #
      # A saved plan carries every variable value, so no `TF_VAR_*` belongs here
      # -- they were removed rather than left inert and misleading. If state has
      # moved since the plan was taken, Terraform refuses the stale plan instead
      # of applying something nobody reviewed. That refusal is the point.
      - uses: actions/download-artifact@v5
        with:
          name: tfplan-staging
          # Relative to the workspace: `defaults.run.working-directory` governs
          # `run` steps only, never an action's own inputs.
          path: infra/environments/staging

      # Restore the plan-time `.build/` directory, if the plan produced one
      # (#1663) -- see the matching comment in apply-dev. `if-no-artifact-found:
      # ignore` mirrors the upload's `if-no-files-found: ignore`.
      - uses: actions/download-artifact@v5
        with:
          name: tfbuild-staging
          path: infra/environments/staging/.build
          if-no-artifact-found: ignore
      - run: terraform apply -input=false -auto-approve tfplan
        timeout-minutes: 45
      - name: Export outputs to GitHub Actions variables
        env:
          GH_TOKEN: ${{ secrets.BIFFO_GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh variable set API_GATEWAY_URL \
            --body "$(terraform output -raw api_gateway_url)" \
            --env staging
          gh variable set COGNITO_USER_POOL_ID \
            --body "$(terraform output -raw cognito_user_pool_id)" \
            --env staging
          gh variable set COGNITO_CLIENT_ID \
            --body "$(terraform output -raw cognito_client_id)" \
            --env staging
          gh variable set CORE_API_LAMBDA_NAME \
            --body "$(terraform output -raw core_api_lambda_name)" \
            --env staging
          gh variable set PORTAL_BUCKET_NAME \
            --body "$(terraform output -raw portal_bucket_name)" \
            --env staging
          # Consumed by deploy-app.yml to upload the Lambda package to S3 instead of
          # inlining it against a ~70MB request cap (#994). deploy-app FALLS BACK to an
          # inline upload when this is unset, which is what makes the ordering safe: a
          # core upgrade lands the workflow and the bucket in one PR, and nothing orders
          # Deploy Application after Deploy Infrastructure.
          gh variable set ARTIFACTS_BUCKET_NAME \
            --body "$(terraform output -raw artifacts_bucket_name)" \
            --env staging
          gh variable set CLOUDFRONT_DISTRIBUTION_ID \
            --body "$(terraform output -raw cloudfront_distribution_id)" \
            --env staging
          gh variable set PORTAL_URL \
            --body "$(terraform output -raw portal_url)" \
            --env staging
      - name: Publish runtime identity document (#403)
        # See the dev job above for the rationale.
        run: |
          IDENTITY="$(jq -n \
            --arg userPoolId "$(terraform output -raw cognito_user_pool_id)" \
            --arg clientId "$(terraform output -raw cognito_client_id)" \
            --arg region "${AWS_REGION:-us-east-1}" \
            --arg apiUrl "$(terraform output -raw api_gateway_url)" \
            --arg portalUrl "$(terraform output -raw portal_url)" \
            '{userPoolId: $userPoolId, clientId: $clientId, region: $region, apiUrl: $apiUrl, portalUrl: $portalUrl}')"
          echo "$IDENTITY" | aws s3 cp - \
            "s3://$(terraform output -raw portal_bucket_name)/.well-known/biffo-identity.json" \
            --content-type application/json \
            --cache-control "max-age=60"

  # ─── PROD ────────────────────────────────────────────────────────────────────
  # Auto-deploys on push to main branch; manual via workflow_dispatch.
  # Requires prod environment approval in GitHub Settings → Environments.

  plan-prod:
    name: Plan (prod)
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    environment: prod
    # prod deploys always require an explicit workflow_dispatch, never a push
    # side effect — BIFFO_DEPLOY_ENABLED is a single repo-wide flag set true
    # by the very first `biffo deploy` of ANY environment, so a push-triggered
    # prod path here would mean every future push to main (e.g. a routine PR
    # merge) silently deploys to production the moment anyone has ever run
    # `biffo deploy dev` even once.
    if: vars.BIFFO_DEPLOY_ENABLED == 'true' && github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod'
    defaults:
      run:
        working-directory: infra/environments/prod
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.BIFFO_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Generate backend config
        run: |
          cat > backend.hcl << 'EOF'
          bucket = "${{ vars.TF_STATE_BUCKET }}"
          key    = "prod/terraform.tfstate"
          region = "${{ vars.AWS_REGION || 'us-east-1' }}"
          EOF
      - run: terraform init -input=false -backend-config=backend.hcl
        timeout-minutes: 10
      - run: terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan.txt
        timeout-minutes: 20
        env:
          TF_VAR_project_name: ${{ vars.PROJECT_NAME }}
          TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
          TF_VAR_admin_email: ${{ vars.BIFFO_ADMIN_EMAIL }}
          TF_VAR_admin_username: ${{ vars.BIFFO_ADMIN_USERNAME }}
          TF_VAR_domain: ${{ vars.DOMAIN }}
          TF_VAR_custom_domain: ${{ vars.CUSTOM_DOMAIN }}
          TF_VAR_acm_certificate_arn: ${{ vars.ACM_CERTIFICATE_ARN }}
          TF_VAR_hosted_zone_id: ${{ vars.HOSTED_ZONE_ID }}
          # biffo-template#1574. Published by deploy-global.yml's "Export
          # outputs" step, exactly like ACM_CERTIFICATE_ARN above and for the
          # same reason: Lambda@Edge functions must live in us-east-1, so this
          # one is created in the global stack and its qualified ARN threaded
          # into the regional one. Without this line #1529's fix ships inert —
          # the CDN module defaults the variable to "" and every API 403/404
          # keeps returning the portal's index.html.
          #
          # Empty is the SAFE state, not merely the old one: the module gates
          # the origin-response demote AND the viewer-response restore on this
          # single variable, so neither half can arm without the other. Demote
          # alone would return HTTP 200 on real API errors, which is worse than
          # the bug this fixes. See modules/cloud/aws/cdn/variables.tf and
          # cli/src/lib/cdn-error-status-coupling.test.ts.
          TF_VAR_error_status_restore_lambda_arn: ${{ vars.ERROR_STATUS_RESTORE_LAMBDA_ARN }}
          # Endpoint control plane / PR-signer (ADR-0008). All default to empty
          # or false, so a deployment that has not set these GitHub variables is
          # unaffected — but without passing them, an instance could not enable
          # the feature the template already ships (#458, backported from tabsii).
          TF_VAR_enable_pr_signer: ${{ vars.ENABLE_PR_SIGNER || 'false' }}
          TF_VAR_pr_signer_github_app_id: ${{ vars.PR_SIGNER_GITHUB_APP_ID }}
          TF_VAR_pr_signer_github_installation_id: ${{ vars.PR_SIGNER_GITHUB_INSTALLATION_ID }}
          TF_VAR_pr_signer_repo_owner: ${{ vars.PR_SIGNER_REPO_OWNER }}
          TF_VAR_pr_signer_repo_name: ${{ vars.PR_SIGNER_REPO_NAME }}
          TF_VAR_pr_signer_base_branch: ${{ vars.PR_SIGNER_BASE_BRANCH || 'dev' }}

      # Refuse a plan that destroys stateful infrastructure without saying so
      # (#387). Runs in the PLAN job, before Apply, so a refusal costs nothing —
      # nothing has been touched yet. Apply is --auto-approve, so this is the
      # only point where a human decision can still be required.
      #
      # Bare node, no pnpm install: this job sets up Terraform and AWS and
      # nothing else, and the guard has no dependencies precisely so three plan
      # jobs need not each install one.
      - name: Destructive-plan guard
        run: |
          terraform show -json tfplan > plan.json
          node "$GITHUB_WORKSPACE/scripts/check-destructive-plan.mjs" plan.json
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}

      # Carry the plan the guard just inspected across to the apply job (#1148),
      # so the thing applied is the thing that was reviewed.
      #
      # Retention is deliberately minimal: a Terraform plan file embeds variable
      # values and resolved resource attributes, so it is sensitive and must not
      # outlive the run that needs it. `if-no-files-found: error` because a
      # missing plan must fail here rather than let the apply job fall back to
      # computing its own -- which is the entire defect this fixes.
      - uses: actions/upload-artifact@v5
        with:
          name: tfplan-prod
          path: infra/environments/prod/tfplan
          retention-days: 1
          if-no-files-found: error

      # Carry whatever `.build/` files this plan generated across to the apply
      # job too (#1663) -- see the matching comment in plan-dev for the full
      # explanation. `if-no-files-found: ignore`: most environments' Terraform
      # has no archive_file at all, so no `.build/` is ever produced.
      - uses: actions/upload-artifact@v5
        with:
          name: tfbuild-prod
          path: infra/environments/prod/.build/
          retention-days: 1
          if-no-files-found: ignore
          # See the matching comment on tfbuild-dev in plan-dev -- .build/ is
          # a dot-directory and upload-artifact excludes it by default (root
          # included, not just nested descendants), which silently uploaded
          # nothing even when real archive_file zips existed
          # (biffo-template#1774).
          include-hidden-files: true
  apply-prod:
    name: Apply (prod)
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    environment: prod
    needs: plan-prod
    # See plan-prod above — prod always requires an explicit workflow_dispatch.
    if: vars.BIFFO_DEPLOY_ENABLED == 'true' && github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod'
    defaults:
      run:
        working-directory: infra/environments/prod
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.BIFFO_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Generate backend config
        run: |
          cat > backend.hcl << 'EOF'
          bucket = "${{ vars.TF_STATE_BUCKET }}"
          key    = "prod/terraform.tfstate"
          region = "${{ vars.AWS_REGION || 'us-east-1' }}"
          EOF
      - run: terraform init -input=false -backend-config=backend.hcl
        timeout-minutes: 10
      # Apply the plan the guard inspected, never a fresh one (#1148).
      #
      # Until this, plan and apply ran as SEPARATE JOBS on separate runners and
      # `tfplan` was never transported, so `terraform apply -auto-approve`
      # recomputed a plan from scratch. `check-destructive-plan.mjs` therefore
      # inspected a plan that was then thrown away: the guard could not gate
      # what was actually applied, by construction, in all three environments.
      #
      # A saved plan carries every variable value, so no `TF_VAR_*` belongs here
      # -- they were removed rather than left inert and misleading. If state has
      # moved since the plan was taken, Terraform refuses the stale plan instead
      # of applying something nobody reviewed. That refusal is the point.
      - uses: actions/download-artifact@v5
        with:
          name: tfplan-prod
          # Relative to the workspace: `defaults.run.working-directory` governs
          # `run` steps only, never an action's own inputs.
          path: infra/environments/prod

      # Restore the plan-time `.build/` directory, if the plan produced one
      # (#1663) -- see the matching comment in apply-dev. `if-no-artifact-found:
      # ignore` mirrors the upload's `if-no-files-found: ignore`.
      - uses: actions/download-artifact@v5
        with:
          name: tfbuild-prod
          path: infra/environments/prod/.build
          if-no-artifact-found: ignore
      - run: terraform apply -input=false -auto-approve tfplan
        timeout-minutes: 45
      - name: Export outputs to GitHub Actions variables
        env:
          GH_TOKEN: ${{ secrets.BIFFO_GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh variable set API_GATEWAY_URL \
            --body "$(terraform output -raw api_gateway_url)" \
            --env prod
          gh variable set COGNITO_USER_POOL_ID \
            --body "$(terraform output -raw cognito_user_pool_id)" \
            --env prod
          gh variable set COGNITO_CLIENT_ID \
            --body "$(terraform output -raw cognito_client_id)" \
            --env prod
          gh variable set CORE_API_LAMBDA_NAME \
            --body "$(terraform output -raw core_api_lambda_name)" \
            --env prod
          gh variable set PORTAL_BUCKET_NAME \
            --body "$(terraform output -raw portal_bucket_name)" \
            --env prod
          # Consumed by deploy-app.yml to upload the Lambda package to S3 instead of
          # inlining it against a ~70MB request cap (#994). deploy-app FALLS BACK to an
          # inline upload when this is unset, which is what makes the ordering safe: a
          # core upgrade lands the workflow and the bucket in one PR, and nothing orders
          # Deploy Application after Deploy Infrastructure.
          gh variable set ARTIFACTS_BUCKET_NAME \
            --body "$(terraform output -raw artifacts_bucket_name)" \
            --env prod
          gh variable set CLOUDFRONT_DISTRIBUTION_ID \
            --body "$(terraform output -raw cloudfront_distribution_id)" \
            --env prod
          gh variable set PORTAL_URL \
            --body "$(terraform output -raw portal_url)" \
            --env prod
      - name: Publish runtime identity document (#403)
        # See the dev job above for the rationale.
        run: |
          IDENTITY="$(jq -n \
            --arg userPoolId "$(terraform output -raw cognito_user_pool_id)" \
            --arg clientId "$(terraform output -raw cognito_client_id)" \
            --arg region "${AWS_REGION:-us-east-1}" \
            --arg apiUrl "$(terraform output -raw api_gateway_url)" \
            --arg portalUrl "$(terraform output -raw portal_url)" \
            '{userPoolId: $userPoolId, clientId: $clientId, region: $region, apiUrl: $apiUrl, portalUrl: $portalUrl}')"
          echo "$IDENTITY" | aws s3 cp - \
            "s3://$(terraform output -raw portal_bucket_name)/.well-known/biffo-identity.json" \
            --content-type application/json \
