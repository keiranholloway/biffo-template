name: Destroy Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to destroy
        required: true
        type: choice
        options: [dev, staging, prod]

env:
  TERRAFORM_VERSION: '~> 1.9'
  # Defence in depth for the class of bug in #322: an interactive Terraform
  # prompt on a CI runner has no stdin to read and blocks until the job is
  # killed. Every invocation also passes -input=false explicitly and a drift
  # guard enforces that; this is the backstop for one added without it.
  TF_INPUT: '0'

permissions:
  id-token: write
  contents: read

# Destroys all Terraform-managed infrastructure for the selected environment.
# Run this before biffo teardown to avoid orphaning VPCs, RDS, Lambda, etc.

# ─── DEV ─────────────────────────────────────────────────────────────────────

jobs:
  destroy-dev:
    name: Destroy (dev)
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    environment: dev
    if: vars.BIFFO_DEPLOY_ENABLED == 'true' && github.event.inputs.environment == 'dev'
    defaults:
      run:
        working-directory: infra/environments/dev
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.BIFFO_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Generate backend config
        run: |
          cat > backend.hcl << 'EOF'
          bucket = "${{ vars.TF_STATE_BUCKET }}"
          key    = "dev/terraform.tfstate"
          region = "${{ vars.AWS_REGION || 'us-east-1' }}"
          EOF
      - run: terraform init -input=false -backend-config=backend.hcl
        timeout-minutes: 10
      - name: Delete RDS proxy and instance before destroy
        run: |
          PREFIX="${{ vars.PROJECT_NAME }}-dev"
          PROXY="${PREFIX}-proxy"
          DB="${PREFIX}-postgres"
          # Delete proxy first (removes ENI so SG can be cleaned up by terraform)
          if aws rds describe-db-proxies --db-proxy-name "$PROXY" --query 'DBProxies[0].Status' --output text 2>/dev/null | grep -qv None; then
            echo "Deleting RDS proxy: $PROXY"
            aws rds delete-db-proxy --db-proxy-name "$PROXY" 2>/dev/null || true
            for i in $(seq 1 30); do
              STATUS=$(aws rds describe-db-proxies --db-proxy-name "$PROXY" --query 'DBProxies[0].Status' --output text 2>/dev/null || echo "deleted")
              [ "$STATUS" = "deleted" ] || [ -z "$STATUS" ] || [ "$STATUS" = "None" ] && break
              echo "  Proxy status: $STATUS"; sleep 20
            done
          fi
          # Delete RDS instance (skip final snapshot for teardown)
          if aws rds describe-db-instances --db-instance-identifier "$DB" --query 'DBInstances[0].DBInstanceStatus' --output text 2>/dev/null | grep -qv None; then
            PROTECTED=$(aws rds describe-db-instances --db-instance-identifier "$DB" --query 'DBInstances[0].DeletionProtection' --output text 2>/dev/null || echo "False")
            if [ "$PROTECTED" = "True" ]; then
              echo "Disabling deletion protection on $DB"
              aws rds modify-db-instance --db-instance-identifier "$DB" --no-deletion-protection --apply-immediately
              for i in $(seq 1 15); do
                STILL_PROTECTED=$(aws rds describe-db-instances --db-instance-identifier "$DB" --query 'DBInstances[0].DeletionProtection' --output text 2>/dev/null || echo "False")
                [ "$STILL_PROTECTED" = "False" ] && break
                echo "  Waiting for deletion protection to clear..."; sleep 5
              done
            fi
            echo "Deleting RDS instance: $DB"
            aws rds delete-db-instance --db-instance-identifier "$DB" \
              --skip-final-snapshot --delete-automated-backups
            echo "Waiting for RDS deletion (up to 15 min)..."
            aws rds wait db-instance-deleted --db-instance-identifier "$DB"
          fi
      - name: Delete CloudWatch log groups
        run: |
          REGION="${{ vars.AWS_REGION || 'us-east-1' }}"
          PREFIX="${{ vars.PROJECT_NAME }}-dev"
          for LG in \
            "/biffo/${PREFIX}/vpc-flow-logs" \
            "/biffo/${PREFIX}/api-gateway" \
            "/biffo/${PREFIX}/events" \
            "/aws/lambda/${PREFIX}-core-api"; do
            aws logs delete-log-group --log-group-name "$LG" --region "$REGION" 2>/dev/null || true
          done
      - run: terraform destroy -input=false -auto-approve
        timeout-minutes: 45
        env:
          TF_VAR_project_name: ${{ vars.PROJECT_NAME }}
          TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
          TF_VAR_admin_email: ${{ vars.BIFFO_ADMIN_EMAIL }}
          TF_VAR_admin_username: ${{ vars.BIFFO_ADMIN_USERNAME }}
          TF_VAR_domain: ${{ vars.DOMAIN }}
          TF_VAR_custom_domain: ${{ vars.CUSTOM_DOMAIN }}
          TF_VAR_acm_certificate_arn: ${{ vars.ACM_CERTIFICATE_ARN }}
          TF_VAR_hosted_zone_id: ${{ vars.HOSTED_ZONE_ID }}
          # biffo-template#1574 — kept in step with deploy-infra.yml. A destroy
          # plan computed with this empty would show the Lambda@Edge
          # associations and the restore CloudFront Function being removed
          # first, as though a config change were in flight, muddying the one
          # plan a human is expected to read before agreeing to a teardown.
          TF_VAR_error_status_demote_lambda_arn: ${{ vars.ERROR_STATUS_DEMOTE_LAMBDA_ARN }}
      # Post-destroy backstop for the flow-logs orphan (#332). The pre-destroy
      # sweep above runs while the flow log is still live, so any group it
      # deletes is immediately re-materialised by the next log delivery. Now
      # that `terraform destroy` has removed the flow log AND drained its
      # delivery pipeline, deleting the group is final. Re-check and retry in
      # case a straggler delivery recreated it in the seconds after DeleteFlowLogs.
      - name: Sweep leftover CloudWatch log groups (post-destroy backstop)
        run: |
          REGION="${{ vars.AWS_REGION || 'us-east-1' }}"
          PREFIX="${{ vars.PROJECT_NAME }}-dev"
          for LG in \
            "/biffo/${PREFIX}/vpc-flow-logs" \
            "/biffo/${PREFIX}/api-gateway" \
            "/biffo/${PREFIX}/events" \
            "/aws/lambda/${PREFIX}-core-api"; do
            for attempt in 1 2 3; do
              aws logs delete-log-group --log-group-name "$LG" --region "$REGION" 2>/dev/null || true
              STILL=$(aws logs describe-log-groups --log-group-name-prefix "$LG" --region "$REGION" \
                --query "logGroups[?logGroupName=='$LG'].logGroupName" --output text 2>/dev/null || true)
              [ -z "$STILL" ] && break
              echo "Log group $LG still present after delete (attempt $attempt) — a straggler flow-log delivery may have recreated it; retrying."
              sleep 10
            done
          done
      - name: Verify no orphaned Cognito pool or VPC remain
        uses: ./.github/actions/verify-no-orphans
        with:
          resource-type: cognito-vpc
          prefix: '${{ vars.PROJECT_NAME }}-dev'

  # ─── STAGING ─────────────────────────────────────────────────────────────────

  destroy-staging:
    name: Destroy (staging)
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    environment: staging
