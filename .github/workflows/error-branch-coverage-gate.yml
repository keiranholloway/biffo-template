name: Error-branch coverage gate

# Deterministic replacement for the best-effort cross-workflow combine that
# used to live inline in `ci.yml`'s Python job (#637). That version raced:
# `CI` and `RLS Tests` trigger on the same push with no ordering between
# them, and measurement on tabsii-platform's real run history showed `RLS
# Tests` finishing AFTER `CI` in 3 of 4 same-commit pairs — so on a typical
# first push the artefact the best-effort step wanted usually did not exist
# yet, and the combine silently fell back to Python-only coverage, which
# flags every Postgres-only error branch (an RLS refusal, a constraint
# violation) as newly unexecuted. `ci.yml` kept a duplicate, weaker stub test
# purely to survive that (PR #831); this workflow is what removes the need
# for the insurance rather than re-litigating it.
#
# `workflow_run` is the only GitHub Actions trigger that can run AFTER
# another workflow's run has already concluded, which is the property this
# needs: by the time this job can see BOTH a completed `CI` run and a
# completed `RLS Tests` run for one commit, both have already produced
# whatever coverage artefact they are ever going to produce for it — there
# is no earlier point at which the combine could observe a false absence.
# `workflow_run` fires once per completing workflow, so in a repo with both
# workflows this job runs up to twice per commit; both invocations share the
# logic below, and only the one that finds both runs actually asserts
# anything (see "Wait for both lanes, or bail without asserting").
#
# `workflow_run` also carries a real tradeoff, named directly in
# tabsii-platform#637: it always runs the workflow file version committed to
# the DEFAULT branch, and — this is the part that is easy to miss — the
# check run/status it produces is NOT automatically attached to the PR whose
# push triggered the chain. GitHub associates a check with the commit SHA it
# is reported against, and a `workflow_run` job's own ambient `github.sha`
# is the default branch's HEAD, not the triggering commit. Left alone, this
# job would run, assert correctly, and the PR would never see it — a gate
# that is green and gates nothing, the exact "reports green without
# checking" shape #637 is filed against. "Report the result" below is here
# specifically to close that gap: it posts an explicit commit status via the
# REST Statuses API, addressed to `github.event.workflow_run.head_sha` (the
# ACTUAL commit under test, fork or same-repo, PR or push), not to this
# job's own ambient SHA. A commit status posted this way appears in the PR's
# checks list like any other, and `context: "Error-branch coverage"` can be
# added to branch protection's required contexts exactly like a normal job
# name — proven in this PR's own description (see the PR body for the run
# URLs of a failing and a passing gate against a scratch commit).
#
# Security: this job never EXECUTES anything from the commit under test.
# `actions/checkout` below takes the default ref (this workflow's own trigger
# context, i.e. the trusted default branch), so
# `scripts/error_branch_coverage.py` always runs as the DEFAULT BRANCH'S
# copy of itself, regardless of what a PR (fork or otherwise) changed that
# script to say. Everything that needs to be commit-specific — does this
# commit have an RLS lane, which artefacts belong to it, and (since #1595)
# what its source actually says — is read via the GitHub API (contents
# lookup, workflow-run listing, artifact download, source tarball), never via
# checking out and running the PR's own code with this job's write-scoped
# token. Running a fork's modified script here, privileged, would be the
# classic "pwn request" shape.
#
# The distinction that makes #1595's fix safe: the danger is executing a
# fork's code, not reading it. "Materialise the commit under test's source"
# below expands a tarball that is only ever PARSED, by the default branch's
# analyser — nothing in it is imported, installed or run, and no credential
# is written into that tree. Conflating "do not run the PR's code" with "do
# not look at the PR's code" is what left the analyser judging one revision's
# coverage against another revision's source in the first place.

on:
  workflow_run:
    workflows: ['CI', 'RLS Tests']
    types: [completed]

permissions:
  contents: read
  actions: read
  statuses: write

jobs:
  gate:
    name: Error-branch coverage
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      TRIGGERING_NAME: ${{ github.event.workflow_run.name }}
      TRIGGERING_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      # Deliberately the DEFAULT branch's checkout (no `ref:` override) — see
      # the security note above. This is only ever used to run
      # scripts/error_branch_coverage.py, never to inspect the PR's commit.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      # A repo-level question, evaluated at the ACTUAL commit under test (via
      # the contents API, not a checkout) so a PR that adds the RLS lane for
      # the first time is gated by it immediately, matching the same
      # `hashFiles('.github/workflows/rls-tests.yml')` test `ci.yml` uses —
      # the two must agree on what "this repo has the lane" means, or a repo
      # with the lane could end up asked for it in one place and not the
      # other.
      - name: Does this commit's repo have an RLS lane?
        id: rls-lane
        run: |
          set -uo pipefail
          if gh api "repos/$REPO/contents/.github/workflows/rls-tests.yml?ref=$SHA" >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # No RLS lane at all: `ci.yml`'s own inline "Error-branch coverage"
      # step already asserted the single-file check for this commit (it only
      # skips itself when the lane IS present — see that file). Nothing more
      # for this workflow to do, and nothing is posted: this job is not a
      # required context in a repo without the lane, so leaving no status is
      # correct, not a silent skip of something that mattered.
      - name: No RLS lane — nothing for this gate to do
        if: steps.rls-lane.outputs.present == 'false'
        run: echo "No .github/workflows/rls-tests.yml at $SHA — ci.yml's own inline check already covers this commit. Exiting without posting a status."

      # Wait for both lanes, or bail without asserting.
      #
      # This job was triggered by ONE of {CI, RLS Tests} completing, so that
      # run's id is already known (`TRIGGERING_RUN_ID`) — the other has to be
      # looked up, and it may genuinely not have finished yet: the two
      # workflows start at roughly the same time with no ordering guarantee.
      # "Not found yet" here is NOT the same failure this gate exists to
      # close — it is the ordinary shape of the FIRST of the two firings, and
      # the correct response is to leave no status and let the SECOND firing
      # (the other workflow's own completion event) finish the job. A PR
      # whose other lane never completes at all stays pending on this check
      # forever, which blocks merge rather than passing it — the same
      # "cannot tell is never a pass" posture AGENTS.md's `wait-for-checks`
      # and `branch-health` already use, not a new invention. See the PR
      # description for the residual case this does not close (a run GitHub
      # never dispatches at all) and its recovery.
      - name: Find both runs for this commit
        id: runs
        if: steps.rls-lane.outputs.present == 'true'
        run: |
          set -uo pipefail
          # `status=completed` is the API's word for FINISHED, not SUCCEEDED
          # — it matches `cancelled` and `timed_out` alongside `success`, and
          # a run cancelled by an ordinary supersession (two merges landing
          # close together) produces no artefact precisely because it never
          # finished, not because anything is wrong. Filtering on
          # `conclusion == "success"` instead means a cancelled or failed run
          # is simply not found here — which lands on the existing
          # "not asserting yet" branch below, the same posture already used
          # for "hasn't completed yet". A genuinely failed run is also left
          # unasserted deliberately: CI's own red already reports it, and
          # reddening this gate too would be duplicate reporting for the
          # same cause (see PR description). A commit whose only CI/RLS run
          # was cancelled or failed therefore leaves this check pending
          # rather than green or red — pending blocks merge exactly like a
          # failure would, so nothing unsafe passes through.
          if [ "$TRIGGERING_NAME" = "CI" ]; then
            ci_run_id="$TRIGGERING_RUN_ID"
            ci_conclusion="${{ github.event.workflow_run.conclusion }}"
            [ "$ci_conclusion" = "success" ] || ci_run_id=""
            rls_run_id=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&status=completed&per_page=50" \
              --jq '[.workflow_runs[] | select(.name == "RLS Tests") | select(.conclusion == "success")] | first | .id // empty')
          else
            rls_run_id="$TRIGGERING_RUN_ID"
            rls_conclusion="${{ github.event.workflow_run.conclusion }}"
            [ "$rls_conclusion" = "success" ] || rls_run_id=""
            ci_run_id=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&status=completed&per_page=50" \
              --jq '[.workflow_runs[] | select(.name == "CI") | select(.conclusion == "success")] | first | .id // empty')
          fi

          if [ -z "$ci_run_id" ] || [ -z "$rls_run_id" ]; then
            echo "Only one of {CI, RLS Tests} has a SUCCESSFUL completed run for $SHA so far (ci=${ci_run_id:-<none>} rls=${rls_run_id:-<none>}) — this is the ordinary shape of whichever finished first, OR of a cancelled/failed run that legitimately has no coverage artefact to combine. Not asserting; a later successful completion (a re-run, or the other workflow) will re-trigger this gate. This check stays pending, which blocks merge the same way a failure would."
            echo "both_found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Both runs completed for $SHA: CI run $ci_run_id, RLS Tests run $rls_run_id."
          echo "both_found=true" >> "$GITHUB_OUTPUT"
          echo "ci_run_id=$ci_run_id" >> "$GITHUB_OUTPUT"
          echo "rls_run_id=$rls_run_id" >> "$GITHUB_OUTPUT"

      # Download both artefacts. A download failing here is NOT the same
      # "not found yet" case above — both runs are already known-SUCCESSFUL
      # completions (selected on `conclusion == "success"`, not merely
      # `status == "completed"` — see the step above), so a missing artefact
      # means the lane ran to a green conclusion and still produced nothing,
      # which is a real defect and must fail the gate, not fall back quietly
      # to whichever coverage IS present. This is the opposite posture from
      # `error_branch_coverage.py`'s own `--coverage` handling, which treats
      # an absent file as a soft warning — that leniency exists for a
      # caller who cannot tell "not yet" from "never" (the old best-effort
      # step in `ci.yml`, still true for a repo mid-way through adopting the
      # lane's producer half); this job has already resolved that ambiguity
      # by waiting for both runs to reach `completed`, so absence here can
      # only mean the producer failed. Reported explicitly rather than
      # relying on the script's own tolerant default.
      - name: Download both coverage artefacts
        id: download
        if: steps.runs.outputs.both_found == 'true'
        run: |
          set -uo pipefail
          ok=true
          reason=""

          if ! gh run download "${{ steps.runs.outputs.ci_run_id }}" --repo "$REPO" --name python-coverage --dir cov-ci; then
            ok=false
            reason="CI run ${{ steps.runs.outputs.ci_run_id }} completed but its python-coverage artefact could not be downloaded (missing or expired)."
          fi

          if ! gh run download "${{ steps.runs.outputs.rls_run_id }}" --repo "$REPO" --name rls-coverage --dir cov-rls; then
            ok=false
            reason="${reason:+$reason }RLS Tests run ${{ steps.runs.outputs.rls_run_id }} completed but its rls-coverage artefact could not be downloaded — a repo with the RLS lane must not silently fall back to Python-only coverage."
          fi

          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          if [ "$ok" = "false" ]; then
            echo "reason=$reason" >> "$GITHUB_OUTPUT"
            echo "::error::error-branch coverage gate: $reason"
          fi

      # The source the coverage was MEASURED against — not the source this job
      # happens to be standing in.
      #
      # `scripts/error_branch_coverage.py` finds a branch by parsing a file and
      # then asks whether that branch's line number appears in the coverage
      # report's executed/missing lists. Both halves have to describe the same
      # revision. The checkout above is deliberately the default branch's (see
      # the header), so until #1595 the *source* came from there too while the
      # *coverage* came from the commit under test — and any file the commit
      # changed had its line numbers looked up in the wrong revision's AST.
      # Measured on tabsii-platform#922: the default branch's `admin_app.py`
      # was 35 lines shorter, and two branches that had tests were reported as
      # newly unexecuted at lines holding unrelated code. It only ever
      # diverged on files a commit changed, i.e. the ones this gate exists to
      # judge, which is why it survived this long.
      #
      # This is data, not code. A tarball is expanded and READ by the default
      # branch's analyser; nothing inside it is executed, no dependency of it
      # is installed, and no build runs. The header's pwn-request concern is
      # about running a fork's modified script with this job's write-scoped
      # token, and that is unchanged: the script is still the default
      # branch's. Fetching via the API rather than `checkout` with a `ref:`
      # keeps it that way — there is no second checkout to accidentally
      # execute from, and `persist-credentials` never touches this tree.
      #
      # Fails closed. An artefact that cannot be fetched is not a reason to
      # quietly fall back to the default branch's source: that is precisely
      # the wrong-revision comparison being removed here, and it would restore
      # it silently under a green tick.
      - name: Materialise the commit under test's source
        id: source
        if: steps.download.outputs.ok == 'true'
        run: |
          set -uo pipefail
          mkdir -p under-test
          if ! gh api "repos/$REPO/tarball/$SHA" > under-test.tar.gz; then
            echo "::error::error-branch coverage gate: could not fetch the source tarball for $SHA."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "reason=could not fetch the source tarball for the commit under test ($SHA)." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! tar -xzf under-test.tar.gz -C under-test --strip-components=1; then
            echo "::error::error-branch coverage gate: the source tarball for $SHA could not be expanded."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "reason=the source tarball for the commit under test ($SHA) could not be expanded." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Expanded the source of $SHA into under-test/ ($(find under-test -name '*.py' | wc -l) Python file(s))."
          echo "ok=true" >> "$GITHUB_OUTPUT"

      # The actual assertion — both artefacts are guaranteed present at this
      # point (the download step already failed closed if either was missing),
      # and the source they are judged against is the commit's own (the step
      # above failed closed if it could not be fetched), so this is a plain
      # combine-and-check with no absence case to reason about.
      - name: Combine and check
        id: check
        if: steps.source.outputs.ok == 'true'
        run: |
          set -uo pipefail
          if python3 scripts/error_branch_coverage.py --check \
              --source-root under-test \
              --coverage cov-ci/coverage.json --coverage cov-rls/rls-coverage.json \
              | tee check-output.txt; then
            echo "state=success" >> "$GITHUB_OUTPUT"
            echo "description=combined CI run ${{ steps.runs.outputs.ci_run_id }} + RLS Tests run ${{ steps.runs.outputs.rls_run_id }}" >> "$GITHUB_OUTPUT"
          else
            echo "state=failure" >> "$GITHUB_OUTPUT"
            echo "description=new unexecuted error branch(es) — see this run's log" >> "$GITHUB_OUTPUT"
          fi

      # Report the result — see the file header for why this explicit
      # Statuses API call, addressed to the commit under test rather than
      # this job's own ambient SHA, is what makes the gate visible on the PR
      # at all. Runs whenever this invocation reached a definitive verdict
      # (download failure OR a completed check), never on the "still waiting
      # for the other lane" path, which must leave no status.
      - name: Report the result
        if: always() && steps.runs.outputs.both_found == 'true'
        run: |
          set -uo pipefail
          if [ "${{ steps.download.outputs.ok }}" = "false" ]; then
            state=failure
            description="${{ steps.download.outputs.reason }}"
          elif [ "${{ steps.source.outputs.ok }}" = "false" ]; then
            state=failure
            description="${{ steps.source.outputs.reason }}"
          else
            state="${{ steps.check.outputs.state }}"
            description="${{ steps.check.outputs.description }}"
          fi

          # A verdict this step cannot name is a failure, never a pass. Without
          # this, an unforeseen skip upstream leaves `state` empty, the
          # Statuses API rejects it, and the job dies having posted NOTHING —
          # which on a required context is indistinguishable from a run that
          # never happened. Same "cannot tell is not a pass" posture as the
          # rest of this file.
          if [ -z "$state" ]; then
            state=failure
            description="the gate reached its reporting step without a verdict — see this run's log"
          fi

          # The Statuses API caps `description` at ~140 characters.
          description=$(printf '%s' "$description" | cut -c1-140)

          gh api "repos/$REPO/statuses/$SHA" \
            -f state="$state" \
            -f context="Error-branch coverage" \
            -f description="$description" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          echo "Posted commit status '$state' for Error-branch coverage on $SHA."
          if [ "$state" = "failure" ]; then
            exit 1
          fi
