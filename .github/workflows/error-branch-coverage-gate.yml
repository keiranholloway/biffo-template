name: Error-branch coverage gate

# Deterministic replacement for the best-effort cross-workflow combine that
# used to live inline in `ci.yml`'s Python job (#637). That version raced:
# `CI` and `RLS Tests` trigger on the same push with no ordering between
# them, and measurement on tabsii-platform's real run history showed `RLS
# Tests` finishing AFTER `CI` in 3 of 4 same-commit pairs — so on a typical
# first push the artefact the best-effort step wanted usually did not exist
# yet, and the combine silently fell back to Python-only coverage, which
# flags every Postgres-only error branch (an RLS refusal, a constraint
# violation) as newly unexecuted. `ci.yml` kept a duplicate, weaker stub test
# purely to survive that (PR #831); this workflow is what removes the need
# for the insurance rather than re-litigating it.
#
# `workflow_run` is the only GitHub Actions trigger that can run AFTER
# another workflow's run has already concluded, which is the property this
# needs: by the time this job can see BOTH a completed `CI` run and a
# completed `RLS Tests` run for one commit, both have already produced
# whatever coverage artefact they are ever going to produce for it — there
# is no earlier point at which the combine could observe a false absence.
# `workflow_run` fires once per completing workflow, so in a repo with both
# workflows this job runs up to twice per commit; both invocations share the
# logic below, and only the one that finds both runs successful actually
# asserts anything (see "Can this commit be asserted yet?").
#
# EVERY invocation posts a status, though, whether or not it can assert. That
# distinction is load-bearing and was got wrong: a required context that is
# never posted does not read as "pending", it reads as `expected` — invisible
# on the PR and unmergeable for ever. See "Report the result" for the three
# commits that measured it. A required check must always report.
#
# `workflow_run` also carries a real tradeoff, named directly in
# tabsii-platform#637: it always runs the workflow file version committed to
# the DEFAULT branch, and — this is the part that is easy to miss — the
# check run/status it produces is NOT automatically attached to the PR whose
# push triggered the chain. GitHub associates a check with the commit SHA it
# is reported against, and a `workflow_run` job's own ambient `github.sha`
# is the default branch's HEAD, not the triggering commit. Left alone, this
# job would run, assert correctly, and the PR would never see it — a gate
# that is green and gates nothing, the exact "reports green without
# checking" shape #637 is filed against. "Report the result" below is here
# specifically to close that gap: it posts an explicit commit status via the
# REST Statuses API, addressed to `github.event.workflow_run.head_sha` (the
# ACTUAL commit under test, fork or same-repo, PR or push), not to this
# job's own ambient SHA. A commit status posted this way appears in the PR's
# checks list like any other, and `context: "Error-branch coverage"` can be
# added to branch protection's required contexts exactly like a normal job
# name — proven in this PR's own description (see the PR body for the run
# URLs of a failing and a passing gate against a scratch commit).
#
# Security: this job never EXECUTES anything from the commit under test.
# `actions/checkout` below takes the default ref (this workflow's own trigger
# context, i.e. the trusted default branch), so
# `scripts/error_branch_coverage.py` always runs as the DEFAULT BRANCH'S
# copy of itself, regardless of what a PR (fork or otherwise) changed that
# script to say. Everything that needs to be commit-specific — does this
# commit have an RLS lane, which artefacts belong to it, and (since #1595)
# what its source actually says — is read via the GitHub API (contents
# lookup, workflow-run listing, artifact download, source tarball), never via
# checking out and running the PR's own code with this job's write-scoped
# token. Running a fork's modified script here, privileged, would be the
# classic "pwn request" shape.
#
# The distinction that makes #1595's fix safe: the danger is executing a
# fork's code, not reading it. "Materialise the commit under test's source"
# below expands a tarball that is only ever PARSED, by the default branch's
# analyser — nothing in it is imported, installed or run, and no credential
# is written into that tree. Conflating "do not run the PR's code" with "do
# not look at the PR's code" is what left the analyser judging one revision's
# coverage against another revision's source in the first place.

on:
  workflow_run:
    # `workflow_run.workflows` matches EXACT names and supports no globbing, so
    # this list cannot be derived and is the one place a lane's name still has
    # to be known in advance. It is therefore an enum of ACCEPTED lane names,
    # not a description of one repo's setup (#1597): an instance may call its
    # second coverage lane any of these without editing this template-owned
    # file, which it could not do without declaring a Core-Divergence.
    #
    # A lane whose name is absent here never triggers the gate at all — its
    # coverage is never combined and error-branch coverage is asserted over the
    # Python job alone, while the repo looks fully configured. That is why the
    # membership is no longer left to luck:
    # `scripts/second_coverage_lane.py --check` asserts a repo's actual lane
    # name appears in this list, and `test_second_coverage_lane.py` runs it.
    #
    # Adding a name here is cheap and safe; a name that matches no workflow in
    # a given repo simply never fires.
    workflows: ['CI', 'RLS Tests', 'Postgres Tests', 'Database Tests', 'Coverage Lane']
    types: [completed]

permissions:
  contents: read
  actions: read
  statuses: write

jobs:
  gate:
    name: Error-branch coverage
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      TRIGGERING_NAME: ${{ github.event.workflow_run.name }}
      TRIGGERING_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      # Deliberately the DEFAULT branch's checkout (no `ref:` override) — see
      # the security note above. This is only ever used to run
      # scripts/error_branch_coverage.py, never to inspect the PR's commit.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      # The commit under test's own source, fetched FIRST because everything
      # below is a question about that commit rather than about this checkout:
      # which workflows it defines, and which lines its coverage refers to.
      # Fetching once and reading one materialised copy is what keeps those
      # answers from drifting apart (#1595 was exactly that drift).
      #
      # This is data, not code. The tarball is expanded and READ — parsed by
      # the default branch's scripts — and nothing in it is imported,
      # installed or run, no dependency of it is resolved, and no credential
      # is written into that tree. The header's pwn-request concern is about
      # EXECUTING a fork's code with this job's write-scoped token, which is
      # unchanged.
      #
      # Hard-fails rather than guessing: if the source cannot be fetched, this
      # job cannot tell whether the repo even has a lane. "Cannot tell" is never
      # a pass — but it is no longer SILENT either. Failing here skips every
      # step below, and "Report the result" runs `if: always()` with no verdict
      # to read, which is precisely the case its empty-`state` fallback posts a
      # `failure` for. That fallback used to be unreachable (the reporting step
      # was itself conditional), which is what made this path post nothing.
      - name: Materialise the commit under test's source
        run: |
          set -uo pipefail
          mkdir -p under-test
          if ! gh api "repos/$REPO/tarball/$SHA" > under-test.tar.gz; then
            echo "::error::error-branch coverage gate: could not fetch the source tarball for $SHA — cannot determine whether this commit has a second coverage lane."
            exit 1
          fi
          if ! tar -xzf under-test.tar.gz -C under-test --strip-components=1; then
            echo "::error::error-branch coverage gate: the source tarball for $SHA could not be expanded."
            exit 1
          fi
          echo "Expanded the source of $SHA into under-test/ ($(find under-test -name '*.py' | wc -l) Python file(s))."

      # A repo-level question, answered from the ACTUAL commit under test, and
      # answered by the SAME resolver `ci.yml` uses to decide whether its
      # inline check stands down. The two must agree on what "this repo has a
      # second lane" means: disagree one way and the commit is asserted twice,
      # disagree the other and it is asserted NOWHERE while both files believe
      # the other did it.
      #
      # Detection is by the artefact a lane publishes (`rls-coverage`) rather
      # than by an RLS-specific filename and workflow name (#1597). A repo with
      # no row-level security at all — `biffo-platform` — was previously forced
      # to name its real-Postgres lane `rls-tests.yml`/`RLS Tests`, because the
      # honest name left this gate silent AND re-enabled ci.yml's inline check.
      - name: Does this commit have a second coverage lane?
        id: lane
        run: |
          set -euo pipefail
          # `--github-output` exits 0 for both answers, so a non-zero here is
          # the resolver itself failing — a different fact from "no lane", and
          # `set -e` makes it fatal rather than silently reading as absence.
          python3 scripts/second_coverage_lane.py --root under-test --github-output > lane.env
          cat lane.env
          cat lane.env >> "$GITHUB_OUTPUT"

      # No second lane at all: `ci.yml`'s own inline "Error-branch coverage"
      # step already asserted the single-artefact check for this commit (it
      # only skips itself when a lane IS present — see that file). Nothing more
      # for this workflow to ASSERT — but it still posts, `success` with that
      # reason stated, rather than nothing.
      #
      # The old comment here argued that leaving no status was correct "because
      # this job is not a required context in a repo without a lane". That
      # reasoning depends on a fact about the RECEIVING repo's branch
      # protection, which this workflow cannot read and does not check, in a
      # file distributed verbatim to every instance. A repo that adopts the
      # context and then loses its lane — renamed, or its artefact upload
      # removed — would land here and be unmergeable with nothing on the PR to
      # say why. Posting a green with a stated reason costs nothing and removes
      # the dependency on that unverifiable premise.
      - name: No second coverage lane — nothing for this gate to assert
        if: steps.lane.outputs.present == 'false'
        run: echo "Nothing at $SHA publishes the lane coverage artefact — ci.yml's own inline check already covers this commit. Reporting success with that reason."

      # Can this commit be asserted yet — and if not, WHY?
      #
      # Three answers, and the old inline shell collapsed two of them into one
      # silent `exit 0`:
      #
      #   assert  — both lanes have a successful run; go combine them.
      #   pending — a lane has not finished, or has not been dispatched. The
      #             ordinary shape of whichever of the two firings comes first.
      #             Transient: the other completion re-fires this gate.
      #   failure — every run of a lane has FINISHED and none succeeded.
      #             Terminal. No further `workflow_run` event is coming, so
      #             nothing will ever re-fire this gate for this commit.
      #
      # The old code produced no status for either of the last two, and the
      # header above used to argue that was safe because the check "stays
      # pending, which blocks merge rather than passing it". That is true of a
      # status that EXISTS and is pending. A status that was never posted does
      # not render as pending — on a required context it renders as `expected`:
      # invisible on the PR, absent from `gh pr checks`, and refusing the merge
      # with `Required status check "Error-branch coverage" is expected.` That
      # is not a strict gate, it is a gate that cannot be passed, and the only
      # recovery (re-run CI so this fires again) is stated nowhere the person
      # looking at the PR can see.
      #
      # Measured on tabsii-com/tabsii-platform, 2026-08-18 — PRs #951, #952 and
      # #953, whose `CI` runs concluded `cancelled` (the house failure mode on
      # self-hosted spot runners, where the runner is reclaimed mid-job). Gate
      # runs 32128129670 and 32128394921 logged `ci=<none> lane=32126454650` and
      # exited 0 having posted nothing;
      # `repos/…/commits/142cb4b5…/status` returned an empty `statuses` array.
      #
      # `scripts/error_branch_gate_verdict.py` decides this, for the same reason
      # `second_coverage_lane.py` exists: so the rule is testable against real
      # captured API payloads rather than only in production. Its case matrix —
      # including those three commits' actual run listings — is
      # `services/api/tests/test_error_branch_gate_verdict.py`.
      #
      # It reads ONLY the Actions run listing, never the `workflow_run` event
      # that woke this job. The event's `conclusion` is a snapshot taken when
      # that run finished, and a later re-run makes it stale while the API moves
      # on — two authorities for one fact, which is class #1362. PR #985
      # (b085ca48) shows the divergence live: its `CI` run 32128658649 is on
      # `run_attempt: 2`, and the firing carrying attempt 1's conclusion
      # disagreed with the listing reporting attempt 2's. Treating the event as
      # a wake-up rather than as evidence also deletes the old three-way branch
      # on `TRIGGERING_NAME`, including its `else` for "a workflow in the trigger
      # list that is not this repo's lane" — there is nothing left for that to
      # get wrong, because the answer no longer depends on who fired us.
      #
      # Deliberately NOT pre-filtered on `status=completed`: "has not finished"
      # is one of the three answers, and a pre-filter throws it away — which is
      # the #1363/#1462 shape `actions-run-status-completed-guard.test.ts`
      # exists to catch. `conclusion` is what the resolver branches on.
      - name: Can this commit be asserted yet?
        id: runs
        if: steps.lane.outputs.present == 'true'
        env:
          # The lane's ACTUAL workflow name, discovered from this commit rather
          # than hardcoded (#1597). Passed through the environment rather than
          # interpolated into the script body: a workflow name is
          # repo-controlled text, and `${{ }}` splices it into the shell before
          # the shell ever sees it.
          LANE_NAME: ${{ steps.lane.outputs.name }}
        run: |
          set -uo pipefail

          if ! gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" > runs.json; then
            # Cannot tell, so cannot pass — and must not be silent either.
            echo "::error::error-branch coverage gate: could not list the Actions runs for $SHA."
            echo "verdict=failure" >> "$GITHUB_OUTPUT"
            echo "reason=could not list this commit's Actions runs — the gate cannot tell whether both lanes finished" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! python3 scripts/error_branch_gate_verdict.py \
              --runs runs.json --lane-name "$LANE_NAME" --github-output > verdict.env; then
            # Exit 2 from the resolver: the payload was unreadable. A different
            # fact from any verdict, and still not a reason to post nothing.
            echo "::error::error-branch coverage gate: the verdict resolver could not read this commit's run listing."
            echo "verdict=failure" >> "$GITHUB_OUTPUT"
            echo "reason=the gate could not read this commit's Actions run listing — see this run's log" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cat verdict.env
          cat verdict.env >> "$GITHUB_OUTPUT"

      # Download both artefacts. A download failing here is NOT the same
      # "not found yet" case above — both runs are already known-SUCCESSFUL
      # completions (selected on `conclusion == "success"`, not merely
      # `status == "completed"` — see the step above), so a missing artefact
      # means the lane ran to a green conclusion and still produced nothing,
      # which is a real defect and must fail the gate, not fall back quietly
      # to whichever coverage IS present. This is the opposite posture from
      # `error_branch_coverage.py`'s own `--coverage` handling, which treats
      # an absent file as a soft warning — that leniency exists for a
      # caller who cannot tell "not yet" from "never" (the old best-effort
      # step in `ci.yml`, still true for a repo mid-way through adopting the
      # lane's producer half); this job has already resolved that ambiguity
      # by waiting for both runs to reach `completed`, so absence here can
      # only mean the producer failed. Reported explicitly rather than
      # relying on the script's own tolerant default.
      - name: Download both coverage artefacts
        id: download
        if: steps.runs.outputs.verdict == 'assert'
        run: |
          set -uo pipefail
          ok=true
          reason=""

          if ! gh run download "${{ steps.runs.outputs.ci_run_id }}" --repo "$REPO" --name python-coverage --dir cov-ci; then
            ok=false
            reason="CI run ${{ steps.runs.outputs.ci_run_id }} completed but its python-coverage artefact could not be downloaded (missing or expired)."
          fi

          if ! gh run download "${{ steps.runs.outputs.rls_run_id }}" --repo "$REPO" --name rls-coverage --dir cov-rls; then
            ok=false
            reason="${reason:+$reason }Lane run ${{ steps.runs.outputs.rls_run_id }} (${{ steps.lane.outputs.name }}) completed but its rls-coverage artefact could not be downloaded — a repo WITH a second lane must not silently fall back to Python-only coverage."
          fi

          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          if [ "$ok" = "false" ]; then
            echo "reason=$reason" >> "$GITHUB_OUTPUT"
            echo "::error::error-branch coverage gate: $reason"
          fi

      # The actual assertion — both artefacts are guaranteed present at this
      # point (the download step already failed closed if either was missing),
      # and the source they are judged against is the commit's own (the step
      # above failed closed if it could not be fetched), so this is a plain
      # combine-and-check with no absence case to reason about.
      - name: Combine and check
        id: check
        if: steps.download.outputs.ok == 'true'
        run: |
          set -uo pipefail
          if python3 scripts/error_branch_coverage.py --check \
              --source-root under-test \
              --coverage cov-ci/coverage.json --coverage cov-rls/rls-coverage.json \
              | tee check-output.txt; then
            echo "state=success" >> "$GITHUB_OUTPUT"
            echo "description=combined CI run ${{ steps.runs.outputs.ci_run_id }} + RLS Tests run ${{ steps.runs.outputs.rls_run_id }}" >> "$GITHUB_OUTPUT"
          else
            echo "state=failure" >> "$GITHUB_OUTPUT"
            echo "description=new unexecuted error branch(es) — see this run's log" >> "$GITHUB_OUTPUT"
          fi

      # Report the result — see the file header for why this explicit
      # Statuses API call, addressed to the commit under test rather than this
      # job's own ambient SHA, is what makes the gate visible on the PR at all.
      #
      # `if: always()`, with NO second conjunct. That is the fix. This step used
      # to carry `&& steps.runs.outputs.both_found == 'true'`, so every path
      # that could not pair the two lanes skipped it and the required context
      # was never posted — and, circularly, the empty-`state` fallback below
      # (written for exactly that danger) could never run, because the only way
      # to reach `state` empty was down a path that skipped this step.
      #
      # Every branch below therefore names a state, and this step is the ONLY
      # place a status is posted. There is no reachable path through this job
      # that reports nothing.
      - name: Report the result
        if: always()
        env:
          # Every input arrives through the environment rather than `${{ }}`
          # splicing. `RUNS_REASON` carries the lane's workflow name, which is
          # repo-controlled text; interpolating it into the script body would
          # put it in the shell's hands before the shell ever ran.
          LANE_PRESENT: ${{ steps.lane.outputs.present }}
          RUNS_VERDICT: ${{ steps.runs.outputs.verdict }}
          RUNS_REASON: ${{ steps.runs.outputs.reason }}
          DOWNLOAD_OK: ${{ steps.download.outputs.ok }}
          DOWNLOAD_REASON: ${{ steps.download.outputs.reason }}
          CHECK_STATE: ${{ steps.check.outputs.state }}
          CHECK_DESCRIPTION: ${{ steps.check.outputs.description }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          state=""
          description=""

          if [ "$LANE_PRESENT" = "false" ]; then
            # Legitimately nothing to assert — ci.yml's inline check owns this
            # commit. A stated green, not a silence.
            state=success
            description="no second coverage lane at this commit — ci.yml's inline error-branch check covers it"
          elif [ "$RUNS_VERDICT" = "pending" ] || [ "$RUNS_VERDICT" = "failure" ]; then
            state="$RUNS_VERDICT"
            description="$RUNS_REASON"
          elif [ "$DOWNLOAD_OK" = "false" ]; then
            state=failure
            description="$DOWNLOAD_REASON"
          elif [ -n "$CHECK_STATE" ]; then
            state="$CHECK_STATE"
            description="$CHECK_DESCRIPTION"
          fi

          # A verdict this step cannot name is a failure, never a pass. This is
          # now REACHABLE — it is what a hard failure in "Materialise the commit
          # under test's source" or in the lane resolver lands on, both of which
          # skip every step that sets an output. Without it, `state` stays
          # empty, the Statuses API rejects the call, and the job dies having
          # posted NOTHING — which on a required context is indistinguishable
          # from a run that never happened. Same "cannot tell is not a pass"
          # posture as the rest of this file.
          if [ -z "$state" ]; then
            state=failure
            description="the gate reached its reporting step without a verdict — see this run's log"
          fi

          # `pending` never overwrites a terminal verdict for this context.
          #
          # Both firings (CI's completion and the lane's) post here, and the one
          # that finds a lane still running is fast while the one that asserts
          # downloads two artefacts and runs the analyser. So the waiting firing
          # essentially always finishes first — but "essentially always" is not
          # a guarantee, and without this a slow `pending` could clobber a green
          # that had already landed. Terminal verdicts still overwrite terminal
          # verdicts; only the placeholder defers.
          if [ "$state" = "pending" ]; then
            existing=$(gh api "repos/$REPO/commits/$SHA/status" \
              --jq '[.statuses[] | select(.context == "Error-branch coverage")] | first | .state // empty' 2>/dev/null)
            if [ "$existing" = "success" ] || [ "$existing" = "failure" ]; then
              echo "A terminal '$existing' status already exists for this context on $SHA; not downgrading it to pending."
              exit 0
            fi
          fi

          # The Statuses API caps `description` at ~140 characters.
          description=$(printf '%s' "$description" | cut -c1-140)

          gh api "repos/$REPO/statuses/$SHA" \
            -f state="$state" \
            -f context="Error-branch coverage" \
            -f description="$description" \
            -f target_url="$RUN_URL"

          echo "Posted commit status '$state' for Error-branch coverage on $SHA."
          # `pending` is a correct, complete outcome for this firing — the job
          # did its job. Only a real verdict of failure reddens the run.
          if [ "$state" = "failure" ]; then
            exit 1
          fi
