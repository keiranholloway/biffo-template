name: Instance-adoption estate report

# instance-adoption guard (#1538/#1570): does a real instance's tree consume a
# registered adoption channel its target template ships -- a template-owned
# file distributing correctly while the user-owned line that makes it DO
# anything stays unwritten, invisible in CI and green in the deploy?
#
# `checkInstanceAdoption` (cli/src/lib/instance-adoption.ts) already detects
# this correctly. Its only caller before #1609 was `cli/src/commands/
# core-upgrade.ts`, inside `runCoreUpgradeResolved` -- so it only ever ran
# when an operator happened to invoke `biffo core upgrade` against that exact
# instance. `keiranholloway/biffo-platform` carried the undetected gap for
# three days (PR #174) before anyone looked, and nothing would have shortened
# that window: nothing was watching between upgrades. This is #1413's "third
# audit nobody runs" shape -- a guard with a correct mechanism and zero
# callers outside one manual path is functionally no guard at all for every
# instance nobody happens to be upgrading today.
#
# This workflow is the missing caller: it clones every live core instance
# fresh and runs `sh scripts/biffo.sh check instance-adoption` (#1609) against
# each one's real tree, on a schedule -- the identical shape
# `core-direct-paths-report.yml` (#1377) already established for an adjacent
# "the real defect lives outside this repo's own checkout" problem. That file
# is this one's direct model: same `BIFFO_GITHUB_TOKEN` cross-repo auth (the
# default `GITHUB_TOKEN` cannot read another repo), same
# `user/repos?affiliation=owner` + `orgs/tabsii-com/repos` discovery
# (`users/<name>/repos` silently narrows to PUBLIC repos regardless of token),
# same archival read from each repo's own `.archived` field rather than a
# hardcoded skip list, and the same "open/update one tracking issue by exact
# stable title, never auto-close" pattern `shared-sync-report.yml` and
# `deploy-app.yml` already use.
#
# ## Discovering instances without a hardcoded list
#
# An "instance" is a repo carrying `biffo.core.json` -- the same marker
# `isInstanceRepo()` (cli/src/lib/core-version.ts) already uses, and the one
# AGENTS.md section 9 names as what distinguishes an instance from a sibling
# or plugin repo. Rather than hardcoding `keiranholloway/biffo-platform` and
# `tabsii-com/tabsii-platform` -- correct today, silently stale the day a
# third instance is born -- this workflow clones every `biffo-*`/`tabsii-*`
# repo under the two owners this estate uses (same narrowing the sibling
# workflows apply, never the sole filter) and keeps only the ones that
# actually carry `biffo.core.json` at their root. A repo cloned but rejected
# by that test is not a defect; it is a sibling or plugin repo correctly
# outside this check's population.
#
# ## What "adopted" means here, and why a real finding is never residue
#
# `checkInstanceAdoption` only ever marks a pair `applicable` once the target
# template tree (`theirsDir`, this checkout) actually ships the channel, and
# only marks it `unadopted` once it is applicable and the instance's own tree
# has not consumed it. There is no "pre-existing residue" category for this
# check the way `--skeleton-adoption` has 22 unrelated baselines to tolerate:
# an applicable, unadopted pair is always a live, actionable gap in a real
# instance's tree today, so this workflow fails loud on ANY finding rather
# than ratcheting against a baseline. Both registered instances were measured
# adopted on every registered pair as of 2026-08-17 (biffo-template#1609's own
# premise check) -- a clean run here is expected, not a low bar being
# tolerated.
#
# ## Fail closed, on purpose, at every layer
#
# Same discipline as the two precedent workflows: a missing/empty
# BIFFO_GITHUB_TOKEN, a repo-listing call that fails, or a clone that fails is
# a loud step failure, never a silently smaller estate. Zero candidates
# cloned, or zero of them carrying biffo.core.json, is ALSO a loud failure --
# not a clean report -- because a real defect ships as invisibly as "we
# checked and found nothing" reads.
#
# ## Cadence
#
# 07:00 UTC -- an hour after shared-sync-report.yml's 06:00 and 30 minutes
# after core-direct-paths-report.yml's 06:30, so the three scheduled estate
# clones do not all hit the same two owners' APIs in the same window.

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: instance-adoption-report
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  report:
    name: Report instance-adoption gaps across the live estate
    # `.github/` is wholly template-owned (core-manifest.json), except
    # `*.instance.yml`, so THIS file rides `biffo core upgrade` into every
    # instance exactly like its two precedents already do -- confirmed live:
    # keiranholloway/biffo-platform carries both shared-sync-report.yml and
    # core-direct-paths-report.yml today, AND holds a real BIFFO_GITHUB_TOKEN
    # secret, so neither precedent fails closed there -- each instance's own
    # copy actually re-runs the estate-wide audit on the same schedule and
    # would open ITS OWN duplicate tracking issue for a finding that has
    # nothing to do with that instance. That gap predates this PR and is out
    # of scope to fix retroactively in the other two workflows here, but this
    # file does not need to repeat it: only the template repo should ever
    # actually run this job.
    if: github.repository == 'keiranholloway/biffo-template'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      # This step's own tree is `theirsDir` -- "does the CURRENT template ship
      # a channel some instance hasn't consumed?" -- so it must be the real
      # tip, not whatever SHA triggered the run. Same reasoning and same fix
      # as shared-sync-report.yml's "Re-point the checkout" step.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: dev
          fetch-depth: 0

      - name: Re-point the checkout at the current origin/dev tip
        run: |
          set -eu
          git fetch origin dev --prune
          git reset --hard origin/dev
          behind=$(git rev-list --count HEAD..origin/dev)
          if [ "$behind" -ne 0 ]; then
            echo "::error title=instance-adoption: checkout still behind origin/dev::Reset to origin/dev but still $behind commit(s) behind." >&2
            exit 1
          fi
          echo "checkout is at origin/dev tip: $(git rev-parse --short HEAD)"

      - name: Discover live instances and clone them fresh
        id: estate
        env:
          GH_TOKEN: ${{ secrets.BIFFO_GITHUB_TOKEN }}
        run: |
          set -u
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error title=instance-adoption: no cross-repo token::BIFFO_GITHUB_TOKEN is not set. The default GITHUB_TOKEN cannot read other repos, so this job cannot see any instance -- refusing to report a clean run against nothing it could reach." >&2
            exit 1
          fi

          ESTATE="$RUNNER_TEMP/instance-adoption-estate"
          mkdir -p "$ESTATE"

          # Same discovery as shared-sync-report.yml / core-direct-paths-report.yml,
          # same reason: `GET /users/keiranholloway/repos` returns PUBLIC repos
          # only regardless of token; `GET /user/repos?affiliation=owner` is the
          # authenticated, owner-scoped call that actually sees the private estate.
          if ! gh api "user/repos?affiliation=owner&per_page=100" --paginate \
              --jq '.[] | select(.owner.login == "keiranholloway" and .archived == false and .fork == false) | .full_name' \
              >> "$RUNNER_TEMP/candidates.txt.tmp"; then
            echo "::error title=instance-adoption: could not list keiranholloway's repos::gh api user/repos?affiliation=owner failed -- refusing to survey a shrunk, silently-partial estate." >&2
            exit 1
          fi
          if ! gh api "orgs/tabsii-com/repos?per_page=100" --paginate \
              --jq '.[] | select(.archived == false and .fork == false) | .full_name' \
              >> "$RUNNER_TEMP/candidates.txt.tmp"; then
            echo "::error title=instance-adoption: could not list tabsii-com's repos::gh api orgs/tabsii-com/repos failed -- refusing to survey a shrunk, silently-partial estate." >&2
            exit 1
          fi
          candidates="$RUNNER_TEMP/candidates.txt"
          mv "$RUNNER_TEMP/candidates.txt.tmp" "$candidates"

          : > "$candidates.filtered"
          while IFS= read -r slug; do
            name="${slug##*/}"
            case "$name" in
              biffo-template) continue ;;   # this repo IS the template; nothing to check it against itself
              biffo-*|tabsii-*) ;;
              *) continue ;;
            esac
            printf '%s\n' "$slug" >> "$candidates.filtered"
          done < "$candidates"

          cloned=0
          while IFS= read -r slug; do
            [ -n "$slug" ] || continue
            name="${slug##*/}"
            echo "cloning ${slug}"
            if ! gh repo clone "$slug" "$ESTATE/$name" -- --quiet --depth 1 2>&1; then
              echo "::error title=instance-adoption: could not clone ${slug}::A repo this job could see in the listing but could not clone is a LOUD failure, not a skip -- the alternative silently shrinks the denominator the same way #1145 did for branch protection." >&2
              exit 1
            fi
            cloned=$((cloned + 1))
          done < "$candidates.filtered"

          if [ "$cloned" -eq 0 ]; then
            echo "::error title=instance-adoption: zero candidate repos::Listed keiranholloway and tabsii-com and found nothing matching biffo-*/tabsii-* to even attempt -- a configuration error in this workflow or a naming-convention change, not a clean estate." >&2
            exit 1
          fi

          # An instance is a repo carrying biffo.core.json at its root --
          # isInstanceRepo()'s own definition (cli/src/lib/core-version.ts),
          # not a hardcoded name list. A sibling or plugin repo correctly has
          # none and is correctly excluded here, not counted as a miss.
          : > "$RUNNER_TEMP/instances.txt"
          for dir in "$ESTATE"/*/; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            if [ -f "${dir%/}/biffo.core.json" ]; then
              printf '%s\n' "$name" >> "$RUNNER_TEMP/instances.txt"
            fi
          done
          instance_count=$(wc -l < "$RUNNER_TEMP/instances.txt" | tr -d ' ')

          if [ "$instance_count" -eq 0 ]; then
            echo "::error title=instance-adoption: zero instances found::Cloned ${cloned} candidate repo(s) but NONE carried biffo.core.json -- refusing to report a clean run against an empty population. If every instance repo was renamed or moved, this workflow's discovery needs updating; if not, something in this step broke." >&2
            exit 1
          fi

          echo "estate=$ESTATE" >> "$GITHUB_OUTPUT"
          echo "cloned=$cloned" >> "$GITHUB_OUTPUT"
          echo "instance_count=$instance_count" >> "$GITHUB_OUTPUT"
          echo "cloned ${cloned} candidate repo(s), ${instance_count} carry biffo.core.json (instances): $(paste -sd, - "$RUNNER_TEMP/instances.txt")"

      - uses: pnpm/action-setup@v4
        if: steps.estate.outcome == 'success'
      - uses: actions/setup-node@v5
        if: steps.estate.outcome == 'success'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install this repo's dependencies (the CLI that runs the check)
        id: install
        if: steps.estate.outcome == 'success'
        run: pnpm install --frozen-lockfile

      - name: Run the instance-adoption check against every discovered instance, and report the denominator
        id: check
        if: ${{ !cancelled() && steps.estate.outcome == 'success' && steps.install.outcome == 'success' }}
        run: |
          set -u
          estate="${{ steps.estate.outputs.estate }}"
          theirs_dir="$(pwd)"
          log="$RUNNER_TEMP/instance-adoption-check.log"
          : > "$log"

          examined=0
          gaps=0
          failed_instances=""
          checked_names=""

          while IFS= read -r name; do
            [ -n "$name" ] || continue
            echo "== ${name} ==" >> "$log"
            set +e
            out=$(sh scripts/biffo.sh check instance-adoption \
              --instance "$name" --instance-dir "${estate}/${name}" --theirs-dir "$theirs_dir" 2>&1)
            rc=$?
            set -e
            printf '%s\n' "$out" >> "$log"
            echo "(exit ${rc})" >> "$log"
            echo "" >> "$log"

            examined=$((examined + 1))
            checked_names="${checked_names}${checked_names:+, }${name}"

            # 0 clean, 1 real adoption gap(s), 2 cannot-tell (e.g. the clone is
            # missing/unreadable) -- 2 is never folded into "clean", same
            # three-valued convention scripts/biffo.sh's own header documents.
            if [ "$rc" -ne 0 ]; then
              gaps=$((gaps + 1))
              failed_instances="${failed_instances} ${name}(exit ${rc})"
            fi
          done < "${RUNNER_TEMP}/instances.txt"

          denom="examined ${examined} instance(s): ${checked_names:-(none)}; ${gaps} with a finding"

          echo "$denom"
          {
            echo "### Instance-adoption estate report"
            echo
            echo "\`$denom\`"
            echo
            if [ "$gaps" -gt 0 ]; then
              echo "**${gaps} of ${examined} instance(s) reported a finding:**${failed_instances}"
            else
              echo "All ${examined} instance(s) have adopted every applicable registered channel."
            fi
            echo
            echo '```'
            cat "$log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "denom=$denom" >> "$GITHUB_OUTPUT"
          echo "gaps=$gaps" >> "$GITHUB_OUTPUT"
          echo "examined=$examined" >> "$GITHUB_OUTPUT"
          echo "log=$log" >> "$GITHUB_OUTPUT"

          # Fail closed (#1363): a run that examined zero instances is exactly
          # the vacuity this workflow exists to end, even though the estate
          # discovery step above already guards against a zero instance_count
          # -- this is the second, independent check at the layer that
          # actually iterates, in case that guard is ever bypassed by a future
          # edit to this step alone.
          if [ "$examined" -eq 0 ]; then
            echo "::error title=instance-adoption: zero instances examined::The discovery step found instances but this step never got to any of them." >&2
            exit 1
          fi

          if [ "$gaps" -gt 0 ]; then
            echo "::error title=instance-adoption: adoption gap(s) or an unreadable instance found::${gaps} of ${examined} instance(s) had a finding:${failed_instances}. See the job step summary or log above." >&2
            exit 1
          fi

          exit 0

      - name: Open or update a tracking issue on any failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          title="instance-adoption scheduled report: an instance has not consumed a shipped channel"
          denom="${{ steps.check.outputs.denom }}"
          [ -n "$denom" ] || denom="(the run failed before the check step could compute a denominator -- see the run log)"
          body=$(printf '%s\n' \
            "\`$denom\`" \
            "" \
            "Run: ${run_url}" \
            "" \
            "See the job step summary on the run above for which instance(s) and which registered " \
            "pair(s) (core-api-environment, ...) are affected, and the printed remedy for each." \
            "" \
            "Each finding here is a REAL, actionable gap, not tolerated residue: " \
            "checkInstanceAdoption only marks a pair unadopted once the target template tree " \
            "actually ships the channel and the instance's own tree has not consumed it " \
            "(biffo-template#1538/#1570/#1609)." \
            "" \
            "This issue is not auto-closed on the next clean run, per AGENTS.md section 4 -- " \
            "confirm the instance actually adopted the channel before closing it.")
          existing=$(gh issue list --state open --limit 100 --json number,title \
            --jq "map(select(.title == \"${title}\")) | .[0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
