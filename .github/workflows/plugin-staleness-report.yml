name: Plugin-staleness estate report

# plugin-staleness notifier (#1559): the measurement has existed since #1547 —
# `biffo check plugin-staleness` / `biffo plugin staleness` (cli/src/lib/
# plugin-staleness.ts) — but nothing ever CALLED it anywhere in the estate.
# Grepped both live instances' `origin/dev` under `.github/`, `scripts/` and
# `package.json` for any caller: zero. A guard with a correct mechanism and no
# caller is no guard (#1413's shape, again) — a vendored plugin can drift
# arbitrarily far behind its source while both sides' CI stays green, because
# neither has an opinion about the gap between them.
#
# This workflow is the caller. It is the template's own #1559 decision memo,
# option **C** (the owner's pick, 2026-09-08): a daily report that opens ONE
# CLOSABLE ISSUE PER STALE (instance, plugin) PAIR — never a single standing
# status issue. `shared-sync-report.yml`'s tracking issue (#1632) is the
# measured demonstration of why not: open since 2026-08-17, 15+ automated
# comments, zero action, because a perpetual status issue has no completion
# criterion so nobody can ever finish it. A per-pair issue closes exactly once
# — when its refresh PR merges — so it is triaged like any other item in the
# queue instead of decaying like a dashboard nobody owns.
#
# Modelled closely on instance-adoption-report.yml: same estate-discovery
# shape, same BIFFO_GITHUB_TOKEN cross-repo auth, same "open-or-update by
# exact stable title, never auto-close" pattern (AGENTS.md section 4 — an
# issue here closes only once a human or a later builder confirms the refresh
# actually merged, never on the next clean run).
#
# ## Push vs pull, decided
#
# The decision memo found push and pull no longer differ by a subsystem (a
# push design's "no consumer registry" cost was already retired by
# instance-adoption-report.yml's own discovery, which this workflow reuses)
# — they differ by one workflow file here versus one per plugin repo forever.
# Pull, reusing the estate discovery that already runs green daily, is the
# cheap side of that trade, and the measured drift (1-5 commits per fortnight
# per pair, not the "fire" a stale, pre-#1558 measurement once suggested)
# does not justify the more expensive side.
#
# ## Why this opens issues rather than PRs (notify, not auto-refresh)
#
# The memo's Q2: auto-opening refresh PRs is the right answer once #1565's
# remaining two symptom classes close — until then it would auto-manufacture
# red PRs on exactly the pairs it is meant to help (biffo-platform#164, the
# one refresh PR done so far, took 27 hours and hand-fixes to land clean).
# So this workflow only ever opens an ISSUE naming the remedy command; a
# human or a later builder runs the actual refresh.

on:
  schedule:
    # 08:00 UTC — after every other scheduled estate clone this repo already
    # runs (shared-sync-report 06:00, core-direct-paths-report 06:30,
    # instance-adoption-report 07:00, orphan-ratchet-report and
    # distribution-remote-state-report both 07:30), so none of them hit the
    # same two owners' APIs in the same window.
    - cron: '0 8 * * *'
  workflow_dispatch:

concurrency:
  group: plugin-staleness-report
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  report:
    name: Report vendored-plugin staleness across the live estate
    # Only the template repo should ever run this job. `.github/` is wholly
    # template-owned (core-manifest.json), except `*.instance.yml`, so this
    # file rides `biffo core upgrade` into every instance exactly like
    # instance-adoption-report.yml does — and without this guard each
    # instance would re-run the ENTIRE estate audit on its own schedule and
    # open its own duplicate per-pair issues for pairs that have nothing to
    # do with it. shared-sync-report.yml and core-direct-paths-report.yml
    # predate this guard and still lack it (a known, out-of-scope-here gap);
    # do not repeat that mistake in a new workflow.
    if: github.repository == 'keiranholloway/biffo-template'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      # This step's own tree supplies the CHECKING LOGIC (cli/src/lib/
      # plugin-staleness.ts) that runs against each cloned instance below, so
      # it must be the real tip, not whatever SHA triggered the run — same
      # reasoning as instance-adoption-report.yml's identical step.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: dev
          fetch-depth: 0

      - name: Re-point the checkout at the current origin/dev tip
        run: |
          set -eu
          git fetch origin dev --prune
          git reset --hard origin/dev
          behind=$(git rev-list --count HEAD..origin/dev)
          if [ "$behind" -ne 0 ]; then
            echo "::error title=plugin-staleness: checkout still behind origin/dev::Reset to origin/dev but still $behind commit(s) behind." >&2
            exit 1
          fi
          echo "checkout is at origin/dev tip: $(git rev-parse --short HEAD)"

      - name: Discover live instances and clone them fresh
        id: estate
        env:
          GH_TOKEN: ${{ secrets.BIFFO_GITHUB_TOKEN }}
        run: |
          set -u
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error title=plugin-staleness: no cross-repo token::BIFFO_GITHUB_TOKEN is not set. The default GITHUB_TOKEN cannot read other repos, so this job cannot see any instance -- refusing to report a clean run against nothing it could reach." >&2
            exit 1
          fi

          ESTATE="$RUNNER_TEMP/plugin-staleness-estate"
          mkdir -p "$ESTATE"

          # Identical discovery to instance-adoption-report.yml / shared-sync-
          # report.yml / core-direct-paths-report.yml, same reason: `GET
          # /users/keiranholloway/repos` returns PUBLIC repos only regardless
          # of token; `GET /user/repos?affiliation=owner` is the
          # authenticated, owner-scoped call that actually sees the private
          # estate.
          if ! gh api "user/repos?affiliation=owner&per_page=100" --paginate \
              --jq '.[] | select(.owner.login == "keiranholloway" and .archived == false and .fork == false) | .full_name' \
              >> "$RUNNER_TEMP/candidates.txt.tmp"; then
            echo "::error title=plugin-staleness: could not list keiranholloway's repos::gh api user/repos?affiliation=owner failed -- refusing to survey a shrunk, silently-partial estate." >&2
            exit 1
          fi
          if ! gh api "orgs/tabsii-com/repos?per_page=100" --paginate \
              --jq '.[] | select(.archived == false and .fork == false) | .full_name' \
              >> "$RUNNER_TEMP/candidates.txt.tmp"; then
            echo "::error title=plugin-staleness: could not list tabsii-com's repos::gh api orgs/tabsii-com/repos failed -- refusing to survey a shrunk, silently-partial estate." >&2
            exit 1
          fi
          candidates="$RUNNER_TEMP/candidates.txt"
          mv "$RUNNER_TEMP/candidates.txt.tmp" "$candidates"

          : > "$candidates.filtered"
          while IFS= read -r slug; do
            name="${slug##*/}"
            case "$name" in
              biffo-template) continue ;;   # this repo IS the template; it vendors no plugins
              biffo-*|tabsii-*) ;;
              *) continue ;;
            esac
            printf '%s\n' "$slug" >> "$candidates.filtered"
          done < "$candidates"

          cloned=0
          while IFS= read -r slug; do
            [ -n "$slug" ] || continue
            name="${slug##*/}"
            echo "cloning ${slug}"
            if ! gh repo clone "$slug" "$ESTATE/$name" -- --quiet --depth 1 2>&1; then
              echo "::error title=plugin-staleness: could not clone ${slug}::A repo this job could see in the listing but could not clone is a LOUD failure, not a skip -- the alternative silently shrinks the denominator the same way #1145 did for branch protection." >&2
              exit 1
            fi
            cloned=$((cloned + 1))
          done < "$candidates.filtered"

          if [ "$cloned" -eq 0 ]; then
            echo "::error title=plugin-staleness: zero candidate repos::Listed keiranholloway and tabsii-com and found nothing matching biffo-*/tabsii-* to even attempt -- a configuration error in this workflow or a naming-convention change, not a clean estate." >&2
            exit 1
          fi

          # An instance is a repo carrying biffo.core.json at its root — the
          # only kind of repo that can vendor a plugin under services/ in the
          # first place. A plugin or sibling repo correctly has none and is
          # correctly excluded here, not counted as a miss.
          : > "$RUNNER_TEMP/instances.txt"
          for dir in "$ESTATE"/*/; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            if [ -f "${dir%/}/biffo.core.json" ]; then
              printf '%s\n' "$name" >> "$RUNNER_TEMP/instances.txt"
            fi
          done
          instance_count=$(wc -l < "$RUNNER_TEMP/instances.txt" | tr -d ' ')

          if [ "$instance_count" -eq 0 ]; then
            echo "::error title=plugin-staleness: zero instances found::Cloned ${cloned} candidate repo(s) but NONE carried biffo.core.json -- refusing to report a clean run against an empty population. If every instance repo was renamed or moved, this workflow's discovery needs updating; if not, something in this step broke." >&2
            exit 1
          fi

          echo "estate=$ESTATE" >> "$GITHUB_OUTPUT"
          echo "cloned=$cloned" >> "$GITHUB_OUTPUT"
          echo "instance_count=$instance_count" >> "$GITHUB_OUTPUT"
          echo "cloned ${cloned} candidate repo(s), ${instance_count} carry biffo.core.json (instances): $(paste -sd, - "$RUNNER_TEMP/instances.txt")"

      - uses: pnpm/action-setup@v4
        if: steps.estate.outcome == 'success'
      - uses: actions/setup-node@v5
        if: steps.estate.outcome == 'success'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install this repo's dependencies (the CLI that runs the check)
        id: install
        if: steps.estate.outcome == 'success'
        run: pnpm install --frozen-lockfile

      - name: Run the plugin-staleness check against every discovered instance
        id: check
        if: ${{ !cancelled() && steps.estate.outcome == 'success' && steps.install.outcome == 'success' }}
        run: |
          set -u
          estate="${{ steps.estate.outputs.estate }}"
          theirs_dir="$(pwd)"
          findings="$RUNNER_TEMP/plugin-staleness-findings.jsonl"
          : > "$findings"
          log="$RUNNER_TEMP/plugin-staleness-check.log"
          : > "$log"

          # A thin JSON-serialising shim around `checkPluginStaleness` itself
          # (cli/src/lib/plugin-staleness.ts) -- not a re-implementation of
          # its discovery or comparison logic, which is what actually does
          # the work (discoverVendoredPlugins, checkViaProvenance, the
          # registry/SHA fallback). `biffo plugin staleness` / `biffo check
          # plugin-staleness` only ever print prose for a human; this needs
          # each pair's plugin repo (`result.source`) as data, to build a
          # stable per-pair issue title, without re-parsing it back out of
          # that prose. Dynamic `import()` against a `file://` URL, not a
          # static import, because this script does not live under `cli/`
          # (so a relative specifier has nothing to resolve against) --
          # tsx's loader hook rewrites `.js`-mapped-to-`.ts` specifiers for
          # every import in the process it runs, static or dynamic alike.
          runner="$RUNNER_TEMP/plugin-staleness-runner.mjs"
          cat > "$runner" <<'EOF'
          import { pathToFileURL } from 'node:url'

          const [, , theirsDir, instanceDir] = process.argv
          const staleness = await import(pathToFileURL(`${theirsDir}/cli/src/lib/plugin-staleness.js`).href)
          const gitAdapterMod = await import(pathToFileURL(`${theirsDir}/cli/src/adapters/git/index.js`).href)
          const registryAdapterMod = await import(
            pathToFileURL(`${theirsDir}/cli/src/adapters/registry/index.js`).href
          )

          const results = await staleness.checkPluginStaleness(instanceDir, {
            registry: new registryAdapterMod.RegistryAdapter(),
            git: new gitAdapterMod.GitAdapter(),
          })
          process.stdout.write(JSON.stringify(results))
          EOF

          examined=0
          behind_count=0
          cannot_tell_count=0
          checked_names=""

          while IFS= read -r name; do
            [ -n "$name" ] || continue
            echo "== ${name} ==" >> "$log"
            checked_names="${checked_names}${checked_names:+, }${name}"

            out=$("$theirs_dir/cli/node_modules/.bin/tsx" "$runner" "$theirs_dir" "${estate}/${name}" 2>>"$log")
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "  (tsx exited ${rc} -- see log)" >> "$log"
              echo "::error title=plugin-staleness: check crashed for ${name}::The staleness check itself failed to run for ${name} (exit ${rc}), not a plugin reporting stale -- see the run log." >&2
              cannot_tell_count=$((cannot_tell_count + 1))
              examined=$((examined + 1))
              continue
            fi

            # One JSON line per (instance, plugin) result, tagged with the
            # instance name the CLI itself has no reason to know about.
            printf '%s\n' "$out" | node -e '
              const data = JSON.parse(require("fs").readFileSync(0, "utf8"))
              const instance = process.argv[1]
              for (const r of data) console.log(JSON.stringify({ instance, ...r }))
            ' "$name" >> "$findings"

            plugin_count=$(printf '%s\n' "$out" | node -e 'console.log(JSON.parse(require("fs").readFileSync(0,"utf8")).length)')
            echo "  ${plugin_count} vendored plugin(s)" >> "$log"
            printf '%s\n' "$out" >> "$log"
            examined=$((examined + 1))
          done < "${RUNNER_TEMP}/instances.txt"

          behind_count=$(grep -c '"status":"behind"' "$findings" 2>/dev/null || true)
          cannot_tell_count=$((cannot_tell_count + $(grep -c '"status":"cannot-tell"' "$findings" 2>/dev/null || true)))

          denom="examined ${examined} instance(s): ${checked_names:-(none)}; ${behind_count} pair(s) behind, ${cannot_tell_count} cannot-tell"
          echo "$denom"
          {
            echo "### Plugin-staleness estate report"
            echo
            echo "\`$denom\`"
            echo
            echo '```'
            cat "$log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "denom=$denom" >> "$GITHUB_OUTPUT"
          echo "findings=$findings" >> "$GITHUB_OUTPUT"
          echo "examined=$examined" >> "$GITHUB_OUTPUT"
          echo "behind_count=$behind_count" >> "$GITHUB_OUTPUT"
          echo "cannot_tell_count=$cannot_tell_count" >> "$GITHUB_OUTPUT"

          # Fail closed (#1363): a run that examined zero instances is the
          # exact vacuity this workflow exists to end, even though the
          # discovery step above already guards a zero instance_count -- this
          # is the second, independent check at the layer that actually
          # iterates.
          if [ "$examined" -eq 0 ]; then
            echo "::error title=plugin-staleness: zero instances examined::The discovery step found instances but this step never got to any of them." >&2
            exit 1
          fi

          # `behind` alone does NOT redden this job. Drift is expected and not
          # itself a defect (the same reasoning `biffo check plugin-staleness`
          # documents for why it never fails a build over it) -- the per-pair
          # issue opened below is the notification, not this run's exit code.
          # `cannot-tell` is different: per the estate's three-valued
          # convention (scripts/claim.sh's own comment on why 2 is never a
          # pass), it means the measurement itself could not be made, which
          # IS worth a red run on the Actions tab. Note the one expected,
          # survivable source of cannot-tell here: a provenance record whose
          # `origin` names a local filesystem path (an artifact of a
          # `--local` refresh, e.g. biffo-platform#164) has nothing to
          # resolve on a runner, so `checkOnePlugin` deliberately falls
          # through to the registry lookup (plugin-staleness.ts:162) and then
          # back onto the cheap SHA path -- this is expected and already
          # exercised by that fallback, not a bug to "fix" by teaching this
          # workflow to special-case local paths. A cannot-tell that reaches
          # here means even that fallback failed (network, or the plugin
          # dropped from the registry), which is genuinely worth surfacing.
          #
          # Verified live 2026-09-08 while building this workflow (not this
          # workflow's bug, and out of scope to fix here): the registry
          # currently DOES throw for every plugin on that fallback path --
          # `RegistryAdapter.fetchRegistry()` validates the whole
          # `plugins.json` array in one `safeParse`, and at least one entry's
          # `ui_components` is still shaped as the pre-#1555 `string[]`
          # against the object-array schema #1555 shipped, so the WHOLE
          # fetch rejects and every plugin's registry fallback reads as "not
          # found in the registry" even though the registry is reachable and
          # does carry that plugin. Expect this run's first executions to
          # report cannot-tell for exactly the pairs the 2026-08-31 decision
          # memo already knew had a local-path origin (marketing,
          # idea-scout, ideation) until either that data is fixed upstream
          # in keiranholloway/biffo-plugins-registry, or their provenance is
          # re-recorded against a fetchable origin. That is the CORRECT
          # behaviour for this check to have -- reporting cannot-tell rather
          # than a false up-to-date -- not a reason to loosen it here.
          if [ "$cannot_tell_count" -gt 0 ]; then
            echo "::error title=plugin-staleness: ${cannot_tell_count} pair(s) could not be measured::See the job step summary or log above for which instance(s)/plugin(s)." >&2
            exit 1
          fi

          exit 0

      - name: Open or update one issue per stale (instance, plugin) pair
        # Runs whenever the check step ran at all, whether or not it (or an
        # earlier step) failed -- a cannot-tell finding on one pair must not
        # suppress the closable issues this run also found for OTHER pairs
        # that came back a clean `behind`. Never gated on job success, unlike
        # instance-adoption-report.yml's single `if: failure()` tracking
        # step: that workflow treats its own finding as the failure this
        # step reacts to; this workflow's finding is one or more issues, and
        # `behind` deliberately does not fail the check step above at all.
        if: always() && steps.check.outputs.findings != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          findings="${{ steps.check.outputs.findings }}"
          [ -f "$findings" ] || { echo "no findings file — nothing to report"; exit 0; }
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          opened=0
          updated=0

          while IFS= read -r line; do
            [ -n "$line" ] || continue
            status=$(printf '%s' "$line" | node -e 'console.log(JSON.parse(require("fs").readFileSync(0,"utf8")).status)')
            [ "$status" = 'behind' ] || continue

            instance=$(printf '%s' "$line" | node -e 'console.log(JSON.parse(require("fs").readFileSync(0,"utf8")).instance)')
            plugin=$(printf '%s' "$line" | node -e 'console.log(JSON.parse(require("fs").readFileSync(0,"utf8")).name)')
            detail=$(printf '%s' "$line" | node -e 'console.log(JSON.parse(require("fs").readFileSync(0,"utf8")).detail)')
            source=$(printf '%s' "$line" | node -e 'const r=JSON.parse(require("fs").readFileSync(0,"utf8")); console.log(r.source ?? "")')

            # `source` is a fetchable repo URL on every path this workflow
            # actually reaches in practice: `checkOnePlugin` only takes the
            # local-directory content-diff branch when the recorded origin
            # is BOTH unfetchable AND still exists on the machine running the
            # check (plugin-staleness.ts's `localOrigin`) -- on this runner,
            # a path from whoever's laptop ran a `--local` refresh never
            # exists, so that branch is unreachable here and the library
            # itself falls through to the registry lookup instead (see the
            # check step's own comment on this). Guarded anyway, defensively:
            # a bare local path has no `git clone`-able form, so building
            # one from it would print a remedy nobody else could run.
            case "$source" in
              http://*|https://*|git://*|ssh://*|*@*:*)
                repo_slug="${source##*/}"
                repo_slug="${repo_slug%.git}"
                remedy=$(printf '%s\n' \
                  '```' \
                  "git clone ${source} ../${repo_slug}   # if you do not already have it checked out" \
                  "cd ${instance}" \
                  "npx @biffo/cli plugin upgrade ${plugin} --local ../${repo_slug}" \
                  '```')
                ;;
              *)
                repo_slug='(unresolved plugin repo — see Source below)'
                remedy=$(printf '%s\n' \
                  "\`source\` was not a fetchable repo URL (${source:-none recorded}) -- " \
                  'run `biffo plugin staleness` directly against this instance to resolve a remedy.')
                ;;
            esac

            title="plugin staleness: ${instance}/${plugin} is behind ${repo_slug}"

            body=$(printf '%s\n' \
              "\`${detail}\`" \
              "" \
              "Vendored copy: \`services/${plugin}/\` in \`${instance}\`" \
              "Source: \`${source:-unknown}\`" \
              "" \
              "**Remedy** (the same route every refresh so far has used, e.g. biffo-platform#164):" \
              "" \
              "${remedy}" \
              "" \
              "Run: ${run_url}" \
              "" \
              "This issue is not auto-closed on the next clean run, per AGENTS.md section 4 -- " \
              "confirm the refresh PR actually merged before closing it.")

            existing=$(gh issue list --state open --limit 100 --json number,title \
              --jq "map(select(.title == \"${title}\")) | .[0].number // empty")
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "$body"
              updated=$((updated + 1))
            else
              gh issue create --title "$title" --body "$body"
              opened=$((opened + 1))
            fi
          done < "$findings"

          echo "opened ${opened} new issue(s), updated ${updated} existing issue(s)"
