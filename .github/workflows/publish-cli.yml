name: Publish CLI

# Publishes the scaffolding CLI to npm as the unscoped package `biffo` (#259).
#
# The published version IS the core version. There is no independent CLI
# version and no mapping table: `biffo@0.32.9` is the CLI shipping core 0.32.9,
# so any scaffolded repo is traceable to the exact build that made it — the
# "no version identity" gap #259 names.
#
# Trigger: the `core-v*` tags that core-tag.yml already maintains. Since #294
# those tags stand for the template-owned tree at that core version (with an
# audit), so a tag is exactly the right release point.
on:
  push:
    tags: ['core-v*']
  # Manual re-run, against a tag ref. Publishing is the step most likely to fail
  # for reasons unrelated to the code (missing/expired NPM_TOKEN, npm outage,
  # a GitHub dispatch that never fired — see #293). A release you cannot
  # re-trigger is a trap.
  workflow_dispatch:
    inputs:
      tag:
        description: 'core-v<version> tag to publish (defaults to the ref this was dispatched on)'
        required: false
        type: string
      dry_run:
        description: 'Pack and validate only — do not publish to npm'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # Required for `npm publish --provenance` to mint a Sigstore attestation.
  id-token: write

env:
  NODE_VERSION: '22'

jobs:
  publish:
    name: Publish biffo to npm
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      # This workflow lives in a template-owned path, so it ships to every
      # scaffolded instance — which must never publish the template's CLI to
      # npm under its own tags. Detected the same way core-tag.yml does it:
      # biffo.core.json exists in an instance and never in the template.
      - name: Skip in instances
        id: guard
        run: |
          set -euo pipefail
          if [ -f biffo.core.json ]; then
            echo "biffo.core.json present — this is an instance, not the template. Skipping."
            echo "is_template=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_template=true" >> "$GITHUB_OUTPUT"
          fi

      # The tag IS the version (#423). It is created by core-tag.yml, which
      # derives it as "highest existing core-v* tag, bumped by the commit's
      # conventional type" — so nothing in the tree names a version that could
      # disagree with it, and there is nothing left to cross-check.
      - name: Resolve version
        id: version
        if: steps.guard.outputs.is_template == 'true'
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          case "$tag" in
            core-v*) version="${tag#core-v}" ;;
            *)
              echo "::error::'$tag' is not a core-v* tag. Publish only from a core version tag."
              exit 1
              ;;
          esac
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$tag' does not carry a semver version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The commit actually checked out — not $GITHUB_SHA, which is the SHA
          # of the event's ref and diverges from what was built whenever the
          # `tag` input names something other than the dispatch ref. The failure
          # report compares this against the registry's gitHead, so it has to be
          # the tree in hand.
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Publishing biffo@$version from $tag"

      - uses: pnpm/action-setup@v4
        if: steps.guard.outputs.is_template == 'true'
      - uses: actions/setup-node@v5
        if: steps.guard.outputs.is_template == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile
        if: steps.guard.outputs.is_template == 'true'

      - name: Build
        if: steps.guard.outputs.is_template == 'true'
        run: pnpm --filter @biffo/cli build

      # package.json carries a 0.0.0 placeholder: the version comes from the tag
      # and is stamped here, so it is the published package.json — and therefore
      # the installed CLI's `--version` — that carries the core version.
      - name: Stamp package version
        if: steps.guard.outputs.is_template == 'true'
        working-directory: cli
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      # `npm pack` runs prepack, which copies the repo-root assets listed in
      # cli/scripts/packaged-root-assets.mjs into the package. Verify they
      # actually landed in the tarball: without _skeletons/ `biffo init`
      # creates both repos and then dies at step 6/6 leaving the app sibling
      # empty (#315). Both shipped green — every in-repo test still passes,
      # because the upward walk finds the repo root in a checkout. The tarball is
      # the only honest evidence, so it is checked here, at the gate.
      - name: Verify tarball carries its packaged root assets
        if: steps.guard.outputs.is_template == 'true'
        working-directory: cli
        run: |
          set -euo pipefail
          # tail -n1: `npm pack` prints the filename last, but any prepack hook's
          # stdout precedes it. --silent only quiets npm itself, not the hooks it
          # runs. Belt and braces with sync-core-version.mjs now logging to stderr.
          tarball="$(npm pack --silent | tail -n1)"

          # List the tarball ONCE into a file, then grep the file.
          #
          # Not a style preference — `tar -tzf … | grep -q …` is a live trap
          # under `set -o pipefail`. `grep -q` exits the moment it matches,
          # closing the pipe; tar then dies of SIGPIPE (141) and pipefail
          # promotes that to the pipeline's status. The result is a check that
          # reports "missing" for a file that is *present*, and it fires only
          # once the listing outgrows the pipe buffer — so it stayed dormant
          # while the tarball was small and broke the 0.40.0 publish the moment
          # _skeletons/ (70 files) landed. See AGENTS.md §4 on pipe exit status.
          listing="$(mktemp)"
          tar -tzf "$tarball" > "$listing"

          # The package's own version is the core version the installed CLI
          # reports (getLatestCoreVersion reads it), so a tarball whose stamped
          # version disagrees with the tag would ship a CLI that misreports which
          # core it is — the #259 failure by another route.
          packed="$(tar -xzOf "$tarball" package/package.json | node -e \
            'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).version))')"
          if [ "$packed" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tarball package.json version '$packed' != published version '${{ steps.version.outputs.version }}'."
            exit 1
          fi
          echo "OK: tarball is stamped $packed"

          # _skeletons/ must be present AND complete. Checking only that the
          # directory prefix appears would pass on an empty tree, which would
          # ship and still fail at `biffo init` step 6/6 — so assert on real
          # files the scaffolder reads.
          for required in \
            'package/_skeletons/sibling-template/biffo.sibling.json' \
            'package/_skeletons/plugin-template/biffo.plugin.json' \
            'package/_skeletons/sibling-template/_gitignore'
          do
            if ! grep -qx "$required" "$listing"; then
              echo "::error::Packed tarball is missing $required — refusing to publish."
              grep '_skeletons' "$listing" || echo "(no _skeletons entries at all)"
              exit 1
            fi
          done
          # grep -c exits 1 on zero matches, which `set -e` would treat as fatal
          # before the count could be reported; `|| true` keeps the message.
          skeleton_files="$(grep -c '^package/_skeletons/' "$listing" || true)"
          echo "OK: tarball ships _skeletons ($skeleton_files entries)"
          rm -f "$tarball" "$listing"

      # Trusted publishing (OIDC) needs a recent npm: support landed in 11.5.1,
      # and Node 22 still bundles npm 10.x. Without this the CLI never exchanges
      # the OIDC token, silently falls back to looking for a credential that no
      # longer exists, and the publish fails with a 404 that reads like a
      # missing package (#664). Pin-free `@latest` is deliberate — this is the
      # publish path, and an npm too old to authenticate is the failure mode.
      - name: Use an npm that supports trusted publishing
        if: steps.guard.outputs.is_template == 'true' && !inputs.dry_run
        run: |
          npm install -g npm@latest
          npm --version

      # Publish, and make the failure legible.
      #
      # This step used to be a bare `npm publish`. It failed the job on the #342
      # release race — correctly, as exit codes go — with npm's 403 "cannot
      # publish over the previously published versions" as the only record, in a
      # log nobody had reason to open. main carried one tree, npm carried
      # another as 0.41.9, and nothing said so.
      #
      # Exit status was never the gap. The gap is that "npm is down" and "this
      # version was already released from a different tree" arrive looking the
      # same, and only one of them is fixed by pressing re-run. So npm's output
      # is captured and handed to report-publish-failure.ts, which classifies it
      # and writes ::error:: annotations plus a step summary saying what happened
      # and what to do. The judgement is unit-tested in cli/src/lib/npm-publish.ts
      # rather than living in this YAML.
      - name: Publish
        if: steps.guard.outputs.is_template == 'true' && !inputs.dry_run
        working-directory: cli
        env:
          # No NODE_AUTH_TOKEN: this package publishes via npm trusted
          # publishing (OIDC). npm exchanges the `id-token: write` credential
          # this job already requests — the same one provenance uses — for a
          # short-lived registry token, so there is no long-lived secret to
          # expire, rotate, or leak. The trust is registered on the package
          # itself: npmjs.com → @biffo/cli → Settings → Trusted Publisher,
          # naming this repository and this workflow filename. Renaming this
          # file, or publishing from a different workflow, breaks publishing
          # until that registration is updated to match.
          NPM_CONFIG_PROVENANCE: 'true'
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ inputs.tag || github.ref_name }}
          COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          set -u
          log="$(mktemp)"

          # Deliberately NOT `set -o pipefail` here, and deliberately not `set
          # -e`: the default shell is `bash -e`, so either would abort on the
          # very failure this step exists to explain. PIPESTATUS[0] is npm's own
          # status through the tee — see AGENTS.md §4 on exit status through a
          # pipe, which is how a teardown once reported success while destroying
          # nothing.
          set +e
          npm publish --provenance --access public 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e

          package="$(node -p "require('./package.json').name")"

          if [ "$status" -eq 0 ]; then
            echo "::notice::Published ${package}@${VERSION} from ${TAG}."
            {
              echo "### ✅ Published \`${package}@${VERSION}\`"
              echo
              echo "From \`${TAG}\` (\`${COMMIT}\`), with provenance."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Ask the registry what it actually holds for this version. npm records
          # gitHead on publish, so this is what turns "someone must decide which
          # of the tag and the registry is right" into a one-line verdict. Best
          # effort: an outage here must not replace the real failure with its own.
          registry_git_head="$(npm view "${package}@${VERSION}" gitHead 2>/dev/null || true)"

          PUBLISH_PACKAGE="$package" \
          PUBLISH_VERSION="$VERSION" \
          PUBLISH_TAG="$TAG" \
          PUBLISH_COMMIT="$COMMIT" \
          PUBLISH_LOG="$log" \
          PUBLISH_REGISTRY_GIT_HEAD="$registry_git_head" \
            pnpm --filter @biffo/cli report:publish-failure

      - name: Dry run summary
        if: steps.guard.outputs.is_template == 'true' && inputs.dry_run
        run: echo "Dry run — biffo@${{ steps.version.outputs.version }} packed and verified, not published."
