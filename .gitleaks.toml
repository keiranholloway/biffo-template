title = "Biffo Gitleaks Configuration"

[extend]
useDefault = true

[[rules]]
id = "biffo-aws-account-id"
description = "AWS Account ID — should only appear in .tfvars.example or biffo.config.json placeholders"
regex = '''\b\d{12}\b'''
entropy = 0
[rules.allowlist]
regexes = [
  "\\{\\{AWS_ACCOUNT_ID\\}\\}",  # placeholder in template files
  "123456789012",                  # canonical example account ID used in tests
  "999999999999",                  # canonical wrong-account ID used in error-path tests
  # The fck-nat AMI vendor's PUBLIC AWS account id (modules/cloud/aws/networking).
  # An `aws_ami` data source filters by `owners`, so the publisher's account id
  # must appear literally — it is how AMI ownership lookup works and cannot not.
  # It is not secret: it is published in fck-nat's docs (fck-nat.dev) and the
  # RaJiska/fck-nat Terraform module, and is the same value in every fck-nat
  # deployment worldwide. Same spirit as the siblings carve-out below: narrow a
  # bare-12-digit heuristic away from a value it structurally must match, scoped
  # to this rule only — the rule still fires on every other 12-digit number.
  "568608671756",
]
paths = [
  "docs/",
  "README.md",
  "\\.example$",
  # The sibling CDN registry (ADR-0007). Its `bucket_regional_domain` values
  # are S3 virtual-hosted DNS names — `<project>-<env>-site-<account>.s3...` —
  # so they contain the account id BY CONSTRUCTION and cannot not. They are
  # also not secret: the same names appear in Terraform state, in CloudFront's
  # origin config, and in the sibling's own deploy logs.
  #
  # This narrows a heuristic ("any bare 12-digit number") away from one file it
  # structurally must match, in the same spirit as the .example and docs/
  # entries above. It is not a general loosening: the rule still fires on every
  # other path, including biffo.config.json, which is what it exists to guard.
  #
  # Scoped to this rule only, deliberately, not the global [allowlist].
  #
  # This was already latent: `biffo sibling create`'s registration PR has always
  # written this file into the core repo. Issue #306 makes `biffo init` write it
  # for every instance on day one, which is what surfaced it.
  "siblings\\.auto\\.tfvars\\.json$",
]

[[rules]]
id = "biffo-placeholder-config"
description = "Placeholder values in biffo.config.json must not be replaced with real secrets"
regex = '''"(aws_account_id|oidc_role_arn|admin_email)":\s*"[^{]'''

[allowlist]
paths = [
  "docs/",
  ".github/",
  "scripts/setup-oidc.sh",
]
regexes = [
  "EXAMPLE",
  "\\{\\{.*\\}\\}",
]
