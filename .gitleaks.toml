title = "Biffo Gitleaks Configuration"

[extend]
useDefault = true

[[rules]]
id = "biffo-placeholder-config"
description = "Placeholder values in biffo.config.json must not be replaced with real secrets"
regex = '''"(aws_account_id|oidc_role_arn|admin_email)":\s*"[^{]'''

[allowlist]
paths = [
  "docs/",
  ".github/",
  "scripts/setup-oidc.sh",
  # Written when `scripts/verify.sh`'s filesystem pass (`--no-git`) walked the
  # raw working directory: a real `terraform.tfstate` on a workstation that had
  # run `terraform init` failed the gate every time, for a file the developer
  # cannot remove and is not pushing -- see the long comment for why this was
  # a SCOPE correction rather than a suppression, the distinction AGENTS.md §7
  # turns on.
  #
  # Superseded, not removed (#1194). The working-tree pass now mirrors
  # `git ls-files` into a scratch directory and scans THAT, so `.terraform/`
  # -- gitignored in every Biffo repo -- is no longer copied in and this entry
  # no longer does the job it was written for: nothing untracked reaches the
  # scan at all now, this path included. It stays for one reason only, and it
  # is a narrower one than before -- `secret-scan-scope.test.ts` asserts on
  # its literal presence, coupling this entry to the CI filesystem pass
  # (`ci.yml`'s own `--no-git`, over a plain checkout, which still walks the
  # raw tree exactly as this was originally written against). Removing it here
  # without also revisiting that test and CI's own invocation is a separate,
  # untaken change; scope for this PR was `scripts/verify.sh` and this file,
  # not the workflow or its guard test.
  #
  # The residual risk this leaves: if `.terraform/state` were ever
  # force-tracked (`git add -f`) into THIS repo's `verify.sh` pass, it would
  # now be mirrored and scanned, and this entry would suppress a finding in it
  # -- a real secret about to be pushed, waved through by a rule whose
  # original premise (untracked, cannot be pushed) no longer holds for that
  # case. Flagged rather than silently accepted; not fixed in this change.
  ".terraform/",
]
regexes = [
  "EXAMPLE",
  "\\{\\{.*\\}\\}",
]
