# Scaled down from biffo-template's own root .github/workflows/ci.yml for a
# single sibling app (ADR-0007): one frontend package (apps/frontend), one
# backend service (services/api), one infra/ dir — no monorepo/Turborepo
# filtering needed since there's exactly one of each. Jobs are consolidated by
# toolchain (one JS job, one Python job) rather than one per check: GitHub bills
# each job's wall time rounded up to a full minute and re-installs deps per job,
# so a dozen sub-minute jobs are wasteful. Job *names* below match the core
# project's consolidated CI — `biffo sibling create` configures this repo's
# branch protection with that same status-check list (see
# cli/src/adapters/source-control/github/index.ts's DEFAULT_STATUS_CHECKS).
name: CI

on:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [dev, staging, main]
  # Manual re-run, matching the core project's CI. Without this there is no way
  # to trigger CI on a protected branch without pushing to it — and a sibling
  # repo has the same branch protection, so the same recovery gap. See #293.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.13'
  # Defence in depth for the class of bug in #322: an interactive Terraform
  # prompt on a CI runner has no stdin to read and blocks until the job is
  # killed. Every invocation also passes -input=false explicitly and a drift
  # guard enforces that; this is the backstop for one added without it.
  TF_INPUT: '0'

jobs:
  js:
    # This job also runs a Build step. The name is deliberately NOT extended to
    # say so: it is a required status check context, matched by string against
    # DEFAULT_STATUS_CHECKS and against the branch protection already written
    # onto every sibling repo created so far. Renaming it would leave those
    # repos waiting forever on a context nothing reports.
    name: JS (lint, types, test, audit)
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    # A self-hosted spot runner that is reclaimed mid-job leaves the job hanging
    # rather than failing: on 2026-07-30 five jobs across two PRs died with
    # "The runner has received a shutdown signal", and without a timeout a job
    # whose runner simply vanishes burns the 360-minute default before anyone
    # is told. 20m is ~4x the slowest job observed across this repo and
    # biffo-platform (JS, 5.4m), so a cold cache or a large PR will not trip it.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Check steps use `if: ${{ !cancelled() }}` so a failure in one still runs
      # the rest — every failure surfaces in a single run, not just the first.
      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm run lint
      - name: Type check
        if: ${{ !cancelled() }}
        run: pnpm run typecheck
      - name: Test
        if: ${{ !cancelled() }}
        run: pnpm run test
      # Run with NO NEXT_PUBLIC_CORE_COGNITO_* in scope — this is now the
      # PERMANENT state, not a build-guard quirk. The frontend NEVER reads those
      # vars: it resolves the core's Cognito identity at runtime from
      # /.well-known/biffo-identity.json (#403 Stage 3), so nothing is baked into
      # the bundle and deploy.yml no longer sets them either. `next build`
      # prerenders `/`, which imports src/lib/auth.ts; that module builds its
      # Cognito pool lazily (never at module scope) so the build succeeds with no
      # identity in scope. Originally added as a guard for the eager-construction
      # crash (issue #286); it now simply asserts a sibling's build needs no auth
      # credentials at all.
      - name: Build
        if: ${{ !cancelled() }}
        run: pnpm run build
      - name: Dependency audit
        if: ${{ !cancelled() }}
        # Fails on a real high/critical advisory, but treats a broken audit
        # registry as INCONCLUSIVE rather than reddening a required check for an
        # infrastructure hiccup (#591, #743). The raw `pnpm audit
        # --audit-level=high` this replaces exits non-zero identically whether it
        # found a vulnerability or simply could not parse the registry's
        # response, so any npm blip failed this job on every open PR at once.
        #
        # The relative path is deliberate. This job's working-directory is
        # apps/frontend, which is exactly the tree to audit, and the script
        # audits its own cwd — it is byte-identical to biffo-template's copy and
        # to every other satellite's, distributed by that repo's shared-sync.sh,
        # so it cannot assume a layout. Do not edit it here; edit it upstream.
        run: sh ../../scripts/js-dependency-audit.sh
      # The generic relocation of tabsii-platform#377 Phase 2's scale-guard --
      # the systemic half of that issue, built in biffo-template so every new
      # sibling (in any Biffo instance) is born with it. Ships as
      # @biffo/design-tokens's own bin, so it reaches CI on the next
      # design-tokens version bump with no separate distribution channel to
      # keep in sync -- same reasoning @tabsii-com/ui's original gave, and the
      # estate is deliberately shrinking shared-files.json in favour of
      # exactly this (#1109).
      #
      # A freshly-scaffolded sibling's @biffo/design-tokens has NOT adopted a
      # type scale yet (no --text-*/--space-* tokens) -- this is expected, not
      # broken, and the guard's own PASS/FAIL output says so on every run
      # rather than leaving it implicit. It still genuinely checks: with no
      # scale defined, "declare nothing hardcoded" is the only rule there is,
      # so scale-guard-baseline.json below records 0, a real baseline against
      # a real (currently empty) scan -- not a guard that is red from birth,
      # and not one that is silently skipped either. See bin/scale-guard.mjs
      # in packages/design-tokens (biffo-template) for the full design
      # rationale.
      - name: Scale drift guard
        if: ${{ !cancelled() }}
        run: pnpm exec biffo-scale-guard

  e2e:
    name: E2E (Playwright)
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    # `packages: read` so pnpm can install any private @tabsii-com/* package
    # from GitHub Packages using the workflow token. Harmless if this sibling
    # has none.
    permissions:
      contents: read
      packages: read
    # The official Playwright image, pinned to the @playwright/test version in
    # apps/frontend/package.json. It ships Chromium and every browser system
    # dependency, so this needs no `--with-deps`, no apt, and no root on the
    # self-hosted runners.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Browser system deps come from the container; this only drops the
      # Chromium binary into the resolved cache path (a no-op if present).
      - name: Install Chromium
        run: pnpm exec playwright install chromium
      # `playwright test` boots its own webServer: it builds the static export
      # and serves it base-path aware, INCLUDING
      # `/.well-known/biffo-identity.json`. Serving that document is what makes
      # the harness represent the deployed app -- without it the runtime pool
      # lookup (#403) resolves null and every spec dies on a redirect to the
      # portal, which is how tabsii-geo's CI broke for four hours (#1208).
      - name: E2E tests
        run: pnpm run e2e

  python:
    name: Python (lint, types, test, security)
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - name: Lint
        if: ${{ !cancelled() }}
        run: uv run ruff check .
      - name: Format check
        if: ${{ !cancelled() }}
        run: uv run ruff format --check .
      - name: Type check
        if: ${{ !cancelled() }}
        run: uv run pyright
      - name: Test
        if: ${{ !cancelled() }}
        # `--cov-report=json` is additive to the xml Coverage upload step reads:
        # the Error-branch coverage step below reads coverage.json and nothing
        # else, so without this line it has no input and exits 2 rather than
        # actually checking anything.
        run: uv run pytest --cov --cov-report=xml --cov-report=json
      # Fails only when error handling is ADDED with nothing exercising it
      # (biffo-template#956). An unexecuted `except` is unverified — nobody has
      # ever observed what it does. The analyser is template-owned and
      # distributed verbatim via shared-files.json's `files` at the repo root
      # (biffo-template#1603) — invoked with `../../` because this job's steps
      # run with working-directory services/api, same as
      # scripts/py-dependency-audit.sh below. `--source-root .` matters here:
      # coverage.json's paths are relative to THIS cwd (services/api), and the
      # script's default source root is two directories up from its own file —
      # right for the template/instance, wrong here, where the code being
      # measured lives under services/api, not the repo root. Do not edit this
      # script here; edit it upstream, same rule
      # scripts/py-dependency-audit.sh already carries. A freshly scaffolded
      # sibling has no baseline yet, so this reports what it finds and exits
      # 0 — take the first baseline with `uv run python
      # ../../scripts/error_branch_coverage.py --write --source-root .` once
      # real code exists to measure.
      - name: Error-branch coverage
        if: ${{ !cancelled() }}
        run: uv run python ../../scripts/error_branch_coverage.py --check --coverage coverage.json --source-root .
      - name: Coverage upload
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          files: services/api/coverage.xml
      - name: SAST (Bandit)
        if: ${{ !cancelled() }}
        run: uv run bandit -r src/ -ll --format json -o bandit-report.json
      - name: Upload Bandit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: services/api/bandit-report.json
      - name: Dependency audit
        if: ${{ !cancelled() }}
        # Same treatment as the JS job's Dependency audit above: fails on a real
        # advisory, INCONCLUSIVE on an unreachable PyPI/OSV (#591, #743). cwd is
        # services/api, which is the environment `uv sync` installed and so the
        # one to audit.
        run: sh ../../scripts/py-dependency-audit.sh
      - name: Routing smoke test — self-test
        if: ${{ !cancelled() }}
        # Not exercising this repo's own deployment (CI has none to reach) —
        # proves scripts/routing-smoke-test.sh, the deploy.yml post-deploy
        # routing check (#737), still catches the three recorded CDN routing
        # failures against a stubbed curl. A verification script with no
        # caller is the class tracked in #1413; this is that caller.
        run: sh ../../scripts/routing-smoke-test.test.sh
      - name: Core-revision preflight — self-test
        if: ${{ !cancelled() }}
        # Same shape as the routing smoke test above: not exercising a real
        # core deployment (CI has none to reach), proves
        # scripts/core-revision-preflight.sh — the deploy.yml
        # preflight-core-revision job (#1604) that blocks this sibling from
        # going live ahead of the core routes it depends on — still blocks a
        # stale core, passes a current one, and fails CLOSED when the digest
        # is missing, against a stubbed curl. Without this caller the script
        # is the #1413 zero-caller class the instant it lands.
        run: sh ../../scripts/core-revision-preflight.test.sh
      - name: Core-version preflight — self-test
        if: ${{ !cancelled() }}
        # Same shape as the two self-tests above: not exercising a real core
        # deployment (CI has none to reach), proves
        # scripts/core-version-preflight.sh — the deploy.yml
        # preflight-core-version job (#1605) that blocks this sibling from
        # deploying against an instance whose core TEMPLATE version is too
        # old — still blocks a stale core, passes a current one, and fails
        # CLOSED when the health document is missing or reports "unknown",
        # against a stubbed curl. Without this caller the script is the
        # #1413 zero-caller class the instant it lands.
        run: sh ../../scripts/core-version-preflight.test.sh
      - name: Guard self-test wiring — this repo's own scripts/*.test.sh
        if: ${{ !cancelled() }}
        working-directory: .
        # Level-3 self-audit (biffo-template#1710): the template repo's own
        # scripts/guard-self-test-wiring.sh globs its OWN root-level
        # scripts/*.test.sh with `find -maxdepth 1`, so it structurally
        # cannot reach a skeleton's copy of that discipline — which is
        # exactly how the plugin skeleton's routing-smoke-test.test.sh sat
        # unwired, undetected, until #1710 (this skeleton's own copy IS
        # correctly wired above; this step is what keeps the NEXT one from
        # repeating that). Explicit `working-directory: .` overrides this
        # job's `defaults.run.working-directory: services/api`, because the
        # scripts and workflows being audited live at the repo root, not
        # under services/api. Rather than teach the template's script to
        # walk into _skeletons/** (which would still only cover the
        # TEMPLATE repo, never a repo already scaffolded from this
        # skeleton), this repo checks ITSELF, so a sibling generated from
        # this skeleton fails closed from birth if a future *.test.sh guard
        # is added with no run: line anywhere. Residual: this step protects
        # repos generated FROM this skeleton going forward; it does not
        # give biffo-template's own CI a way to verify a skeleton's wiring
        # before it is ever scaffolded out — that remains
        # scripts/guard-self-test-wiring.sh's gap, tracked as the named
        # residual on #1710.
        run: |
          set -eu
          guards=$(find scripts -maxdepth 1 -type f -name '*.test.sh' | sort)
          if [ -z "$guards" ]; then
            echo "FAIL: found 0 scripts/*.test.sh — an empty discovery is not a vacuous pass." >&2
            exit 1
          fi
          missing=0
          for g in $guards; do
            name=$(basename "$g")
            found=0
            for wf in .github/workflows/*.yml .github/workflows/*.yaml; do
              [ -f "$wf" ] || continue
              if grep -v '^[[:space:]]*#' "$wf" | grep -q "$name"; then
                found=1
              fi
            done
            if [ "$found" -eq 1 ]; then
              echo "OK: $name has a caller in .github/workflows/"
            else
              echo "MISSING CALLER: $name has no run: line anywhere in .github/workflows/" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "FAIL: at least one scripts/*.test.sh guard has zero callers." >&2
            exit 1
          fi
          echo "PASS: every scripts/*.test.sh guard in this repo has a caller."

  security-secrets:
    name: Secret Scan
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      # gitleaks/gitleaks-action@v2 requires a paid GITLEAKS_LICENSE for
      # organization-owned repos (tabsii-com), which isn't provisioned here.
      # Install the free, open-source gitleaks CLI directly instead.
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version
      # First pass: scan git history (fetch-depth: 0 above), catching secrets
      # committed then removed within the same history.
      #
      # --log-opts is load-bearing (issue #258). gitleaks' default git log
      # arguments include `--all`, so with fetch-depth: 0 — which fetches every
      # remote ref, not just the one being built — the scan covers commits that
      # live only on *unmerged* branches, letting anyone's open branch redden
      # the integration branch and every open PR at once. Scoping to HEAD
      # restricts the scan to commits reachable from the ref under test without
      # weakening detection: the full reachable history is still walked, so a
      # secret committed then removed within the branch is still caught, and on
      # pull_request HEAD is the merge commit so the PR's own commits are in
      # scope.
      - name: gitleaks git history scan
        run: gitleaks detect --redact -v --exit-code=2 --log-opts="--full-history HEAD"
      # Second pass: scan every file in the working tree (no-git mode).
      # This mirrors what generated repos see on their first CI run — the initial
      # commit includes every template file, so secrets in unchanged files would
      # pass the history scan above but fail there. Running both here closes the gap.
      - name: gitleaks filesystem scan
        run: gitleaks detect --no-git --redact -v --exit-code=2

  infra-validate:
    name: Terraform Validate & Security
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '~> 1.9'
      - name: Terraform fmt check
        run: terraform fmt -check -recursive infra/ modules/
      - name: Validate infra
        working-directory: infra
        run: |
          terraform init -input=false -backend=false
          terraform validate
      - name: Checkov (Terraform SAST)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: modules/
          quiet: true
          soft_fail: true
          framework: terraform
