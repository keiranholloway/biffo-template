[project]
name = "sibling-api"
version = "0.0.0"
description = "Sibling app backend — verifies the shared core Cognito JWT and calls the core API for all data (ADR-0002/ADR-0007). No database client of any kind belongs in this service."
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115.6",
  "mangum>=0.19.0",
  "pydantic>=2.10.4",
  "pydantic-settings>=2.7.1",
  "aws-lambda-powertools[tracer]>=3.4.0",
  "pyjwt[crypto]>=2.10.0",
  "httpx>=0.28.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.2",
  "pytest-cov>=6.0.0",
  "bandit>=1.8.0",
  "pip-audit>=2.8.0",
  "ruff>=0.8.0",
  "pyright>=1.1.0",
]

[tool.uv]
# `cryptography` arrives transitively via `pyjwt[crypto]`, so there is no direct
# declaration to raise a floor on — the constraint has to be stated here.
#
# CVE-2026-69247 / GHSA-g6cj-pr64-35w5 (2026-08-03): `pkcs7_decrypt_*` reported
# the outcome of decrypting a RecipientInfo's `encryptedKey` in distinguishable
# ways — one of them disclosing the recovered length — giving a Bleichenbacher
# oracle against the content-encryption key to anything that decrypts
# attacker-supplied EnvelopedData. Introduced in 44.0.0, fixed in 50.0.0.
#
# This skeleton does not call PKCS#7 today, so the constraint is preventative
# rather than a live exposure — but `pip-audit` is a required check and reads
# the resolved tree, not the reachable code, so an unpinned transitive
# dependency reddens every sibling scaffolded from here.
constraint-dependencies = ["cryptography>=50.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "S", "UP", "ANN"]
ignore = [
  "S101", # allow assert in tests
  "B008", # FastAPI's Depends(...)/Security(...) default-argument pattern is
  # the sanctioned idiom (see FastAPI's own docs) — not the mutable-default
  # footgun this rule otherwise guards against.
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ANN"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*"]
