[project]
name = "biffo-plugin-sdk"
# 1.0.0, deliberately NOT tied to the template's core version (currently 0.5x.y).
#
# This package is a third-party API contract: every plugin manifest the
# ecosystem ships already declares `"biffo-plugin-sdk": "^1.0"` (see
# _skeletons/plugin-template/biffo.plugin.json and ADR-0003), and the plugin
# skeleton's pyproject.toml already pins `>=1.0,<2.0`. Publishing the first
# release as 1.0.0 makes those existing declarations true. Publishing it as
# 0.32.x — the template's own core version — would break every one of them, and
# would couple a public, semver-bound plugin API to the template's own internal
# release lineage, which moves on every template-owned change (ADR-0006) and
# has nothing to do with whether this API broke.
#
# The CLI is unified with the core version (issue #259's other half) because the
# CLI *is* the template. The SDK is not: it is consumed by repos the template
# does not own, so it keeps its own independent semver and its own release tag
# (`sdk-v*`, see .github/workflows/publish-sdk.yml).
version = "1.0.0"
description = "Biffo Plugin SDK — manifest validation, Core API client, and event system for Biffo plugins"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [{ name = "Keiran Holloway", email = "keiran@tabsii.com" }]
keywords = ["biffo", "plugin", "sdk", "aws", "lambda", "serverless"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.10.4",
  "httpx>=0.28.1",
  "aws-lambda-powertools>=3.4.0",
]

[project.urls]
Homepage = "https://github.com/keiranholloway/biffo-template"
Repository = "https://github.com/keiranholloway/biffo-template"
Issues = "https://github.com/keiranholloway/biffo-template/issues"
Documentation = "https://github.com/keiranholloway/biffo-template/blob/main/docs/ADR/0003-plugin-system-and-marketplace.md"

# SigV4 signing (SignedCoreClient / create_core_client, ADR-0009) needs botocore.
# It is an optional extra, not a hard dependency: botocore is preinstalled in the
# AWS Lambda Python runtime, so a deployed plugin already has it, and the SDK's
# imports of it are lazy so `import biffo_plugin_sdk` works without it. Install
# `biffo-plugin-sdk[sigv4]` when running outside Lambda.
[project.optional-dependencies]
sigv4 = ["botocore>=1.35.0"]
# Authenticated user-facing serving (ADR-0018 §1): the founder-gated Lambda ingress.
# FastAPI + Mangum are bundled by the plugin (not in the Lambda runtime); the
# Cognito verifier is the shared pure package. Imports are lazy, so the SDK loads
# without these unless `require_group`/`authorize` are used.
user-serving = [
  "fastapi>=0.115.0",
  "mangum>=0.19.0",
  "biffo-cognito-auth",
]

[dependency-groups]
dev = [
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.2",
  "botocore>=1.35.0",
  "fastapi>=0.115.0",
  "biffo-cognito-auth",
  "ruff>=0.8.0",
  "pyright>=1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Explicit rather than relying on hatchling's name-matching heuristic: the
# distribution name (`biffo-plugin-sdk`) and the import name
# (`biffo_plugin_sdk`) differ, and being explicit is what keeps the wheel from
# silently acquiring or dropping a top-level package.
[tool.hatch.build.targets.wheel]
packages = ["src/biffo_plugin_sdk"]

# The sdist should carry what is needed to rebuild and verify this package —
# not the monorepo path it happens to live in. Tests are included so a
# downstream packager (distro, mirror, audit) can run them; nothing else from
# the repo is.
[tool.hatch.build.targets.sdist]
include = ["src/biffo_plugin_sdk", "tests", "README.md", "LICENSE", "pyproject.toml"]

# biffo-cognito-auth is a workspace package (packages/cognito-auth), used by the
# user-serving extra's JWT verification; resolve it from the workspace, not PyPI.
[tool.uv.sources]
biffo-cognito-auth = { workspace = true }
