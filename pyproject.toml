[tool.uv.workspace]
members = ["services/*", "services/_plugins/*", "packages/python-sdk"]
# `services/_plugins/` is a container for first-party plugins (ADR-0003), not a
# package itself, so `services/*` must not claim it as a member — its children
# are claimed by `services/_plugins/*` instead.
exclude = ["services/_plugins"]

# NOTE (issue #327): this [tool.ruff] section is currently DORMANT. Ruff resolves
# `ruff.toml` ahead of `pyproject.toml` in the same directory, and a `ruff.toml`
# exists at the repo root, so THAT file — not this section — is the config
# `ruff check` actually uses. The richer select below (I, N, W, B, S, UP, ANN)
# has therefore never been enforced; CI has run Ruff's default E/F rules only.
# Consolidating the two configs and activating the intended strict ruleset (and
# fixing the violations it surfaces) is tracked in issue #345; the security-critical
# TID251 banned-api rule (ADR-0002 / invariant 4) is wired into the ACTIVE
# ruff.toml so it takes effect now regardless.
[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [".worktrees", "services/_template", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "S", "UP", "ANN"]
ignore = [
  "S101",   # allow assert in tests
  "ANN101", # missing type for self
  "ANN102", # missing type for cls
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ANN"]
"migrations/**/*.py" = ["ANN"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
extraPaths = ["services/api/src", "packages/python-sdk/src", "services/pr-signer/src", "services/_plugins/orchestrator/src"]
# _skeletons/ holds standalone-repo skeletons (e.g. plugin-template) that are
# deliberately not uv/pnpm workspace members — see _skeletons/*/README.md.
# Their own Python code is type-checked by their own pyright config once
# copied into a real repo, not by this monorepo's root config, which has no
# extraPaths entry for their (unpublished) dependencies.
# NOTE: setting `exclude` explicitly replaces pyright's built-in default
# excludes (.venv, node_modules, dot-dirs) rather than extending them, so
# those must be re-listed here too or pyright will walk and type-check
# every installed dependency (10k+ files).
exclude = [".worktrees", "_skeletons", ".venv", "node_modules", "**/__pycache__", "**/.*"]

[tool.pytest.ini_options]
testpaths = ["services", "packages"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["services", "packages"]
omit = ["*/tests/*", "*/migrations/*", "services/_template/*"]
