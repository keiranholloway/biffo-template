[tool.uv.workspace]
members = ["services/*", "services/_plugins/*", "packages/python-sdk", "packages/cognito-auth"]
# `services/_plugins/` is a container for first-party plugins (ADR-0003), not a
# package itself, so `services/*` must not claim it as a member — its children
# are claimed by `services/_plugins/*` instead.
exclude = ["services/_plugins"]

# ============================================================================
# Ruff — SINGLE authoritative config (issue #345).
#
# This [tool.ruff] section is now the ONE source of truth for Ruff. The repo
# root's comment-only `ruff.toml` stub — which used to shadow this section, since
# Ruff resolves `ruff.toml` ahead of `pyproject.toml` in the same directory — has
# been removed. `ruff check` / `ruff format` now honour exactly what is below.
#
# Before #345 the strict select here was DORMANT: CI ran Ruff's default E/F only.
# The security-critical TID251 banned-api rule (previously carried by ruff.toml,
# #327) is merged in below so ADR-0002 / invariant 4 stays enforced.
# ============================================================================
[tool.ruff]
target-version = "py313"
line-length = 100
# `extend-exclude` (not `exclude`) keeps Ruff's built-in excludes (.venv,
# node_modules, .git, …) and adds template-scoped paths: `_skeletons/` is
# standalone-repo scaffold linted by its own CI once copied out (matching
# [tool.pyright] below); `db/` is user-owned; `services/_template` is a
# placeholder stub; `migrations` are generated.
extend-exclude = [".worktrees", "services/_template", "_skeletons", "db", "migrations"]

[tool.ruff.lint]
# ANN (flake8-annotations) is deliberately NOT selected: activating it surfaces
# hundreds of missing-annotation violations across the tree that cannot be
# auto-fixed, which would balloon this consolidation PR unboundedly. Adding it is
# left as a tracked follow-up (see issue #345). Everything else from the intended
# strict set is active.
select = ["E", "F", "I", "N", "W", "B", "S", "UP", "TID251"]
ignore = [
  "S101", # allow assert in tests
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection defaults (`x = Depends(...)`, `Query(...)`, etc.)
# are the framework's idiomatic call-in-default pattern, not the B008 mutable-
# default bug. Treat them as immutable so B008 stays useful for real cases.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Body",
  "fastapi.Header",
  "fastapi.Cookie",
  "fastapi.Form",
  "fastapi.File",
  "fastapi.Security",
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use fake credentials/tokens as fixtures — the hardcoded-
# password bandit checks (S105/S106/S107) are pure false positives there.
# NOTE: the glob is `**/tests/**` (not `tests/**`): Ruff anchors slash-containing
# per-file patterns at the project root, so `tests/**` would match only a
# repo-root tests/ dir, never the nested `services/*/tests/` and
# `packages/*/tests/` dirs where these fixtures actually live.
"**/tests/**/*.py" = ["S101", "S105", "S106", "S107"]
# services/api/ IS the data-access layer — the one place DB clients are allowed
# (ADR-0002 / invariant 4). Everywhere else TID251 bans them.
"services/api/**/*.py" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# No DB client outside services/api/ (ADR-0002 / CLAUDE.md invariant 4). All
# other services and packages call the Core API over HTTP. TID251 is the
# specific banned-api rule; the whole TID family is not selected (TID252 would
# ban every relative import).
"psycopg2".msg = "No DB client outside services/api/ (ADR-0002). Call the Core API over HTTP."
"psycopg".msg = "No DB client outside services/api/ (ADR-0002). Call the Core API over HTTP."
"asyncpg".msg = "No DB client outside services/api/ (ADR-0002). Call the Core API over HTTP."
"sqlalchemy".msg = "No DB client outside services/api/ (ADR-0002). Call the Core API over HTTP."

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
extraPaths = ["services/api/src", "packages/python-sdk/src", "packages/cognito-auth/src", "services/pr-signer/src", "services/_plugins/orchestrator/src", "services/_plugins/agent-runtime/src"]
# _skeletons/ holds standalone-repo skeletons (e.g. plugin-template) that are
# deliberately not uv/pnpm workspace members — see _skeletons/*/README.md.
# Their own Python code is type-checked by their own pyright config once
# copied into a real repo, not by this monorepo's root config, which has no
# extraPaths entry for their (unpublished) dependencies.
# NOTE: setting `exclude` explicitly replaces pyright's built-in default
# excludes (.venv, node_modules, dot-dirs) rather than extending them, so
# those must be re-listed here too or pyright will walk and type-check
# every installed dependency (10k+ files).
exclude = [".worktrees", "_skeletons", ".venv", "node_modules", "**/__pycache__", "**/.*"]

[tool.pytest.ini_options]
testpaths = ["services", "packages"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    # A pg-lane module that cannot share the database with a concurrent worker
    # -- it performs DDL with fixed object names, or sweeps `pg_class` /
    # `information_schema` and asserts over every table, so it sees rows another
    # module created. `scripts/verify.sh` and the RLS workflow run these in a
    # second, serial pass after the parallel one (biffo-template#703).
    #
    # Registered here rather than left implicit so `--strict-markers` stays
    # available and a typo'd `@pytest.mark.seriel` is a collection error rather
    # than a module silently rejoining the parallel pass.
    "serial: needs the database to itself; excluded from the parallel pg pass",
]

[tool.coverage.run]
source = ["services", "packages"]
omit = ["*/tests/*", "*/migrations/*", "services/_template/*"]
# services/api is async throughout and reaches the database through
# SQLAlchemy's async layer, which runs user code (including exception
# handlers) inside a greenlet via greenlet_spawn. Coverage does not trace a
# greenlet context unless told to, so without this a local run silently
# under-records 24 files of async DB code -- 60 unexecuted error branches
# reported locally against CI's correctly-measured 47 (#1588).
#
# `thread` is required too, and is not a defensive extra: services/api's own
# code makes no direct use of threads (no ThreadPoolExecutor, run_in_executor,
# or threading module), but the test suite drives it through FastAPI's/
# Starlette's TestClient, which runs the ASGI app -- and therefore every
# greenlet inside it -- on a background thread via anyio's blocking portal.
# `greenlet` alone (verified empirically) traces the main thread's greenlets
# and actually UNDER-counts relative to no setting at all (80 unexecuted vs.
# 60), because it does not extend tracing to that background thread in the
# first place. Only `greenlet,thread` together reach CI's number (47),
# reproduced twice locally with the identical result.
concurrency = ["greenlet", "thread"]
