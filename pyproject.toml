[tool.uv.workspace]
members = ["services/*", "packages/python-sdk"]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = ["services/_template", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "S", "UP", "ANN"]
ignore = [
  "S101",   # allow assert in tests
  "ANN101", # missing type for self
  "ANN102", # missing type for cls
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ANN"]
"migrations/**/*.py" = ["ANN"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
extraPaths = ["services/api/src", "packages/python-sdk/src", "services/rbac/src"]
# _skeletons/ holds standalone-repo skeletons (e.g. plugin-template) that are
# deliberately not uv/pnpm workspace members — see _skeletons/*/README.md.
# Their own Python code is type-checked by their own pyright config once
# copied into a real repo, not by this monorepo's root config, which has no
# extraPaths entry for their (unpublished) dependencies.
# NOTE: setting `exclude` explicitly replaces pyright's built-in default
# excludes (.venv, node_modules, dot-dirs) rather than extending them, so
# those must be re-listed here too or pyright will walk and type-check
# every installed dependency (10k+ files).
exclude = ["_skeletons", ".venv", "node_modules", "**/__pycache__", "**/.*"]

[tool.pytest.ini_options]
testpaths = ["services", "packages"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["services", "packages"]
omit = ["*/tests/*", "*/migrations/*", "services/_template/*"]
