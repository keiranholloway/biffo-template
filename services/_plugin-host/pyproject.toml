[project]
name = "biffo-plugin-host"
version = "0.1.0"
description = "The shared plugin-host runtime (ADR-0021): one Lambda mounts every user-facing plugin's API."
requires-python = ">=3.13"
dependencies = [
  "starlette>=0.37.0",
  "mangum>=0.19.0",
  # >=1.4 (biffo-template#1517): discover.py now parses every manifest through
  # biffo_plugin_sdk.plugin.PluginManifest instead of raw json.loads()+.get(),
  # so the host needs the SDK version where that model knows about
  # user_ingress/admin_ingress at all, and where extra="forbid" is the version
  # gate for a typo failing loudly instead of being silently ignored (see
  # packages/python-sdk/pyproject.toml's version comment).
  "biffo-plugin-sdk[user-serving]>=1.4,<2.0",
]

[dependency-groups]
dev = ["pytest>=8.3.4", "httpx>=0.28.1", "ruff>=0.8.0", "pyright>=1.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plugin_host"]

[tool.pytest.ini_options]
pythonpath = ["src"]

# biffo-plugin-sdk is a workspace member — resolve it from the workspace, like the
# first-party plugins under services/_plugins/.
[tool.uv.sources]
biffo-plugin-sdk = { workspace = true }
