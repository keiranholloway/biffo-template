[project]
name = "biffo-plugin-host"
# Independently semver'd, deliberately NOT tied to the template's core version —
# same rationale packages/python-sdk/pyproject.toml records for
# biffo-plugin-sdk, applied one milestone earlier in this package's life.
#
# This package is a public API contract for third-party plugin repos (a plugin
# repo's own conformance checks import discover.py/load_app to exercise the
# *real* host instead of mocking it, biffo-template#1922) — not part of the
# template's internal core version, which is pre-1.0 and, since #423, is not a
# file at all but the highest `core-v*` git tag. Coupling this package's
# version to that lineage would publish a new host release on every unrelated
# template change, and would break any future plugin-side pin the moment the
# core version crossed a boundary that had nothing to do with this package.
#
# Unlike the SDK's 1.0.0 floor — forced by manifests that already declared
# `^1.0` before the SDK's own packaging test existed — nothing consumes this
# package yet (biffo-template#1922 milestone M1 publishes it; M2 is the
# first consumer). So there is no existing pin to keep satisfiable, and 0.x is
# the honest signal that the public surface (currently just
# plugin_host.discover: discover_plugins, load_app) may still move before it
# is called a stable 1.0.
version = "0.1.0"
description = "The shared plugin-host runtime (ADR-0021): one Lambda mounts every user-facing plugin's API."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [{ name = "Keiran Holloway", email = "keiran@tabsii.com" }]
keywords = ["biffo", "plugin", "host", "aws", "lambda", "serverless"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "starlette>=0.37.0",
  "mangum>=0.19.0",
  # >=1.4 (biffo-template#1517): discover.py now parses every manifest through
  # biffo_plugin_sdk.plugin.PluginManifest instead of raw json.loads()+.get(),
  # so the host needs the SDK version where that model knows about
  # user_ingress/admin_ingress at all, and where extra="forbid" is the version
  # gate for a typo failing loudly instead of being silently ignored (see
  # packages/python-sdk/pyproject.toml's version comment).
  "biffo-plugin-sdk[user-serving]>=1.4,<2.0",
]

[project.urls]
Homepage = "https://github.com/keiranholloway/biffo-template"
Repository = "https://github.com/keiranholloway/biffo-template"
Issues = "https://github.com/keiranholloway/biffo-template/issues"
Documentation = "https://github.com/keiranholloway/biffo-template/blob/main/docs/ADR/0021-shared-plugin-hosting.md"

[dependency-groups]
dev = ["pytest>=8.3.4", "httpx>=0.28.1", "ruff>=0.8.0", "pyright>=1.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plugin_host"]

# The sdist should carry what is needed to rebuild and verify this package —
# not the monorepo path it happens to live in. Tests are included so a
# downstream packager (distro, mirror, audit) can run them; nothing else from
# the repo is (mirrors packages/python-sdk/pyproject.toml).
[tool.hatch.build.targets.sdist]
include = ["src/plugin_host", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
pythonpath = ["src"]

# biffo-plugin-sdk is a workspace member — resolve it from the workspace, like the
# first-party plugins under services/_plugins/.
[tool.uv.sources]
biffo-plugin-sdk = { workspace = true }
