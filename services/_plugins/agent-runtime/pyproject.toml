[project]
name = "biffo-plugin-agent-runtime"
version = "0.1.0"
description = "Agentic-worker execution runtime (ADR-0014): executes agent runs requested on the bus, against OpenRouter, and reports the outcome to the Core API"
requires-python = ">=3.13"
dependencies = [
  "biffo-plugin-sdk",
  # Shared Cognito JWT verification (ADR-0016 §7). Wired in now so Stage 2's
  # Function URL ingress can `from biffo_cognito_auth import verify_cognito_jwt`;
  # the runtime does not call it yet.
  "biffo-cognito-auth",
  "aws-lambda-powertools[tracer]>=3.4.0",
  "httpx>=0.28.1",
  "boto3>=1.35.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.2",
  "ruff>=0.8.0",
  "pyright>=1.1.0",
]

[tool.uv.sources]
biffo-plugin-sdk = { workspace = true }
biffo-cognito-auth = { workspace = true }
