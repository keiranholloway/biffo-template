[alembic]
script_location = migrations
prepend_sys_path = .
# Silences an Alembic deprecation warning for prepend_sys_path/version_locations
# splitting (relevant now that version_locations is set dynamically for plugin
# migration tests/discovery) and future-proofs against the legacy comma/colon
# split being removed.
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
