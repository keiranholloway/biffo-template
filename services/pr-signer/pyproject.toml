[project]
name = "biffo-pr-signer"
version = "0.1.0"
description = "Isolated PR-signer for the endpoint control plane (ADR-0008) — edits a plugin permissions block and opens a PR; holds the GitHub App credential the Core API deliberately does not."
requires-python = ">=3.13"
dependencies = [
  "biffo-plugin-sdk",
  "aws-lambda-powertools>=3.4.0",
  "httpx>=0.28.1",
  "pyjwt[crypto]>=2.10.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.4",
  "ruff>=0.8.0",
  "pyright>=1.1.0",
  # boto3 is provided by the Lambda runtime, so it is not a runtime dependency;
  # it is dev-only here so type-checking and tests can see it.
  "boto3>=1.35.0",
]

[tool.uv.sources]
biffo-plugin-sdk = { workspace = true }
